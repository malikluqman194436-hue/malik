  spawnShopSparkles(W / 2, H / 2, ['#fde047', '#e879f9', '#4ade80', '#ffffff']);
  playPerfectBonusSound();
  triggerVibrate([30, 40, 60]);
  showToast('Ads Removed + 1,000 Coins!');
  syncAndroidBackState();
}

function getMainMenuLeftButtonsLayout() {
  const x = 12;
  const noAdsW = 54;
  const noAdsH = 60;
  const starterSize = 50;
  const safeMinY = 14 + (topInset || 0);
  const totalStackH = (noAdsPurchased ? 0 : (noAdsH + 12)) + (starterPackClaimed ? 0 : starterSize);
  const maxAllowedY = Math.max(safeMinY, ROAD_TOP - Math.max(76, totalStackH + 16));
  const topY = Math.max(safeMinY, Math.min(maxAllowedY, 200 + (topInset || 0) * 0.6));
  const noAdsBtn = noAdsPurchased ? null : { x, y: topY, w: noAdsW, h: noAdsH };
  const starterY = noAdsBtn ? (topY + noAdsH + 12) : topY;
  const starterBtn = starterPackClaimed ? null : { x: x + 2, y: starterY, w: starterSize, h: starterSize };
  return { noAdsBtn, starterBtn };
}

function spawnRewardFlyingCoins(startX, startY, count = 12) {
  const wX = W - 68;
  const wY = 29 + (topInset || 0);
  for (let k = 0; k < count; k++) {
    flyingCoins.push({
      startX: startX + rnd(-24, 24),
      startY: startY + rnd(-10, 10),
      curX: startX,
      curY: startY,
      endX: wX,
      endY: wY,
      t: -k * 0.04,
      dur: 0.56,
      type: 'gold'
    });
  }
}

function spawnShopSparkles(cx, cy, colorList) {
  const colors = colorList || ['#fde047', '#ffffff', '#38bdf8', '#f0abfc', '#4ade80'];
  for (let i = 0; i < 16; i++) {
    const ang = (i / 16) * Math.PI * 2 + Math.random() * 0.4;
    const spd = 65 + Math.random() * 115;
    shopSparkles.push({
      x: cx + (Math.random() - 0.5) * 28,
      y: cy + (Math.random() - 0.5) * 14,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 45,
      life: 0.55 + Math.random() * 0.2,
      maxLife: 0.75,
      size: 3 + Math.random() * 3.5,
      color: colors[i % colors.length]
    });
  }
}

function buyShopItem(id, sparkleX, sparkleY) {
  const item = getShopItemById(id);
  if (!item) return;

  if (wallet >= item.price) {
    wallet -= item.price;
    saveWallet();
    inventory[id] = (inventory[id] || 0) + item.packCount;
    saveInventory();
    selectedLoadout[id] = true;
    saveLoadout();

    coinCounterBump = 1.32;
    shopNoCoinsTimer = 0;
    if (shopCardAnim[id]) {
      shopCardAnim[id].pop = 0.35;
      shopCardAnim[id].shake = 0;
    }
    spawnShopSparkles(sparkleX || W / 2, sparkleY || H / 2, ['#fde047', item.accent, '#ffffff', '#4ade80']);
    playStarSound(2);
    triggerVibrate(35);
    showToast(`${item.name} x${item.packCount} added!`);
  } else {
    if (shopCardAnim[id]) {
      shopCardAnim[id].shake = 0.45;
    }
    shopNoCoinsTimer = 5.0;
    triggerVibrate([30, 40, 30]);
    showToast('Not enough coins');
  }
}

function claimDailyReward(sparkleX, sparkleY) {
  if (!isDailyRewardReady()) {
    const remMs = getDailyRewardRemainingMs();
    const hrs = Math.floor(remMs / 3600000);
    const mins = Math.max(1, Math.ceil((remMs % 3600000) / 60000));
    if (shopCardAnim.daily) shopCardAnim.daily.shake = 0.4;
    showToast(hrs > 0 ? `Next reward in ${hrs}h ${mins}m` : `Next reward in ${mins}m`);
    return false;
  }

  const info = getCurrentDailyRewardInfo();
  const baseStreak = getEffectiveDailyStreak();
  dailyStreak = Math.min(7, baseStreak + 1);
  dailyLastClaimDate = getLocalDateKey();
  lastDailyClaimAt = Date.now();
  saveDailyReward();

  wallet += info.coins;
  saveWallet();

  if (info.bonusBoost > 0) {
    inventory.boost = (inventory.boost || 0) + info.bonusBoost;
    saveInventory();
    selectedLoadout.boost = true;
    saveLoadout();
  }

  coinCounterBump = 1.35;
  shopNoCoinsTimer = 0;
  if (shopCardAnim.daily) shopCardAnim.daily.pop = 0.35;
  const sx = sparkleX || W / 2;
  const sy = sparkleY || H / 2;
  spawnShopSparkles(sx, sy, ['#fde047', '#fef08a', '#4ade80', '#ffffff']);
  spawnRewardFlyingCoins(sx, sy, info.dayNum >= 6 ? 16 : 11);
  playPerfectBonusSound();
  triggerVibrate([30, 40, 60]);
  showToast(info.bonusBoost > 0 ? `+${info.coins} Coins & +1 Boost!` : `Day ${info.dayNum}: +${info.coins} Coins!`);
  return true;
}

function claimStarterPack(sparkleX, sparkleY) {
  if (starterPackClaimed) return false;
  starterPackClaimed = true;
  saveStarterPack();

  wallet += 500;
  saveWallet();
  inventory.boost = (inventory.boost || 0) + 3;
  saveInventory();
  selectedLoadout.boost = true;
  saveLoadout();

  coinCounterBump = 1.38;
  const sx = sparkleX || W / 2;
  const sy = sparkleY || H / 2;
  spawnRewardFlyingCoins(sx, sy, 14);
  playPerfectBonusSound();
  triggerVibrate([35, 45, 70]);
  closeStarterPopup();
  showToast('+500 Coins & Boost x3!');
  return true;
}

function pauseGame() {
  if (!isPauseButtonVisible()) return;
  paused = true;
  homeConfirmOpen = false;
  resetConfirming = false;
  pauseCountdown = 0;
  hold = false;
  wasThrustActive = false;
  puffHoldTimer = 0;
  activePress = null;
  stopAllGameAudioAndSuspend();
  syncAndroidBackState();
}

function resumeFromPause() {
  if (!paused) return;
  paused = false;
  homeConfirmOpen = false;
  resetConfirming = false;
  pauseCountdown = 3.0;
  hold = false;
  wasThrustActive = false;
  puffHoldTimer = 0;
  activePress = null;
  syncAndroidBackState();
}

function restartFromPause() {
  paused = false;
  homeConfirmOpen = false;
  resetConfirming = false;
  pauseCountdown = 0;
  hold = false;
  wasThrustActive = false;
  puffHoldTimer = 0;
  activePress = null;
  resumeGameAudio();
  startLevelWithTransition(curLevel);
  syncAndroidBackState();
}

function goHomeFromPause() {
  paused = false;
  homeConfirmOpen = false;
  resetConfirming = false;
  pauseCountdown = 0;
  hold = false;
  wasThrustActive = false;
  puffHoldTimer = 0;
  activePress = null;
  resumeGameAudio();
  startLevel(curLevel);
  st = 'ready';
  menuFadeTimer = 0;
  syncAndroidBackState();
}

function handleBackOrEscape() {
  if (st === 'loading') return false;
  if (noAdsPopupOpen) {
    closeNoAdsPopup();
    playClickSound();
    return true;
  }
  if (dailyPopupOpen) {
    closeDailyPopup();
    playClickSound();
    return true;
  }
  if (starterPopupOpen) {
    closeStarterPopup();
    playClickSound();
    return true;
  }
  if (shopOpen) {
    if (coinPackConfirmItem) {
      coinPackConfirmItem = null;
    } else {
      closeShop();
    }
    playClickSound();
    return true;
  }
  if (settingsOpen) {
    if (resetConfirming) {
      resetConfirming = false;
    } else {
      settingsOpen = false;
    }
    playClickSound();
    syncAndroidBackState();
    return true;
  }
  if (paused) {
    if (homeConfirmOpen) {
      homeConfirmOpen = false;
    } else if (resetConfirming) {
      resetConfirming = false;
    } else {
      resumeFromPause();
    }
    return true;
  }
  if (isPauseButtonVisible()) {
    pauseGame();
    return true;
  }
  return false;
}
window.__handleAndroidBack = handleBackOrEscape;

function getShopLayout() {
  const safeTop = Math.max(12, topInset || 0);
  const safeBot = Math.max(12, botInset || 0);
  const awningH = safeTop + 54;
  const closeBtn = { x: 28, y: safeTop + 24, r: 18 };
  const coinPill = { x: W - 114, y: safeTop + 11, w: 102, h: 26 };
  const invBar = { x: 14, y: awningH + 8, w: W - 28, h: shopMode === 'coins' ? 40 : 48 };
  const listTop = invBar.y + invBar.h + 10;
  const listBottom = H - safeBot - 10;
  const listH = Math.max(140, listBottom - listTop);

  const cardW = W - 28;
  const cardH = shopMode === 'coins' ? 92 : 96;
  const cardGap = 12;
  const cardX = 14;
  const sourceList = (shopMode === 'coins') ? COIN_PACKS : SHOP_ITEMS;
  const totalItems = (shopMode === 'coins') ? COIN_PACKS.length : (SHOP_ITEMS.length + 1);
  const contentH = totalItems * cardH + (totalItems - 1) * cardGap + 8;
  shopMaxScroll = Math.max(0, contentH - listH);
  if (shopScrollY > shopMaxScroll) shopScrollY = shopMaxScroll;
  if (shopScrollY < 0) shopScrollY = 0;

  const cards = [];
  if (shopMode === 'coins') {
    for (let i = 0; i < COIN_PACKS.length; i++) {
      const cy = listTop + i * (cardH + cardGap) - shopScrollY;
      const priceBtn = { x: cardX + cardW - 100, y: cy + (cardH - 42) / 2, w: 88, h: 42 };
      cards.push({ type: 'coin_pack', pack: COIN_PACKS[i], x: cardX, y: cy, w: cardW, h: cardH, priceBtn });
    }
  } else {
    for (let i = 0; i < SHOP_ITEMS.length; i++) {
      const cy = listTop + i * (cardH + cardGap) - shopScrollY;
      const priceBtn = { x: cardX + cardW - 96, y: cy + (cardH - 42) / 2, w: 84, h: 42 };
      cards.push({ type: 'item', item: SHOP_ITEMS[i], x: cardX, y: cy, w: cardW, h: cardH, priceBtn });
    }
    const dailyIdx = SHOP_ITEMS.length;
    const dCy = listTop + dailyIdx * (cardH + cardGap) - shopScrollY;
    const dBtn = { x: cardX + cardW - 96, y: dCy + (cardH - 42) / 2, w: 84, h: 42 };
    cards.push({ type: 'daily', id: 'daily', x: cardX, y: dCy, w: cardW, h: cardH, priceBtn: dBtn });
  }

  const shortcutBanner = {
    x: 16,
    y: H - safeBot - 62,
    w: W - 32,
    h: 52,
    btn: { x: W - 16 - 134, y: H - safeBot - 62 + 8, w: 124, h: 36 }
  };

  const confW = 280, confH = 190;
  const confX = Math.round(W / 2 - confW / 2);
  const confY = Math.round(H / 2 - confH / 2);
  const confirmBox = {
    x: confX, y: confY, w: confW, h: confH,
    yesBtn: { x: confX + 20, y: confY + 126, w: 112, h: 44 },
    noBtn: { x: confX + confW - 132, y: confY + 126, w: 112, h: 44 }
  };

  return { safeTop, safeBot, awningH, closeBtn, coinPill, invBar, listTop, listBottom, listH, cards, shortcutBanner, confirmBox };
}

function drawCoinPackPileIcon(cx, cy, level) {
  ctx.save();
  const count = Math.min(6, Math.max(1, level + 1));
  const offsets = [
    { dx: 0, dy: 6 },
    { dx: -11, dy: 9 },
    { dx: 11, dy: 9 },
    { dx: -6, dy: -2 },
    { dx: 7, dy: -2 },
    { dx: 0, dy: -11 }
  ];
  for (let i = 0; i < count; i++) {
    const o = offsets[i];
    drawGoldCoinIcon(cx + o.dx, cy + o.dy, level >= 4 ? 10.5 : 9.5);
  }
  ctx.restore();
}

function drawShopScreen() {
  const L = getShopLayout();
  ctx.save();

  // 1. Full-screen purple background
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#4c1d95');
  bgGrad.addColorStop(0.5, '#6d28d9');
  bgGrad.addColorStop(1, '#2e1065');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Subtle diagonal light rays
  ctx.save();
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = '#f5d0fe';
  for (let r = 0; r < 4; r++) {
    const rx = -40 + r * 120;
    ctx.beginPath();
    ctx.moveTo(rx, 0);
    ctx.lineTo(rx + 46, 0);
    ctx.lineTo(rx + 170, H);
    ctx.lineTo(rx + 124, H);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // 2. Scrollable list of colorful rounded cards
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, L.listTop - 2, W, L.listH + 4);
  ctx.clip();

  for (let i = 0; i < L.cards.length; i++) {
    const c = L.cards[i];
    if (c.y + c.h < L.listTop - 10 || c.y > L.listBottom + 10) continue;

    const animKey = c.type === 'item' ? c.item.id : (c.type === 'coin_pack' ? c.pack.id : 'daily');
    const anim = shopCardAnim[animKey] || { pop: 0, shake: 0 };
    const shakeX = anim.shake > 0 ? Math.sin(anim.shake * 55) * 6 * (anim.shake / 0.45) : 0;
    const popScale = anim.pop > 0 ? (1 + 0.045 * Math.sin((anim.pop / 0.35) * Math.PI)) : 1.0;

    ctx.save();
    ctx.translate(c.x + c.w / 2 + shakeX, c.y + c.h / 2);
    ctx.scale(popScale, popScale);
    ctx.translate(-(c.x + c.w / 2), -(c.y + c.h / 2));

    // Card drop shadow
    ctx.shadowColor = 'rgba(15, 7, 36, 0.42)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 5;

    const cardGrad = ctx.createLinearGradient(c.x, c.y, c.x, c.y + c.h);
    if (c.type === 'item') {
      cardGrad.addColorStop(0, c.item.gradTop);
      cardGrad.addColorStop(0.55, c.item.gradMid);
      cardGrad.addColorStop(1, c.item.gradBot);
    } else if (c.type === 'coin_pack') {
      cardGrad.addColorStop(0, c.pack.gradTop);
      cardGrad.addColorStop(0.55, c.pack.gradMid);
      cardGrad.addColorStop(1, c.pack.gradBot);
    } else {
      cardGrad.addColorStop(0, '#fef08a');
      cardGrad.addColorStop(0.5, '#facc15');
      cardGrad.addColorStop(1, '#d97706');
    }
    ctx.fillStyle = cardGrad;
    roundRect(ctx, c.x, c.y, c.w, c.h, 20);
    ctx.fill();
    ctx.shadowColor = 'transparent';

    // Top glossy sheen inside card
    ctx.save();
    roundRect(ctx, c.x, c.y, c.w, c.h, 20);
    ctx.clip();
    const sheen = ctx.createLinearGradient(0, c.y, 0, c.y + c.h * 0.48);
    sheen.addColorStop(0, 'rgba(255, 255, 255, 0.42)');
    sheen.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
    ctx.fillStyle = sheen;
    ctx.fillRect(c.x, c.y, c.w, c.h * 0.48);
    ctx.restore();

    // Card outline
    ctx.strokeStyle = c.type === 'item' ? c.item.border : (c.type === 'coin_pack' ? c.pack.border : '#713f12');
    ctx.lineWidth = 2.6;
    roundRect(ctx, c.x, c.y, c.w, c.h, 20);
    ctx.stroke();

    // Inner bright rim
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.lineWidth = 1.2;
    roundRect(ctx, c.x + 2, c.y + 2, c.w - 4, c.h - 4, 18);
    ctx.stroke();

    // Big icon badge on left
    const iconBoxSz = 60;
    const iconBoxX = c.x + 12;
    const iconBoxY = c.y + (c.h - iconBoxSz) / 2;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.30)';
    roundRect(ctx, iconBoxX, iconBoxY, iconBoxSz, iconBoxSz, 16);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.lineWidth = 1.6;
    roundRect(ctx, iconBoxX, iconBoxY, iconBoxSz, iconBoxSz, 16);
    ctx.stroke();

    if (c.type === 'coin_pack') {
      drawCoinPackPileIcon(iconBoxX + iconBoxSz / 2, iconBoxY + iconBoxSz / 2, c.pack.iconLevel);
      if (c.pack.badge) {
        const bw = c.pack.badge.length > 4 ? 50 : 38;
        const bx = iconBoxX + iconBoxSz - bw / 2 - 2;
        const by = iconBoxY + iconBoxSz - 6;
        ctx.fillStyle = '#ef4444';
        roundRect(ctx, bx - bw / 2, by - 9, bw, 18, 9);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        roundRect(ctx, bx - bw / 2, by - 9, bw, 18, 9);
        ctx.stroke();
        drawGlossyText(c.pack.badge, bx, by + 0.5, 9, 'center', '#ffffff', '#7f1d1d', 2.2);
      }

      const textX = iconBoxX + iconBoxSz + 10;
      drawGlossyText(c.pack.title, textX, c.y + 34, 18, 'left', '#ffffff', c.pack.border, 3.6);
      drawGlossyText(c.pack.desc, textX, c.y + 58, 10.5, 'left', '#fef9c3', '#0f172a', 2.0);

      const pb = c.priceBtn;
      const isBuyPressed = (activePress === 'coin_pack_buy_' + c.pack.id);
      drawGlossyButton(pb.x, pb.y, pb.w, pb.h, BUTTON_THEMES.green, c.pack.priceText, null, isBuyPressed, 14);
    } else {
      const iconName = (c.type === 'item') ? c.item.icon : 'daily_gift';
      drawButtonIcon(iconName, iconBoxX + iconBoxSz / 2, iconBoxY + iconBoxSz / 2, 42);

      if (c.type === 'item') {
        // "x3" pack badge
        const px = iconBoxX + iconBoxSz - 10;
        const py = iconBoxY + iconBoxSz - 8;
        ctx.fillStyle = c.item.accent;
        roundRect(ctx, px - 14, py - 9, 28, 18, 9);
        ctx.fill();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1.6;
        roundRect(ctx, px - 14, py - 9, 28, 18, 9);
        ctx.stroke();
        drawGlossyText(`x${c.item.packCount}`, px, py + 0.5, 11, 'center', '#ffffff', '#0f172a', 2.6);

        // Name and short description
        const textX = iconBoxX + iconBoxSz + 10;
        drawGlossyText(c.item.name, textX, c.y + 30, 18, 'left', '#ffffff', c.item.border, 3.6);
        drawGlossyText(c.item.desc, textX, c.y + 52, 10.5, 'left', '#f8fafc', '#0f172a', 2.0);
        drawGlossyText(`Owned: ${inventory[c.item.id] || 0}`, textX, c.y + 72, 10.5, 'left', '#fde047', '#0f172a', 2.2);

        // Green price button with coin icon & price
        const pb = c.priceBtn;
        const isBuyPressed = (activePress === 'shop_buy_' + c.item.id);
        drawGlossyButton(pb.x, pb.y, pb.w, pb.h, BUTTON_THEMES.green, null, null, isBuyPressed, 14);
        const pressDy = isBuyPressed ? 3 : 0;
        const cIconX = pb.x + 19;
        const cIconY = pb.y + pb.h / 2 + pressDy;
        const animF = Math.floor((gameTime * 10) % 8);
        if (coinFrames[animF]) {
          const spr = coinFrames[animF];
          const sc = 18 / spr.height;
          ctx.drawImage(spr, cIconX - (spr.width * sc) / 2, cIconY - (spr.height * sc) / 2, spr.width * sc, spr.height * sc);
        } else {
          ctx.fillStyle = '#fde047';
          ctx.beginPath(); ctx.arc(cIconX, cIconY, 8, 0, Math.PI * 2); ctx.fill();
        }
        drawGlossyText(String(c.item.price), pb.x + 54, cIconY + 1, 16, 'center', '#ffffff', BUTTON_THEMES.green.border, 3.4);
      } else {
        // Daily reward card
        const textX = iconBoxX + iconBoxSz + 10;
        const ready = isDailyRewardReady();
        const dInfo = getCurrentDailyRewardInfo();
        drawGlossyText(`Daily Day ${dInfo.dayNum}`, textX, c.y + 31, 17, 'left', '#ffffff', '#713f12', 3.6);
        const dSub = dInfo.bonusBoost > 0 ? `+${dInfo.coins} coins + 1 Boost` : `+${dInfo.coins} free coins`;
        drawGlossyText(dSub, textX, c.y + 54, 11, 'left', '#ffffff', '#713f12', 2.2);

        const pb = c.priceBtn;
        const isDailyPressed = (activePress === 'shop_claim_daily');
        const dTheme = ready ? BUTTON_THEMES.green : BUTTON_THEMES.gray;
        drawGlossyButton(pb.x, pb.y, pb.w, pb.h, dTheme, ready ? 'Claim' : 'Claimed', null, isDailyPressed, 14);
      }
    }

    ctx.restore();
  }
  ctx.restore();

  // 3. Striped awning at top
  ctx.save();
  const stripeCount = 10;
  const stripeW = W / stripeCount;
  const scallopR = stripeW / 2;
  const awningBodyH = L.awningH - scallopR * 0.5;

  // Awning shadow
  ctx.fillStyle = 'rgba(15, 7, 36, 0.35)';
  for (let i = 0; i < stripeCount; i++) {
    ctx.beginPath();
    ctx.arc(i * stripeW + scallopR, awningBodyH + 4, scallopR, 0, Math.PI, false);
    ctx.fill();
  }

  for (let i = 0; i < stripeCount; i++) {
    const sx = i * stripeW;
    const isEven = (i % 2 === 0);
    const sGrad = ctx.createLinearGradient(0, 0, 0, L.awningH);
    if (isEven) {
      sGrad.addColorStop(0, '#c026d3');
      sGrad.addColorStop(1, '#9333ea');
    } else {
      sGrad.addColorStop(0, '#fdf4ff');
      sGrad.addColorStop(1, '#f3e8ff');
    }
    ctx.fillStyle = sGrad;
    ctx.fillRect(sx, 0, stripeW + 0.5, awningBodyH);
    ctx.beginPath();
    ctx.arc(sx + scallopR, awningBodyH, scallopR + 0.3, 0, Math.PI, false);
    ctx.fill();

    ctx.strokeStyle = '#3b0764';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(sx + scallopR, awningBodyH, scallopR, 0.08, Math.PI - 0.08, false);
    ctx.stroke();
  }
  ctx.restore();

  // Top-left Red round X button, Title, Top-right Coin pill
  drawRoundGlossyButton(L.closeBtn.x, L.closeBtn.y, L.closeBtn.r, BUTTON_THEMES.red, 'close', activePress === 'close_shop');
  drawGlossyText(shopMode === 'coins' ? 'COINS' : 'SHOP', W / 2 - 12, L.safeTop + 24, 24, 'center', '#ffffff', '#3b0764', 5.0);
  drawWalletCoinPill(L.coinPill.x, L.coinPill.y, L.coinPill.w, L.coinPill.h, Math.round(shopDisplayedWallet), coinCounterBump, false);

  // 4. Top sub-bar ("Coin Packs" header in Coins mode OR "Inventory" in Boosters mode)
  ctx.save();
  ctx.fillStyle = 'rgba(24, 14, 58, 0.85)';
  roundRect(ctx, L.invBar.x, L.invBar.y, L.invBar.w, L.invBar.h, 15);
  ctx.fill();
  ctx.strokeStyle = '#c084fc';
  ctx.lineWidth = 1.8;
  roundRect(ctx, L.invBar.x, L.invBar.y, L.invBar.w, L.invBar.h, 15);
  ctx.stroke();

  if (shopMode === 'coins') {

    const chipStartX = L.invBar.x + 84;

    }
  }
  ctx.restore();

  // 5. "Not enough coins" + "Daily reward" shortcut banner (Boosters mode)
  if (shopMode === 'boosters' && shopNoCoinsTimer > 0) {
    const sb = L.shortcutBanner;
    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 4;
    ctx.fillStyle = 'rgba(69, 10, 10, 0.94)';
    roundRect(ctx, sb.x, sb.y, sb.w, sb.h, 16);
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = '#f87171';
    ctx.lineWidth = 2;
    roundRect(ctx, sb.x, sb.y, sb.w, sb.h, 16);
    ctx.stroke();

    drawGlossyText('Not enough coins!', sb.x + 14, sb.y + sb.h / 2 + 1, 13.5, 'left', '#fecaca', '#450a0a', 2.6);
    const dReady = isDailyRewardReady();
    const dLabel = dReady ? 'Daily reward' : 'Daily (Wait)';
    drawGlossyButton(sb.btn.x, sb.btn.y, sb.btn.w, sb.btn.h, dReady ? BUTTON_THEMES.yellow : BUTTON_THEMES.gray, dLabel, null, activePress === 'shop_shortcut_daily', 12);
    ctx.restore();
  }

  // 5b. Coin pack preview confirmation modal
  if (coinPackConfirmItem) {
    const b = L.confirmBox;
    ctx.save();
    ctx.fillStyle = 'rgba(10, 15, 25, 0.62)';
    ctx.fillRect(0, 0, W, H);

    ctx.shadowColor = 'rgba(0, 0, 0, 0.42)';
    ctx.shadowBlur = 18;
    ctx.shadowOffsetY = 8;
    ctx.fillStyle = '#f8fafc';
    roundRect(ctx, b.x, b.y, b.w, b.h, 22);
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 4.5;
    roundRect(ctx, b.x, b.y, b.w, b.h, 22);
    ctx.stroke();
    ctx.strokeStyle = '#1e3a8a';
    ctx.lineWidth = 2;
    roundRect(ctx, b.x, b.y, b.w, b.h, 22);
    ctx.stroke();

    drawGoldCoinIcon(W / 2 - 72, b.y + 42, 15);
    drawGlossyText(coinPackConfirmItem.title, W / 2 + 14, b.y + 42, 20, 'center', '#b45309', '#ffffff', 3.0);
    drawGlossyText(`Price: ${coinPackConfirmItem.priceText}`, W / 2, b.y + 74, 14, 'center', '#16a34a', '#ffffff', 2.4);
    drawGlossyText('Preview mode — no real money charged', W / 2, b.y + 98, 10.5, 'center', '#64748b', '#ffffff', 1.8);

    drawGlossyButton(b.yesBtn.x, b.yesBtn.y, b.yesBtn.w, b.yesBtn.h, BUTTON_THEMES.green, 'Get Coins', null, activePress === 'coin_pack_confirm_yes', 14);
    drawGlossyButton(b.noBtn.x, b.noBtn.y, b.noBtn.w, b.noBtn.h, BUTTON_THEMES.gray, 'Cancel', null, activePress === 'coin_pack_confirm_no', 14);
    ctx.restore();
  }

  // 6. Purchase & Daily Reward Sparkles
  for (let i = 0; i < shopSparkles.length; i++) {
    const spk = shopSparkles[i];
    const alpha = Math.max(0, Math.min(1, spk.life / spk.maxLife));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = spk.color;
    ctx.beginPath();
    ctx.arc(spk.x, spk.y, spk.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

function getSettingsModalLayout(isPauseMode) {
  const cw = 304;
  const cx = W / 2 - cw / 2;
  const padX = 16;
  const innerW = cw - padX * 2;
  const innerX = cx + padX;
  const hasVib = hasVibrationSupport();

  const ribbonOverhang = 40;
  const safeTop = Math.max(10, (topInset || 0) + 6) + ribbonOverhang;
  const safeBot = Math.max(12, (botInset || 0) + 10);

  let relY = isPauseMode ? 32 : 34;

  let resumeBtn = null;
  let restartBtn = null;
  let homeBtn = null;
  let soundBtn = null;
  let ambientBtn = null;
  let vibrateBtn = null;
  let hoverCard = null;
  let hoverBtn = null;
  let speedCard = null;
  let speedNormalBtn = null;
  let speedFastBtn = null;
  let speedTurboBtn = null;
  let resetBtn = null;

  if (isPauseMode) {
    const resH = 52;
    resumeBtn = { x: innerX, y: relY, w: innerW, h: resH };
    relY += resH + 12;

    const actGap = 12;
    const actW = (innerW - actGap) / 2;
    const actH = 44;
    restartBtn = { x: innerX, y: relY, w: actW, h: actH };
    homeBtn = { x: innerX + actW + actGap, y: relY, w: actW, h: actH };
    relY += actH + 16;

    // Pause mode: ONLY Sound and Vibration (if supported) square toggles
    const sqSz = 82;
    const sqGap = 24;
    const toggleCount = hasVib ? 2 : 1;
    const rowW = toggleCount * sqSz + (toggleCount - 1) * sqGap;
    const rowStartX = W / 2 - rowW / 2;
    soundBtn = { x: rowStartX, y: relY, w: sqSz, h: sqSz };
    vibrateBtn = hasVib ? { x: rowStartX + sqSz + sqGap, y: relY, w: sqSz, h: sqSz } : null;
    relY += sqSz + 20;
  } else {
    // Settings mode: Sound, Ambient, and Vibrate (if supported)
    const sqSz = 76;
    const sqGap = hasVib ? 14 : 22;
    const toggleCount = hasVib ? 3 : 2;
    const rowW = toggleCount * sqSz + (toggleCount - 1) * sqGap;
    const rowStartX = W / 2 - rowW / 2;
    soundBtn = { x: rowStartX, y: relY, w: sqSz, h: sqSz };
    ambientBtn = { x: rowStartX + sqSz + sqGap, y: relY, w: sqSz, h: sqSz };
    vibrateBtn = hasVib ? { x: rowStartX + (sqSz + sqGap) * 2, y: relY, w: sqSz, h: sqSz } : null;
    relY += sqSz + 11;

    // Row 2: Controls - Easy Hover (on/off)
    const hoverCardH = 48;
    const hoverBtnW = 80;
    const hoverBtnH = 34;
    hoverCard = { x: innerX, y: relY, w: innerW, h: hoverCardH };
    hoverBtn = {
      x: innerX + innerW - hoverBtnW - 8,
      y: relY + (hoverCardH - hoverBtnH) / 2,
      w: hoverBtnW,
      h: hoverBtnH
    };
    relY += hoverCardH + 11;

    // Row 3: Speed (Normal, Fast, Turbo)
    const speedCardH = 62;
    speedCard = { x: innerX, y: relY, w: innerW, h: speedCardH };
    const spGap = 8;
    const spBtnW = (innerW - 16 - spGap * 2) / 3;
    const spBtnH = 32;
    const spBtnY = relY + 23;
    const spStartX = innerX + 8;
    speedNormalBtn = { x: spStartX, y: spBtnY, w: spBtnW, h: spBtnH };
    speedFastBtn = { x: spStartX + spBtnW + spGap, y: spBtnY, w: spBtnW, h: spBtnH };
    speedTurboBtn = { x: spStartX + (spBtnW + spGap) * 2, y: spBtnY, w: spBtnW, h: spBtnH };
    relY += speedCardH + 12;

    // Row 4: Red Reset progress button
    const resetBtnW = 204;
    const resetBtnH = 40;
    resetBtn = { x: cx + (cw - resetBtnW) / 2, y: relY, w: resetBtnW, h: resetBtnH };
    relY += resetBtnH + 16;
  }

  const ch = relY;
  const rawCy = Math.round(H / 2 - ch / 2 + 8);
  const maxCy = Math.max(safeTop, H - safeBot - ch);
  const cy = Math.max(safeTop, Math.min(maxCy, rawCy));

  const shiftY = (r) => r ? { x: r.x, y: cy + r.y, w: r.w, h: r.h } : null;

  // Confirmation modal ("Are you sure?") centered within safe area
  const confW = 260, confH = 166;
  const confX = W / 2 - confW / 2;
  const confSafeTop = Math.max(12, (topInset || 0) + 12);
  const confCyRaw = Math.round(H / 2 - confH / 2);
  const confY = Math.max(confSafeTop, Math.min(H - safeBot - confH, confCyRaw));
  const confBtnW = 98, confBtnH = 42, confBtnY = confY + 102;

  return {
    isPauseMode,
    hasVib,
    cx, cy, cw, ch,
    closeCenter: { x: cx + cw - 12, y: cy + 12, r: 17 },
    resumeBtn: shiftY(resumeBtn),
    restartBtn: shiftY(restartBtn),
    homeBtn: shiftY(homeBtn),
    soundBtn: shiftY(soundBtn),
    ambientBtn: shiftY(ambientBtn),
    vibrateBtn: shiftY(vibrateBtn),
    hoverCard: shiftY(hoverCard),
    hoverBtn: shiftY(hoverBtn),
    speedCard: shiftY(speedCard),
    speedNormalBtn: shiftY(speedNormalBtn),
    speedFastBtn: shiftY(speedFastBtn),
    speedTurboBtn: shiftY(speedTurboBtn),
    resetBtn: shiftY(resetBtn),
    confirmBox: {
      x: confX, y: confY, w: confW, h: confH,
      yesBtn: { x: confX + 22, y: confBtnY, w: confBtnW, h: confBtnH },
      noBtn: { x: confX + confW - 22 - confBtnW, y: confBtnY, w: confBtnW, h: confBtnH }
    }
  };
}

    drawGlossyText('SPEED', L.speedCard.x + L.speedCard.w / 2, L.speedCard.y + 13, 10, 'center', '#64748b', '#0f172a', 1.9);

    const normTheme = (speedMode === 'normal') ? BUTTON_THEMES.blue : BUTTON_THEMES.gray;
    drawGlossyButton(L.speedNormalBtn.x, L.speedNormalBtn.y, L.speedNormalBtn.w, L.speedNormalBtn.h, normTheme, 'Normal', null, activePress === 'set_speed_normal', 10);

    const fastTheme = (speedMode === 'fast') ? BUTTON_THEMES.green : BUTTON_THEMES.gray;
    drawGlossyButton(L.speedFastBtn.x, L.speedFastBtn.y, L.speedFastBtn.w, L.speedFastBtn.h, fastTheme, 'Fast', null, activePress === 'set_speed_fast', 10);

    const turboTheme = (speedMode === 'turbo') ? BUTTON_THEMES.orange : BUTTON_THEMES.gray;
    drawGlossyButton(L.speedTurboBtn.x, L.speedTurboBtn.y, L.speedTurboBtn.w, L.speedTurboBtn.h, turboTheme, 'Turbo', null, activePress === 'set_speed_turbo', 10);

    // Row 4: Red Reset progress button
    drawGlossyButton(L.resetBtn.x, L.resetBtn.y, L.resetBtn.w, L.resetBtn.h, BUTTON_THEMES.red, 'Reset progress', null, activePress === 'ask_reset_progress', 13);
  }

  // Sub-popups ("Are you sure?")
  if (isPauseMode && homeConfirmOpen) {
    drawAreYouSureSubPopup(L, 'Return to the main menu?', 'pause_home_confirm_yes', 'pause_home_confirm_no');
  } else if (resetConfirming) {
    drawAreYouSureSubPopup(L, 'Reset progress to Level 1?', 'confirm_reset_progress', 'cancel_reset_progress');
  }

  ctx.restore();
}

function drawPauseCountdown() {
  const num = Math.max(1, Math.min(3, Math.ceil(pauseCountdown)));
  const elapsedInBeat = num - pauseCountdown;
  const scale = 1.35 - 0.35 * Math.min(1, elapsedInBeat / 0.25);
  const alpha = (elapsedInBeat > 0.85) ? Math.max(0.2, (1 - elapsedInBeat) / 0.15) : 1.0;

  ctx.save();
  ctx.fillStyle = 'rgba(10, 15, 25, 0.35)';
  ctx.fillRect(0, 0, W, H);

  ctx.translate(W / 2, H * 0.44);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;

  const r = 46;
  ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 4;
  const g = ctx.createLinearGradient(0, -r, 0, r);
  g.addColorStop(0, '#93c5fd');
  g.addColorStop(0.5, '#3b82f6');
  g.addColorStop(1, '#1d4ed8');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3.5;
  ctx.stroke();

  drawGlossyText(String(num), 0, 3, 52, 'center', '#ffffff', '#0f172a', 7.5);
  ctx.restore();
}

  ctx.fill();
  ctx.strokeStyle = '#60a5fa';

  ctx.stroke();
  drawButtonIcon('daily_calendar', cx + 46, heroY, 34);

  drawGlossyText(`7-DAY STREAK`, cx + 78, heroY - 9, 15.5, 'left', '#1e3a8a', '#ffffff', 2.6);
  drawGlossyText(`Collected: ${effStreak} / 7 Days`, cx + 78, heroY + 10, 11.5, 'left', '#64748b', '#ffffff', 2.0);

  // 7 Days as cards: Row 1 (Days 1..4), Row 2 (Days 5..7)
  const padX = 14;
  const gap = 8;
  const row1Y = cy + 84;
  const cardH1 = 86;
  const cardW1 = Math.floor((cw - padX * 2 - gap * 3) / 4); // 66px

  const drawDayCard = (dayIdx, rx, ry, rw, rh, isDay7) => {
    const dayNum = dayIdx + 1;
    const rewardCoins = DAILY_STREAK_REWARDS[dayIdx];
    const isCollected = (dayIdx < effStreak);

    const pulse = isToday ? (1 + 0.045 * Math.sin(gameTime * 6.0)) : 1.0;

    ctx.save();
    ctx.translate(rx + rw / 2, ry + rh / 2);
    ctx.scale(pulse, pulse);
    const lx = -rw / 2, ly = -rh / 2;

      ctx.shadowColor = 'rgba(250, 204, 21, 0.7)';
      ctx.shadowBlur = 12;

    const grad = ctx.createLinearGradient(0, ly, 0, ly + rh);
    if (isCollected) {
      grad.addColorStop(0, '#dcfce7');
      grad.addColorStop(1, '#bbf7d0');

      grad.addColorStop(0, '#fef9c3');
      grad.addColorStop(0.55, '#fde047');

function drawRotatingSunburstRays(cx, cy, maxR, rayCount, speed, alpha) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(gameTime * speed);
  const step = (Math.PI * 2) / rayCount;
  const halfSlice = step * 0.24;
  for (let i = 0; i < rayCount; i++) {
    const a = i * step;
    const grad = ctx.createRadialGradient(0, 0, 6, 0, 0, maxR);
    grad.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
    grad.addColorStop(0.55, `rgba(255, 255, 255, ${alpha * 0.45})`);
    grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, maxR, a - halfSlice, a + halfSlice);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawNoAdsCircleEmblem(cx, cy, radius) {
  ctx.save();
  ctx.translate(cx, cy);

  // White outer bezel rim
  ctx.shadowColor = 'rgba(88, 28, 135, 0.35)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 4;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowColor = 'transparent';

  // Deep purple inner circle
  const innerR = radius * 0.80;
  const pGrad = ctx.createRadialGradient(0, -innerR * 0.25, 4, 0, 0, innerR);
  pGrad.addColorStop(0, '#7c3aed');
  pGrad.addColorStop(1, '#4c1d95');
  ctx.fillStyle = pGrad;
  ctx.beginPath();
  ctx.arc(0, 0, innerR, 0, Math.PI * 2);
  ctx.fill();

  // Diagonal prohibition slash (under ADS text)
  const ringR = radius * 0.80;
  const ringW = radius * 0.19;
  ctx.save();
  ctx.strokeStyle = '#dc2626';
  ctx.lineWidth = ringW * 0.86;
  ctx.lineCap = 'butt';
  ctx.beginPath();
  const diag = ringR * 0.72;
  ctx.moveTo(-diag, diag);
  ctx.lineTo(diag, -diag);
  ctx.stroke();

  // Glossy red prohibition outer ring
  const rGrad = ctx.createLinearGradient(0, -ringR, 0, ringR);
  rGrad.addColorStop(0, '#f87171');
  rGrad.addColorStop(0.45, '#ef4444');
  rGrad.addColorStop(1, '#b91c1c');
  ctx.strokeStyle = rGrad;
  ctx.lineWidth = ringW;
  ctx.beginPath();
  ctx.arc(0, 0, ringR, 0, Math.PI * 2);
  ctx.stroke();

  // Subtle top glossy arc highlight on red ring
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
  ctx.lineWidth = ringW * 0.32;
  ctx.beginPath();
  ctx.arc(0, 0, ringR + ringW * 0.14, -Math.PI * 0.82, -Math.PI * 0.18);
  ctx.stroke();
  ctx.restore();

  // Bold white ADS letters across center
  drawGlossyText('ADS', 0, 2, radius * 0.68, 'center', '#ffffff', '#2e1065', 5.2);
  ctx.restore();
}

function drawLevelCompletePopup() {
  ctx.save();
  ctx.fillStyle = 'rgba(10, 15, 25, 0.65)';
  ctx.fillRect(0, 0, W, H);

  drawConfetti();

  const isPerf = isPerfect;
  const cw = 296, ch = isPerf ? 312 : 282;
  const cx = W / 2 - cw / 2, cy = H / 2 - ch / 2 - 15;

  ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
  ctx.shadowBlur = 18;
  ctx.shadowOffsetY = 8;
  ctx.fillStyle = '#f8fafc';
  roundRect(ctx, cx, cy, cw, ch, 24);
  ctx.fill();

  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#22c55e';
  ctx.lineWidth = 5;
  roundRect(ctx, cx, cy, cw, ch, 24);
  ctx.stroke();

  ctx.strokeStyle = '#052e16';
  ctx.lineWidth = 2;
  roundRect(ctx, cx, cy, cw, ch, 24);
  ctx.stroke();

  const lvlNum = levelJustCleared || (curLevel > 1 ? curLevel - 1 : 1);
  drawRibbonHeader(W / 2, cy - 20, 230, 44, `LEVEL ${lvlNum} CLEAR!`, BUTTON_THEMES.green, 2);

  const isXPressed = (activePress === 'close_complete');
  drawRoundGlossyButton(cx + cw - 12, cy + 12, 17, BUTTON_THEMES.red, 'close', isXPressed);

  // Play star sound when each star appears
  const starDelays = [0.35, 0.70, 1.05];
  for (let i = 0; i < 3; i++) {
    if (earnedStars >= (i + 1) && levelCompleteTimer >= starDelays[i] && !starSoundsPlayed[i]) {
      starSoundsPlayed[i] = true;
      playStarSound(i + 1);
    }
  }

  // Draw 3 stars with sequential pop animation
  const starCoords = [
    { x: W / 2 - 50, y: cy + 54, r: 19 },
    { x: W / 2,      y: cy + 42, r: 25 },
    { x: W / 2 + 50, y: cy + 54, r: 19 }
  ];

  for (let i = 0; i < 3; i++) {
    const sc = starCoords[i];
    const delay = starDelays[i];
    if (earnedStars >= (i + 1)) {
      if (levelCompleteTimer < delay) {
        drawEmptyStar(sc.x, sc.y, sc.r);
      } else {
        const t = (levelCompleteTimer - delay) / 0.22;
        let scale = 1.0;
        if (t < 1.0) {
          scale = 1.0 + 0.35 * Math.sin(t * Math.PI);
        }
        drawGoldStar(sc.x, sc.y, sc.r, scale);
      }
    } else {
      drawEmptyStar(sc.x, sc.y, sc.r);
    }
  }

  // PERFECT bonus: if 100% coins collected
  if (isPerf) {
    drawGoldenPerfectRibbon(W / 2, cy + 86, 210, 30);

    if (levelCompleteTimer >= 1.25 && !perfectBonusGiven) {
      perfectBonusGiven = true;
      wallet += 25;
      saveWallet();
      playPerfectBonusSound();

      // 10 bonus coins fly towards the wallet at top-right
      const ribX = W / 2;
      const ribY = cy + 86;
      const wX = W - 55;
      const wY = 38 + topInset + 12;
      for (let k = 0; k < 10; k++) {
        flyingCoins.push({
          startX: ribX + rnd(-18, 18),
          startY: ribY + rnd(-4, 4),
          curX: ribX,
          curY: ribY,
          endX: wX,
          endY: wY,
          t: -k * 0.045,
          dur: 0.52,
          type: 'coin'
        });
      }
    }
  }

  // Quick count-up for "Coins: collected / total" with gold coin icon
  const countT = Math.min(1.0, levelCompleteTimer / 0.65);
  const displayedCoins = Math.min(levelCoinsCollected, Math.floor(countT * levelCoinsCollected));
  const coinsRowY = isPerf ? (cy + 130) : (cy + 102);

  const coinsText = `Coins: ${displayedCoins} / ${levelCoinsTotal}`;
  ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  const tw = ctx.measureText(coinsText).width;
  const coinR = 11;
  const gap = 8;
  const totalW = coinR * 2 + gap + tw;
  const startX = W / 2 - totalW / 2;
  const coinCX = startX + coinR;
  const coinCY = coinsRowY;

  const curAnimFrame = Math.floor(gameTime * 10) % 8;
  if (coinFrames[curAnimFrame]) {
    const spr = coinFrames[curAnimFrame];
    const s = (coinR * 2.2) / spr.height;
    ctx.drawImage(spr, coinCX - (spr.width * s) / 2, coinCY - (spr.height * s) / 2, spr.width * s, spr.height * s);
  } else {
    ctx.save();
    ctx.beginPath();
    ctx.arc(coinCX, coinCY, coinR * 0.85, 0, Math.PI * 2);
    ctx.fillStyle = '#fde047';
    ctx.fill();
    ctx.restore();
  }
  drawGlossyText(coinsText, coinCX + coinR + gap, coinCY + 1, 16, 'left', '#fde047', '#713f12', 3.0);

  // Total Score & Wallet Line
  const totalScore = 100 * lvlNum;
  const scoreRowY = isPerf ? (cy + 162) : (cy + 134);
  drawGlossyText(`Total Score: ${totalScore}  •  🪙 Wallet: ${wallet}`, W / 2, scoreRowY, 13, 'center', '#ffffff', '#0f172a', 2.6);

  // Next Level button
  const btnW = 210, btnH = 52;
  const isNextPressed = (activePress === 'next_level');
  drawGlossyButton(W / 2 - btnW / 2, cy + ch - 66, btnW, btnH, BUTTON_THEMES.green, `START LEVEL ${lvlNum + 1}`, null, isNextPressed, 22);

  // Wallet coin pill on top right
  drawWalletCoinPill(W - 98, 14 + topInset, 88, 24, wallet, coinCounterBump);

  // Draw Flying Coins above popup
  for (let i = 0; i < flyingCoins.length; i++) {
    const fc = flyingCoins[i];
    if (fc.t < 0) continue;
    const spr = getCoinSprite(fc.type, curAnimFrame);
    if (spr) {
      ctx.save();
      const glow = (fc.type === 'coin_100' || fc.type === 'gem') ? '#ffffff' : ((fc.type === 'coin_50' || fc.type === 'gold' || fc.type === 'silver') ? '#facc15' : '#fde047');
      ctx.shadowColor = glow;
      ctx.shadowBlur = 8;
      ctx.drawImage(spr, fc.curX - spr.width / 2, fc.curY - spr.height / 2);
      ctx.restore();
    }
  }

  ctx.restore();
}

function drawCrashPopup() {
  ctx.save();
  ctx.fillStyle = 'rgba(10, 15, 25, 0.7)';
  ctx.fillRect(0, 0, W, H);

  const cw = 290, ch = 275;
  const cx = W / 2 - cw / 2, cy = H / 2 - ch / 2 - 20;

  ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
  ctx.shadowBlur = 18;
  ctx.shadowOffsetY = 8;
  ctx.fillStyle = '#f8fafc';
  roundRect(ctx, cx, cy, cw, ch, 24);
  ctx.fill();

  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 5;
  roundRect(ctx, cx, cy, cw, ch, 24);
  ctx.stroke();

  ctx.strokeStyle = '#450a0a';
  ctx.lineWidth = 2;
  roundRect(ctx, cx, cy, cw, ch, 24);
  ctx.stroke();

  drawRibbonHeader(W / 2, cy - 20, 200, 44, 'CRASHED', BUTTON_THEMES.red, 2);

  const isXPressed = (activePress === 'close_dead');
  drawRoundGlossyButton(cx + cw - 12, cy + 12, 17, BUTTON_THEMES.red, 'close', isXPressed);

  const progress = getLevelProgress();
  const curScore = Math.floor(progress * 100);
  const currentTotal = 100 * (curLevel - 1) + curScore;

  drawGlossyText(`LEVEL ${curLevel}: ${curScore}%`, W / 2, cy + 62, 22, 'center', '#ffffff', '#ef4444', 4.5);
  drawGlossyText(`Score: ${currentTotal}`, W / 2, cy + 96, 16, 'center', '#ffffff', '#0f172a', 3.5);
  drawGlossyText(`Best: ${best}`, W / 2, cy + 122, 16, 'center', '#ffffff', '#ea580c', 3.5);
  drawGlossyText(`Coins kept: ${levelCoinsCollected}`, W / 2, cy + 148, 14, 'center', '#fde047', '#713f12', 3.0);

  const btnW = 210, btnH = 52;
  const isTryPressed = (activePress === 'try_again');
  drawGlossyButton(W / 2 - btnW / 2, cy + ch - 68, btnW, btnH, BUTTON_THEMES.orange, `RETRY LEVEL ${curLevel}`, null, isTryPressed, 22);

  ctx.restore();
}

function drawGameContent(dt = 0.016) {
  const cfg = curConfig;

  // Camera shake: up to 1.5px during booster, or 1.0px in Turbo mode during active play
  let shakeX = 0, shakeY = 0;
  if (st === 'play' && finishRunStage === 'none' && !stopping && !paused && pauseCountdown <= 0) {
    if (boostRampFactor > 0.05) {
      shakeX = (Math.random() * 2 - 1) * 1.5 * boostRampFactor;
      shakeY = (Math.random() * 2 - 1) * 1.5 * boostRampFactor;
    } else if (speedMode === 'turbo') {
      shakeX = (Math.random() * 2 - 1) * 1.0;
      shakeY = (Math.random() * 2 - 1) * 1.0;
    }
  }
  if (shakeX !== 0 || shakeY !== 0) {
    ctx.save();
    ctx.translate(shakeX, shakeY);
  }

  // 1. Picture background (or fallback procedural)
  drawBackground();

  // 2. Wheel thruster smoke (behind road and car; never drawn on top of road or truss)
  const sRoadX1 = START_ROAD_START - cam - 20;
  const sRoadX2 = START_ROAD_END - cam + 20;
  const fRoadX1 = FINISH_ROAD_X - cam - 20;
  const fRoadX2 = FINISH_ROAD_END - cam + 20;

  for (const p of parts) {
    const k = 1 - p.l / p.m;
    if (k <= 0) continue;
    const r = p.size * (1 + 0.3 * (1 - k));

    // Exclude any smoke from being drawn on top of the road or truss
    const overRoad = (p.x + r >= sRoadX1 && p.x - r <= sRoadX2) || (p.x + r >= fRoadX1 && p.x - r <= fRoadX2);
    if (overRoad && p.y + r >= ROAD_TOP - 2) {
      if (p.y - r >= ROAD_TOP - 2) continue;
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, ROAD_TOP - 2);
      ctx.clip();
      ctx.globalAlpha = 0.7 * k;
      ctx.fillStyle = p.color || '#ffffff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, 6.28);
      ctx.fill();
      ctx.restore();
    } else {
      ctx.globalAlpha = 0.7 * k;
      ctx.fillStyle = p.color || '#ffffff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, 6.28);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // 3. Starting Road Platform
  drawRoadPlatform(START_ROAD_START, START_ROAD_END, ROAD_TOP);

  // 4. Finish Road Platform
  drawRoadPlatform(FINISH_ROAD_X, FINISH_ROAD_END, ROAD_TOP, true);

  // 5. Spikes & Studded Rails with continuous connected rail pieces
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i];
    const x = s.x - cam;
    if (x + s.w < -60 || x > W + 60) continue;
    if (!s.isOpen) drawWall(s, x);
    if (s.obstacles) drawObstacles(s, x, cfg);

    const curTop = (s.curTop !== undefined) ? s.curTop : s.top;
    const curBot = (s.curBot !== undefined) ? s.curBot : s.bot;

    // Connected Rails between neighboring segments (visual only, no collision)
    if (i < segs.length - 1) {
      const sNext = segs[i + 1];
      if (!s.isOpen && !sNext.isOpen && !s.isSlanted && !sNext.isSlanted) {
        const nextTop = (sNext.curTop !== undefined) ? sNext.curTop : sNext.top;
        const nextBot = (sNext.curBot !== undefined) ? sNext.curBot : sNext.bot;
        const seamX = (s.x + s.w) - cam;
        if (Math.abs(curTop - nextTop) > 1) {
          drawVerticalRailConnector(seamX, curTop - 18 - RAIL_THICKNESS, nextTop - 18 - RAIL_THICKNESS, cfg);
        }
        if (Math.abs(curBot - nextBot) > 1) {
          drawVerticalRailConnector(seamX, curBot + 18, nextBot + 18, cfg);
        }
      }
    }

    if (s.topSpikes) {
      const count = s.topSpikes.length;
      for (let j = 0; j < count; j++) {
        let baseY = curTop - 18;
        if (s.isSlanted && s.top2 !== undefined) {
          const t = Math.min(1, (j * 12) / s.w);
          baseY = (curTop + (s.top2 - curTop) * t) - 18;
        }
        drawSpike(x + j * 12, baseY, true, s.topSpikes[j], j, s.slope || 0);
      }
    }
    if (s.botSpikes) {
      const count = s.botSpikes.length;
      for (let j = 0; j < count; j++) {
        let baseY = curBot + 18;
        if (s.isSlanted && s.bot2 !== undefined) {
          const t = Math.min(1, (j * 12) / s.w);
          baseY = (curBot + (s.bot2 - curBot) * t) + 18;
        }
        drawSpike(x + j * 12, baseY, false, s.botSpikes[j], j, s.slope || 0);
      }
    }
  }

  // 5b. Collectible Coins and Gems
  const animFrame = Math.floor((gameTime * 10) % 8);

  for (let i = 0; i < coins.length; i++) {
    const c = coins[i];
    const screenX = c.x - cam;
    if (screenX < -50 || screenX > W + 50) continue;

    if (!c.collected) {
      const f = Math.floor((gameTime * 10 + c.phase) % 8);
      const spr = getCoinSprite(c.type, f);
      if (spr) {
        if (c.type === 'gold') {
          ctx.save();
          ctx.shadowColor = 'rgba(250, 204, 21, 0.7)';
          ctx.shadowBlur = 10;
          ctx.drawImage(spr, screenX - spr.width / 2, c.y - spr.height / 2);
          ctx.restore();
        } else {
          ctx.drawImage(spr, screenX - spr.width / 2, c.y - spr.height / 2);
        }
      }
    } else if (c.popTimer > 0) {
      const popK = c.popTimer / 0.22;
      const popScale = 1.0 + (1 - popK) * 0.6;
      const spr = getCoinSprite(c.type, 0);
      if (spr) {
        ctx.save();
        ctx.globalAlpha = popK;
        ctx.translate(screenX, c.y);
        ctx.scale(popScale, popScale);
        ctx.drawImage(spr, -spr.width / 2, -spr.height / 2);
        ctx.restore();
      }
    }
  }

  // Draw Coin Sparkles
  for (let i = 0; i < coinSparkles.length; i++) {
    const spk = coinSparkles[i];
    const alpha = Math.max(0, spk.life / spk.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = spk.color;
    ctx.shadowColor = spk.color;
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.arc(spk.x, spk.y, spk.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Draw Flying Coins
  for (let i = 0; i < flyingCoins.length; i++) {
    const fc = flyingCoins[i];
    if (fc.t < 0) continue;
    const spr = getCoinSprite(fc.type, animFrame);
    if (spr) {
      ctx.save();
      const glow = (fc.type === 'coin_100' || fc.type === 'gem') ? '#ffffff' : ((fc.type === 'coin_50' || fc.type === 'gold' || fc.type === 'silver') ? '#facc15' : '#fde047');
      ctx.shadowColor = glow;
      ctx.shadowBlur = 6;
      ctx.drawImage(spr, fc.curX - spr.width / 2, fc.curY - spr.height / 2);
      ctx.restore();
    }
  }

  // Draw Floating Texts (+1, +5)
  for (let i = 0; i < coinFloatTexts.length; i++) {
    const ft = coinFloatTexts[i];
    const alpha = Math.min(1, ft.timer / 0.3);
    ctx.save();
    ctx.globalAlpha = alpha;
    drawGlossyText(ft.text, ft.x, ft.y, 16, 'center', ft.color, '#0f172a', 3.8);
    ctx.restore();
  }

  // Draw Boosters & Booster Sparkles
  drawBoosters();

  // Ghost copies trail during boost
  if (carGhostTrail.length > 0 && trimmedCarCanvas) {
    ctx.save();
    for (let i = 0; i < carGhostTrail.length; i++) {
      const g = carGhostTrail[i];
      if (g.alpha <= 0.02) continue;
      ctx.globalAlpha = g.alpha * 0.45;
      const gCenterY = (g.y + 24) - CAR_DRAW_H / 2;
      ctx.drawImage(trimmedCarCanvas, g.x - CAR_DRAW_W / 2, gCenterY - CAR_DRAW_H / 2, CAR_DRAW_W, CAR_DRAW_H);
    }
    ctx.restore();
  }

  // Bright speed aura around car during boost
  if (boostRampFactor > 0.05) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const auraX = (st === 'ready') ? carDrawX : CAR_X;
    const auraY = (cy + 24) - CAR_DRAW_H / 2;
    const auraGrad = ctx.createRadialGradient(auraX, auraY, CAR_DRAW_W * 0.2, auraX, auraY, CAR_DRAW_W * 0.65);
    const auraAlpha = 0.5 * boostRampFactor;
    auraGrad.addColorStop(0, `rgba(255, 255, 255, ${auraAlpha})`);
    auraGrad.addColorStop(0.4, `rgba(56, 189, 248, ${auraAlpha * 0.8})`);
    auraGrad.addColorStop(0.8, `rgba(147, 51, 234, ${auraAlpha * 0.3})`);
    auraGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');
    ctx.fillStyle = auraGrad;
    ctx.beginPath();
    ctx.ellipse(auraX, auraY, CAR_DRAW_W * 0.65, CAR_DRAW_H * 0.9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 6. Sky Car (thin dark outline + soft shadow, blinking during boost/shield protection fade)
  let carAlpha = 1.0;
  if (st === 'ready') {
    carAlpha = Math.min(1, menuFadeTimer / 0.3);
  } else if ((boostTimer <= 0 && boostProtectionTimer > 0) || (!shieldActive && shieldBreakInvulnTimer > 0)) {
    const blinkT = Math.max(boostProtectionTimer, shieldBreakInvulnTimer);
    carAlpha = (Math.floor(blinkT * 22) % 2 === 0) ? 0.35 : 1.0;
  }
  ctx.save();
  ctx.globalAlpha = carAlpha;
  car(carDrawX);
  ctx.restore();

  // Magnet aura around car
  if (magnetTimer > 0 && st === 'play') {
    ctx.save();
    const auraX = CAR_X;
    const auraY = (cy + 24) - CAR_DRAW_H / 2;
    const pulse = (gameTime * 2.2) % 1;
    ctx.strokeStyle = `rgba(232, 121, 249, ${(1 - pulse) * 0.55})`;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(auraX, auraY, 34 + pulse * 36, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Energy Shield bubble around car
  if (shieldActive && st === 'play') {
    ctx.save();
    const sX = CAR_X;
    const sY = (cy + 24) - CAR_DRAW_H / 2;
    const sPulse = 0.5 + 0.5 * Math.sin(gameTime * 6);
    const sGrad = ctx.createRadialGradient(sX, sY, 18, sX, sY, 48);
    sGrad.addColorStop(0, 'rgba(74, 222, 128, 0.04)');
    sGrad.addColorStop(0.75, 'rgba(74, 222, 128, 0.22)');
    sGrad.addColorStop(1, 'rgba(134, 239, 172, 0.55)');
    ctx.fillStyle = sGrad;
    ctx.beginPath();
    ctx.ellipse(sX, sY, CAR_DRAW_W * 0.56, CAR_DRAW_H * 0.88, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = `rgba(134, 239, 172, ${0.7 + 0.3 * sPulse})`;
    ctx.lineWidth = 2.4;
    ctx.stroke();
    ctx.restore();
  }

  // Jet thruster sparks (falling down and drifting back with the world)
  if (SHOW_FLAMES) {
    drawSparks(ctx);
  }
  drawHazardParticles(ctx);

  // Thin horizontal speed lines in the stage's accent color
  const curStage = getStage(curLevel);
  const speedLinesDt = (paused || pauseCountdown > 0) ? 0 : dt;
  updateAndDrawSpeedLines(speedLinesDt, speed(), curStage);

  if (shakeX !== 0 || shakeY !== 0) {
    ctx.restore();
  }

  // Subtle cool icy overlay when Slow-Mo is active
  if (slowMoTimer > 0 && st === 'play') {
    ctx.save();
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
    ctx.lineWidth = 8;
    ctx.strokeRect(0, 0, W, H);
    ctx.restore();
  }

  // 7. UI and Screens (all HUD text in white with dark outline)
  if (st === 'play') {
    if (stopping || confettiStarted) {
      drawConfetti();
    }
    drawHUD();
    drawFloatingTexts();
    if (SHOW_DEBUG) {
      drawDebugOverlay();
    }
    if (paused) {
      drawPausePopup();
    } else if (pauseCountdown > 0) {
      drawPauseCountdown();
    }

  } else if (st === 'transition') {
    if (levelTransitionInitialized) {
      drawHUD();
      drawFloatingTexts();
    }
    drawStylishLevelTransition(transitionTimer);

  } else if (st === 'ready') {
    const menuAlpha = Math.min(1, menuFadeTimer / 0.3);
    ctx.save();
    ctx.globalAlpha = menuAlpha;

    // Top Right: Wallet Coin pill with gold coin and green "+" shortcut to Shop
    drawWalletCoinPill(W - 126, 16 + topInset, 114, 26, wallet, coinCounterBump, true);

    // Left-side Main Menu Buttons (No Ads image badge & one-time Starter Pack)
    const leftMenu = getMainMenuLeftButtonsLayout();
    if (leftMenu.noAdsBtn) {
      const nBtn = leftMenu.noAdsBtn;
      const isNoAdsPressed = (activePress === 'open_no_ads_popup');
      drawNoAdsBadgeIcon(nBtn.x + nBtn.w / 2, nBtn.y + nBtn.h / 2, nBtn.w, nBtn.h, isNoAdsPressed);
    }

    if (leftMenu.starterBtn) {
      const sBtn = leftMenu.starterBtn;
      const isStarterMenuPressed = (activePress === 'open_starter_popup');
      drawGlossyButton(sBtn.x, sBtn.y, sBtn.w, sBtn.h, BUTTON_THEMES.orange, null, 'starter_bundle', isStarterMenuPressed, 15);
      drawGlossyText('STARTER', sBtn.x + sBtn.w / 2, sBtn.y + sBtn.h - 7, 8.2, 'center', '#ffffff', '#7c2d12', 2.4);
    }

    // Title Logo
    drawGlossyText('THORN RUSH', W / 2, 120 + topInset * 0.6, 46, 'center', '#ffffff', '#0f172a', 8);
    const menuStageText = getStageMenuText(curLevel);
    drawGlossyText(menuStageText, W / 2, 165 + topInset * 0.6, 18, 'center', '#ffffff', '#0f172a', 4.5);
    const stageNum = getStageNumber(curLevel);
    const newHazardText = STAGE_NEW_HAZARDS[stageNum];
    if (newHazardText && getLevelInStage(curLevel) === 1) {
      drawGlossyText(newHazardText, W / 2, 192 + topInset * 0.6, 12, 'center', '#fde047', '#0f172a', 3.0);
    }

    // "Take with you" pre-level booster row (shown only if player owns boosters)
    const takeLayout = getTakeWithYouSlots();
    if (takeLayout) {
      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
      roundRect(ctx, takeLayout.barX, takeLayout.barY, takeLayout.barW, takeLayout.barH, 16);
      ctx.fill();
      ctx.strokeStyle = '#c084fc';
      ctx.lineWidth = 1.8;
      roundRect(ctx, takeLayout.barX, takeLayout.barY, takeLayout.barW, takeLayout.barH, 16);
      ctx.stroke();

      drawGlossyText('Take with you', W / 2, takeLayout.barY + 9, 10, 'center', '#f5d0fe', '#0f172a', 2.2);

      for (let i = 0; i < takeLayout.slots.length; i++) {
        const s = takeLayout.slots[i];
        const item = getShopItemById(s.id);
        if (!item) continue;
        const isSelected = Boolean(selectedLoadout[s.id]);
        const isSlotPressed = (activePress === 'toggle_take_' + s.id);
        const sTheme = isSelected ? BUTTON_THEMES[item.themeKey] : BUTTON_THEMES.gray;
        drawGlossyButton(s.x, s.y, s.w, s.h, sTheme, null, item.icon, isSlotPressed, 12);

        // Count badge at bottom-right
        drawGlossyText(`x${inventory[s.id] || 0}`, s.x + s.w - 3, s.y + s.h - 5, 9.5, 'right', '#fde047', '#0f172a', 2.2);

        // Checkmark dot at top-right if selected
        if (isSelected) {
          const chkX = s.x + s.w - 4;
          const chkY = s.y + 4;
          ctx.fillStyle = '#22c55e';
          ctx.beginPath(); ctx.arc(chkX, chkY, 6, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(chkX - 2.6, chkY); ctx.lineTo(chkX - 0.5, chkY + 2.2); ctx.lineTo(chkX + 3, chkY - 2);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    // Bottom Row: moved up by botInset (slides down on level start)
    let bottomSlideY = 0;
    if (menuExiting) {
      const p = Math.max(0, Math.min(1, menuExitTimer / MENU_EXIT_DURATION));
      const easeIn = p * p * (0.35 + 0.65 * p);
      bottomSlideY = easeIn * (150 + botInset);
    }

    ctx.save();
    if (bottomSlideY !== 0) {
      ctx.translate(0, bottomSlideY);
    }

    const btnY = H - 70 - botInset;
    const playY = H - 98 - botInset;

    const isSetPressed = (activePress === 'open_settings');
    drawRoundGlossyButton(52, btnY, 26, BUTTON_THEMES.blue, 'gear', isSetPressed);

    const isLevelPressed = (activePress === 'start_level');
    drawGlossyButton(96, playY, 168, 56, BUTTON_THEMES.green, `LEVEL ${curLevel}`, null, isLevelPressed, 28);

    const isShopPressed = (activePress === 'open_shop');
    drawRoundGlossyButton(308, btnY, 26, BUTTON_THEMES.purple, 'shop', isShopPressed);

    ctx.restore();
    ctx.restore();

  } else if (st === 'level_complete') {
    drawLevelCompletePopup();

  } else if (st === 'dead') {
    drawCrashPopup();
  }

  if (settingsOpen) {
    drawSettingsPopup();
  }

  if (noAdsPopupOpen) {
    drawNoAdsPopup();
  } else if (dailyPopupOpen) {
    drawDailyRewardPopup();
    drawWalletCoinPill(W - 126, 16 + topInset, 114, 26, wallet, coinCounterBump, false);
    for (let i = 0; i < flyingCoins.length; i++) {
      const fc = flyingCoins[i];
      if (fc.t < 0) continue;
      const spr = getCoinSprite(fc.type, animFrame);
      if (spr) {
        ctx.save();
        ctx.shadowColor = '#fde047';
        ctx.shadowBlur = 6;
        ctx.drawImage(spr, fc.curX - spr.width / 2, fc.curY - spr.height / 2);
        ctx.restore();
      }
    }
  } else if (starterPopupOpen) {
    drawStarterPackPopup();
    drawWalletCoinPill(W - 126, 16 + topInset, 114, 26, wallet, coinCounterBump, false);
    for (let i = 0; i < flyingCoins.length; i++) {
      const fc = flyingCoins[i];
      if (fc.t < 0) continue;
      const spr = getCoinSprite(fc.type, animFrame);
      if (spr) {
        ctx.save();
        ctx.shadowColor = '#fde047';
        ctx.shadowBlur = 6;
        ctx.drawImage(spr, fc.curX - spr.width / 2, fc.curY - spr.height / 2);
        ctx.restore();
      }
    }
  } else if (st === 'ready' && flyingCoins.length > 0) {
    for (let i = 0; i < flyingCoins.length; i++) {
      const fc = flyingCoins[i];
      if (fc.t < 0) continue;
      const spr = getCoinSprite(fc.type, animFrame);
      if (spr) {
        ctx.save();
        ctx.shadowColor = '#fde047';
        ctx.shadowBlur = 6;
        ctx.drawImage(spr, fc.curX - spr.width / 2, fc.curY - spr.height / 2);
        ctx.restore();
      }
    }
  }

  if (shopOpen) {
    drawShopScreen();
  }

  if (toastMsg && toastTimer > 0) {
    ctx.save();
    const tw = 180, th = 38;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 4;
    ctx.fillStyle = '#1e1b4b';
    roundRect(ctx, W / 2 - tw / 2, 230, tw, th, 19);
    ctx.fill();
    ctx.strokeStyle = '#c084fc';
    ctx.lineWidth = 2;
    roundRect(ctx, W / 2 - tw / 2, 230, tw, th, 19);
    ctx.stroke();
    drawGlossyText(toastMsg, W / 2, 249, 16, 'center', '#ffffff', '#3b0764', 3.8);
    ctx.restore();
  }
}

function draw(dt = 0.016) {
  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  if (st === 'loading') {
    const loadingAlpha = Math.max(0, 1 - loadingFade);
    if (loadingAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = loadingAlpha;
      drawLoadingScreen();
      ctx.restore();
    }
    ctx.restore();
    return;
  }

  drawGameContent(dt);
  ctx.restore();
}

function loop(t) {
  if (!last) last = t;
  const rawDt = (t - last) / 1000;
  last = t;
  const dt = Math.max(0.001, Math.min(0.1, rawDt || 0.016));
  step(dt);
  draw(dt);
  requestAnimationFrame(loop);
}

// ==========================================
// TOUCH & POINTER CONTROLS
// ==========================================
function getCanvasCoords(e) {
  const rect = cv.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

function inBox(px, py, x, y, w, h) {
  return px >= x && px <= x + w && py >= y && py <= y + h;
}

function inCircle(px, py, cx, cy, r) {
  const dx = px - cx, dy = py - cy;
  return dx * dx + dy * dy <= r * r;
}

function handleSettingsModalPointerDown(x, y, isPauseMode) {
  const L = getSettingsModalLayout(isPauseMode);

  if (isPauseMode && homeConfirmOpen) {
    const b = L.confirmBox;
    if (inBox(x, y, b.yesBtn.x, b.yesBtn.y, b.yesBtn.w, b.yesBtn.h)) {
      activePress = 'pause_home_confirm_yes';
      return;
    }
    if (inBox(x, y, b.noBtn.x, b.noBtn.y, b.noBtn.w, b.noBtn.h)) {
      activePress = 'pause_home_confirm_no';
      return;
    }
    if (!inBox(x, y, b.x, b.y, b.w, b.h)) {
      homeConfirmOpen = false;
    }
    return;
  }

  if (resetConfirming) {
    const b = L.confirmBox;
    if (inBox(x, y, b.yesBtn.x, b.yesBtn.y, b.yesBtn.w, b.yesBtn.h)) {
      activePress = 'confirm_reset_progress';
      return;
    }
    if (inBox(x, y, b.noBtn.x, b.noBtn.y, b.noBtn.w, b.noBtn.h)) {
      activePress = 'cancel_reset_progress';
      return;
    }
    if (!inBox(x, y, b.x, b.y, b.w, b.h)) {
      resetConfirming = false;
    }
    return;
  }

  if (inCircle(x, y, L.closeCenter.x, L.closeCenter.y, 24)) {
    activePress = isPauseMode ? 'pause_close' : 'close_settings';
    return;
  }

  if (isPauseMode) {
    if (inBox(x, y, L.resumeBtn.x, L.resumeBtn.y, L.resumeBtn.w, L.resumeBtn.h)) {
      activePress = 'pause_resume';
      return;
    }
    if (inBox(x, y, L.restartBtn.x, L.restartBtn.y, L.restartBtn.w, L.restartBtn.h)) {
      activePress = 'pause_restart';
      return;
    }
    if (inBox(x, y, L.homeBtn.x, L.homeBtn.y, L.homeBtn.w, L.homeBtn.h)) {
      activePress = 'pause_home';
      return;
    }
  }

  if (inBox(x, y, L.soundBtn.x, L.soundBtn.y, L.soundBtn.w, L.soundBtn.h)) {
    activePress = 'toggle_sound';
    return;
  }
  if (!isPauseMode && L.ambientBtn && inBox(x, y, L.ambientBtn.x, L.ambientBtn.y, L.ambientBtn.w, L.ambientBtn.h)) {
    activePress = 'toggle_ambient';
    return;
  }
  if (L.hasVib && L.vibrateBtn && inBox(x, y, L.vibrateBtn.x, L.vibrateBtn.y, L.vibrateBtn.w, L.vibrateBtn.h)) {
    activePress = 'toggle_vibrate';
    return;
  }

  if (!isPauseMode) {
    if (inBox(x, y, L.hoverCard.x, L.hoverCard.y, L.hoverCard.w, L.hoverCard.h)) {
      activePress = 'toggle_easy_hover';
      return;
    }

    if (inBox(x, y, L.speedNormalBtn.x, L.speedNormalBtn.y, L.speedNormalBtn.w, L.speedNormalBtn.h)) {
      activePress = 'set_speed_normal';
      return;
    }
    if (inBox(x, y, L.speedFastBtn.x, L.speedFastBtn.y, L.speedFastBtn.w, L.speedFastBtn.h)) {
      activePress = 'set_speed_fast';
      return;
    }
    if (inBox(x, y, L.speedTurboBtn.x, L.speedTurboBtn.y, L.speedTurboBtn.w, L.speedTurboBtn.h)) {
      activePress = 'set_speed_turbo';
      return;
    }

    if (inBox(x, y, L.resetBtn.x, L.resetBtn.y, L.resetBtn.w, L.resetBtn.h)) {
      activePress = 'ask_reset_progress';
      return;
    }
  }

  if (!isPauseMode && !inBox(x, y, L.cx, L.cy, L.cw, L.ch)) {
    settingsOpen = false;
    resetConfirming = false;
    playClickSound();
  }
}

function handleShopPointerDown(x, y) {
  const L = getShopLayout();

  if (coinPackConfirmItem) {
    const b = L.confirmBox;
    if (inBox(x, y, b.yesBtn.x, b.yesBtn.y, b.yesBtn.w, b.yesBtn.h)) {
      activePress = 'coin_pack_confirm_yes';
      return;
    }
    if (inBox(x, y, b.noBtn.x, b.noBtn.y, b.noBtn.w, b.noBtn.h)) {
      activePress = 'coin_pack_confirm_no';
      return;
    }
    if (!inBox(x, y, b.x, b.y, b.w, b.h)) {
      coinPackConfirmItem = null;
    }
    return;
  }

  if (inCircle(x, y, L.closeBtn.x, L.closeBtn.y, 26)) {
    activePress = 'close_shop';
    return;
  }

  if (shopMode === 'boosters' && shopNoCoinsTimer > 0) {
    const sb = L.shortcutBanner;
    if (inBox(x, y, sb.btn.x - 4, sb.btn.y - 4, sb.btn.w + 8, sb.btn.h + 8)) {
      activePress = 'shop_shortcut_daily';
      return;
    }
    if (inBox(x, y, sb.x, sb.y, sb.w, sb.h)) {
      activePress = 'shop_shortcut_daily';
      return;
    }
  }

  if (y >= L.listTop && y <= L.listBottom) {
    shopDragActive = true;
    shopDragStartY = y;
    shopDragLastY = y;
    shopDragMoved = false;
    shopDragVelocity = 0;

    for (let i = 0; i < L.cards.length; i++) {
      const c = L.cards[i];
      const pb = c.priceBtn;
      if (inBox(x, y, pb.x - 4, pb.y - 4, pb.w + 8, pb.h + 8)) {
        if (c.type === 'coin_pack') {
          activePress = 'coin_pack_buy_' + c.pack.id;
        } else {
          activePress = (c.type === 'item') ? ('shop_buy_' + c.item.id) : 'shop_claim_daily';
        }
        return;
      }
    }
  }
}

function handlePointerDown(e) {
  initAudio();
  const { x, y } = getCanvasCoords(e);

  if (st === 'loading') return;

  if (shopOpen) {
    handleShopPointerDown(x, y);
    return;
  }

  if (noAdsPopupOpen) {
    const L = getNoAdsPopupLayout();
    if (inCircle(x, y, L.closeCenter.x, L.closeCenter.y, 24)) {
      activePress = 'close_no_ads_popup';
      return;
    }
    if (inBox(x, y, L.buyBtn.x - 4, L.buyBtn.y - 4, L.buyBtn.w + 8, L.buyBtn.h + 8)) {
      activePress = 'no_ads_popup_buy';
      return;
    }
    return;
  }

  if (dailyPopupOpen) {
    const L = getDailyPopupLayout();
    if (inCircle(x, y, L.closeCenter.x, L.closeCenter.y, 24)) {
      activePress = 'close_daily_popup';
      return;
    }
    if (inBox(x, y, L.claimBtn.x - 4, L.claimBtn.y - 4, L.claimBtn.w + 8, L.claimBtn.h + 8)) {
      activePress = 'daily_popup_claim';
      return;
    }
    return;
  }

  if (starterPopupOpen) {
    const L = getStarterPopupLayout();
    if (inCircle(x, y, L.closeCenter.x, L.closeCenter.y, 24)) {
      activePress = 'close_starter_popup';
      return;
    }
    if (inBox(x, y, L.claimBtn.x - 4, L.claimBtn.y - 4, L.claimBtn.w + 8, L.claimBtn.h + 8)) {
      activePress = 'starter_popup_claim';
      return;
    }
    return;
  }

  if (settingsOpen) {
    handleSettingsModalPointerDown(x, y, false);
    return;
  }

  if (st === 'ready') {
    if (menuExiting) return;

    // Check green "+" on coin pill (or whole coin pill)
    const pillX = W - 126, pillY = 16 + topInset, pillW = 114, pillH = 26;
    if (inBox(x, y, pillX - 6, pillY - 6, pillW + 12, pillH + 12)) {
      activePress = 'open_shop_plus';
      return;
    }

    // Check left-side menu buttons (No Ads & Starter Pack)
    const leftMenu = getMainMenuLeftButtonsLayout();
    if (leftMenu.noAdsBtn) {
      const nBtn = leftMenu.noAdsBtn;
      if (inBox(x, y, nBtn.x - 4, nBtn.y - 4, nBtn.w + 8, nBtn.h + 8)) {
        activePress = 'open_no_ads_popup';
        return;
      }
    }
    if (leftMenu.starterBtn) {
      const sBtn = leftMenu.starterBtn;
      if (inBox(x, y, sBtn.x - 4, sBtn.y - 4, sBtn.w + 8, sBtn.h + 8)) {
        activePress = 'open_starter_popup';
        return;
      }
    }

    // Check "Take with you" pre-level booster slots
    const takeLayout = getTakeWithYouSlots();
    if (takeLayout) {
      for (let i = 0; i < takeLayout.slots.length; i++) {
        const s = takeLayout.slots[i];
        if (inBox(x, y, s.x - 4, s.y - 4, s.w + 8, s.h + 8)) {
          activePress = 'toggle_take_' + s.id;
          return;
        }
      }
      if (inBox(x, y, takeLayout.barX, takeLayout.barY, takeLayout.barW, takeLayout.barH)) {
        return;
      }
    }

    const btnY = H - 70 - botInset;
    if (inCircle(x, y, 52, btnY, 32)) {
      activePress = 'open_settings';
      return;
    }
    if (inCircle(x, y, 308, btnY, 32)) {
      activePress = 'open_shop';
      return;
    }
    activePress = 'start_level';
    return;
  }

  if (st === 'transition') {
    return;
  }

  if (st === 'level_complete') {
    const cw = 290, ch = 270;
    const cx = W / 2 - cw / 2, cy = H / 2 - ch / 2 - 20;

    if (inCircle(x, y, cx + cw - 12, cy + 12, 24)) {
      activePress = 'close_complete';
      return;
    }
    const btnW = 210, btnH = 54;
    if (inBox(x, y, W / 2 - btnW / 2, cy + ch - 72, btnW, btnH)) {
      activePress = 'next_level';
      return;
    }
    if (levelCompleteTimer >= 0.8) {
      activePress = 'next_level';
    }
    return;
  }

  if (st === 'dead') {
    const cw = 290, ch = 270;
    const cx = W / 2 - cw / 2, cy = H / 2 - ch / 2 - 20;

    if (inCircle(x, y, cx + cw - 12, cy + 12, 24)) {
      activePress = 'close_dead';
      return;
    }
    const btnW = 210, btnH = 54;
    if (inBox(x, y, W / 2 - btnW / 2, cy + ch - 72, btnW, btnH)) {
      activePress = 'try_again';
      return;
    }
    if (performance.now() - deadAt >= 350) {
      activePress = 'try_again';
    }
    return;
  }

  if (paused) {
    handleSettingsModalPointerDown(x, y, true);
    return;
  }

  if (pauseCountdown > 0) {
    return;
  }

  if (st === 'play') {
    if (isPauseButtonVisible()) {
      const pb = getPauseButtonRect();
      if (inBox(x, y, pb.x - 4, pb.y - 4, pb.size + 8, pb.size + 8)) {
        activePress = 'pause_game';
        hold = false;
        return;
      }
    }
    if (!stopping && finishRunStage === 'none' && activeLevelBoosters.length > 0) {
      const inLevelBtns = getInLevelBoosterButtons();
      for (let i = 0; i < inLevelBtns.length; i++) {
        const b = inLevelBtns[i];
        if (inCircle(x, y, b.cx, b.cy, b.r + 6)) {
          activePress = 'use_booster_' + b.id;
          hold = false;
          return;
        }
      }
    }
    if (!stopping && finishRunStage === 'none') {
      hold = true;
    }
  }
}

function handlePointerMove(e) {
  if (!shopOpen || !shopDragActive) return;
  const { y } = getCanvasCoords(e);
  const dy = y - shopDragLastY;
  if (Math.abs(y - shopDragStartY) > 6) {
    shopDragMoved = true;
    if (activePress && (activePress.startsWith('shop_buy_') || activePress.startsWith('coin_pack_buy_') || activePress === 'shop_claim_daily')) {
      activePress = null;
    }
  }
  if (shopDragMoved) {
    shopScrollY = Math.max(0, Math.min(shopMaxScroll, shopScrollY - dy));
    shopDragVelocity = dy * 28;
  }
  shopDragLastY = y;
}

function handlePointerUp(e) {
  hold = false;
  shopDragActive = false;
  const upCoords = e ? getCanvasCoords(e) : { x: W / 2, y: H / 2 };

  if (activePress) {
    playClickSound();

    if (activePress === 'open_shop') {
      openShop('boosters');
    } else if (activePress === 'open_shop_plus') {
      openShop('coins');
    } else if (activePress === 'close_shop') {
      closeShop();
    } else if (activePress.startsWith('coin_pack_buy_')) {
      const pid = activePress.slice('coin_pack_buy_'.length);
      const pack = getCoinPackById(pid);
      if (pack) {
        coinPackConfirmItem = pack;
      }
    } else if (activePress === 'coin_pack_confirm_yes') {
      if (coinPackConfirmItem) {
        const pack = coinPackConfirmItem;
        coinPackConfirmItem = null;
        wallet += pack.coins;
        saveWallet();
        coinCounterBump = 1.38;
        if (shopCardAnim[pack.id]) {
          shopCardAnim[pack.id].pop = 0.35;
        }
        spawnShopSparkles(W / 2, H / 2, ['#fde047', pack.accent, '#ffffff', '#4ade80']);
        playPerfectBonusSound();
        triggerVibrate([30, 40, 60]);
        showToast(`+${pack.coins.toLocaleString()} Coins!`);
      }
    } else if (activePress === 'coin_pack_confirm_no') {
      coinPackConfirmItem = null;
    } else if (activePress === 'open_no_ads_popup') {
      openNoAdsPopup();
    } else if (activePress === 'close_no_ads_popup') {
      closeNoAdsPopup();
    } else if (activePress === 'no_ads_popup_buy') {
      purchaseNoAds();
    } else if (activePress === 'open_daily_popup') {
      openDailyPopup();
    } else if (activePress === 'close_daily_popup') {
      closeDailyPopup();
    } else if (activePress === 'daily_popup_claim') {
      const dL = getDailyPopupLayout();
      claimDailyReward(dL.claimBtn.x + dL.claimBtn.w / 2, dL.claimBtn.y);
    } else if (activePress === 'open_starter_popup') {
      openStarterPopup();
    } else if (activePress === 'close_starter_popup') {
      closeStarterPopup();
    } else if (activePress === 'starter_popup_claim') {
      const sL = getStarterPopupLayout();
      claimStarterPack(sL.claimBtn.x + sL.claimBtn.w / 2, sL.claimBtn.y);
    } else if (activePress === 'shop_claim_daily' || activePress === 'shop_shortcut_daily') {
      claimDailyReward(upCoords.x, upCoords.y);
    } else if (activePress.startsWith('shop_buy_')) {
      const id = activePress.slice('shop_buy_'.length);
      buyShopItem(id, upCoords.x, upCoords.y);
    } else if (activePress.startsWith('toggle_take_')) {
      const id = activePress.slice('toggle_take_'.length);
      selectedLoadout[id] = !selectedLoadout[id];
      saveLoadout();
      triggerVibrate(20);
    } else if (activePress.startsWith('use_booster_')) {
      const id = activePress.slice('use_booster_'.length);
      activateInLevelBooster(id);
    } else if (activePress === 'pause_game') {
      pauseGame();
    } else if (activePress === 'pause_close' || activePress === 'pause_resume') {
      resumeFromPause();
    } else if (activePress === 'pause_restart') {
      restartFromPause();
    } else if (activePress === 'pause_home') {
      homeConfirmOpen = true;
      resetConfirming = false;
    } else if (activePress === 'pause_home_confirm_yes') {
      goHomeFromPause();
    } else if (activePress === 'pause_home_confirm_no') {
      homeConfirmOpen = false;
    } else if (activePress === 'close_settings') {
      settingsOpen = false;
      resetConfirming = false;
    } else if (activePress === 'toggle_sound') {
      setSound(!soundEnabled);
      triggerVibrate(30);
    } else if (activePress === 'toggle_ambient') {
      setAmbient(!ambientEnabled);
      triggerVibrate(30);
    } else if (activePress === 'toggle_vibrate') {
      setVibrate(!vibrateEnabled);
      if (vibrateEnabled) triggerVibrate(40);
    } else if (activePress === 'toggle_easy_hover') {
      setEasyHover(!easyHoverEnabled);
      triggerVibrate(30);
      showToast(easyHoverEnabled ? 'Easy Hover: ON' : 'Easy Hover: OFF');
    } else if (activePress === 'set_speed_normal') {
      setSpeedMode('normal');
      triggerVibrate(30);
      showToast('Speed: NORMAL (1.0x)');
    } else if (activePress === 'set_speed_fast') {
      setSpeedMode('fast');
      triggerVibrate(30);
      showToast('Speed: FAST (1.7x)');
    } else if (activePress === 'set_speed_turbo') {
      setSpeedMode('turbo');
      triggerVibrate(40);
      showToast('Speed: TURBO (2.3x)');
    } else if (activePress === 'ask_reset_progress') {
      resetConfirming = true;
      homeConfirmOpen = false;
    } else if (activePress === 'cancel_reset_progress') {
      resetConfirming = false;
    } else if (activePress === 'confirm_reset_progress') {
      resetConfirming = false;
      curLevel = 1;
      highestLevel = 1;
      saveProgress(1, 1, best);
      if (paused) {
        paused = false;
        homeConfirmOpen = false;
        pauseCountdown = 0;
        hold = false;
        wasThrustActive = false;
        puffHoldTimer = 0;
        resumeGameAudio();
        startLevel(1);
        st = 'ready';
        menuFadeTimer = 0;
      } else {
        startLevel(1);
      }
      syncAndroidBackState();
      showToast('Progress reset to Level 1');
    } else if (activePress === 'open_settings') {
      settingsOpen = true;
      resetConfirming = false;
    } else if (activePress === 'dec_start_level') {
      if (curLevel > 1) {
        curLevel--;
        saveProgress(curLevel, highestLevel, best);
        startLevel(curLevel);
        triggerVibrate(25);
        showToast('Level ' + curLevel);
      }
    } else if (activePress === 'inc_start_level') {
      if (curLevel < highestLevel) {
        curLevel++;
        saveProgress(curLevel, highestLevel, best);
        startLevel(curLevel);
        triggerVibrate(25);
        showToast('Level ' + curLevel);
      }
    } else if (activePress === 'start_level') {
      beginMenuExitToLevel();
    } else if (activePress === 'car_garage' || activePress === 'cycle_rim_style') {
      cycleAlloyRimStyle();
    } else if (activePress === 'next_level') {
      advanceToNextLevel();
    } else if (activePress === 'close_complete') {
      const nextLvl = (levelJustCleared ? levelJustCleared + 1 : curLevel + 1);
      curLevel = nextLvl;
      saveProgress(curLevel, Math.max(highestLevel, curLevel), best);
      startLevel(curLevel);
      st = 'ready';
      hold = false;
    } else if (activePress === 'try_again') {
      const restartLvl = RETRY_FROM_LEVEL_START ? curLevel : 1;
      curLevel = restartLvl;
      startLevelWithTransition(curLevel);
      hold = false;
    } else if (activePress === 'close_dead') {
      const restartLvl = RETRY_FROM_LEVEL_START ? curLevel : 1;
      curLevel = restartLvl;
      startLevel(curLevel);
      st = 'ready';
      hold = false;
    }

    activePress = null;
  }
}

cv.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudioContext(); handlePointerDown(e); });
window.addEventListener('pointermove', e => { handlePointerMove(e); });
window.addEventListener('pointerup', e => { e.preventDefault(); handlePointerUp(e); });
window.addEventListener('pointercancel', () => { hold = false; shopDragActive = false; activePress = null; });
cv.addEventListener('wheel', e => {
  if (shopOpen) {
    e.preventDefault();
    shopScrollY = Math.max(0, Math.min(shopMaxScroll, shopScrollY + e.deltaY * 0.5));
  }
}, { passive: false });
window.addEventListener('blur', () => { hold = false; shopDragActive = false; activePress = null; });
document.addEventListener('visibilitychange', () => { hold = false; shopDragActive = false; activePress = null; });

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!e.repeat && handleBackOrEscape()) {
      e.preventDefault();
    }
    return;
  }
  if (e.code === 'Space') {
    e.preventDefault();
    if (shopOpen || dailyPopupOpen || starterPopupOpen || noAdsPopupOpen || settingsOpen || paused || pauseCountdown > 0) return;
    ensureAudioContext();
    if (!e.repeat) {
      if (st === 'ready') {
        if (!menuExiting) {
          playClickSound();
          beginMenuExitToLevel();
        }
      }
      else if (st === 'play') {
        if (!stopping && finishRunStage === 'none') {
          hold = true;
        }
      }
      else if (st === 'dead' && performance.now() - deadAt > 350) { startLevel(curLevel); st = 'play'; }
      else if (st === 'level_complete' && levelCompleteTimer >= 0.8) {
        advanceToNextLevel();
      }
    }
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') { hold = false; }
});
window.addEventListener('resize', () => {
  resizeCanvas();
  prerenderVignette();
  prerenderStageBackgrounds();
  prerenderAllStageSpikes();
  prerenderHazardSprites();
  prerenderCoinFrames();
  prerenderBoosterSprite();
  initSpeedLines();
  initStageParticles();
  if (curConfig) {
    prerenderSpikes(curConfig);
    preloadedPictures.forEach(pic => {
      if (pic.loaded) updatePictureSeamlessCanvas(pic);
    });
  }
});

loadSpeedSetting();
loadEasyHoverSetting();
updateSpeedPhysics();
loadProgress();
loadWallet();
loadInventory();
loadLoadout();
loadDailyReward();
loadStarterPack();
loadNoAdsState();
loadStars();
currentBgStage = getStageNumber(curLevel);
prevBgStage = currentBgStage;
bgCrossFadeTimer = 0;
prerenderVignette();
prerenderStageBackgrounds();
prerenderAllStageSpikes();
prerenderHazardSprites();
prerenderCoinFrames();
prerenderBoosterSprite();
initSpeedLines();
initStageParticles();
startLevel(curLevel);
step(0);
draw();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
