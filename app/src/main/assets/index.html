    ctx.restore();
  } else {
    drawRoundGlossyButton(52, btnY, 27, BUTTON_THEMES.blue, 'gear', isSetPressed);
  }

  const isLevelPressed = (activePress === 'start_level');
  if (btnLevelLoadedImg) {
    ctx.save();
    ctx.translate(180, btnY + (isLevelPressed ? 2.5 : 0));
    if (isLevelPressed) ctx.scale(0.96, 0.96);
    ctx.drawImage(btnLevelLoadedImg, -83, -32.5, 166, 65);
    const lvlTxt = `LEVEL ${curLevel}`;
    const lvlFontSz = lvlTxt.length > 8 ? 20 : 23;
    drawGlossyText(lvlTxt, 0, 1, lvlFontSz, 'center', '#ffffff', '#0f4412', 4.6);
    ctx.restore();
  } else {
    drawGlossyButton(96, playY, 168, 56, BUTTON_THEMES.green, `LEVEL ${curLevel}`, null, isLevelPressed, 28);
  }

  const isShopPressed = (activePress === 'open_shop');
  if (btnShopLoadedImg && btnShopLoadedImg.naturalWidth > 0 && btnShopLoadedImg.naturalHeight > 0) {
    const shopW = 72;
    const shopH = shopW * (btnShopLoadedImg.naturalHeight / btnShopLoadedImg.naturalWidth);
    ctx.save();
    ctx.translate(306, btnY + (isShopPressed ? 2.5 : 0));
    if (isShopPressed) ctx.scale(0.94, 0.94);
    ctx.drawImage(btnShopLoadedImg, -shopW / 2, -shopH / 2, shopW, shopH);
    ctx.restore();
  } else {
    drawRoundGlossyButton(308, btnY, 27, BUTTON_THEMES.orange, 'shop', isShopPressed);
  }

  ctx.restore();
  ctx.restore();
}

function drawGameContent(dt = 0.016) {
  // Fast blackout frame: skip full world/HUD redraw when iris completely covers screen
  if (st === 'transition' && getIrisRadiusAt(transitionTimer) <= 0.5) {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);
    return;
  }

  // Opaque full-screen Shop early-out: skip entire world, spikes, car, and Home UI underneath
  if (shopOpen) {
    drawShopScreen();
    drawToastOverlay();
    return;
  }

  const cfg = curConfig;

  // Keep screen steady without trembling/vibrating jitter during Turbo or Boost
  const shakeX = 0, shakeY = 0;

  // 1. Picture background (or fallback procedural)
  drawBackground();

  // 2. Wheel thruster smoke (behind road and car; never drawn on top of road or truss)
  const sRoadX1 = START_ROAD_START - cam - 20;
  const sRoadX2 = START_ROAD_END - cam + 20;
  const fRoadX1 = FINISH_ROAD_X - cam - 20;
  const fRoadX2 = FINISH_ROAD_END - cam + 20;

  for (const p of parts) {
    const k = 1 - p.l / p.m;
    if (k <= 0) continue;
    const r = p.size * (1 + 0.3 * (1 - k));

    // Exclude any smoke from being drawn on top of the road or truss
    const overRoad = (p.x + r >= sRoadX1 && p.x - r <= sRoadX2) || (p.x + r >= fRoadX1 && p.x - r <= fRoadX2);
    if (overRoad && p.y + r >= ROAD_TOP - 2) {
      if (p.y - r >= ROAD_TOP - 2) continue;
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, ROAD_TOP - 2);
      ctx.clip();
      ctx.globalAlpha = 0.7 * k;
      ctx.fillStyle = p.color || '#ffffff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, 6.28);
      ctx.fill();
      ctx.restore();
    } else {
      ctx.globalAlpha = 0.7 * k;
      ctx.fillStyle = p.color || '#ffffff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, 6.28);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // 3. Starting & Finish Road Platforms (hidden on Home Screen when scenic road background is active)
  const useScenicHomeRoad = (isShowingHomeVisuals() && homeBgLoadedImg && homeBgLoadedImg.naturalWidth > 0);
  if (!useScenicHomeRoad) {
    drawRoadPlatform(START_ROAD_START, START_ROAD_END, ROAD_TOP);
    drawRoadPlatform(FINISH_ROAD_X, FINISH_ROAD_END, ROAD_TOP, true);
  }

  // 5. Spikes & Studded Rails with continuous connected rail pieces
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i];
    const x = s.x - cam;
    if (x + s.w < -60 || x > W + 60) continue;
    if (!s.isOpen) drawWall(s, x);
    if (s.obstacles) drawObstacles(s, x, cfg);

    const curTop = (s.curTop !== undefined) ? s.curTop : s.top;
    const curBot = (s.curBot !== undefined) ? s.curBot : s.bot;

    // Connected Rails between neighboring segments (visual only, no collision)
    if (i < segs.length - 1) {
      const sNext = segs[i + 1];
      if (!s.isOpen && !sNext.isOpen && !s.isSlanted && !sNext.isSlanted) {
        const nextTop = (sNext.curTop !== undefined) ? sNext.curTop : sNext.top;
        const nextBot = (sNext.curBot !== undefined) ? sNext.curBot : sNext.bot;
        const seamX = (s.x + s.w) - cam;
        if (Math.abs(curTop - nextTop) > 1) {
          drawVerticalRailConnector(seamX, curTop - 18 - RAIL_THICKNESS, nextTop - 18 - RAIL_THICKNESS, cfg);
        }
        if (Math.abs(curBot - nextBot) > 1) {
          drawVerticalRailConnector(seamX, curBot + 18, nextBot + 18, cfg);
        }
      }
    }

    if (s.topSpikes) {
      const count = s.topSpikes.length;
      for (let j = 0; j < count; j++) {
        let baseY = curTop - 18;
        if (s.isSlanted && s.top2 !== undefined) {
          const t = Math.min(1, (j * 12) / s.w);
          baseY = (curTop + (s.top2 - curTop) * t) - 18;
        }
        drawSpike(x + j * 12, baseY, true, s.topSpikes[j], j, s.slope || 0);
      }
    }
    if (s.botSpikes) {
      const count = s.botSpikes.length;
      for (let j = 0; j < count; j++) {
        let baseY = curBot + 18;
        if (s.isSlanted && s.bot2 !== undefined) {
          const t = Math.min(1, (j * 12) / s.w);
          baseY = (curBot + (s.bot2 - curBot) * t) + 18;
        }
        drawSpike(x + j * 12, baseY, false, s.botSpikes[j], j, s.slope || 0);
      }
    }
  }

  // 5b. Collectible Coins and Gems
  const animFrame = Math.floor((gameTime * 10) % 8);

  for (let i = 0; i < coins.length; i++) {
    const c = coins[i];
    const screenX = c.x - cam;
    if (screenX < -50 || screenX > W + 50) continue;

    if (!c.collected) {
      const f = Math.floor((gameTime * 10 + c.phase) % 8);
      const spr = getCoinSprite(c.type, f);
      if (spr) {
        drawCoinSpriteCentered(spr, screenX, c.y);
      }
    } else if (c.popTimer > 0) {
      const popK = c.popTimer / 0.22;
      const popScale = 1.0 + (1 - popK) * 0.6;
      const spr = getCoinSprite(c.type, 0);
      if (spr) {
        ctx.save();
        ctx.globalAlpha = popK;
        ctx.translate(screenX, c.y);
        ctx.scale(popScale, popScale);
        drawCoinSpriteCentered(spr, 0, 0);
        ctx.restore();
      }
    }
  }

  // Draw Coin Sparkles
  for (let i = 0; i < coinSparkles.length; i++) {
    const spk = coinSparkles[i];
    const alpha = Math.max(0, spk.life / spk.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = spk.color;
    ctx.beginPath();
    ctx.arc(spk.x, spk.y, spk.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Draw Flying Coins
  for (let i = 0; i < flyingCoins.length; i++) {
    const fc = flyingCoins[i];
    if (fc.t < 0) continue;
    const spr = getCoinSprite(fc.type, animFrame);
    if (spr) {
      drawCoinSpriteCentered(spr, fc.curX, fc.curY);
    }
  }

  // Draw Floating Texts (+1, +5)
  for (let i = 0; i < coinFloatTexts.length; i++) {
    const ft = coinFloatTexts[i];
    const alpha = Math.min(1, ft.timer / 0.3);
    ctx.save();
    ctx.globalAlpha = alpha;
    drawGlossyText(ft.text, ft.x, ft.y, 16, 'center', ft.color, '#0f172a', 3.8);
    ctx.restore();
  }

  // Draw Boosters & Booster Sparkles
  drawBoosters();

  // Ghost copies trail during boost
  if (carGhostTrail.length > 0 && trimmedCarCanvas) {
    ctx.save();
    for (let i = 0; i < carGhostTrail.length; i++) {
      const g = carGhostTrail[i];
      if (g.alpha <= 0.02) continue;
      ctx.globalAlpha = g.alpha * 0.45;
      const gCenterY = (g.y + 24) - CAR_DRAW_H / 2;
      ctx.drawImage(trimmedCarCanvas, g.x - CAR_DRAW_W / 2, gCenterY - CAR_DRAW_H / 2, CAR_DRAW_W, CAR_DRAW_H);
    }
    ctx.restore();
  }

  // Bright speed aura around car during boost (cached ellipse sprite)
  if (boostRampFactor > 0.05) {
    if (!hudSpriteCache.boostAuraSprite) {
      const ac = document.createElement('canvas');
      ac.width = 160;
      ac.height = 160;
      const aCtx = ac.getContext('2d');
      const g = aCtx.createRadialGradient(80, 80, 18, 80, 80, 78);
      g.addColorStop(0, 'rgba(255, 255, 255, 0.50)');
      g.addColorStop(0.4, 'rgba(56, 189, 248, 0.40)');
      g.addColorStop(0.8, 'rgba(147, 51, 234, 0.15)');
      g.addColorStop(1, 'rgba(56, 189, 248, 0)');
      aCtx.fillStyle = g;
      aCtx.fillRect(0, 0, 160, 160);
      hudSpriteCache.boostAuraSprite = ac;
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = boostRampFactor;
    const auraX = isShowingHomeVisuals() ? carDrawX : CAR_X;
    const auraY = (cy + 24) - CAR_DRAW_H / 2;
    const rx = CAR_DRAW_W * 0.65;
    const ry = CAR_DRAW_H * 0.9;
    ctx.drawImage(hudSpriteCache.boostAuraSprite, auraX - rx, auraY - ry, rx * 2, ry * 2);
    ctx.restore();
  }

  // 6. Sky Car (thin dark outline + soft shadow, blinking during boost/shield protection fade)
  let carAlpha = 1.0;
  if (st === 'ready') {
    carAlpha = Math.min(1, menuFadeTimer / 0.3);
  } else if (isShowingHomeVisuals()) {
    carAlpha = 1.0;
  } else if ((boostTimer <= 0 && boostProtectionTimer > 0) || (!shieldActive && shieldBreakInvulnTimer > 0)) {
    const blinkT = Math.max(boostProtectionTimer, shieldBreakInvulnTimer);
    carAlpha = (Math.floor(blinkT * 22) % 2 === 0) ? 0.35 : 1.0;
  }
  ctx.save();
  ctx.globalAlpha = carAlpha;
  car(carDrawX);
  ctx.restore();

  // Magnet aura around car
  if (magnetTimer > 0 && st === 'play') {
    ctx.save();
    const auraX = CAR_X;
    const auraY = (cy + 24) - CAR_DRAW_H / 2;
    const pulse = (gameTime * 2.2) % 1;
    ctx.strokeStyle = `rgba(232, 121, 249, ${(1 - pulse) * 0.55})`;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(auraX, auraY, 34 + pulse * 36, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Energy Shield bubble around car (cached sprite)
  if (shieldActive && st === 'play') {
    if (!hudSpriteCache.shieldBubbleSprite) {
      const sc = document.createElement('canvas');
      sc.width = 160;
      sc.height = 120;
      const sCtx = sc.getContext('2d');
      sCtx.save();
      sCtx.translate(80, 60);
      sCtx.scale(1.0, 60 / 80);
      const sg = sCtx.createRadialGradient(0, 0, 26, 0, 0, 74);
      sg.addColorStop(0, 'rgba(74, 222, 128, 0.04)');
      sg.addColorStop(0.75, 'rgba(74, 222, 128, 0.22)');
      sg.addColorStop(1, 'rgba(134, 239, 172, 0.55)');
      sCtx.fillStyle = sg;
      sCtx.beginPath();
      sCtx.arc(0, 0, 74, 0, Math.PI * 2);
      sCtx.fill();
      sCtx.restore();
      hudSpriteCache.shieldBubbleSprite = sc;
    }
    const sX = CAR_X;
    const sY = (cy + 24) - CAR_DRAW_H / 2;
    const sPulse = 0.5 + 0.5 * Math.sin(gameTime * 6);
    const rx = CAR_DRAW_W * 0.56;
    const ry = CAR_DRAW_H * 0.88;
    ctx.drawImage(hudSpriteCache.shieldBubbleSprite, sX - rx * 1.08, sY - ry * 1.08, rx * 2.16, ry * 2.16);
    ctx.save();
    ctx.strokeStyle = `rgba(134, 239, 172, ${0.7 + 0.3 * sPulse})`;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.ellipse(sX, sY, rx, ry, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Jet thruster sparks (falling down and drifting back with the world)
  if (SHOW_FLAMES) {
    drawSparks(ctx);
  }
  drawHazardParticles(ctx);
  drawBirdsAndBlood(ctx);

  // Moving stage speed lines removed across all stages (reserved for future background graphics)

  if (shakeX !== 0 || shakeY !== 0) {
    ctx.restore();
  }

  // Subtle cool icy overlay when Slow-Mo is active
  if (slowMoTimer > 0 && st === 'play') {
    ctx.save();
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
    ctx.lineWidth = 8;
    ctx.strokeRect(0, 0, W, H);
    ctx.restore();
  }

  // 7. UI and Screens (all HUD text in white with dark outline)
  if (st === 'play') {
    if (stopping || confettiStarted) {
      drawConfetti();
    }
    drawHUD();
    drawFloatingTexts();
    if (SHOW_DEBUG) {
      drawDebugOverlay();
    }
    if (paused) {
      drawPausePopup();
    } else if (pauseCountdown > 0) {
      drawPauseCountdown();
    }

  } else if (st === 'transition') {
    if (transitionTargetState === 'ready') {
      if (levelTransitionInitialized) {
        drawHomeScreenUi(1.0);
      } else {
        drawHUD();
        drawFloatingTexts();
      }
    } else if (levelTransitionInitialized) {
      drawHUD();
      drawFloatingTexts();
    }
    drawStylishLevelTransition(transitionTimer);

  } else if (st === 'ready') {
    drawHomeScreenUi(Math.min(1, menuFadeTimer / 0.3));
  } else if (st === 'level_complete') {
    drawLevelCompletePopup();

  } else if (st === 'dead') {
    drawCrashPopup();
  }

  if (settingsOpen) {
    drawSettingsPopup();
  }

  if (noAdsPopupOpen) {
    drawNoAdsPopup();
  } else if (dailyPopupOpen) {
    drawDailyRewardPopup();
    drawHomeWalletCoinPill();
    for (let i = 0; i < flyingCoins.length; i++) {
      const fc = flyingCoins[i];
      if (fc.t < 0) continue;
      const spr = getCoinSprite(fc.type, animFrame);
      if (spr) drawCoinSpriteCentered(spr, fc.curX, fc.curY);
    }
  } else if (starterPopupOpen) {
    drawStarterPackPopup();
    drawHomeWalletCoinPill();
    for (let i = 0; i < flyingCoins.length; i++) {
      const fc = flyingCoins[i];
      if (fc.t < 0) continue;
      const spr = getCoinSprite(fc.type, animFrame);
      if (spr) drawCoinSpriteCentered(spr, fc.curX, fc.curY);
    }
  } else if (bgPopupOpen) {
    drawBackgroundsPopup();
    drawHomeWalletCoinPill();
  } else if (st === 'ready' && flyingCoins.length > 0) {
    for (let i = 0; i < flyingCoins.length; i++) {
      const fc = flyingCoins[i];
      if (fc.t < 0) continue;
      const spr = getCoinSprite(fc.type, animFrame);
      if (spr) drawCoinSpriteCentered(spr, fc.curX, fc.curY);
    }
  }

  drawToastOverlay();
}

function draw(dt = 0.016) {
  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (st === 'loading') {
    const loadingAlpha = Math.max(0, 1 - loadingFade);
    if (loadingAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = loadingAlpha;
      drawLoadingScreen();
      ctx.restore();
    }
    ctx.restore();
    return;
  }

  drawGameContent(dt);
  ctx.restore();
}

let skipNextDtSpike = false;
let rafScheduled = false;

function scheduleNextFrame() {
  if (rafScheduled || document.hidden) return;
  rafScheduled = true;
  requestAnimationFrame(loop);
}

function loop(t) {
  rafScheduled = false;
  if (document.hidden) {
    last = 0;
    skipNextDtSpike = true;
    return;
  }
  if (adShowing) {
    last = 0;
    scheduleNextFrame();
    return;
  }
  if (!last || skipNextDtSpike) {
    last = t;
    skipNextDtSpike = false;
    draw(0.016);
    scheduleNextFrame();
    return;
  }
  const rawDt = (t - last) / 1000;
  last = t;
  const dt = (rawDt > 0 && rawDt < 0.25) ? Math.min(0.033, Math.max(0.004, rawDt)) : 0.016;
  step(dt);
  draw(dt);
  scheduleNextFrame();
}

// ==========================================
// TOUCH & POINTER CONTROLS
// ==========================================
function getCanvasCoords(e) {
  const rect = cv.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

function inBox(px, py, x, y, w, h) {
  return px >= x && px <= x + w && py >= y && py <= y + h;
}

function inCircle(px, py, cx, cy, r) {
  const dx = px - cx, dy = py - cy;
  return dx * dx + dy * dy <= r * r;
}

function getSettingsHitKey(x, y, isPauseMode) {
  const L = getSettingsModalLayout(isPauseMode);

  if (isPauseMode) {
    if (inCircle(x, y, L.closeCenter.x, L.closeCenter.y, 23)) return 'pause_close';
    if (inBox(x, y, L.resumeBtn.x, L.resumeBtn.y, L.resumeBtn.w, L.resumeBtn.h)) return 'pause_resume';
    if (inBox(x, y, L.replayBtn.x, L.replayBtn.y, L.replayBtn.w, L.replayBtn.h)) return 'pause_restart';
    if (inBox(x, y, L.homeBtn.x, L.homeBtn.y, L.homeBtn.w, L.homeBtn.h)) return 'pause_home';
    if (inBox(x, y, L.soundBtn.x, L.soundBtn.y, L.soundBtn.w, L.soundBtn.h)) return 'toggle_sound';
    if (inBox(x, y, L.vibrateBtn.x, L.vibrateBtn.y, L.vibrateBtn.w, L.vibrateBtn.h)) return 'toggle_vibrate';
    return null;
  }

  if (settingsConfirmAction) {
    const b = L.confirmBox;
    if (inBox(x, y, b.yesBtn.x, b.yesBtn.y, b.yesBtn.w, b.yesBtn.h)) return 'settings_confirm_yes';
    if (inBox(x, y, b.noBtn.x, b.noBtn.y, b.noBtn.w, b.noBtn.h)) return 'settings_confirm_no';
    return null;
  }
  if (legalSubOpen) {
    const lb = L.legalBox;
    if (inCircle(x, y, lb.closeCenter.x, lb.closeCenter.y, 22)) return 'close_legal_sub';
    if (inBox(x, y, lb.closeBtn.x, lb.closeBtn.y, lb.closeBtn.w, lb.closeBtn.h)) return 'close_legal_sub';
    return null;
  }
  if (supportSubOpen) {
    const sb = L.supportBox;
    if (inCircle(x, y, sb.closeCenter.x, sb.closeCenter.y, 22)) return 'close_support_sub';
    if (inBox(x, y, sb.resetBtn.x, sb.resetBtn.y, sb.resetBtn.w, sb.resetBtn.h)) return 'ask_reset_progress';
    if (inBox(x, y, sb.closeBtn.x, sb.closeBtn.y, sb.closeBtn.w, sb.closeBtn.h)) return 'close_support_sub';
    return null;
  }

  if (inCircle(x, y, L.closeCenter.x, L.closeCenter.y, 23)) return 'close_settings';
  if (inBox(x, y, L.soundBtn.x, L.soundBtn.y, L.soundBtn.w, L.soundBtn.h)) return 'toggle_sound';
  if (inBox(x, y, L.vibrateBtn.x, L.vibrateBtn.y, L.vibrateBtn.w, L.vibrateBtn.h)) return 'toggle_vibrate';
  if (inBox(x, y, L.speedNormalBtn.x, L.speedNormalBtn.y, L.speedNormalBtn.w, L.speedNormalBtn.h)) return 'set_speed_normal';
  if (inBox(x, y, L.speedFastBtn.x, L.speedFastBtn.y, L.speedFastBtn.w, L.speedFastBtn.h)) return 'set_speed_fast';
  if (inBox(x, y, L.speedTurboBtn.x, L.speedTurboBtn.y, L.speedTurboBtn.w, L.speedTurboBtn.h)) return 'set_speed_turbo';
  if (inBox(x, y, L.supportBtn.x, L.supportBtn.y, L.supportBtn.w, L.supportBtn.h)) return 'open_support_sub';
  if (inBox(x, y, L.termsBtn.x, L.termsBtn.y, L.termsBtn.w, L.termsBtn.h)) return 'open_terms_sub';
  if (inBox(x, y, L.privacyBtn.x, L.privacyBtn.y, L.privacyBtn.w, L.privacyBtn.h)) return 'open_privacy_sub';
  return null;
}

function handleSettingsModalPointerDown(x, y, isPauseMode) {
  const L = getSettingsModalLayout(isPauseMode);

  if (!isPauseMode && settingsConfirmAction) {
    const b = L.confirmBox;
    if (inBox(x, y, b.yesBtn.x, b.yesBtn.y, b.yesBtn.w, b.yesBtn.h)) {
      activePress = 'settings_confirm_yes';
      return;
    }
    if (inBox(x, y, b.noBtn.x, b.noBtn.y, b.noBtn.w, b.noBtn.h)) {
      activePress = 'settings_confirm_no';
      return;
    }
    if (!inBox(x, y, b.x, b.y, b.w, b.h)) {
      settingsConfirmAction = null;
      syncAndroidBackState();
    }
    return;
  }

  if (!isPauseMode && legalSubOpen) {
    const lb = L.legalBox;
    const hit = getSettingsHitKey(x, y, false);
    if (hit) {
      activePress = hit;
      return;
    }
    if (!inBox(x, y, lb.x, lb.y, lb.w, lb.h)) {
      legalSubOpen = null;
      syncAndroidBackState();
    }
    return;
  }

  if (!isPauseMode && supportSubOpen) {
    const sb = L.supportBox;
    const hit = getSettingsHitKey(x, y, false);
    if (hit) {
      activePress = hit;
      return;
    }
    if (!inBox(x, y, sb.x, sb.y, sb.w, sb.h)) {
      supportSubOpen = false;
      syncAndroidBackState();
    }
    return;
  }

  const hit = getSettingsHitKey(x, y, isPauseMode);
  if (hit) {
    activePress = hit;
    return;
  }

  if (!isPauseMode && !inBox(x, y, L.cx, L.cy, L.cw, L.ch)) {
    settingsOpen = false;
    supportSubOpen = false;
    legalSubOpen = null;
    settingsConfirmAction = null;
    hoverKey = null;
    syncAndroidBackState();
    playClickSound();
  }
}

function handleShopPointerDown(x, y) {
  const L = getShopLayout();

  if (coinPackConfirmItem) {
    const b = L.confirmBox;
    if (inBox(x, y, b.yesBtn.x, b.yesBtn.y, b.yesBtn.w, b.yesBtn.h)) {
      activePress = 'coin_pack_confirm_yes';
      return;
    }
    if (inBox(x, y, b.noBtn.x, b.noBtn.y, b.noBtn.w, b.noBtn.h)) {
      activePress = 'coin_pack_confirm_no';
      return;
    }
    if (!inBox(x, y, b.x, b.y, b.w, b.h)) {
      coinPackConfirmItem = null;
    }
    return;
  }

  if (inCircle(x, y, L.closeBtn.x, L.closeBtn.y, 26)) {
    activePress = 'close_shop';
    return;
  }

  if (shopMode === 'boosters' && inBox(x, y, L.coinPill.x - 6, L.coinPill.y - 6, L.coinPill.w + 12, L.coinPill.h + 12)) {
    activePress = 'open_shop_plus';
    return;
  }

  if (shopMode === 'boosters' && shopNoCoinsTimer > 0) {
    const sb = L.shortcutBanner;
    if (inBox(x, y, sb.btn.x - 4, sb.btn.y - 4, sb.btn.w + 8, sb.btn.h + 8)) {
      activePress = 'shop_shortcut_daily';
      return;
    }
    if (inBox(x, y, sb.x, sb.y, sb.w, sb.h)) {
      activePress = 'shop_shortcut_daily';
      return;
    }
  }

  if (y >= L.listTop && y <= L.listBottom) {
    shopDragActive = true;
    shopDragStartY = y;
    shopDragLastY = y;
    shopDragMoved = false;
    shopDragVelocity = 0;

    for (let i = 0; i < L.cards.length; i++) {
      const c = L.cards[i];
      const pb = c.priceBtn;
      if (inBox(x, y, pb.x - 4, pb.y - 4, pb.w + 8, pb.h + 8)) {
        if (c.type === 'rewarded_coins') {
          activePress = 'shop_rewarded_coins';
        } else if (c.type === 'no_ads_shop') {
          activePress = 'shop_no_ads_open';
        } else if (c.type === 'bundle') {
          activePress = 'shop_bundle_buy_' + c.bundle.id;
        } else if (c.type === 'coin_pack') {
          activePress = 'coin_pack_buy_' + c.pack.id;
        } else {
          activePress = (c.type === 'item') ? ('shop_buy_' + c.item.id) : 'shop_claim_daily';
        }
        return;
      }
    }
  }
}

function handlePointerDown(e) {
  initAudio();
  const { x, y } = getCanvasCoords(e);

  if (st === 'loading' || adShowing) return;

  if (shopOpen) {
    handleShopPointerDown(x, y);
    return;
  }

  if (noAdsPopupOpen) {
    if (noAdsConfirmOpen) {
      const bw = 280, bh = 186;
      const bx = Math.round(W / 2 - bw / 2);
      const by = Math.round(H / 2 - bh / 2);
      const yesBtn = { x: bx + 18, y: by + 122, w: 116, h: 44 };
      const noBtn = { x: bx + bw - 134, y: by + 122, w: 116, h: 44 };
      if (inBox(x, y, yesBtn.x, yesBtn.y, yesBtn.w, yesBtn.h)) {
        activePress = 'no_ads_confirm_yes';
        return;
      }
      if (inBox(x, y, noBtn.x, noBtn.y, noBtn.w, noBtn.h)) {
        activePress = 'no_ads_confirm_no';
        return;
      }
      if (!inBox(x, y, bx, by, bw, bh)) {
        noAdsConfirmOpen = false;
      }
      return;
    }
    const L = getNoAdsPopupLayout();
    if (inCircle(x, y, L.closeCenter.x, L.closeCenter.y, 24)) {
      activePress = 'close_no_ads_popup';
      return;
    }
    if (inBox(x, y, L.buyBtn.x - 4, L.buyBtn.y - 4, L.buyBtn.w + 8, L.buyBtn.h + 8)) {
      activePress = 'no_ads_popup_buy';
      return;
    }
    return;
  }

  if (dailyPopupOpen) {
    const L = getDailyPopupLayout();
    if (inCircle(x, y, L.closeCenter.x, L.closeCenter.y, 24)) {
      activePress = 'close_daily_popup';
      return;
    }
    if (inBox(x, y, L.claimBtn.x - 4, L.claimBtn.y - 4, L.claimBtn.w + 8, L.claimBtn.h + 8)) {
      activePress = 'daily_popup_claim';
      return;
    }
    return;
  }

  if (starterPopupOpen) {
    if (starterConfirmOpen) {
      const bw = 280, bh = 186;
      const bx = Math.round(W / 2 - bw / 2);
      const by = Math.round(H / 2 - bh / 2);
      const yesBtn = { x: bx + 18, y: by + 122, w: 116, h: 44 };
      const noBtn = { x: bx + bw - 134, y: by + 122, w: 116, h: 44 };
      if (inBox(x, y, yesBtn.x, yesBtn.y, yesBtn.w, yesBtn.h)) {
        activePress = 'starter_confirm_yes';
        return;
      }
      if (inBox(x, y, noBtn.x, noBtn.y, noBtn.w, noBtn.h)) {
        activePress = 'starter_confirm_no';
        return;
      }
      if (!inBox(x, y, bx, by, bw, bh)) {
        starterConfirmOpen = false;
      }
      return;
    }
    const L = getStarterPopupLayout();
    if (inCircle(x, y, L.closeCenter.x, L.closeCenter.y, 24)) {
      activePress = 'close_starter_popup';
      return;
    }
    if (inBox(x, y, L.buyBtn.x - 4, L.buyBtn.y - 4, L.buyBtn.w + 8, L.buyBtn.h + 8)) {
      activePress = 'starter_popup_buy';
      return;
    }
    return;
  }

  if (bgPopupOpen) {
    const L = getBgPopupLayout();
    if (bgConfirmId) {
      if (inCircle(x, y, L.confirmClose.x, L.confirmClose.y, 24)) {
        activePress = 'bg_confirm_close';
        return;
      }
      if (inBox(x, y, L.confirmAdBtn.x - 4, L.confirmAdBtn.y - 4, L.confirmAdBtn.w + 8, L.confirmAdBtn.h + 8)) {
        activePress = 'bg_confirm_ad';
        return;
      }
      if (inBox(x, y, L.confirmCoinBtn.x - 4, L.confirmCoinBtn.y - 4, L.confirmCoinBtn.w + 8, L.confirmCoinBtn.h + 8)) {
        activePress = 'bg_confirm_coins';
        return;
      }
      if (!inBox(x, y, L.confirmBox.x, L.confirmBox.y, L.confirmBox.w, L.confirmBox.h)) {
        bgConfirmId = null;
      }
      return;
    }

    if (inCircle(x, y, L.closeCenter.x, L.closeCenter.y, 24)) {
      activePress = 'close_bg_popup';
      return;
    }
    if (inBox(x, y, L.defaultBtn.x - 4, L.defaultBtn.y - 4, L.defaultBtn.w + 8, L.defaultBtn.h + 8)) {
      activePress = 'bg_select_default';
      return;
    }
    if (y >= L.listTop && y <= L.listBottom) {
      bgDragActive = true;
      bgDragStartY = y;
      bgDragLastY = y;
      bgDragMoved = false;
      bgDragVelocity = 0;

      for (let i = 0; i < L.cards.length; i++) {
        const item = L.cards[i];
        const id = item.bg.id;
        const isUnlocked = Boolean(unlockedBgs[id]);
        if (isUnlocked) {
          if (inBox(x, y, item.cardBox.x, item.cardBox.y, item.cardBox.w, item.cardBox.h)) {
            activePress = `bg_select_${id}`;
            return;
          }
        } else {
          if (inBox(x, y, item.adBtn.x - 2, item.adBtn.y - 2, item.adBtn.w + 4, item.adBtn.h + 4)) {
            activePress = `bg_ad_${id}`;
            return;
          }
          if (inBox(x, y, item.coinBtn.x - 2, item.coinBtn.y - 2, item.coinBtn.w + 4, item.coinBtn.h + 4)) {
            activePress = `bg_coin_${id}`;
            return;
          }
          if (inBox(x, y, item.cardBox.x, item.cardBox.y, item.cardBox.w, item.cardBox.h)) {
            activePress = `bg_open_confirm_${id}`;
            return;
          }
        }
      }
    }
    return;
  }

  if (settingsOpen) {
    handleSettingsModalPointerDown(x, y, false);
    return;
  }

  if (st === 'ready') {
    if (menuExiting) return;

    // Tapping the top-right coin pill still opens Coins Shop cleanly
    const pillX = W - 118, pillY = 16 + topInset, pillW = 104, pillH = 27;
    if (inBox(x, y, pillX - 6, pillY - 6, pillW + 12, pillH + 12)) {
      activePress = 'open_shop_plus';
      return;
    }

    // Check left-side menu buttons (No Ads, Starter Pack & Backgrounds)
    const leftMenu = getMainMenuLeftButtonsLayout();
    if (leftMenu.noAdsBtn) {
      const nBtn = leftMenu.noAdsBtn;
      if (inBox(x, y, nBtn.x - 4, nBtn.y - 4, nBtn.w + 8, nBtn.h + 8)) {
        activePress = 'open_no_ads_popup';
        return;
      }
    }
    if (leftMenu.starterBtn) {
      const sBtn = leftMenu.starterBtn;
      if (inBox(x, y, sBtn.x - 4, sBtn.y - 4, sBtn.w + 8, sBtn.h + 8)) {
        activePress = 'open_starter_popup';
        return;
      }
    }
    if (leftMenu.bgBtn) {
      const bBtn = leftMenu.bgBtn;
      if (inBox(x, y, bBtn.x - 4, bBtn.y - 4, bBtn.w + 8, bBtn.h + 8)) {
        activePress = 'open_bg_popup';
        return;
      }
    }

    // Check "Take with you" pre-level booster slots
    const takeLayout = getTakeWithYouSlots();
    if (takeLayout) {
      for (let i = 0; i < takeLayout.slots.length; i++) {
        const s = takeLayout.slots[i];
        if (inBox(x, y, s.x - 4, s.y - 4, s.w + 8, s.h + 8)) {
          activePress = 'toggle_take_' + s.id;
          return;
        }
      }
      if (inBox(x, y, takeLayout.barX, takeLayout.barY, takeLayout.barW, takeLayout.barH)) {
        return;
      }
    }

    const btnY = H - 70 - botInset;
    if (inCircle(x, y, 52, btnY, 32)) {
      activePress = 'open_settings';
      return;
    }
    if (inBox(x, y, 267, btnY - 32, 78, 64)) {
      activePress = 'open_shop';
      return;
    }
    activePress = 'start_level';
    return;
  }

  if (st === 'transition') {
    return;
  }

  if (st === 'level_complete') {
    const L = getLevelCompletePopupLayout();
    const coinPillRect = { x: W - 100, y: 14 + (topInset || 0), w: 88, h: 26 };
    if (inBox(x, y, coinPillRect.x - 6, coinPillRect.y - 6, coinPillRect.w + 12, coinPillRect.h + 12)) {
      activePress = 'open_shop_plus';
      return;
    }
    if (inBox(x, y, L.nextBtn.x - 4, L.nextBtn.y - 4, L.nextBtn.w + 8, L.nextBtn.h + 8)) {
      activePress = 'next_level';
      return;
    }
    if (L.doubleBtn && inBox(x, y, L.doubleBtn.x - 4, L.doubleBtn.y - 4, L.doubleBtn.w + 8, L.doubleBtn.h + 8)) {
      activePress = 'rewarded_double_coins';
      return;
    }
    if (L.homeBtn && inBox(x, y, L.homeBtn.x - 4, L.homeBtn.y - 4, L.homeBtn.w + 8, L.homeBtn.h + 8)) {
      activePress = 'close_complete';
      return;
    }
    return;
  }

  if (st === 'dead') {
    const L = getCrashPopupLayout();
    const coinPillRect = { x: W - 100, y: 14 + (topInset || 0), w: 88, h: 26 };
    if (inBox(x, y, coinPillRect.x - 6, coinPillRect.y - 6, coinPillRect.w + 12, coinPillRect.h + 12)) {
      activePress = 'open_shop_plus';
      return;
    }
    if (inBox(x, y, L.leftBtn.x - 4, L.leftBtn.y - 4, L.leftBtn.w + 8, L.leftBtn.h + 8)) {
      activePress = L.showRevive ? 'rewarded_revive' : 'crash_home';
      return;
    }
    if (inBox(x, y, L.rightBtn.x - 4, L.rightBtn.y - 4, L.rightBtn.w + 8, L.rightBtn.h + 8)) {
      activePress = L.showRevive ? 'coin_revive' : 'crash_shop';
      return;
    }
    if (inBox(x, y, L.restartBtn.x - 4, L.restartBtn.y - 4, L.restartBtn.w + 8, L.restartBtn.h + 8)) {
      activePress = 'try_again';
      return;
    }
    return;
  }

  if (paused) {
    handleSettingsModalPointerDown(x, y, true);
    return;
  }

  if (pauseCountdown > 0) {
    return;
  }

  if (st === 'play') {
    if (isPauseButtonVisible()) {
      const pb = getPauseButtonRect();
      if (inBox(x, y, pb.x - 4, pb.y - 4, pb.size + 8, pb.size + 8)) {
        activePress = 'pause_game';
        hold = false;
        return;
      }
    }
    if (!stopping && finishRunStage === 'none' && activeLevelBoosters.length > 0) {
      const inLevelBtns = getInLevelBoosterButtons();
      for (let i = 0; i < inLevelBtns.length; i++) {
        const b = inLevelBtns[i];
        if (inCircle(x, y, b.cx, b.cy, b.r + 6)) {
          activePress = 'use_booster_' + b.id;
          hold = false;
          return;
        }
      }
    }
    if (!stopping && finishRunStage === 'none') {
      const wasHeldBefore = hold;
      hold = true;
      if (controlMode === 'tap') {
        tapBoostTimer = 0.16;
        vy = Math.min(vy, -MAX_UP_SPEED * 0.72);
        playSinglePuff(true);
        wasThrustActive = true;
      } else if (!wasHeldBefore && !wasThrustActive) {
        playSinglePuff(true);
        wasThrustActive = true;
      }
    }
  }
}

function handlePointerMove(e) {
  if ((settingsOpen || paused) && !shopOpen && !dailyPopupOpen && !starterPopupOpen && !noAdsPopupOpen && !bgPopupOpen) {
    const { x, y } = getCanvasCoords(e);
    const hk = getSettingsHitKey(x, y, paused);
    hoverKey = hk;
    cv.style.cursor = hk ? 'pointer' : 'default';
    return;
  }
  hoverKey = null;
  cv.style.cursor = 'default';

  if (bgPopupOpen && bgDragActive) {
    const { y } = getCanvasCoords(e);
    const dy = y - bgDragLastY;
    if (Math.abs(y - bgDragStartY) > 6) {
      bgDragMoved = true;
      if (activePress && (activePress.startsWith('bg_select_') || activePress.startsWith('bg_ad_') || activePress.startsWith('bg_coin_') || activePress.startsWith('bg_open_confirm_'))) {
        activePress = null;
      }
    }
    if (bgDragMoved) {
      bgScrollY = Math.max(0, Math.min(bgMaxScroll, bgScrollY - dy));
      bgDragVelocity = dy * 28;
    }
    bgDragLastY = y;
    return;
  }
  if (!shopOpen || !shopDragActive) return;
  const { y } = getCanvasCoords(e);
  const dy = y - shopDragLastY;
  if (Math.abs(y - shopDragStartY) > 6) {
    shopDragMoved = true;
    if (activePress && (activePress.startsWith('shop_buy_') || activePress.startsWith('coin_pack_buy_') || activePress.startsWith('shop_bundle_buy_') || activePress === 'shop_claim_daily' || activePress === 'shop_rewarded_coins' || activePress === 'shop_no_ads_open')) {
      activePress = null;
    }
  }
  if (shopDragMoved) {
    shopScrollY = Math.max(0, Math.min(shopMaxScroll, shopScrollY - dy));
    shopDragVelocity = dy * 28;
  }
  shopDragLastY = y;
}

const SETTINGS_DEBOUNCE_KEYS = new Set([
  'pause_close', 'pause_resume', 'pause_restart', 'pause_home',
  'pause_home_confirm_yes', 'pause_home_confirm_no',
  'close_settings', 'toggle_sound', 'toggle_vibrate',
  'set_speed_normal', 'set_speed_fast', 'set_speed_turbo',
  'open_support_sub', 'close_support_sub', 'ask_reset_progress',
  'open_terms_sub', 'open_privacy_sub', 'close_legal_sub',
  'settings_confirm_yes', 'settings_confirm_no'
]);

function handlePointerUp(e) {
  hold = false;
  holdToViewCrash = false;
  shopDragActive = false;
  bgDragActive = false;
  const upCoords = e ? getCanvasCoords(e) : { x: W / 2, y: H / 2 };

  if (activePress) {
    if ((settingsOpen || paused) && SETTINGS_DEBOUNCE_KEYS.has(activePress)) {
      const nowMs = performance.now();
      const releaseHit = getSettingsHitKey(upCoords.x, upCoords.y, paused);
      if (releaseHit !== activePress || (nowMs - lastSettingsActionAt) < 160) {
        activePress = null;
        return;
      }
      lastSettingsActionAt = nowMs;
    }

    playClickSound();

    if (activePress === 'open_shop') {
      openShop('boosters');
    } else if (activePress === 'open_shop_plus') {
      openShop('coins');
    } else if (activePress === 'close_shop') {
      closeShop();
    } else if (activePress.startsWith('shop_bundle_buy_')) {
      const bid = activePress.slice('shop_bundle_buy_'.length);
      const bundle = getShopBundleById(bid);
      if (bundle) {
        if (bundle.removesAds && noAdsPurchased) {
          if (shopCardAnim[bundle.id]) shopCardAnim[bundle.id].shake = 0.35;
          showToast('No Ads Already Owned!');
        } else {
          coinPackConfirmItem = bundle;
        }
      }
    } else if (activePress.startsWith('coin_pack_buy_')) {
      const pid = activePress.slice('coin_pack_buy_'.length);
      const pack = getCoinPackById(pid);
      if (pack) {
        coinPackConfirmItem = pack;
      }
    } else if (activePress === 'coin_pack_confirm_yes') {
      if (coinPackConfirmItem) {
        const pack = coinPackConfirmItem;
        coinPackConfirmItem = null;
        if (pack.coins > 0) {
          wallet += pack.coins;
          saveWallet();
          coinCounterBump = 1.38;
        }
        if (pack.boosters) {
          ['boost', 'magnet', 'shield', 'slowmo'].forEach(k => {
            if (pack.boosters[k] > 0) {
              inventory[k] = (inventory[k] || 0) + pack.boosters[k];
              selectedLoadout[k] = true;
            }
          });
          saveInventory();
          saveLoadout();
        }
        if (pack.removesAds) {
          noAdsPurchased = true;
          saveNoAdsState();
        }
        if (pack.id === 'bundle_starter') {
          starterPackClaimed = true;
          saveStarterPack();
        }
        if (shopCardAnim[pack.id]) {
          shopCardAnim[pack.id].pop = 0.35;
        }
        if (pack.coins > 0) {
          spawnRewardFlyingCoins(W / 2, H / 2, 12);
        }
        spawnShopSparkles(W / 2, H / 2, ['#fde047', pack.accent || '#fde047', '#ffffff', '#4ade80']);
        playPerfectBonusSound();
        triggerVibrate([30, 40, 60]);
        if (pack.removesAds && (!pack.coins || pack.coins === 0)) {
          showToast('Ads Removed Permanently!');
        } else if (pack.boosters) {
          showToast(`${pack.title} Unlocked!`);
        } else {
          showToast(`+${pack.coins.toLocaleString()} Coins!`);
        }
      }
    } else if (activePress === 'coin_pack_confirm_no') {
      coinPackConfirmItem = null;
    } else if (activePress === 'shop_rewarded_coins') {
      requestRewardedAd('shop_free_coins');
    } else if (activePress === 'shop_no_ads_open') {
      openNoAdsPopup();
    } else if (activePress === 'open_no_ads_popup') {
      openNoAdsPopup();
    } else if (activePress === 'close_no_ads_popup') {
      closeNoAdsPopup();
    } else if (activePress === 'no_ads_popup_buy') {
      noAdsConfirmOpen = true;
    } else if (activePress === 'no_ads_confirm_yes') {
      purchaseNoAds();
    } else if (activePress === 'no_ads_confirm_no') {
      noAdsConfirmOpen = false;
    } else if (activePress === 'open_daily_popup') {
      openDailyPopup();
    } else if (activePress === 'close_daily_popup') {
      closeDailyPopup();
    } else if (activePress === 'daily_popup_claim') {
      const dL = getDailyPopupLayout();
      claimDailyReward(dL.claimBtn.x + dL.claimBtn.w / 2, dL.claimBtn.y);
    } else if (activePress === 'open_starter_popup') {
      openStarterPopup();
    } else if (activePress === 'close_starter_popup') {
      closeStarterPopup();
    } else if (activePress === 'starter_popup_buy' || activePress === 'starter_popup_claim') {
      starterConfirmOpen = true;
    } else if (activePress === 'starter_confirm_yes') {
      const sL = getStarterPopupLayout();
      claimStarterPack(sL.buyBtn.x + sL.buyBtn.w / 2, sL.buyBtn.y);
    } else if (activePress === 'starter_confirm_no') {
      starterConfirmOpen = false;
    } else if (activePress === 'open_bg_popup') {
      openBgPopup();
    } else if (activePress === 'close_bg_popup') {
      closeBgPopup();
    } else if (activePress === 'bg_confirm_close') {
      bgConfirmId = null;
    } else if (activePress === 'bg_confirm_ad') {
      if (bgConfirmId) requestRewardedAd(`unlock_bg_${bgConfirmId}`);
    } else if (activePress === 'bg_confirm_coins') {
      if (bgConfirmId) buyBackgroundWithCoins(bgConfirmId);
    } else if (activePress === 'bg_select_default') {
      selectBackground('default');
      closeBgPopup();
      if (st === 'ready' && !menuExiting) beginMenuExitToLevel();
    } else if (activePress.startsWith('bg_select_')) {
      const selBgId = activePress.slice('bg_select_'.length);
      selectBackground(selBgId);
      closeBgPopup();
      if (st === 'ready' && !menuExiting) beginMenuExitToLevel();
    } else if (activePress.startsWith('bg_ad_')) {
      requestRewardedAd(`unlock_bg_${activePress.slice('bg_ad_'.length)}`);
    } else if (activePress.startsWith('bg_coin_')) {
      buyBackgroundWithCoins(activePress.slice('bg_coin_'.length));
    } else if (activePress.startsWith('bg_open_confirm_')) {
      bgConfirmId = activePress.slice('bg_open_confirm_'.length);
    } else if (activePress === 'shop_claim_daily' || activePress === 'shop_shortcut_daily') {
      claimDailyReward(upCoords.x, upCoords.y);
    } else if (activePress.startsWith('shop_buy_')) {
      const id = activePress.slice('shop_buy_'.length);
      buyShopItem(id, upCoords.x, upCoords.y);
    } else if (activePress.startsWith('toggle_take_')) {
      const id = activePress.slice('toggle_take_'.length);
      selectedLoadout[id] = !selectedLoadout[id];
      saveLoadout();
      triggerVibrate(20);
    } else if (activePress.startsWith('use_booster_')) {
      const id = activePress.slice('use_booster_'.length);
      activateInLevelBooster(id);
    } else if (activePress === 'pause_game') {
      pauseGame();
    } else if (activePress === 'pause_close' || activePress === 'pause_resume') {
      resumeFromPause();
    } else if (activePress === 'pause_restart') {
      restartFromPause();
    } else if (activePress === 'pause_home') {
      goHomeWithTransition();
    } else if (activePress === 'settings_confirm_yes') {
      const act = settingsConfirmAction;
      settingsConfirmAction = null;
      if (act === 'restart') {
        restartFromPause();
      } else if (act === 'quit') {
        quitGameApp();
      } else if (act === 'reset_settings') {
        setSound(true);
        setSoundVolume(85);
        setMusicVolume(65);
        setVibrate(true);
        setVibrationVolume(80);
        setSpeedMode('normal');
        setEasyHover(false);
        setControlMode('hold');
        setControlSensitivity(1.0);
        setAutoGlideAssist(false);
        triggerVibrate(35);
      } else if (act === 'reset_progress') {
        supportSubOpen = false;
        resetConfirming = false;
        curLevel = 1;
        highestLevel = 1;
        saveProgress(1, 1, best);
        if (paused) {
          goHomeFromPause();
        } else {
          startLevel(1);
        }
        syncAndroidBackState();
      }
    } else if (activePress === 'settings_confirm_no') {
      settingsConfirmAction = null;
      syncAndroidBackState();
    } else if (activePress === 'open_controls_sub') {
      controlsSubOpen = true;
      supportSubOpen = false;
      settingsConfirmAction = null;
      syncAndroidBackState();
    } else if (activePress === 'close_controls_sub') {
      controlsSubOpen = false;
      syncAndroidBackState();
    } else if (activePress === 'ctrl_mode_hold') {
      setControlMode('hold');
      triggerVibrate(25);
    } else if (activePress === 'ctrl_mode_tap') {
      setControlMode('tap');
      triggerVibrate(25);
    } else if (activePress === 'ctrl_sens_low') {
      setControlSensitivity(0.8);
      triggerVibrate(25);
    } else if (activePress === 'ctrl_sens_med') {
      setControlSensitivity(1.0);
      triggerVibrate(25);
    } else if (activePress === 'ctrl_sens_high') {
      setControlSensitivity(1.25);
      triggerVibrate(25);
    } else if (activePress === 'toggle_auto_glide') {
      setAutoGlideAssist(!autoGlideAssist);
      triggerVibrate(25);
    } else if (activePress === 'reset_controls_defaults') {
      setControlMode('hold');
      setControlSensitivity(1.0);
      setAutoGlideAssist(false);
      triggerVibrate(30);
    } else if (activePress === 'open_support_sub') {
      supportSubOpen = true;
      legalSubOpen = null;
      controlsSubOpen = false;
      settingsConfirmAction = null;
      syncAndroidBackState();
    } else if (activePress === 'close_support_sub') {
      supportSubOpen = false;
      syncAndroidBackState();
    } else if (activePress === 'open_terms_sub') {
      legalSubOpen = 'terms';
      supportSubOpen = false;
      controlsSubOpen = false;
      settingsConfirmAction = null;
      syncAndroidBackState();
    } else if (activePress === 'open_privacy_sub') {
      legalSubOpen = 'privacy';
      supportSubOpen = false;
      controlsSubOpen = false;
      settingsConfirmAction = null;
      syncAndroidBackState();
    } else if (activePress === 'close_legal_sub') {
      legalSubOpen = null;
      syncAndroidBackState();
    } else if (activePress === 'close_settings') {
      settingsOpen = false;
      controlsSubOpen = false;
      supportSubOpen = false;
      legalSubOpen = null;
      settingsConfirmAction = null;
      sliderDragActive = null;
      hoverKey = null;
      syncAndroidBackState();
    } else if (activePress === 'toggle_sound') {
      setSound(!soundEnabled);
      if (soundEnabled) playClickSound();
      triggerVibrate(30);
      toastMsg = '';
      toastTimer = 0;
    } else if (activePress === 'toggle_music_mute') {
      if (musicVolume > 0) {
        musicRestoreVolume = musicVolume;
        setMusicVolume(0);
      } else {
        setMusicVolume(musicRestoreVolume > 0 ? musicRestoreVolume : 65);
      }
      triggerVibrate(25);
      toastMsg = '';
      toastTimer = 0;
    } else if (activePress === 'toggle_ambient') {
      setAmbient(!ambientEnabled);
      triggerVibrate(30);
      toastMsg = '';
      toastTimer = 0;
    } else if (activePress === 'toggle_vibrate') {
      setVibrate(!vibrateEnabled);
      if (vibrateEnabled) triggerVibrate(40);
      toastMsg = '';
      toastTimer = 0;
    } else if (activePress === 'toggle_easy_hover') {
      setEasyHover(!easyHoverEnabled);
      triggerVibrate(30);
      toastMsg = '';
      toastTimer = 0;
    } else if (activePress === 'cycle_speed_mode') {
      const nextMode = speedMode === 'normal' ? 'fast' : (speedMode === 'fast' ? 'turbo' : 'normal');
      setSpeedMode(nextMode);
      triggerVibrate(30);
      toastMsg = '';
      toastTimer = 0;
    } else if (activePress === 'set_speed_normal') {
      setSpeedMode('normal');
      triggerVibrate(30);
      toastMsg = '';
      toastTimer = 0;
    } else if (activePress === 'set_speed_fast') {
      setSpeedMode('fast');
      triggerVibrate(30);
      toastMsg = '';
      toastTimer = 0;
    } else if (activePress === 'set_speed_turbo') {
      setSpeedMode('turbo');
      triggerVibrate(40);
      toastMsg = '';
      toastTimer = 0;
    } else if (activePress === 'ask_reset_settings') {
      settingsConfirmAction = 'reset_settings';
      syncAndroidBackState();
    } else if (activePress === 'ask_reset_progress') {
      settingsConfirmAction = 'reset_progress';
      syncAndroidBackState();
    } else if (activePress === 'open_settings') {
      settingsOpen = true;
      toastMsg = '';
      toastTimer = 0;
      resetConfirming = false;
      homeConfirmOpen = false;
      supportSubOpen = false;
      legalSubOpen = null;
      controlsSubOpen = false;
      settingsConfirmAction = null;
      sliderDragActive = null;
      hoverKey = null;
      syncAndroidBackState();
    } else if (activePress === 'dec_start_level') {
      if (curLevel > 1) {
        curLevel--;
        saveProgress(curLevel, highestLevel, best);
        startLevel(curLevel);
        triggerVibrate(25);
        showToast('Level ' + curLevel);
      }
    } else if (activePress === 'inc_start_level') {
      if (curLevel < highestLevel) {
        curLevel++;
        saveProgress(curLevel, highestLevel, best);
        startLevel(curLevel);
        triggerVibrate(25);
        showToast('Level ' + curLevel);
      }
    } else if (activePress === 'start_level') {
      beginMenuExitToLevel();
    } else if (activePress === 'car_garage' || activePress === 'cycle_rim_style') {
      cycleAlloyRimStyle();
    } else if (activePress === 'rewarded_double_coins') {
      requestRewardedAd('double_level_coins');
    } else if (activePress === 'rewarded_revive') {
      requestRewardedAd('revive');
    } else if (activePress === 'coin_revive') {
      if (st === 'dead' && !levelReviveUsed) {
        if (wallet >= REVIVE_COIN_COST) {
          wallet -= REVIVE_COIN_COST;
          saveWallet();
          coinCounterBump = 1.35;
          reviveAfterCrash();
        } else {
          triggerVibrate([30, 40, 30]);
          showToast(`Need ${REVIVE_COIN_COST} coins to revive!`);
        }
      }
    } else if (activePress === 'crash_home' || activePress === 'close_dead') {
      const goHomeDead = () => {
        const restartLvl = RETRY_FROM_LEVEL_START ? curLevel : 1;
        curLevel = restartLvl;
        startLevel(curLevel);
        st = 'ready';
        hold = false;
        syncHomeMusicState();
      };
      if (!noAdsPurchased && deathCountSinceAd >= 2) {
        deathCountSinceAd = 0;
        requestInterstitialThen('close_after_crash', goHomeDead);
      } else {
        goHomeDead();
      }
    } else if (activePress === 'crash_shop') {
      const restartLvl = RETRY_FROM_LEVEL_START ? curLevel : 1;
      curLevel = restartLvl;
      startLevel(curLevel);
      st = 'ready';
      hold = false;
      syncHomeMusicState();
      openShop('boosters');
    } else if (activePress === 'next_level') {
      if (!noAdsPurchased && levelClearCountSinceAd >= 2) {
        levelClearCountSinceAd = 0;
        requestInterstitialThen('level_complete_next', () => advanceToNextLevel());
      } else {
        advanceToNextLevel();
      }
    } else if (activePress === 'close_complete') {
      const goHomeAfterComplete = () => {
        const nextLvl = (levelJustCleared ? levelJustCleared + 1 : curLevel + 1);
        curLevel = nextLvl;
        saveProgress(curLevel, Math.max(highestLevel, curLevel), best);
        startLevel(curLevel);
        st = 'ready';
        hold = false;
        syncHomeMusicState();
      };
      if (!noAdsPurchased && levelClearCountSinceAd >= 2) {
        levelClearCountSinceAd = 0;
        requestInterstitialThen('level_complete_home', goHomeAfterComplete);
      } else {
        goHomeAfterComplete();
      }
    } else if (activePress === 'try_again') {
      const retryRun = () => {
        const restartLvl = RETRY_FROM_LEVEL_START ? curLevel : 1;
        curLevel = restartLvl;
        startLevelWithTransition(curLevel);
        hold = false;
      };
      if (!noAdsPurchased && deathCountSinceAd >= 2) {
        deathCountSinceAd = 0;
        requestInterstitialThen('retry_after_crash', retryRun);
      } else {
        retryRun();
      }
    }

    activePress = null;
  }
}

cv.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudioContext(); handlePointerDown(e); });
window.addEventListener('pointermove', e => {
  if (trInfoModalEl && trInfoModalEl.classList.contains('open')) return;
  handlePointerMove(e);
});
window.addEventListener('pointerup', e => {
  if (e.target && e.target.closest && e.target.closest('#trInfoModal')) return;
  e.preventDefault();
  handlePointerUp(e);
});
window.addEventListener('pointercancel', () => { hold = false; holdToViewCrash = false; shopDragActive = false; bgDragActive = false; sliderDragActive = null; hoverKey = null; activePress = null; });
cv.addEventListener('wheel', e => {
  if (shopOpen) {
    e.preventDefault();
    shopScrollY = Math.max(0, Math.min(shopMaxScroll, shopScrollY + e.deltaY * 0.5));
  } else if (bgPopupOpen && !bgConfirmId) {
    e.preventDefault();
    bgScrollY = Math.max(0, Math.min(bgMaxScroll, bgScrollY + e.deltaY * 0.5));
  }
}, { passive: false });
window.addEventListener('blur', () => {
  hold = false; shopDragActive = false; bgDragActive = false; sliderDragActive = null; hoverKey = null; activePress = null;
  last = 0; skipNextDtSpike = true;
  flushDirtyStorage();
});
window.addEventListener('focus', () => {
  last = 0; skipNextDtSpike = true;
  scheduleNextFrame();
});
document.addEventListener('visibilitychange', () => {
  hold = false; shopDragActive = false; bgDragActive = false; sliderDragActive = null; hoverKey = null; activePress = null;
  last = 0; skipNextDtSpike = true;
  flushDirtyStorage();
  if (document.hidden) {
    stopMusicScheduler();
  } else {
    syncHomeMusicState();
    scheduleNextFrame();
  }
});
window.addEventListener('pageshow', () => {
  last = 0; skipNextDtSpike = true;
  scheduleNextFrame();
});
window.addEventListener('pagehide', () => { flushDirtyStorage(); });

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!e.repeat && handleBackOrEscape()) {
      e.preventDefault();
    }
    return;
  }
  const activeTag = document.activeElement ? document.activeElement.tagName : '';
  if (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT') {
    return;
  }
  if (e.code === 'Space') {
    e.preventDefault();
    if (adShowing || shopOpen || dailyPopupOpen || starterPopupOpen || noAdsPopupOpen || bgPopupOpen || settingsOpen || paused || pauseCountdown > 0) return;
    ensureAudioContext();
    if (!e.repeat) {
      if (st === 'ready') {
        if (!menuExiting) {
          playClickSound();
          beginMenuExitToLevel();
        }
      }
      else if (st === 'play') {
        if (!stopping && finishRunStage === 'none') {
          hold = true;
          if (controlMode === 'tap') {
            tapBoostTimer = 0.16;
            vy = Math.min(vy, -MAX_UP_SPEED * 0.72);
          }
        }
      }
      else if (st === 'dead' && performance.now() - deadAt > 350) { startLevel(curLevel); st = 'play'; }
      else if (st === 'level_complete' && levelCompleteTimer >= 0.8) {
        advanceToNextLevel();
      }
    }
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') { hold = false; }
});
let lastResizeW = window.innerWidth || 0;
let lastResizeH = window.innerHeight || 0;
let lastResizeDpr = window.devicePixelRatio || 1;
window.addEventListener('resize', () => {
  const nw = window.innerWidth || 0;
  const nh = window.innerHeight || 0;
  const nd = window.devicePixelRatio || 1;
  if (nw === lastResizeW && nh === lastResizeH && nd === lastResizeDpr) {
    updateSafeInsets();
    return;
  }
  lastResizeW = nw;
  lastResizeH = nh;
  lastResizeDpr = nd;
  resizeCanvas();
  prerenderVignette();
  prerenderStageBackgrounds();
  initSpeedLines();
  initStageParticles();
  if (curConfig) {
    preloadedPictures.forEach(pic => {
      if (pic.loaded) updatePictureSeamlessCanvas(pic);
    });
    Object.values(customBgPictures).forEach(pic => {
      if (pic && pic.loaded) updatePictureSeamlessCanvas(pic);
    });
  }
});

loadSpeedSetting();
loadEasyHoverSetting();
loadControlSettings();
updateSpeedPhysics();
loadProgress();
loadWallet();
loadInventory();
loadLoadout();
loadDailyReward();
loadStarterPack();
loadNoAdsState();
loadBgStore();
loadStars();
currentBgStage = getStageNumber(curLevel);
prevBgStage = currentBgStage;
bgCrossFadeTimer = 0;
prerenderVignette();
prerenderStageBackgrounds();
prerenderAllStageSpikes();
prerenderCoinFrames();
prerenderBoosterSprite();
initSpeedLines();
initStageParticles();
// Unlock Web Audio immediately on first pointer/touch/key anywhere (including loading & modals)
window.addEventListener('pointerdown', ensureAudioContext, { capture: true, passive: true });
window.addEventListener('touchstart', ensureAudioContext, { capture: true, passive: true });
initAudio();
startLevel(curLevel);
step(0);
draw();
scheduleNextFrame();
})();
</script>
</body>
</html>
