function drawCreamyToggleBox(box, showDots = false) {
  ctx.save();
  // Warm tan bottom lip
  ctx.fillStyle = '#c8af90';
  roundRect(ctx, box.x, box.y + 3, box.w, box.h, 16);
  ctx.fill();

  const cg = ctx.createLinearGradient(0, box.y, 0, box.y + box.h);
  cg.addColorStop(0, '#fdf5eb');
  cg.addColorStop(1, '#f1dfc8');
  ctx.fillStyle = cg;
  roundRect(ctx, box.x, box.y, box.w, box.h, 16);
  ctx.fill();

  if (showDots) {
    ctx.save();
    roundRect(ctx, box.x, box.y, box.w, box.h, 16);
    ctx.clip();
    ctx.fillStyle = 'rgba(200, 175, 144, 0.28)';
    const spots = [
      [0.09, 0.25, 5], [0.16, 0.72, 3.5], [0.49, 0.16, 4],
      [0.86, 0.24, 5.5], [0.92, 0.74, 4]
    ];
    for (const [fx, fy, r] of spots) {
      ctx.beginPath();
      ctx.arc(box.x + box.w * fx, box.y + box.h * fy, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.6;
  roundRect(ctx, box.x + 1.5, box.y + 1.5, box.w - 3, box.h - 3, 14.5);
  ctx.stroke();

  ctx.strokeStyle = '#b99c7b';
  ctx.lineWidth = 1.8;
  roundRect(ctx, box.x, box.y, box.w, box.h, 16);
  ctx.stroke();
  ctx.restore();
}

function drawSettingsModal(isPauseMode) {
  const L = getSettingsModalLayout(isPauseMode);
  const { cx, cy, cw, ch } = L;

  ctx.save();
  ctx.fillStyle = 'rgba(6, 12, 28, 0.74)';
  ctx.fillRect(0, 0, W, H);

  if (isPauseMode) {
    if (pausePanelBgImg && pausePanelBgImg.complete && pausePanelBgImg.naturalWidth > 0) {
      ctx.save();
      ctx.shadowColor = 'rgba(20, 4, 48, 0.58)';
      ctx.shadowBlur = 20;
      ctx.shadowOffsetY = 6;
      ctx.drawImage(pausePanelBgImg, cx, cy, cw, ch);
      ctx.restore();
    } else {
      drawRoyalModalCardShell(cx, cy, cw, ch, 26);
      drawCreamyToggleBox(L.creamBox, true);
    }

    if (pauseRibbonImg && pauseRibbonImg.complete && pauseRibbonImg.naturalWidth > 0) {
      const rw = 236;
      const rh = Math.round(rw * (pauseRibbonImg.naturalHeight / pauseRibbonImg.naturalWidth));
      ctx.save();
      ctx.shadowColor = 'rgba(2, 12, 42, 0.45)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 3;
      ctx.drawImage(pauseRibbonImg, Math.round(W / 2 - rw / 2), cy - Math.round(rh * 0.52), rw, rh);
      ctx.restore();
    } else {
      drawRoyalSettingsRibbon(W / 2, cy - 22, 226, 46, 'Paused');
    }

    const closePressed = activePress === 'pause_close';
    const closeHovered = hoverKey === 'pause_close' && !closePressed;
    if (pauseBtnCloseImg && pauseBtnCloseImg.complete && pauseBtnCloseImg.naturalWidth > 0) {
      const baseSz = 38;
      const scale = closePressed ? 0.92 : (closeHovered ? 1.05 : 1.0);
      const dw = baseSz * scale;
      const dh = dw * (pauseBtnCloseImg.naturalHeight / pauseBtnCloseImg.naturalWidth);
      const dy = closePressed ? 2 : 0;
      ctx.save();
      ctx.shadowColor = closeHovered ? 'rgba(216, 180, 254, 0.85)' : 'rgba(2, 12, 42, 0.40)';
      ctx.shadowBlur = closeHovered ? 10 : 6;
      ctx.shadowOffsetY = 2;
      ctx.drawImage(pauseBtnCloseImg, L.closeCenter.x - dw / 2, L.closeCenter.y - dh / 2 + dy, dw, dh);
      ctx.restore();
    } else {
      drawRoundGlossyButton(L.closeCenter.x, L.closeCenter.y, L.closeCenter.r, BUTTON_THEMES.redRim, 'close', closePressed);
    }

    const drawPurplePauseSpriteBtn = (rect, img, pressKey, fallbackLabel, fallbackIcon, radius = 16) => {
      const isPressed = activePress === pressKey;
      const isHovered = hoverKey === pressKey && !isPressed;
      if (img && img.complete && img.naturalWidth > 0) {
        const scale = Math.min(rect.w / img.naturalWidth, rect.h / img.naturalHeight) * (isPressed ? 0.95 : (isHovered ? 1.03 : 1.0));
        const dw = img.naturalWidth * scale;
        const dh = img.naturalHeight * scale;
        const dx = rect.x + (rect.w - dw) / 2;
        const dy = rect.y + (rect.h - dh) / 2 + (isPressed ? 2.5 : 0);
        ctx.save();
        ctx.shadowColor = isHovered ? 'rgba(216, 180, 254, 0.80)' : 'rgba(2, 12, 42, 0.42)';
        ctx.shadowBlur = isHovered ? 12 : 6;
        ctx.shadowOffsetY = isPressed ? 1 : 3;
        ctx.drawImage(img, dx, dy, dw, dh);
        ctx.restore();
      } else {
        drawGlossyButton(rect.x, rect.y, rect.w, rect.h, BUTTON_THEMES.royalPurple, fallbackLabel, fallbackIcon, isPressed, radius, { hovered: isHovered });
      }
    };

    drawPurplePauseSpriteBtn(L.resumeBtn, pauseBtnResumeImg, 'pause_resume', 'Resume', 'play_tri', 18);
    drawPurplePauseSpriteBtn(L.replayBtn, pauseBtnRestartImg, 'pause_restart', 'Restart', 'restart_cw', 16);
    drawPurplePauseSpriteBtn(L.homeBtn, pauseBtnHomeImg, 'pause_home', 'Home', 'home_house', 16);

    const drawGoldPauseTile = (rect, label, iconName, enabled, pressKey) => {
      const isPressed = (activePress === pressKey);
      const theme = enabled ? BUTTON_THEMES.goldTile : BUTTON_THEMES.silver;
      drawGlossyButton(rect.x, rect.y, rect.w, rect.h, theme, null, null, isPressed, 14, { hovered: hoverKey === pressKey });
      const dy = isPressed ? 3 : 0;
      const iconSz = Math.min(rect.w * 0.36, rect.h * 0.46);
      drawButtonIcon(iconName, rect.x + rect.w / 2, rect.y + rect.h * 0.36 + dy, iconSz);
      drawGlossyText(label, rect.x + rect.w / 2, rect.y + rect.h - 11 + dy, 11.5, 'center', '#ffffff', enabled ? '#78350f' : '#334155', 2.8);
    };
    drawGoldPauseTile(L.soundBtn, 'SOUND', soundEnabled ? 'sound_on_white' : 'sound_off', soundEnabled, 'toggle_sound');
    drawGoldPauseTile(L.vibrateBtn, 'VIBRATE', vibrateEnabled ? 'vibrate_on_white' : 'vibrate_off', vibrateEnabled, 'toggle_vibrate');

    ctx.restore();
    return;
  }

  // Exact user Settings background rendered unstretched in natural aspect ratio
  if (settingsPanelBgImg && settingsPanelBgImg.complete && settingsPanelBgImg.naturalWidth > 0) {
    ctx.save();
    ctx.shadowColor = 'rgba(2, 12, 42, 0.58)';
    ctx.shadowBlur = 20;
    ctx.shadowOffsetY = 6;
    ctx.drawImage(settingsPanelBgImg, cx, cy, cw, ch);
    ctx.restore();
  } else {
    drawRoyalModalCardShell(cx, cy, cw, ch, 26);
  }

  // Custom Settings header banner centered in top arch bezel
  const hb = L.headerBanner;
  if (settingsHeaderBannerImg && settingsHeaderBannerImg.complete && settingsHeaderBannerImg.naturalWidth > 0) {
    ctx.drawImage(settingsHeaderBannerImg, hb.x, hb.y, hb.w, hb.h);
  } else {
    drawRoyalSettingsRibbon(W / 2, cy - 18, 222, 46, 'Settings');
  }

  // Top-right Close (X) button
  if (hoverKey === 'close_settings' && activePress !== 'close_settings') {
    ctx.save();
    ctx.shadowColor = 'rgba(252, 165, 165, 0.9)';
    ctx.shadowBlur = 10;
    drawRoundGlossyButton(L.closeCenter.x, L.closeCenter.y, L.closeCenter.r + 0.5, BUTTON_THEMES.redRim, 'close', false);
    ctx.restore();
  } else {
    drawRoundGlossyButton(L.closeCenter.x, L.closeCenter.y, L.closeCenter.r, BUTTON_THEMES.redRim, 'close', activePress === 'close_settings');
  }

  // Row 1: Voliume & Vibrate custom sprites
  drawSpriteSettingsButton(L.soundBtn, settingsBtnVolumeImg, {
    isPressed: activePress === 'toggle_sound',
    isHovered: hoverKey === 'toggle_sound',
    isSelected: soundEnabled,
    isOff: !soundEnabled,
    fallbackTheme: BUTTON_THEMES.cyanBlue,
    fallbackLabel: soundEnabled ? 'Sound: ON' : 'Sound: OFF'
  });
  drawSpriteSettingsButton(L.vibrateBtn, settingsBtnVibrateImg, {
    isPressed: activePress === 'toggle_vibrate',
    isHovered: hoverKey === 'toggle_vibrate',
    isSelected: vibrateEnabled,
    isOff: !vibrateEnabled,
    fallbackTheme: BUTTON_THEMES.cyanBlue,
    fallbackLabel: vibrateEnabled ? 'Vibrate: ON' : 'Vibrate: OFF'
  });

  // Row 2: Speed: Normal (1x) | Speed: Fast (1.5x) | Speed: Turbo (2x)
  drawSpriteSettingsButton(L.speedNormalBtn, settingsBtnSpeedNormalImg, {
    isPressed: activePress === 'set_speed_normal',
    isHovered: hoverKey === 'set_speed_normal',
    isSelected: speedMode === 'normal',
    badgeText: '1x',
    fallbackTheme: BUTTON_THEMES.limePill,
    fallbackLabel: 'Normal'
  });
  drawSpriteSettingsButton(L.speedFastBtn, settingsBtnSpeedFastImg, {
    isPressed: activePress === 'set_speed_fast',
    isHovered: hoverKey === 'set_speed_fast',
    isSelected: speedMode === 'fast',
    badgeText: '1.5x',
    fallbackTheme: BUTTON_THEMES.royalPurple,
    fallbackLabel: 'Fast'
  });
  drawSpriteSettingsButton(L.speedTurboBtn, settingsBtnSpeedTurboImg, {
    isPressed: activePress === 'set_speed_turbo',
    isHovered: hoverKey === 'set_speed_turbo',
    isSelected: speedMode === 'turbo',
    badgeText: '2x',
    fallbackTheme: BUTTON_THEMES.orange,
    fallbackLabel: 'Turbo'
  });

  // Row 3: Support custom sprite centered
  drawSpriteSettingsButton(L.supportBtn, settingsBtnSupportImg, {
    isPressed: activePress === 'open_support_sub',
    isHovered: hoverKey === 'open_support_sub',
    isSelected: supportSubOpen,
    fallbackTheme: BUTTON_THEMES.cyanBlue,
    fallbackLabel: 'Support'
  });

  // Row 4: Terms (left) & Privacy (right) below Support
  drawSpriteSettingsButton(L.termsBtn, settingsBtnTermsImg, {
    isPressed: activePress === 'open_terms_sub',
    isHovered: hoverKey === 'open_terms_sub',
    isSelected: legalSubOpen === 'terms',
    fallbackTheme: BUTTON_THEMES.cyanBlue,
    fallbackLabel: 'Terms'
  });
  drawSpriteSettingsButton(L.privacyBtn, settingsBtnPrivacyImg, {
    isPressed: activePress === 'open_privacy_sub',
    isHovered: hoverKey === 'open_privacy_sub',
    isSelected: legalSubOpen === 'privacy',
    fallbackTheme: BUTTON_THEMES.cyanBlue,
    fallbackLabel: 'Privacy'
  });

  // Support, Legal & Confirmation sub-popups
  if (settingsConfirmAction === 'reset_progress') {
    drawAreYouSureSubPopup(L, 'Are you sure?', 'Reset progress back to Level 1?', 'settings_confirm_yes', 'settings_confirm_no');
  } else if (legalSubOpen) {

function drawPauseCountdown() {
  const num = Math.max(1, Math.min(3, Math.ceil(pauseCountdown)));
  const elapsedInBeat = num - pauseCountdown;
  const scale = 1.35 - 0.35 * Math.min(1, elapsedInBeat / 0.25);
  const alpha = (elapsedInBeat > 0.85) ? Math.max(0.2, (1 - elapsedInBeat) / 0.15) : 1.0;

  ctx.save();
  ctx.fillStyle = 'rgba(10, 15, 25, 0.35)';
  ctx.fillRect(0, 0, W, H);

  ctx.translate(W / 2, H * 0.44);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;

  const r = 46;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
  ctx.beginPath();
  ctx.arc(0, 4, r + 2, 0, Math.PI * 2);
  ctx.fill();
  const g = ctx.createLinearGradient(0, -r, 0, r);
  g.addColorStop(0, '#93c5fd');
  g.addColorStop(0.5, '#3b82f6');
  g.addColorStop(1, '#1d4ed8');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3.5;
  ctx.stroke();

  drawGlossyText(String(num), 0, 3, 52, 'center', '#ffffff', '#0f172a', 7.5);
  ctx.restore();
}

      grad.addColorStop(0, '#fef9c3');

  for (let i = 0; i < 4; i++) {

  // Contents row
  const contX = cx + padX;
  const contY = row2Y + cardH2 + 12;

  const contH = 56;
  ctx.save();

  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 1.6;
  roundRect(ctx, contX, contY, contW, contH, 14);

  if (ready) {

    if (todayInfo.bonusBoost > 0) {

  } else {
    const remMs = getDailyRewardRemainingMs();
    drawGlossyText('NEXT REWARD IN', W / 2, contY + 15, 10, 'center', '#64748b', '#ffffff', 1.8);
    drawGlossyText(formatDailyCountdown(remMs), W / 2, contY + 38, 17, 'center', '#1e3a8a', '#ffffff', 2.6);

  ctx.restore();

  // Green Claim button
  const btnTheme = ready ? BUTTON_THEMES.green : BUTTON_THEMES.gray;

  drawGlossyButton(L.claimBtn.x, L.claimBtn.y, L.claimBtn.w, L.claimBtn.h, btnTheme, btnLabel, null, activePress === 'daily_popup_claim', 22);

}

function drawAnimatedHomeSpriteBadge(cx, cy, w, h, img, opts = {}) {
  const {
    pressed = false,
    phase = 0,
    raySpeed = 0.65,
    rayAlpha = 0.45,
    glowType = 'gold',
    accentColor = '#fde047',
    particleKind = 'star'
  } = opts;

  const t = gameTime + phase;
  const bobY = pressed ? 0 : Math.sin(t * 2.7) * 2.2;
  // Periodic lively attention bounce + continuous breathing scale
  const cycle = (t % 3.4) / 3.4;
  const hopBump = cycle < 0.22 ? Math.sin((cycle / 0.22) * Math.PI) * 0.08 : 0;
  const pulse = pressed ? 0.91 : (1.0 + 0.038 * Math.sin(t * 3.8) + hopBump);
  const tilt = pressed ? 0 : (Math.sin(t * 2.3) * 0.028 + (cycle < 0.22 ? Math.sin((cycle / 0.22) * Math.PI * 2) * 0.035 : 0));

  ctx.save();
  ctx.translate(cx, cy + (pressed ? 2 : bobY));

  // Rotating sunburst rays & pulsing radial halo behind the button
  drawRotatingSunburstRays(0, -2, Math.max(w, h) * 0.80, 8, raySpeed, rayAlpha);
  const gr = Math.max(w, h) * 0.66;
  ctx.save();
  ctx.globalAlpha = 0.72 + 0.28 * Math.sin(t * 4.1);
  const haloImg = (glowType === 'purple') ? getCachedNoAdsGlowSprite() : getCachedChestHaloSprite();
  ctx.drawImage(haloImg, -gr, -2 - gr, gr * 2, gr * 2);
  ctx.restore();

  ctx.save();
  ctx.rotate(tilt);
  ctx.scale(pulse, pulse);

  let dw = w;
  let dh = h;
  if (img && img.naturalWidth > 0 && img.naturalHeight > 0) {
    const aspect = img.naturalWidth / img.naturalHeight;
    dw = w;
    dh = dw / aspect;
    if (dh > h) {
      dh = h;
      dw = dh * aspect;
    }
    ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);

    // Periodic diagonal glossy shine sweep across the button
    if (cycle < 0.30) {
      const p = cycle / 0.30;
      const sx = -dw * 0.6 + p * dw * 1.2;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = Math.sin(p * Math.PI) * 0.24;
      const sheenG = ctx.createLinearGradient(sx - 12, -dh * 0.5, sx + 12, dh * 0.5);
      sheenG.addColorStop(0, 'rgba(255, 255, 255, 0)');
      sheenG.addColorStop(0.5, 'rgba(255, 255, 255, 0.9)');
      sheenG.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = sheenG;
      roundRect(ctx, -dw * 0.44, -dh * 0.44, dw * 0.88, dh * 0.88, 12);
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();

  // Animated orbiting/twinkling particles matching the sprite's theme
  for (let i = 0; i < 3; i++) {
    const pt = (t * 0.85 + i * 0.333) % 1;
    const ang = phase + i * 2.094 + Math.sin(t * 1.4 + i) * 0.25;
    const radX = w * (0.42 + 0.08 * Math.sin(pt * Math.PI));
    const radY = h * (0.40 + 0.08 * Math.cos(pt * Math.PI));
    const px = Math.cos(ang) * radX;
    const py = Math.sin(ang) * radY - pt * 4;
    const tw = Math.sin(pt * Math.PI);
    if (tw > 0.08) {
      if (particleKind === 'diamond' && i === 0) {
        ctx.save();
        ctx.translate(px, py);
        ctx.globalAlpha = tw * 0.9;
        ctx.fillStyle = '#38bdf8';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -3.5);
        ctx.lineTo(3, 0);
        ctx.lineTo(0, 3.5);
        ctx.lineTo(-3, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      } else {
        drawSparkleStar(px, py, (3.2 + (i % 2) * 0.9) * tw, tw * 0.95);
      }
    }
  }

  ctx.restore();
}

function drawRotatingSunburstRays(cx, cy, maxR, rayCount, speed, alpha) {
  const aKey = Math.round(alpha * 100);
  const key = `${rayCount}_${aKey}`;
  let spr = uiRenderCache.sunbursts.get(key);
  if (!spr) {
    const r = 128;
    const sz = r * 2;
    const c = document.createElement('canvas');
    c.width = sz;
    c.height = sz;
    const sCtx = c.getContext('2d');
    sCtx.translate(r, r);
    const step = (Math.PI * 2) / rayCount;
    const halfSlice = step * 0.24;
    const grad = sCtx.createRadialGradient(0, 0, 5, 0, 0, r);
    grad.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
    grad.addColorStop(0.55, `rgba(255, 255, 255, ${alpha * 0.45})`);
    grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    sCtx.fillStyle = grad;
    sCtx.beginPath();
    for (let i = 0; i < rayCount; i++) {
      const a = i * step;
      sCtx.moveTo(0, 0);
      sCtx.arc(0, 0, r, a - halfSlice, a + halfSlice);
      sCtx.closePath();
    }
    sCtx.fill();
    uiRenderCache.sunbursts.set(key, c);
    spr = c;
  }
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(gameTime * speed);
  ctx.drawImage(spr, -maxR, -maxR, maxR * 2, maxR * 2);
  ctx.restore();
}

function drawNoAdsCircleEmblem(cx, cy, radius, whiteCenter = false) {
  ctx.save();
  ctx.translate(cx, cy);

  // Subtle shadow circle (no expensive shadowBlur)
  ctx.fillStyle = whiteCenter ? 'rgba(107, 33, 168, 0.16)' : 'rgba(88, 28, 135, 0.28)';
  ctx.beginPath();
  ctx.arc(0, 2.5, radius + 1.5, 0, Math.PI * 2);
  ctx.fill();

  // White outer bezel rim
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.fill();

  const innerR = radius * 0.80;
  if (whiteCenter) {
    ctx.fillStyle = '#ffffff';
  } else {
    const pGrad = ctx.createRadialGradient(0, -innerR * 0.25, 4, 0, 0, innerR);
    pGrad.addColorStop(0, '#7c3aed');
    pGrad.addColorStop(1, '#4c1d95');
    ctx.fillStyle = pGrad;
  }
  ctx.beginPath();
  ctx.arc(0, 0, innerR, 0, Math.PI * 2);
  ctx.fill();

  // Diagonal prohibition slash (under ADS text)
  const ringR = radius * 0.80;
  const ringW = radius * 0.19;
  ctx.save();
  ctx.strokeStyle = '#dc2626';
  ctx.lineWidth = ringW * 0.86;
  ctx.lineCap = 'butt';
  ctx.beginPath();
  const diag = ringR * 0.72;
  ctx.moveTo(-diag, diag);
  ctx.lineTo(diag, -diag);
  ctx.stroke();

  // Glossy red prohibition outer ring
  const rGrad = ctx.createLinearGradient(0, -ringR, 0, ringR);
  rGrad.addColorStop(0, '#f87171');
  rGrad.addColorStop(0.45, '#ef4444');
  rGrad.addColorStop(1, '#b91c1c');
  ctx.strokeStyle = rGrad;
  ctx.lineWidth = ringW;
  ctx.beginPath();
  ctx.arc(0, 0, ringR, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
  ctx.lineWidth = ringW * 0.32;
  ctx.beginPath();
  ctx.arc(0, 0, ringR + ringW * 0.14, -Math.PI * 0.82, -Math.PI * 0.18);
  ctx.stroke();
  ctx.restore();

  const adsStroke = Math.max(1.8, +(radius * 0.13).toFixed(1));
  if (whiteCenter) {
    drawGlossyText('ADS', 0, 2, radius * 0.68, 'center', '#ef4444', '#1e1b4b', adsStroke);
  } else {
    drawGlossyText('ADS', 0, 2, radius * 0.68, 'center', '#ffffff', '#2e1065', adsStroke);
  }
  ctx.restore();
}

function drawCleanRoundedText(text, x, y, size, align = 'center', color = '#ffffff', strokeColor = '#07317a', strokeWidth = 2.8) {
  ctx.save();
  ctx.font = `800 ${size}px system-ui, "Segoe UI", Roboto, Arial, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;
  if (strokeWidth > 0) {
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeWidth;
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawCrashActionPill(x, y, w, h, variant, isPressed) {
  const py = isPressed ? y + 3 : y;
  const lipH = isPressed ? 2 : 4;
  const radius = 14;
  const isGold = (variant === 'gold');
  const lipCol = isGold ? '#b45309' : '#15803d';
  const borderCol = isGold ? '#854d0e' : '#166534';
  const rimCol = isGold ? '#fef08a' : '#d9f99d';

  ctx.save();
  ctx.fillStyle = lipCol;
  roundRect(ctx, x, py + lipH, w, h, radius);
  ctx.fill();

  const grad = ctx.createLinearGradient(0, py, 0, py + h);
  if (isGold) {
    grad.addColorStop(0, '#ffe44d');
    grad.addColorStop(0.5, '#ffca14');
    grad.addColorStop(1, '#f59e0b');
  } else {
    grad.addColorStop(0, '#72ea38');
    grad.addColorStop(0.5, '#35c724');
    grad.addColorStop(1, '#159f22');
  }
  ctx.fillStyle = grad;
  roundRect(ctx, x, py, w, h, radius);
  ctx.fill();

  ctx.save();
  roundRect(ctx, x, py, w, h, radius);
  ctx.clip();
  const shine = ctx.createLinearGradient(0, py, 0, py + h * 0.5);
  shine.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
  shine.addColorStop(1, 'rgba(255, 255, 255, 0.04)');
  ctx.fillStyle = shine;
  ctx.beginPath();
  ctx.ellipse(x + w / 2, py + 2, w * 0.58, h * 0.44, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Warm golden-cream / lime-gold inner highlight rim (matches second reference image)
  ctx.strokeStyle = rimCol;
  ctx.lineWidth = 1.8;
  roundRect(ctx, x + 1.5, py + 1.5, w - 3, h - 3, radius - 1.5);
  ctx.stroke();

  ctx.strokeStyle = borderCol;
  ctx.lineWidth = 1.8;
  roundRect(ctx, x, py, w, h + (isPressed ? 1 : 2), radius);
  ctx.stroke();
  ctx.restore();
}

function drawMiniGamePreview(px, py, pw, ph, t) {
  ctx.save();
  roundRect(ctx, px, py, pw, ph, 10);
  ctx.clip();

  // 1. Warm glowing amber canyon mist atmosphere
  const skyGrad = ctx.createRadialGradient(px + pw * 0.56, py + ph * 0.5, 10, px + pw * 0.5, py + ph * 0.5, pw * 0.72);
  skyGrad.addColorStop(0, '#e39a5c');
  skyGrad.addColorStop(0.55, '#b96d3c');
  skyGrad.addColorStop(1, '#714023');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(px, py, pw, ph);

  // Subtle glowing diagonal sunbeams sweeping through canyon sky
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.fillStyle = '#fde68a';
  const rayShift = (t * 26) % 90;
  for (let i = -1; i < 4; i++) {
    const rx = px + i * 90 - rayShift;
    ctx.beginPath();
    ctx.moveTo(rx, py);
    ctx.lineTo(rx + 28, py);
    ctx.lineTo(rx - 18, py + ph);
    ctx.lineTo(rx - 46, py + ph);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // Drifting warm canyon clouds scrolling right-to-left
  const cloudScroll = t * 44;
  for (let i = 0; i < 8; i++) {
    const span = pw + 90;
    const cxCloud = px + pw + 30 - (((cloudScroll + i * 52) % span));
    const cyCloud = py + ph * (0.34 + (i % 3) * 0.16) + Math.sin(i * 1.9 + t * 0.6) * 4;
    const cr = 22 + (i % 3) * 9;
    const cg = ctx.createRadialGradient(cxCloud, cyCloud, 2, cxCloud, cyCloud, cr);
    cg.addColorStop(0, i % 2 === 0 ? 'rgba(255, 224, 178, 0.34)' : 'rgba(245, 178, 120, 0.28)');
    cg.addColorStop(1, 'rgba(180, 100, 50, 0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(cxCloud, cyCloud, cr, 0, Math.PI * 2);
    ctx.fill();
  }

  // Distant silhouettes along canyon floor
  ctx.fillStyle = 'rgba(42, 24, 14, 0.22)';
  const hillOff = (t * 24) % 80;
  ctx.beginPath();
  ctx.moveTo(px, py + ph);
  for (let x = -80; x <= pw + 80; x += 40) {
    const hx = px + x - hillOff;
    const hy = py + ph * 0.72 + Math.sin(x * 0.08 + curLevel) * 10;
    ctx.lineTo(hx, hy);
  }
  ctx.lineTo(px + pw, py + ph);
  ctx.closePath();
  ctx.fill();

  // 2. Smooth curving dark-brown canyon walls + bold alternating Orange & White spikes
  const scrollPx = t * 136;
  const spikeStep = 17;
  const firstIdx = Math.floor(scrollPx / spikeStep) - 1;
  const count = Math.ceil(pw / spikeStep) + 3;

  const getTunnelY = (worldX) => {
    const arch = Math.sin((worldX - scrollPx) / pw * Math.PI) * 7;
    const wave = Math.sin(worldX * 0.012 + curLevel) * 5;
    return {
      topY: py + 14 + wave + arch * 0.4,
      botY: py + ph - 20 + wave * 0.6 - arch * 0.4
    };
  };

  ctx.fillStyle = '#574636';
  ctx.beginPath();
  ctx.moveTo(px, py);
  for (let i = 0; i <= count; i++) {
    const wx = (firstIdx + i) * spikeStep;
    const sx = px + (wx - scrollPx);
    const { topY } = getTunnelY(wx);
    ctx.lineTo(sx, topY);
  }
  ctx.lineTo(px + pw + 20, py);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(px, py + ph);
  for (let i = 0; i <= count; i++) {
    const wx = (firstIdx + i) * spikeStep;
    const sx = px + (wx - scrollPx);
    const { botY } = getTunnelY(wx);
    ctx.lineTo(sx, botY);
  }
  ctx.lineTo(px + pw + 20, py + ph);
  ctx.closePath();
  ctx.fill();

  for (let i = 0; i < count; i++) {
    const idx = firstIdx + i;
    const wx = idx * spikeStep;
    const sx = px + (wx - scrollPx);
    const { topY, botY } = getTunnelY(wx);
    const spH = (Math.abs(idx) % 3 === 0) ? 16 : 12.5;

    ctx.fillStyle = (Math.abs(idx) % 2 === 0) ? '#f97316' : '#ffffff';
    ctx.strokeStyle = '#3b281c';
    ctx.lineWidth = 1.0;

    ctx.beginPath();
    ctx.moveTo(sx, topY);
    ctx.lineTo(sx + spikeStep * 0.5, topY + spH);
    ctx.lineTo(sx + spikeStep, topY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(sx, botY);
    ctx.lineTo(sx + spikeStep * 0.5, botY - spH);
    ctx.lineTo(sx + spikeStep, botY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  ctx.strokeStyle = '#ea580c';
  ctx.lineWidth = 2.0;
  ctx.beginPath();
  for (let i = 0; i <= count; i++) {
    const wx = (firstIdx + i) * spikeStep;
    const sx = px + (wx - scrollPx);
    const { topY } = getTunnelY(wx);
    if (i === 0) ctx.moveTo(sx, topY); else ctx.lineTo(sx, topY);
  }
  ctx.stroke();

  ctx.beginPath();
  for (let i = 0; i <= count; i++) {
    const wx = (firstIdx + i) * spikeStep;
    const sx = px + (wx - scrollPx);
    const { botY } = getTunnelY(wx);
    if (i === 0) ctx.moveTo(sx, botY); else ctx.lineTo(sx, botY);
  }
  ctx.stroke();

  // 3. Flying/Driving Car Position & Smooth Motion inside Canyon
  const carScreenX = px + pw * 0.34;
  const carWorldX = scrollPx + (carScreenX - px);
  const tunnelAtCar = getTunnelY(carWorldX);
  const midY = (tunnelAtCar.topY + tunnelAtCar.botY) * 0.5;
  const bobOffset = Math.sin(t * 3.8) * 6.5;
  const carVelY = Math.cos(t * 3.8) * 6.5 * 3.8;
  const carY = midY + bobOffset;
  const carTilt = Math.max(-0.15, Math.min(0.15, carVelY * 0.0045));

  // 4. Clean Glowing Star Coins gliding along tunnel
  const coinSpacing = 128;
  const firstCoinIdx = Math.floor(scrollPx / coinSpacing);
  const animFrame = Math.floor((t * 10) % 8);
  for (let ci = firstCoinIdx; ci <= firstCoinIdx + 3; ci++) {
    const cwx = ci * coinSpacing + 86;
    const csx = px + (cwx - scrollPx);
    if (csx < carScreenX + 18 || csx > px + pw + 16) continue;
    const tBounds = getTunnelY(cwx);
    const cyCoin = (tBounds.topY + tBounds.botY) * 0.52 + Math.sin(ci * 1.4) * 5;
    const cGlow = ctx.createRadialGradient(csx, cyCoin, 2, csx, cyCoin, 15);
    cGlow.addColorStop(0, 'rgba(254, 240, 138, 0.55)');
    cGlow.addColorStop(1, 'rgba(250, 204, 21, 0)');
    ctx.fillStyle = cGlow;
    ctx.beginPath();
    ctx.arc(csx, cyCoin, 15, 0, Math.PI * 2);
    ctx.fill();

    const spr = getCoinSprite('gold', animFrame);
    if (spr) {
      ctx.drawImage(spr, csx - 9, cyCoin - 9, 18, 18);
    } else {
      drawStarCoinEmblem(csx, cyCoin, 8.5);
    }
  }

  // 5. Sleek Animated White Sports Car Driving/Flying Smoothly (with spinning wheels & subtle thruster)
  const miniCarW = 82;
  const miniCarH = 23;
  ctx.save();
  ctx.translate(carScreenX, carY);
  ctx.rotate(carTilt);

  ctx.globalCompositeOperation = 'lighter';
  const rearFlW = 11 + Math.sin(t * 46) * 4;
  const rearFg = ctx.createLinearGradient(-miniCarW * 0.47, 0, -miniCarW * 0.47 - rearFlW, 0);
  rearFg.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
  rearFg.addColorStop(0.5, 'rgba(253, 224, 71, 0.45)');
  rearFg.addColorStop(1, 'rgba(249, 115, 22, 0)');
  ctx.fillStyle = rearFg;
  ctx.beginPath();
  ctx.moveTo(-miniCarW * 0.46, -2.5);
  ctx.lineTo(-miniCarW * 0.47 - rearFlW, 0);
  ctx.lineTo(-miniCarW * 0.46, 2.5);
  ctx.closePath();
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  if (trimmedCarCanvas) {
    ctx.drawImage(trimmedCarCanvas, -miniCarW / 2, -miniCarH / 2, miniCarW, miniCarH);
  } else {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1.6;
    roundRect(ctx, -miniCarW / 2, -miniCarH / 2, miniCarW, miniCarH, 6);
    ctx.fill();
    ctx.stroke();
  }

  const rwX = -miniCarW / 2 + miniCarW * WHEEL_REAR_X;
  const fwX = -miniCarW / 2 + miniCarW * WHEEL_FRONT_X;
  const wY = -miniCarH / 2 + miniCarH * WHEEL_Y;
  const wR = miniCarW * WHEEL_RADIUS;
  const wheelSpinAngle = t * 18;
  for (const wxPos of [rwX, fwX]) {
    ctx.save();
    ctx.translate(wxPos, wY);
    ctx.rotate(wheelSpinAngle);
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(0, 0, wR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e2e8f0';
    ctx.beginPath();
    ctx.arc(0, 0, wR * 0.56, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1.0;
    for (let s = 0; s < 3; s++) {
      const a = s * (Math.PI / 3);
      ctx.beginPath();
      ctx.moveTo(-Math.cos(a) * wR * 0.5, -Math.sin(a) * wR * 0.5);
      ctx.lineTo(Math.cos(a) * wR * 0.5, Math.sin(a) * wR * 0.5);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();

  // 6. Miniature HUD overlays inside preview (gold progress pill top-left + royal blue || pause icon top-right)
  const progFrac = Math.min(1, ((t * 0.14) % 1));
  ctx.fillStyle = 'rgba(38, 28, 20, 0.78)';
  roundRect(ctx, px + 8, py + 6, 70, 9, 4.5);
  ctx.fill();
  ctx.fillStyle = '#facc15';
  roundRect(ctx, px + 9.5, py + 7.5, Math.max(10, 67 * progFrac), 6, 3);
  ctx.fill();

  const pbx = px + pw - 23, pby = py + 4, pbs = 18;
  const pbGrad = ctx.createLinearGradient(0, pby, 0, pby + pbs);
  pbGrad.addColorStop(0, '#60ccff');
  pbGrad.addColorStop(1, '#1d4ed8');
  ctx.fillStyle = pbGrad;
  roundRect(ctx, pbx, pby, pbs, pbs, 4.5);
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.1;
  roundRect(ctx, pbx + 1, pby + 1, pbs - 2, pbs - 2, 3.8);
  ctx.stroke();
  ctx.strokeStyle = '#052873';
  ctx.lineWidth = 1.2;
  roundRect(ctx, pbx, pby, pbs, pbs, 4.5);
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(pbx + 5.5, pby + 4.5, 2.5, 9);
  ctx.fillRect(pbx + 10, pby + 4.5, 2.5, 9);

  ctx.restore();

  ctx.save();
  ctx.strokeStyle = '#3e2d20';
  ctx.lineWidth = 2.0;
  roundRect(ctx, px, py, pw, ph, 10);
  ctx.stroke();
  ctx.restore();
}

function drawFullWidthCrashRibbon(cx, cy, w, h, text) {
  ctx.save();
  const halfW = w / 2;
  const tailW = 20;
  const arch = 7;

  // Folded blue tails flaring smoothly outside the card edges
  for (const side of [-1, 1]) {
    ctx.fillStyle = '#0d5dd8';
    ctx.strokeStyle = '#0740a6';
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx + side * (halfW - 4), cy + 12);
    ctx.lineTo(cx + side * (halfW + tailW), cy + 16);
    ctx.lineTo(cx + side * (halfW + tailW - 6), cy + h * 0.62);
    ctx.lineTo(cx + side * (halfW + tailW - 1), cy + h + 6);
    ctx.lineTo(cx + side * (halfW - 8), cy + h + 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#06368a';
    ctx.beginPath();
    ctx.moveTo(cx + side * (halfW - 10), cy + h - 3);
    ctx.lineTo(cx + side * (halfW + 3), cy + h + 4);
    ctx.lineTo(cx + side * (halfW - 14), cy + h + 5);
    ctx.closePath();
    ctx.fill();
  }

  const traceRibbon = (ox, oy) => {
    ctx.beginPath();
    ctx.moveTo(cx - halfW + 8 + ox, cy + 4 + oy);
    ctx.quadraticCurveTo(cx + ox, cy - arch + oy, cx + halfW - 8 + ox, cy + 4 + oy);
    ctx.quadraticCurveTo(cx + halfW + 2 + ox, cy + 6 + oy, cx + halfW + ox, cy + h - 2 + oy);
    ctx.quadraticCurveTo(cx + ox, cy + h - arch * 0.8 + oy, cx - halfW + ox, cy + h - 2 + oy);
    ctx.quadraticCurveTo(cx - halfW - 2 + ox, cy + 6 + oy, cx - halfW + 8 + ox, cy + 4 + oy);
    ctx.closePath();
  };

  ctx.fillStyle = 'rgba(4, 24, 72, 0.28)';
  traceRibbon(0, 4);
  ctx.fill();

  const rGrad = ctx.createLinearGradient(0, cy - arch, 0, cy + h);
  rGrad.addColorStop(0, '#53bfff');
  rGrad.addColorStop(0.45, '#1982fa');
  rGrad.addColorStop(1, '#0b5ed9');
  ctx.fillStyle = rGrad;
  traceRibbon(0, 0);
  ctx.fill();

  ctx.save();
  traceRibbon(0, 0);
  ctx.clip();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.24)';
  ctx.beginPath();
  ctx.moveTo(cx - halfW, cy + 4);
  ctx.quadraticCurveTo(cx, cy - arch, cx + halfW, cy + 4);
  ctx.lineTo(cx + halfW, cy + h * 0.42);
  ctx.quadraticCurveTo(cx, cy + h * 0.26, cx - halfW, cy + h * 0.42);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = 'rgba(186, 230, 253, 0.8)';
  ctx.lineWidth = 1.4;
  traceRibbon(0, 1);
  ctx.stroke();

  ctx.strokeStyle = '#0740a6';
  ctx.lineWidth = 1.6;
  traceRibbon(0, 0);
  ctx.stroke();

  drawGoldStar(cx - halfW + 46, cy + h / 2 + 1, 11.2);
  drawGoldStar(cx + halfW - 46, cy + h / 2 + 1, 11.2);
  drawSparkleStar(cx - halfW + 64, cy + h - 9, 4.8, 0.95);
  drawSparkleStar(cx + halfW - 64, cy + h - 9, 4.8, 0.95);

  drawCleanRoundedText(text, cx, cy + h / 2 + 1, 27, 'center', '#ffffff', '#063485', 2.8);
  ctx.restore();
}

  ctx.strokeStyle = '#025812';
  ctx.lineWidth = 1.2;
  roundRect(ctx, W / 2 - lineW / 2, ry + 11, lineW, lineH, 1.4);
  ctx.stroke();
  ctx.fill();

  ctx.restore();
}

function drawHomeScreenUi(menuAlpha = 1.0) {

  // Top Right: Red 5th Wallet Coin Pill positioned slightly higher up on Home Screen

  // Left-side Main Menu Buttons (No Ads image badge & one-time Starter Pack)

  }

  if (leftMenu.starterBtn) {

    drawStarterPackBadgeIcon(sBtn.x + sBtn.w / 2, sBtn.y + sBtn.h / 2, sBtn.w, sBtn.h, isStarterMenuPressed);
  }

  if (leftMenu.bgBtn) {

    drawBgSelectorBadgeIcon(bBtn.x + bBtn.w / 2, bBtn.y + bBtn.h / 2, bBtn.w, bBtn.h, isBgPressed);
  }

  // Animated Title Logo (16-frame 4x4 sprite sheet)
  const logoCenterY = 114 + topInset * 0.65;
  if (logoSheetLoadedImg && logoSheetLoadedImg.naturalWidth > 0) {
    const seqLen = 30; // smooth ping-pong 0..15..1
    const step = Math.floor(gameTime * 11) % seqLen;
    const frameIdx = step < 16 ? step : (30 - step);
    const col = frameIdx % 4;
    const row = Math.floor(frameIdx / 4);

    const cellW = logoSheetLoadedImg.naturalWidth / 4;
    const cellH = logoSheetLoadedImg.naturalHeight / 4;
    const padX = cellW * (8 / 400);
    const padY = cellH * (8 / 272);
    const srcX = col * cellW + padX;
    const srcY = row * cellH + padY;
    const srcW = cellW - padX * 2;
    const srcH = cellH - padY * 2;

    const logoW = Math.min(226, W * 0.63);
    const logoH = logoW * (srcH / srcW);
    const bobY = Math.sin(gameTime * 2.2) * 2.6;
    const pulse = 1 + 0.015 * Math.sin(gameTime * 3.0);

    // Subtle atmospheric aura glow synced to fire (frames 1-8) vs electric blue (frames 9-15)
    ctx.save();
    ctx.translate(W / 2, logoCenterY + bobY);
    const isElectric = frameIdx >= 9;
    const glowAlpha = frameIdx === 0 ? 0.14 : (isElectric ? 0.30 : 0.28);
    const glowGrad = ctx.createRadialGradient(0, 4, logoW * 0.10, 0, 4, logoW * 0.54);
    glowGrad.addColorStop(0, isElectric ? `rgba(56, 189, 248, ${glowAlpha})` : `rgba(251, 146, 60, ${glowAlpha})`);
    glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(0, 4, logoW * 0.54, 0, Math.PI * 2);
    ctx.fill();

    ctx.scale(pulse, pulse);
    ctx.drawImage(logoSheetLoadedImg, srcX, srcY, srcW, srcH, -logoW / 2, -logoH / 2, logoW, logoH);
    ctx.restore();
  } else {
    drawGlossyText('THORN RUSH', W / 2, 120 + topInset * 0.6, 46, 'center', '#ffffff', '#0f172a', 8);
  }

  // "Take with you" pre-level booster row (shown only if player owns boosters)
  const takeLayout = getTakeWithYouSlots();

    ctx.save();
    ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
    roundRect(ctx, takeLayout.barX, takeLayout.barY, takeLayout.barW, takeLayout.barH, 16);
    ctx.fill();
    ctx.strokeStyle = '#c084fc';
    ctx.lineWidth = 1.8;

    drawGlossyText('Take with you', W / 2, takeLayout.barY + 9, 10, 'center', '#f5d0fe', '#0f172a', 2.2);

    for (let i = 0; i < takeLayout.slots.length; i++) {
      const s = takeLayout.slots[i];
      const item = getShopItemById(s.id);
      if (!item) continue;
      const isSelected = Boolean(selectedLoadout[s.id]);
      const isSlotPressed = (activePress === 'toggle_take_' + s.id);
      const sTheme = isSelected ? BUTTON_THEMES[item.themeKey] : BUTTON_THEMES.gray;
      drawGlossyButton(s.x, s.y, s.w, s.h, sTheme, null, item.icon, isSlotPressed, 12);

      // Count badge at bottom-right
      drawGlossyText(`x${inventory[s.id] || 0}`, s.x + s.w - 3, s.y + s.h - 5, 9.5, 'right', '#fde047', '#0f172a', 2.2);

      // Checkmark dot at top-right if selected

        ctx.lineWidth = 1.6;

    const p = Math.max(0, Math.min(1, menuExitTimer / MENU_EXIT_DURATION));
    const easeIn = p * p * (0.35 + 0.65 * p);
    bottomSlideY = easeIn * (150 + botInset);

  if (bottomSlideY !== 0) {
    ctx.translate(0, bottomSlideY);
