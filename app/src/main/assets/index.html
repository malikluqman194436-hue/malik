window.__onRewardedAdResult = function(placement, rewardEarned, status) {
  adShowing = false;
  pendingRewardedPlacement = null;
  resumeGameAudio();
  if (status === 'loading' || status === 'failed') {
    showToast('Ad loading, try again!');
    try {
      if (window.AndroidAdsBridge && typeof window.AndroidAdsBridge.preloadAds === 'function') {
        window.AndroidAdsBridge.preloadAds();
      }
    } catch (e) {}
    return;
  }
  if (!rewardEarned) {
    showToast('Watch full ad for reward');
    return;
  }
  if (placement === 'revive') {
    if (st === 'dead' && !levelReviveUsed) {
      reviveAfterCrash();
    }
  } else if (placement === 'double_level_coins') {
    if (st === 'level_complete' && !levelRewardDoubled && levelCoinsCollected > 0) {
      levelRewardDoubled = true;
      const bonus = levelCoinsCollected;
      wallet += bonus;
      saveWallet();
      levelCoinsCollected += bonus;
      coinCounterBump = 1.45;
      spawnRewardFlyingCoins(W / 2, H / 2, 12);
      playPerfectBonusSound();
      triggerVibrate([30, 40, 60]);
      showToast(`+${bonus} Bonus Coins (2X)!`);
    }
  } else if (placement === 'shop_free_coins') {
    const reward = 250;
    wallet += reward;
    saveWallet();
    shopDisplayedWallet = wallet;
    coinCounterBump = 1.45;
    if (shopCardAnim.rewarded_coins) shopCardAnim.rewarded_coins.pop = 0.35;
    spawnRewardFlyingCoins(W / 2, H / 2, 10);
    spawnShopSparkles(W / 2, H / 2, ['#fde047', '#4ade80', '#ffffff']);
    playPerfectBonusSound();
    triggerVibrate([30, 40, 60]);
    showToast('+250 Free Coins!');
  } else if (placement && placement.startsWith('unlock_bg_')) {
    const bgId = placement.slice('unlock_bg_'.length);
    const bgObj = CUSTOM_BACKGROUNDS.find(b => b.id === bgId);
    if (bgObj && !unlockedBgs[bgId]) {
      bgAdProgress[bgId] = Math.min(BG_REQUIRED_ADS, (bgAdProgress[bgId] || 0) + 1);
      if (bgAdProgress[bgId] >= BG_REQUIRED_ADS) {
        unlockedBgs[bgId] = true;
        activeBgId = bgId;
        bgConfirmId = null;
        spawnShopSparkles(W / 2, H / 2, ['#fde047', bgObj.accent, '#4ade80', '#ffffff']);
        playPerfectBonusSound();
        triggerVibrate([30, 40, 60]);
        showToast(`${bgObj.name} Unlocked!`);
      } else {
        playClickSound();
        triggerVibrate(25);
        showToast(`Unlocked ${bgAdProgress[bgId]}/${BG_REQUIRED_ADS}!`);
      }
      saveBgStore();
    }
  }
};

function getMainMenuLeftButtonsLayout() {
  const centerX = 44;
  const noAdsW = 64, noAdsH = 58;
  const starterW = 68, starterH = 54;
  const bgW = 68, bgH = 48;
  const gap = 10;
  const safeMinY = 14 + (topInset || 0);
  const totalStackH =
    (noAdsPurchased ? 0 : (noAdsH + gap)) +
    (starterPackClaimed ? 0 : (starterH + gap)) +
    bgH;
  const maxAllowedY = Math.max(safeMinY, ROAD_TOP - Math.max(76, totalStackH + 14));
  const topY = Math.max(safeMinY, Math.min(maxAllowedY, 194 + (topInset || 0) * 0.5));
  let curY = topY;
  const noAdsBtn = noAdsPurchased ? null : { x: Math.round(centerX - noAdsW / 2), y: curY, w: noAdsW, h: noAdsH };
  if (noAdsBtn) curY += noAdsH + gap;
  const starterBtn = starterPackClaimed ? null : { x: Math.round(centerX - starterW / 2), y: curY, w: starterW, h: starterH };
  if (starterBtn) curY += starterH + gap;
  const bgBtn = { x: Math.round(centerX - bgW / 2), y: curY, w: bgW, h: bgH };
  return { noAdsBtn, starterBtn, bgBtn };
}

      startY: startY + rnd(-10, 10),

      t: -k * 0.04,
      dur: 0.56,
      type: 'gold'

function spawnShopSparkles(cx, cy, colorList) {
  const colors = colorList || ['#fde047', '#ffffff', '#38bdf8', '#f0abfc', '#4ade80'];
  for (let i = 0; i < 16; i++) {
    const ang = (i / 16) * Math.PI * 2 + Math.random() * 0.4;
    const spd = 65 + Math.random() * 115;
    shopSparkles.push({
      x: cx + (Math.random() - 0.5) * 28,
      y: cy + (Math.random() - 0.5) * 14,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 45,
      life: 0.55 + Math.random() * 0.2,
      maxLife: 0.75,
      size: 3 + Math.random() * 3.5,
      color: colors[i % colors.length]
    });
  }
}

function claimDailyReward(sparkleX, sparkleY) {
  if (!isDailyRewardReady()) {
    const remMs = getDailyRewardRemainingMs();
    const hrs = Math.floor(remMs / 3600000);
    const mins = Math.max(1, Math.ceil((remMs % 3600000) / 60000));
    if (shopCardAnim.daily) shopCardAnim.daily.shake = 0.4;
    showToast(hrs > 0 ? `Next reward in ${hrs}h ${mins}m` : `Next reward in ${mins}m`);
    return false;
  }

  const info = getCurrentDailyRewardInfo();
  const baseStreak = getEffectiveDailyStreak();
  dailyStreak = Math.min(7, baseStreak + 1);
  dailyLastClaimDate = getLocalDateKey();
  lastDailyClaimAt = Date.now();
  saveDailyReward();

  wallet += info.coins;
  saveWallet();

  if (info.bonusBoost > 0) {
    inventory.boost = (inventory.boost || 0) + info.bonusBoost;
    saveInventory();
    selectedLoadout.boost = true;
    saveLoadout();
  }

  coinCounterBump = 1.35;
  shopNoCoinsTimer = 0;
  if (shopCardAnim.daily) shopCardAnim.daily.pop = 0.35;
  const sx = sparkleX || W / 2;
  const sy = sparkleY || H / 2;
  spawnShopSparkles(sx, sy, ['#fde047', '#fef08a', '#4ade80', '#ffffff']);
  spawnRewardFlyingCoins(sx, sy, info.dayNum >= 6 ? 16 : 11);

  showToast(info.bonusBoost > 0 ? `+${info.coins} Coins & +1 Boost!` : `Day ${info.dayNum}: +${info.coins} Coins!`);
  return true;
}

function handleBackOrEscape() {
  if (st === 'loading') return false;
  if (noAdsPopupOpen) {
    if (noAdsConfirmOpen) {
      noAdsConfirmOpen = false;
    } else {
      closeNoAdsPopup();
    }
    playClickSound();
    return true;
  }
  if (dailyPopupOpen) {
    closeDailyPopup();
    playClickSound();
    return true;
  }
  if (starterPopupOpen) {
    if (starterConfirmOpen) {
      starterConfirmOpen = false;
    } else {
      closeStarterPopup();
    }
    playClickSound();
    return true;
  }
  if (bgPopupOpen) {
    if (bgConfirmId) {
      bgConfirmId = null;
    } else {
      closeBgPopup();
    }
    playClickSound();
    return true;
  }
  if (shopOpen) {
    if (coinPackConfirmItem) {
      coinPackConfirmItem = null;
    } else {
      closeShop();
    }
    playClickSound();
    return true;
  }
  if (settingsOpen) {
    if (settingsConfirmAction) {
      settingsConfirmAction = null;
    } else if (resetConfirming) {
      resetConfirming = false;
    } else if (controlsSubOpen) {
      controlsSubOpen = false;
    } else if (legalSubOpen) {
      legalSubOpen = null;
    } else if (supportSubOpen) {
      supportSubOpen = false;
    } else {
      settingsOpen = false;
      sliderDragActive = null;
      hoverKey = null;
    }
    playClickSound();
    syncAndroidBackState();
    return true;
  }
  if (paused) {
    if (settingsConfirmAction) {
      settingsConfirmAction = null;
    } else if (homeConfirmOpen) {
      homeConfirmOpen = false;
    } else if (resetConfirming) {
      resetConfirming = false;
    } else if (controlsSubOpen) {
      controlsSubOpen = false;
    } else if (legalSubOpen) {
      legalSubOpen = null;
    } else if (supportSubOpen) {
      supportSubOpen = false;
    } else {
      resumeFromPause();
    }
    playClickSound();
    syncAndroidBackState();
    return true;
  }
  if (st === 'dead') {
    holdToViewCrash = false;
    startLevel(curLevel);
    st = 'ready';
    hold = false;
    playClickSound();
    syncAndroidBackState();
    syncHomeMusicState();
    return true;
  }
  if (isPauseButtonVisible()) {
    pauseGame();
    return true;
  }
  return false;
}

function getShopLayout() {

  const gridCardH = 132;

      cards.push({ type: 'coin_pack', pack: COIN_PACKS[i], x: gx, y: gy, w: gridCardW, h: gridCardH, priceBtn });
    }
    const coinRows = Math.ceil(COIN_PACKS.length / 3);
    cursorY += coinRows * gridCardH + Math.max(0, coinRows - 1) * gridGap + cardGap + 4;

    // 2. Rewarded Ad Free Coins
    {
      const h = 92;
      const cy = Math.round(cursorY - shopScrollY);
      const priceBtn = { x: cardX + cardW - 108, y: Math.round(cy + (h - 40) / 2), w: 96, h: 40 };
      cards.push({ type: 'rewarded_coins', id: 'rewarded_coins', x: cardX, y: cy, w: cardW, h, priceBtn });
      cursorY += h + cardGap;
    }

    // 3. No Ads + No Ads Pack
    if (!noAdsPurchased) {
      const noAdsB = getShopBundleById('bundle_no_ads');
      if (noAdsB) {
        const h = 96;
        const cy = Math.round(cursorY - shopScrollY);

        cards.push({ type: 'bundle', bundle: noAdsB, x: cardX, y: cy, w: cardW, h, priceBtn });
        cursorY += h + cardGap;
      }
      const noAdsPackB = getShopBundleById('bundle_no_ads_pack');
      if (noAdsPackB) {
        const h = 136;
        const cy = Math.round(cursorY - shopScrollY);
        const priceBtn = { x: cardX + cardW - 118, y: cy + 71, w: 106, h: 38 };
        cards.push({ type: 'bundle', bundle: noAdsPackB, x: cardX, y: cy, w: cardW, h, priceBtn });
        cursorY += h + cardGap;
      }
    }
  } else {
    // Main Shop matching reference video:
    // 1. Starter Pack, No Ads, No Ads Pack, Small Pack, Special Pack, Large Pack
    for (let i = 0; i < SHOP_BUNDLES.length; i++) {
      const b = SHOP_BUNDLES[i];
      const h = (b.kind === 'no_ads_simple') ? 96 : (b.kind === 'no_ads_bundle' ? 136 : 130);
      const cy = Math.round(cursorY - shopScrollY);

        priceBtn = { x: cardX + cardW - 118, y: cy + 71, w: 106, h: 38 };

      }
      cards.push({ type: 'bundle', bundle: b, x: cardX, y: cy, w: cardW, h, priceBtn });
      cursorY += h + cardGap;
    }

    // 2. 3x2 Coin Pack Grid (1000, 5000, 10000 / 25000, 50000, 100000)
    cursorY += 2;
    for (let i = 0; i < COIN_PACKS.length; i++) {
      const col = i % 3;
      const row = Math.floor(i / 3);
      const gx = cardX + col * (gridCardW + gridGap);
      const gy = Math.round(cursorY + row * (gridCardH + gridGap) - shopScrollY);
      const priceBtn = { x: gx + 5, y: gy + gridCardH - 36, w: gridCardW - 10, h: 28 };

    }
    const coinRows = Math.ceil(COIN_PACKS.length / 3);
    cursorY += coinRows * gridCardH + Math.max(0, coinRows - 1) * gridGap + cardGap + 2;

    // 3. Individual Booster Coin-Buy Cards (Boost, Magnet, Shield, Slow-mo)
    for (let i = 0; i < SHOP_ITEMS.length; i++) {
      const h = 88;

      cursorY += h + 9;

    {

  if (shopScrollY < 0) shopScrollY = 0;

  const shortcutBanner = {

    h: 52,

  const confW = 290, confH = 214;

  const confY = Math.round(H / 2 - confH / 2);
  const confirmBox = {
    x: confX, y: confY, w: confW, h: confH,

    noBtn: { x: confX + confW - 138, y: confY + confH - 60, w: 118, h: 44 }
  };

  return { safeTop, safeBot, awningH, closeBtn, coinPill, listTop, listBottom, listH, cards, shortcutBanner, confirmBox };
}

function draw3DCoinStack(cx, baseY, rx, count) {
  const ry = rx * 0.42;
  const stepH = Math.max(2.6, rx * 0.28);
  for (let i = 0; i < count; i++) {
    const cy = baseY - i * stepH;
    ctx.fillStyle = (i % 2 === 0) ? '#b45309' : '#d97706';
    ctx.beginPath();
    ctx.ellipse(cx, cy + stepH * 0.55, rx, ry, 0, 0, Math.PI);
    ctx.fill();
    ctx.strokeStyle = '#92400e';
    ctx.lineWidth = 0.9;
    ctx.stroke();

    const topG = ctx.createRadialGradient(cx - rx * 0.25, cy - ry * 0.30, rx * 0.1, cx, cy, rx);
    topG.addColorStop(0, '#fef9c3');
    topG.addColorStop(0.35, '#fde047');
    topG.addColorStop(0.82, '#facc15');
    topG.addColorStop(1, '#eab308');
    ctx.fillStyle = topG;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#b45309';
    ctx.lineWidth = 1.0;
    ctx.stroke();

    // Inner recessed ring & embossed 5-point golden star on top coin of stack (matching Home Screen Star Coin)
    if (i === count - 1 && rx >= 5.5) {
      ctx.strokeStyle = '#b45309';
      ctx.lineWidth = Math.max(0.75, rx * 0.08);
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx * 0.74, ry * 0.74, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(1, ry / rx);
      const starOuter = rx * 0.48;
      const starInner = rx * 0.24;
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const ang = (k * Math.PI) / 5 - Math.PI / 2;
        const rad = (k % 2 === 0) ? starOuter : starInner;
        const px = Math.cos(ang) * rad;
        const py = Math.sin(ang) * rad;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#b45309';
      ctx.lineWidth = Math.max(1.2, rx * 0.15);
      ctx.stroke();
      ctx.fillStyle = '#fef08a';
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawSparkleStar(cx, cy, r, alpha = 1.0) {
  if (r <= 0.4 || alpha <= 0.02) return;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.quadraticCurveTo(0, 0, 0, r);
  ctx.quadraticCurveTo(0, 0, -r, 0);
  ctx.quadraticCurveTo(0, 0, 0, -r);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawCardShineSweep(x, y, w, h, radius, phaseOffset = 0) {
  const cycle = (gameTime * 0.48 + phaseOffset) % 2.4;
  if (cycle > 0.85) return;
  const p = cycle / 0.85;
  const sweepX = x - w * 0.45 + p * (w * 1.9);
  const insetX = Math.min(w * 0.15, (radius || 16) * 0.38);
  ctx.save();
  ctx.beginPath();
  ctx.rect(x + insetX, y + 2, w - insetX * 2, h - 4);
  ctx.clip();
  ctx.translate(sweepX, y + h * 0.5);
  ctx.rotate(0.45);
  ctx.drawImage(getShineSweepSprite(), -28, -h * 1.4, 56, h * 2.8);
  ctx.restore();
}

function drawTreasureChestDynamicGlow(cx, cy, sz = 1.0) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(sz, sz);

  // Rotating rays + cached glowing halo behind open chest
  drawRotatingSunburstRays(0, -10, 62, 10, 0.55, 0.72);
  drawRotatingSunburstRays(0, -10, 44, 8, -0.82, 0.55);

  const pulse = 0.88 + 0.12 * Math.sin(gameTime * 4.5);
  const haloR = 50 * pulse;
  ctx.drawImage(getCachedChestHaloSprite(), -haloR, -12 - haloR, haloR * 2, haloR * 2);

  // Fast solid semi-transparent upward light flames ("sholay") - 0 gradients
  const beamFlicker = Math.sin(gameTime * 5.2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.34)';
  const beams = [
    [-14, -30, 46 + beamFlicker * 4],
    [0, 0, 54 - beamFlicker * 3],
    [14, 30, 46 + beamFlicker * 4]
  ];
  for (let i = 0; i < beams.length; i++) {
    const x0 = beams[i][0], x1 = beams[i][1], h = beams[i][2];
    ctx.beginPath();
    ctx.moveTo(x0 - 7, -4);
    ctx.lineTo(x1 - 12, -h);
    ctx.lineTo(x1 + 12, -h);
    ctx.lineTo(x0 + 7, -4);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawTreasureChestDynamicSparkles(cx, cy, sz = 1.0) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(sz, sz);
  const tw1 = 0.55 + 0.45 * Math.sin(gameTime * 6.0);
  const tw2 = 0.55 + 0.45 * Math.cos(gameTime * 5.2 + 1.2);
  drawSparkleStar(-22, -26, 6.5 * tw1, 0.95);
  drawSparkleStar(24, -22, 5.5 * tw2, 0.90);
  drawSparkleStar(2, -34, 7.0 * tw2, 0.95);
  ctx.restore();
}

function getCachedChestSprite(style, sz = 1.0) {
  if (!uiRenderCache.chests) uiRenderCache.chests = new Map();
  const key = `${style}_${sz.toFixed(2)}_${dpr}`;
  const hit = uiRenderCache.chests.get(key);
  if (hit) return hit;
  if (uiRenderCache.chests.size > 16) uiRenderCache.chests.clear();

  const w = Math.ceil(110 * sz);
  const h = Math.ceil(96 * sz);
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * dpr);
  c.height = Math.ceil(h * dpr);
  const cCtx = c.getContext('2d');
  cCtx.scale(dpr, dpr);
  const prevCtx = ctx;
  ctx = cCtx;
  try {
    drawTreasureChestStatic(w / 2, h * 0.56, style, sz);
  } finally {
    ctx = prevCtx;
  }
  const res = { canvas: c, w, h, ox: w / 2, oy: h * 0.56 };
  uiRenderCache.chests.set(key, res);
  return res;
}

function drawTreasureChestIcon(cx, cy, style, sz = 1.0) {
  drawTreasureChestDynamicGlow(cx, cy, sz);
  const spr = getCachedChestSprite(style, sz);
  ctx.drawImage(spr.canvas, cx - spr.ox, cy - spr.oy, spr.w, spr.h);
  drawTreasureChestDynamicSparkles(cx, cy, sz);
}

function drawRibbonFiveStar(cx, cy, r, fillColor) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = fillColor;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (i * Math.PI) / 5 - Math.PI / 2;
    const rad = (i % 2 === 0) ? r : r * 0.44;
    const px = Math.cos(a) * rad;
    const py = Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function getPackRibbonSpriteInfo(text) {
  if (text === 'Starter Pack' && ribbonStarterPackImg && ribbonStarterPackImg.naturalWidth > 0) {
    return { img: ribbonStarterPackImg, drawText: null, isBlankBase: false };
  }
  if (text === 'No Ads Pack' && ribbonNoAdsPackImg && ribbonNoAdsPackImg.naturalWidth > 0) {
    return { img: ribbonNoAdsPackImg, drawText: 'No Ads Pack', outline: '#042f66', isBlankBase: true };
  }
  if (text === 'Small Pack' && ribbonSmallPackImg && ribbonSmallPackImg.naturalWidth > 0) {
    return { img: ribbonSmallPackImg, drawText: null, isBlankBase: false };
  }
  if (text === 'Special Pack' && ribbonSpecialPackImg && ribbonSpecialPackImg.naturalWidth > 0) {
    return { img: ribbonSpecialPackImg, drawText: null, isBlankBase: false };
  }
  if (text === 'Large Pack' && ribbonLargePackImg && ribbonLargePackImg.naturalWidth > 0) {
    return { img: ribbonLargePackImg, drawText: 'Large Pack', outline: '#450a0a', isBlankBase: true };
  }
  return null;
}

function drawArchedRibbonLabelText(cx, cy, maxW, baseFontSz, text, outlineCol) {
  ctx.save();
  ctx.font = `800 ${baseFontSz}px "Baloo 2", "Fredoka", system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  const totalMeasure = ctx.measureText(text).width;
  const hScale = totalMeasure > maxW ? (maxW / totalMeasure) : 1.0;
  const chars = Array.from(text);
  const widths = chars.map(ch => ctx.measureText(ch).width * hScale);
  const fullW = widths.reduce((a, b) => a + b, 0);
  const arch = Math.min(3.0, baseFontSz * 0.14);

  let cursorX = cx - fullW / 2;
  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i];
    const cw = widths[i];
    const charCx = cursorX + cw / 2;
    const norm = fullW > 0 ? ((charCx - cx) / (fullW / 2)) : 0;
    const dy = -arch * (1 - norm * norm) + arch * 0.35;
    const rot = norm * 0.055;

    ctx.save();
    ctx.translate(charCx, cy + dy);
    ctx.rotate(rot);
    ctx.scale(hScale, 1);

    ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
    ctx.shadowBlur = 2.5;
    ctx.shadowOffsetY = 1.6;
    ctx.strokeStyle = outlineCol;
    ctx.lineWidth = Math.max(3.8, baseFontSz * 0.28);
    ctx.strokeText(ch, 0, 0);

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(ch, 0, 0);
    ctx.restore();

    cursorX += cw;
  }
  ctx.restore();
}

function drawCardRibbonLabel(x, y, w, h, text, theme) {
  ctx.save();
  x = Math.round(x);
  y = Math.round(y);
  w = Math.round(w);
  h = Math.round(h);
  const cx = Math.round(x + w / 2);
  const cy = Math.round(y + h / 2);

  const sprInfo = getPackRibbonSpriteInfo(text);
  if (sprInfo) {
    const imgAspect = sprInfo.img.naturalWidth / sprInfo.img.naturalHeight;
    const drawH = sprInfo.isBlankBase ? Math.max(h + 30, 62) : Math.max(h + 26, 62);
    let drawW = Math.round(drawH * imgAspect);
    let finalH = drawH;
    const maxAllowedW = w + 2;
    if (drawW > maxAllowedW) {
      drawW = maxAllowedW;
      finalH = Math.round(drawW / imgAspect);
    }
    const rx = Math.round(cx - drawW / 2);
    const ry = Math.round(y - (finalH - h) * 0.42);
    ctx.shadowColor = 'rgba(15, 7, 36, 0.34)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 2.5;
    ctx.drawImage(sprInfo.img, rx, ry, drawW, finalH);
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    if (sprInfo.drawText) {
      const textCy = ry + finalH * 0.565;
      const fontSz = text.length >= 11 ? 15.2 : 16.4;
      drawArchedRibbonLabelText(cx, textCy, drawW * 0.54, fontSz, sprInfo.drawText, sprInfo.outline);
    }
    ctx.restore();
    return;
  }

  const arch = 5;

  // 1. Curved under-curls tucked behind left & right edges
  ctx.fillStyle = theme.lip;
  ctx.beginPath();
  ctx.moveTo(x - 8, y + arch + 6);
  ctx.quadraticCurveTo(x - 13, y + h * 0.72, x + 8, y + h + 5);
  ctx.lineTo(x + 15, y + h - 1);
  ctx.lineTo(x + 4, y + arch + 4);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x + w + 8, y + arch + 6);
  ctx.quadraticCurveTo(x + w + 13, y + h * 0.72, x + w - 8, y + h + 5);
  ctx.lineTo(x + w - 15, y + h - 1);
  ctx.lineTo(x + w - 4, y + arch + 4);
  ctx.closePath();
  ctx.fill();

  // 2. Arched 3D ribbon drop shadow (fast offset shape instead of shadowBlur)
  ctx.beginPath();
  ctx.moveTo(x - 7, y + arch + 2.5);
  ctx.quadraticCurveTo(cx, y - arch + 2.5, x + w + 7, y + arch + 2.5);
  ctx.quadraticCurveTo(x + w + 12, cy + 2.5, x + w + 7, y + h + 3.5);
  ctx.quadraticCurveTo(cx, y + h - arch * 1.4 + 2.5, x - 7, y + h + 3.5);
  ctx.quadraticCurveTo(x - 12, cy + 2.5, x - 7, y + arch + 2.5);
  ctx.closePath();
  ctx.fillStyle = 'rgba(15, 7, 36, 0.28)';
  ctx.fill();

  // 3. Arched 3D ribbon body with flared curved swallowtail ends
  ctx.beginPath();
  ctx.moveTo(x - 7, y + arch);
  ctx.quadraticCurveTo(cx, y - arch, x + w + 7, y + arch);
  ctx.quadraticCurveTo(x + w + 12, cy, x + w + 7, y + h + 1);
  ctx.quadraticCurveTo(cx, y + h - arch * 1.4, x - 7, y + h + 1);
  ctx.quadraticCurveTo(x - 12, cy, x - 7, y + arch);
  ctx.closePath();

  const g = ctx.createLinearGradient(0, y - arch, 0, y + h + 2);
  g.addColorStop(0, theme.top);
  g.addColorStop(0.45, theme.mid);
  g.addColorStop(1, theme.bot);
  ctx.fillStyle = g;
  ctx.fill();

  // 4. Glossy specular top curve & crisp rim highlight inside ribbon
  ctx.save();
  ctx.clip();
  const topHighlight = ctx.createLinearGradient(0, y - arch, 0, y + h * 0.52);
  topHighlight.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
  topHighlight.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
  ctx.fillStyle = topHighlight;
  ctx.fillRect(x - 16, y - arch - 2, w + 32, h * 0.55);

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(x - 6, y + arch + 1.5);
  ctx.quadraticCurveTo(cx, y - arch + 1.5, x + w + 6, y + arch + 1.5);
  ctx.stroke();
  ctx.restore();

  ctx.strokeStyle = theme.border;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 5. Left & Right translucent 5-point stars inside ribbon
  const starCol = theme.star || 'rgba(255, 255, 255, 0.55)';
  drawRibbonFiveStar(x + 14, cy + 1, 7.2, starCol);
  drawRibbonFiveStar(x + w - 14, cy + 1, 7.2, starCol);

  // 6. Crisp sharp white pack title
  drawGlossyText(text, cx, cy, 15.2, 'center', '#ffffff', theme.border, 2.0);
  ctx.restore();
}

function drawShopPriceButton(x, y, w, h, label, isPressed, isOwned = false) {
  x = Math.round(x);
  y = Math.round(y);
  w = Math.round(w);
  h = Math.round(h);
  const key = `${w}_${h}_${label}_${isPressed ? 1 : 0}_${isOwned ? 1 : 0}_${dpr}`;
  let spr = uiRenderCache.priceBtns.get(key);
  if (!spr) {
    if (uiRenderCache.priceBtns.size > 48) {
      uiRenderCache.priceBtns.clear();
    }
    const pad = 4;
    const totW = w + pad * 2;
    const totH = h + pad * 2 + 4;
    const c = document.createElement('canvas');
    c.width = Math.ceil(totW * dpr);
    c.height = Math.ceil(totH * dpr);
    const bCtx = c.getContext('2d');
    bCtx.scale(dpr, dpr);
    const prevCtx = ctx;
    ctx = bCtx;
    try {
      const lx = pad;
      const ly = pad;
      const py = isPressed ? ly + 2 : ly;
      const lipH = isPressed ? 2 : 4;
      const radius = Math.min(13, Math.round(h * 0.38));

      bCtx.fillStyle = isOwned ? '#475569' : '#15803d';
      roundRect(bCtx, lx, py + lipH, w, h, radius);
      bCtx.fill();

      const g = bCtx.createLinearGradient(0, py, 0, py + h);
      if (isOwned) {
        g.addColorStop(0, '#cbd5e1');
        g.addColorStop(0.5, '#94a3b8');
        g.addColorStop(1, '#64748b');
      } else {
        g.addColorStop(0, '#86efac');
        g.addColorStop(0.28, '#4ade80');
        g.addColorStop(0.68, '#22c55e');
        g.addColorStop(1, '#16a34a');
      }
      bCtx.fillStyle = g;
      roundRect(bCtx, lx, py, w, h, radius);
      bCtx.fill();

      bCtx.save();
      roundRect(bCtx, lx, py, w, h, radius);
      bCtx.clip();
      const shine = bCtx.createLinearGradient(0, py, 0, py + h * 0.48);
      shine.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
      shine.addColorStop(1, 'rgba(255, 255, 255, 0.04)');
      bCtx.fillStyle = shine;
      bCtx.fillRect(lx, py, w, h * 0.48);
      bCtx.restore();

      bCtx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
      bCtx.lineWidth = 1.0;
      roundRect(bCtx, lx + 1, py + 1, w - 2, h - 2, Math.max(4, radius - 1));
      bCtx.stroke();

      bCtx.strokeStyle = isOwned ? '#334155' : '#14532d';
      bCtx.lineWidth = 1.5;
      roundRect(bCtx, lx, py, w, h, radius);
      bCtx.stroke();

      let fontSize = Math.max(11.5, Math.min(15.5, Math.round(h * 0.44)));
      bCtx.font = `800 ${fontSize}px "Lilita One", "Baloo 2", cursive, system-ui, sans-serif`;
      const maxTextW = Math.max(36, w - 12);
      const measured = bCtx.measureText(label).width;
      if (measured > maxTextW) {
        fontSize = Math.max(9.5, +(fontSize * (maxTextW / measured)).toFixed(1));
      }
      const strokeW = Math.max(1.4, +(fontSize * 0.14).toFixed(1));
      const tx = Math.round(lx + w / 2);
      const ty = Math.round(py + h / 2 + 0.5);
      drawGlossyText(label, tx, ty, fontSize, 'center', '#ffffff', isOwned ? '#1e293b' : '#14532d', strokeW);
    } finally {
      ctx = prevCtx;
    }
    spr = { canvas: c, pad, totW, totH };
    uiRenderCache.priceBtns.set(key, spr);
  }
  ctx.drawImage(spr.canvas, x - spr.pad, y - spr.pad, spr.totW, spr.totH);
}

function drawMiniBoosterBox(x, y, w, h, bgTop, bgBot, borderCol, items) {
  ctx.save();
  x = Math.round(x);
  y = Math.round(y);
  w = Math.round(w);
  h = Math.round(h);

  const isFourBoosterBar = items && items.length === 4 && items.every(it => it.kind === 'booster');
  if (isFourBoosterBar && boosterOfferBarImg && boosterOfferBarImg.naturalWidth > 0) {
    const imgAspect = boosterOfferBarImg.naturalWidth / boosterOfferBarImg.naturalHeight;
    let drawW = w;
    let drawH = drawW / imgAspect;
    if (drawH > h) {
      drawH = h;
      drawW = drawH * imgAspect;
    }
    const dx = Math.round(x + (w - drawW) / 2);
    const dy = Math.round(y + (h - drawH) / 2);
    ctx.shadowColor = 'rgba(14, 165, 233, 0.45)';
    ctx.shadowBlur = 7;
    ctx.shadowOffsetY = 2;
    ctx.drawImage(boosterOfferBarImg, dx, dy, drawW, drawH);
    ctx.restore();
    return;
  }

  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, bgTop);
  g.addColorStop(1, bgBot);
  ctx.fillStyle = g;
  roundRect(ctx, x, y, w, h, 13);
  ctx.fill();

  ctx.save();
  roundRect(ctx, x, y, w, h, 13);
  ctx.clip();
  const topSh = ctx.createLinearGradient(0, y, 0, y + 10);
  topSh.addColorStop(0, 'rgba(0, 0, 0, 0.28)');
  topSh.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = topSh;
  ctx.fillRect(x, y, w, 10);
  ctx.restore();

  ctx.strokeStyle = borderCol;
  ctx.lineWidth = 1.6;
  roundRect(ctx, x, y, w, h, 13);
  ctx.stroke();

  const slotW = w / items.length;
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    const sx = Math.round(x + slotW * i + slotW / 2);
    const sy = Math.round(y + h * 0.40);
    if (it.kind === 'coins') {
      drawCoinPackPileIcon(sx, sy - 1, 2);
    } else {
      drawButtonIcon(it.icon, sx, sy, 27);
    }
    drawGlossyText(it.label, sx, y + h - 9, 10.5, 'center', '#ffffff', '#0f172a', 2.0);
  }
  ctx.restore();
}

function getCachedShopBackground() {
  const key = `${W}_${H}_${dpr}`;
  if (uiRenderCache.shopBg && uiRenderCache.shopBgKey === key) return uiRenderCache.shopBg;
  const c = document.createElement('canvas');
  c.width = Math.ceil(W * dpr);
  c.height = Math.ceil(H * dpr);
  const sCtx = c.getContext('2d');
  sCtx.scale(dpr, dpr);
  const bgGrad = sCtx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#5b21b6');
  bgGrad.addColorStop(0.5, '#4c1d95');
  bgGrad.addColorStop(1, '#3b0764');
  sCtx.fillStyle = bgGrad;
  sCtx.fillRect(0, 0, W, H);

  sCtx.globalAlpha = 0.07;
  sCtx.fillStyle = '#f5d0fe';
  for (let r = 0; r < 5; r++) {
    const rx = -60 + r * 110;
    sCtx.beginPath();
    sCtx.moveTo(rx, 0);
    sCtx.lineTo(rx + 42, 0);
    sCtx.lineTo(rx + 185, H);
    sCtx.lineTo(rx + 143, H);
    sCtx.closePath();
    sCtx.fill();
  }
  uiRenderCache.shopBg = c;
  uiRenderCache.shopBgKey = key;
  return c;
}

function getCachedShopAwning(L, closePressed) {
  const key = `${W}_${L.awningH}_${dpr}_${closePressed ? 1 : 0}`;
  if (uiRenderCache.shopAwning && uiRenderCache.shopAwningKey === key) return uiRenderCache.shopAwning;
  const stripeCount = 10;
  const stripeW = W / stripeCount;
  const scallopR = stripeW / 2;
  const awningBodyH = L.awningH - scallopR * 0.55;
  const totH = Math.ceil(awningBodyH + scallopR + 8);
  const c = document.createElement('canvas');
  c.width = Math.ceil(W * dpr);
  c.height = Math.ceil(totH * dpr);
  const aCtx = c.getContext('2d');
  aCtx.scale(dpr, dpr);

  aCtx.fillStyle = 'rgba(15, 7, 36, 0.32)';
  for (let i = 0; i < stripeCount; i++) {
    aCtx.beginPath();
    aCtx.arc(i * stripeW + scallopR, awningBodyH + 4, scallopR, 0, Math.PI, false);
    aCtx.fill();
  }

  for (let i = 0; i < stripeCount; i++) {
    const sx = i * stripeW;
    const isEven = (i % 2 === 0);
    const sGrad = aCtx.createLinearGradient(0, 0, 0, L.awningH);
    if (isEven) {
      sGrad.addColorStop(0, '#9333ea');
      sGrad.addColorStop(1, '#6b21a8');
    } else {
      sGrad.addColorStop(0, '#e9d5ff');
      sGrad.addColorStop(1, '#c084fc');
    }
    aCtx.fillStyle = sGrad;
    aCtx.fillRect(sx, 0, stripeW + 0.6, awningBodyH);
    aCtx.beginPath();
    aCtx.arc(sx + scallopR, awningBodyH, scallopR + 0.4, 0, Math.PI, false);
    aCtx.fill();
  }

  const prevCtx = ctx;
  ctx = aCtx;
  try {
    drawRoundGlossyButton(L.closeBtn.x, L.closeBtn.y, L.closeBtn.r, BUTTON_THEMES.red, 'close', closePressed);
  } finally {
    ctx = prevCtx;
  }

  uiRenderCache.shopAwning = { canvas: c, w: W, h: totH };
  uiRenderCache.shopAwningKey = key;
  return uiRenderCache.shopAwning;
}

function getCachedBundleCardLayers(c, isOwned) {
  const b = c.bundle;
  const hasBarSprite = (boosterOfferBarImg && boosterOfferBarImg.naturalWidth > 0) ? 1 : 0;
  const ribbonMask = (ribbonStarterPackImg ? 1 : 0) | (ribbonNoAdsPackImg ? 2 : 0) | (ribbonSmallPackImg ? 4 : 0) | (ribbonSpecialPackImg ? 8 : 0) | (ribbonLargePackImg ? 16 : 0);
  const key = `bundle_${b.id}_${c.w}_${c.h}_${isOwned ? 1 : 0}_${hasBarSprite}_${ribbonMask}_${dpr}`;
  const hit = uiRenderCache.shopCards.get(key);
  if (hit) return hit;

  const padL = 16, padR = 18, padT = 10, padB = 12;
  const totW = c.w + padL + padR;
  const totH = c.h + padT + padB;

  const mkLayer = () => {
    const cvL = document.createElement('canvas');
    cvL.width = Math.ceil(totW * dpr);
    cvL.height = Math.ceil(totH * dpr);
    const lx = cvL.getContext('2d');
    lx.scale(dpr, dpr);
    return { cvL, lx };
  };

  // Layer 1: Background card + shadow + sheen + border + inner rim
  const bg = mkLayer();
  const prevCtx = ctx;
  ctx = bg.lx;
  try {
    const ox = padL, oy = padT;
    bg.lx.fillStyle = 'rgba(15, 7, 36, 0.30)';
    roundRect(bg.lx, ox, oy + 4, c.w, c.h, 20);
    bg.lx.fill();

    const g = bg.lx.createLinearGradient(ox, oy, ox, oy + c.h);
    g.addColorStop(0, b.gradTop);
    g.addColorStop(0.55, b.gradMid);
    g.addColorStop(1, b.gradBot);
    bg.lx.fillStyle = g;
    roundRect(bg.lx, ox, oy, c.w, c.h, 20);
    bg.lx.fill();

    bg.lx.save();
    roundRect(bg.lx, ox, oy, c.w, c.h, 20);
    bg.lx.clip();
    const sheen = bg.lx.createLinearGradient(0, oy, 0, oy + c.h * 0.44);
    sheen.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
    sheen.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
    bg.lx.fillStyle = sheen;
    bg.lx.fillRect(ox, oy, c.w, c.h * 0.44);
    bg.lx.restore();

    bg.lx.strokeStyle = b.border;
    bg.lx.lineWidth = 2.2;
    roundRect(bg.lx, ox, oy, c.w, c.h, 20);
    bg.lx.stroke();
    bg.lx.strokeStyle = b.innerRim || 'rgba(255, 255, 255, 0.8)';
    bg.lx.lineWidth = 1.5;
    roundRect(bg.lx, ox + 2, oy + 2, c.w - 4, c.h - 4, 18);
    bg.lx.stroke();
  } finally {
    ctx = prevCtx;
  }

  // Layer 2: Foreground chest/emblem + mini booster box + 3D arched star ribbon + note + badge
  const fg = mkLayer();
  ctx = fg.lx;
  try {
    const ox = padL, oy = padT;
    if (b.kind === 'no_ads_simple') {
      const nx = ox + 48, ny = oy + 40;
      drawNoAdsCircleEmblem(nx, ny, 28);
      const pillX = ox + 88, pillY = oy + 24, pillW = 114, pillH = 34;
      const pG = fg.lx.createLinearGradient(0, pillY, 0, pillY + pillH);
      pG.addColorStop(0, '#6b21a8');
      pG.addColorStop(1, '#3b0764');
      fg.lx.fillStyle = pG;
      roundRect(fg.lx, pillX, pillY, pillW, pillH, 10);
      fg.lx.fill();
      fg.lx.strokeStyle = '#ffffff';
      fg.lx.lineWidth = 1.5;
      roundRect(fg.lx, pillX, pillY, pillW, pillH, 10);
      fg.lx.stroke();
      drawGlossyText('No Ads', pillX + pillW / 2, pillY + pillH / 2 + 1, 16.5, 'center', '#ffffff', '#1e1b4b', 2.4);
      drawGlossyText(b.noteText, Math.round(ox + c.w / 2), oy + c.h - 14, 10, 'center', '#ffffff', '#4c1d95', 1.6);
    } else if (b.kind === 'no_ads_bundle') {
      const nx = ox + 76, ny = oy + 31;
      drawNoAdsCircleEmblem(nx, ny, 25);
      drawMiniBoosterBox(ox + c.w - 174, oy + 12, 162, 52, b.boxTop, b.boxBot, b.boxBorder, b.miniItems);
      drawCardRibbonLabel(ox + 18, oy + 68, 184, 30, b.title, b.ribbonTheme);
      drawGlossyText(b.noteText, Math.round(ox + c.w / 2), oy + c.h - 10, 9.8, 'center', '#ffffff', '#1e3a8a', 1.6);
    } else {
      const chestX = ox + 70, chestY = oy + 38;
      drawTreasureChestStatic(chestX, chestY, b.chestStyle, 0.88);
      drawGlossyText(String(b.coins), chestX, oy + 59, 16, 'center', '#ffffff', b.boxBot || b.border, 2.3);
      drawMiniBoosterBox(ox + c.w - 176, oy + 15, 166, 63, b.boxTop, b.boxBot, b.boxBorder, b.miniItems);
      drawCardRibbonLabel(ox + 18, oy + 83, 186, 34, b.title, b.ribbonTheme);
      if (b.discountTag) {
        drawCornerDiscountBadge(ox + c.w - 38, oy + 4, b.discountTag);
      }
    }
  } finally {
    ctx = prevCtx;
  }

  const res = { bg: bg.cvL, fg: fg.cvL, padL, padT, totW, totH };
  uiRenderCache.shopCards.set(key, res);
  return res;
}

function getCachedCoinPackLayers(c) {
  const p = c.pack;
  const key = `coinpack_${p.id}_${c.w}_${c.h}_${dpr}`;
  const hit = uiRenderCache.shopCards.get(key);
  if (hit) return hit;

  const pad = 6;
  const totW = c.w + pad * 2;
  const totH = c.h + pad * 2;

  const mkLayer = () => {
    const cvL = document.createElement('canvas');
    cvL.width = Math.ceil(totW * dpr);
    cvL.height = Math.ceil(totH * dpr);
    const lx = cvL.getContext('2d');
    lx.scale(dpr, dpr);
    return { cvL, lx };
  };

  const bg = mkLayer();
  const prevCtx = ctx;
  ctx = bg.lx;
  try {
    const ox = pad, oy = pad;
    bg.lx.fillStyle = 'rgba(15, 7, 36, 0.28)';
    roundRect(bg.lx, ox, oy + 3, c.w, c.h, 16);
    bg.lx.fill();

    const g = bg.lx.createLinearGradient(ox, oy, ox, oy + c.h);
    g.addColorStop(0, p.gradTop);
    g.addColorStop(0.55, p.gradMid);
    g.addColorStop(1, p.gradBot);
    bg.lx.fillStyle = g;
    roundRect(bg.lx, ox, oy, c.w, c.h, 16);
    bg.lx.fill();

    bg.lx.save();
    roundRect(bg.lx, ox, oy, c.w, c.h, 16);
    bg.lx.clip();
    const sheen = bg.lx.createLinearGradient(0, oy, 0, oy + c.h * 0.45);
    sheen.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
    sheen.addColorStop(1, 'rgba(255, 255, 255, 0)');
    bg.lx.fillStyle = sheen;
    bg.lx.fillRect(ox, oy, c.w, c.h * 0.45);
    bg.lx.restore();

    bg.lx.strokeStyle = p.border;
    bg.lx.lineWidth = 2.0;
    roundRect(bg.lx, ox, oy, c.w, c.h, 16);
    bg.lx.stroke();
    bg.lx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
    bg.lx.lineWidth = 1.4;
    roundRect(bg.lx, ox + 2, oy + 2, c.w - 4, c.h - 4, 14);
    bg.lx.stroke();
  } finally {
    ctx = prevCtx;
  }

  const fg = mkLayer();
  ctx = fg.lx;
  try {
    const ox = pad, oy = pad;
    fg.lx.save();
    fg.lx.translate(Math.round(ox + c.w / 2), Math.round(oy + 37));
    fg.lx.scale(1.18, 1.18);
    drawCoinPackPileIcon(0, 0, p.iconLevel);
    fg.lx.restore();
    drawGlossyText(String(p.coins), Math.round(ox + c.w / 2), Math.round(oy + 78), 16.5, 'center', '#ffffff', '#92400e', 2.4);
  } finally {
    ctx = prevCtx;
  }

  const res = { bg: bg.cvL, fg: fg.cvL, pad, totW, totH };
  uiRenderCache.shopCards.set(key, res);
  return res;
}

function getCachedMiscShopCard(c, subKey, pressed, drawerFn) {
  const key = `misc_${c.id || (c.item && c.item.id)}_${subKey}_${pressed ? 1 : 0}_${c.w}_${c.h}_${dpr}`;
  const hit = uiRenderCache.shopCards.get(key);
  if (hit) return hit;

  if (uiRenderCache.shopCards.size > 64) {
    uiRenderCache.shopCards.clear();
  }
  const pad = 4;
  const totW = c.w + pad * 2;
  const totH = c.h + pad * 2;
  const cvL = document.createElement('canvas');
  cvL.width = Math.ceil(totW * dpr);
  cvL.height = Math.ceil(totH * dpr);
  const mc = cvL.getContext('2d');
  mc.scale(dpr, dpr);

  const prevCtx = ctx;
  ctx = mc;
  try {
    const ox = pad, oy = pad;
    const cardGrad = mc.createLinearGradient(ox, oy, ox, oy + c.h);
    if (c.type === 'item') {
      cardGrad.addColorStop(0, c.item.gradTop);
      cardGrad.addColorStop(0.55, c.item.gradMid);
      cardGrad.addColorStop(1, c.item.gradBot);
    } else if (c.type === 'rewarded_coins') {
      cardGrad.addColorStop(0, '#65a30d');
      cardGrad.addColorStop(0.55, '#3f6212');
      cardGrad.addColorStop(1, '#14532d');
    } else {
      cardGrad.addColorStop(0, '#fef08a');
      cardGrad.addColorStop(0.5, '#facc15');
      cardGrad.addColorStop(1, '#d97706');
    }
    mc.fillStyle = cardGrad;
    roundRect(mc, ox, oy, c.w, c.h, 18);
    mc.fill();

    mc.save();
    roundRect(mc, ox, oy, c.w, c.h, 18);
    mc.clip();
    const sheen = mc.createLinearGradient(0, oy, 0, oy + c.h * 0.45);
    sheen.addColorStop(0, 'rgba(255, 255, 255, 0.42)');
    sheen.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
    mc.fillStyle = sheen;
    mc.fillRect(ox, oy, c.w, c.h * 0.45);
    mc.restore();

    mc.strokeStyle = c.type === 'item' ? c.item.border : (c.type === 'rewarded_coins' ? '#052e16' : '#713f12');
    mc.lineWidth = 2.4;
    roundRect(mc, ox, oy, c.w, c.h, 18);
    mc.stroke();
    mc.strokeStyle = 'rgba(255, 255, 255, 0.48)';
    mc.lineWidth = 1.2;
    roundRect(mc, ox + 2, oy + 2, c.w - 4, c.h - 4, 16);
    mc.stroke();

    const iconBoxSz = 56;
    const iconBoxX = ox + 12;
    const iconBoxY = oy + (c.h - iconBoxSz) / 2;
    mc.fillStyle = 'rgba(15, 23, 42, 0.28)';
    roundRect(mc, iconBoxX, iconBoxY, iconBoxSz, iconBoxSz, 14);
    mc.fill();
    mc.strokeStyle = 'rgba(255, 255, 255, 0.55)';
    mc.lineWidth = 1.6;
    roundRect(mc, iconBoxX, iconBoxY, iconBoxSz, iconBoxSz, 14);
    mc.stroke();

    drawerFn(ox, oy, iconBoxX, iconBoxY, iconBoxSz);
  } finally {
    ctx = prevCtx;
  }

  const res = { canvas: cvL, pad, totW, totH };
  uiRenderCache.shopCards.set(key, res);
  return res;
}

function drawShopScreen() {
  const L = getShopLayout();
  ctx.save();

  // 1. Pre-cached purple background + diagonal rays (1 drawImage)
  ctx.drawImage(getCachedShopBackground(), 0, 0, W, H);

  // 2. Scrollable list of pre-cached cards starting right under the awning
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, L.listTop - 6, W, L.listH + 14);
  ctx.clip();

  for (let i = 0; i < L.cards.length; i++) {
    const c = L.cards[i];
    if (c.y + c.h < L.listTop - 16 || c.y > L.listBottom + 16) continue;

    const animKey = c.type === 'item'
      ? c.item.id
      : (c.type === 'coin_pack'
        ? c.pack.id
        : (c.type === 'bundle' ? c.bundle.id : (c.id || 'daily')));
    const anim = shopCardAnim[animKey] || { pop: 0, shake: 0 };
    const shakeX = anim.shake > 0 ? Math.sin(anim.shake * 55) * 6 * (anim.shake / 0.45) : 0;
    const popScale = anim.pop > 0 ? (1 + 0.045 * Math.sin((anim.pop / 0.35) * Math.PI)) : 1.0;
    const hasAnim = (shakeX !== 0 || popScale !== 1.0);

    if (hasAnim) {
      ctx.save();
      ctx.translate(c.x + c.w / 2 + shakeX, c.y + c.h / 2);
      ctx.scale(popScale, popScale);
      ctx.translate(-(c.x + c.w / 2), -(c.y + c.h / 2));
    }

    if (c.type === 'bundle') {
      const b = c.bundle;
      const isPressed = (activePress === 'shop_bundle_buy_' + b.id);
      const isOwned = Boolean(b.removesAds && noAdsPurchased);
      const layers = getCachedBundleCardLayers(c, isOwned);

      // Base card (1 blit)
      ctx.drawImage(layers.bg, c.x - layers.padL, c.y - layers.padT, layers.totW, layers.totH);

      // Rotating sunburst rays & glowing halo clipped inside card
      ctx.save();
      roundRect(ctx, c.x, c.y, c.w, c.h, 20);
      ctx.clip();
      const rayOriginX = b.kind === 'no_ads_simple' ? (c.x + 48) : (b.kind === 'no_ads_bundle' ? (c.x + 76) : (c.x + 70));
      const rayOriginY = c.y + (b.kind === 'no_ads_simple' ? 40 : (b.kind === 'no_ads_bundle' ? 31 : 38));
      drawRotatingSunburstRays(rayOriginX, rayOriginY, 175, 10, (i % 2 === 0 ? 0.38 : -0.35), 0.38);
      if (b.kind === 'no_ads_simple') {
        drawRotatingSunburstRays(c.x + 48, c.y + 40, 48, 8, -0.7, 0.55);
      } else if (b.kind === 'no_ads_bundle') {
        drawRotatingSunburstRays(c.x + 76, c.y + 31, 58, 10, 0.55, 0.7);
      } else {
        drawTreasureChestDynamicGlow(c.x + 70, c.y + 38, 0.88);
      }
      ctx.restore();

      drawCardShineSweep(c.x, c.y, c.w, c.h, 20, i * 0.42);

      // Foreground chest + ribbon + mini-box + badge (1 blit)
      ctx.drawImage(layers.fg, c.x - layers.padL, c.y - layers.padT, layers.totW, layers.totH);
      if (b.kind !== 'no_ads_simple' && b.kind !== 'no_ads_bundle') {
        drawTreasureChestDynamicSparkles(c.x + 70, c.y + 38, 0.88);
      }

      const pb = c.priceBtn;
      drawShopPriceButton(pb.x, pb.y, pb.w, pb.h, isOwned ? 'Owned' : b.priceText, isPressed, isOwned);

    } else if (c.type === 'coin_pack') {
      const p = c.pack;
      const layers = getCachedCoinPackLayers(c);

      // Base grid card (1 blit)
      ctx.drawImage(layers.bg, c.x - layers.pad, c.y - layers.pad, layers.totW, layers.totH);

      // Rotating sunburst rays neatly inside card bounds (0 clip needed)
      drawRotatingSunburstRays(c.x + c.w / 2, c.y + 38, 37, 8, (i % 2 === 0 ? 0.55 : -0.5), 0.52);
      drawCardShineSweep(c.x, c.y, c.w, c.h, 16, i * 0.25);

      // Rich 3D coin pile + sharp amount text (1 blit)
      ctx.drawImage(layers.fg, c.x - layers.pad, c.y - layers.pad, layers.totW, layers.totH);
      drawSparkleStar(c.x + c.w / 2 + 18, c.y + 18, 4.8 + 1.5 * Math.sin(gameTime * 5 + i), 0.95);

      const pb = c.priceBtn;
      drawShopPriceButton(pb.x, pb.y, pb.w, pb.h, p.priceText, activePress === 'coin_pack_buy_' + p.id, false);

    } else if (c.type === 'rewarded_coins') {
      const pressed = (activePress === 'shop_rewarded_coins');
      const cardSpr = getCachedMiscShopCard(c, 'ad', pressed, (ox, oy, iconBoxX, iconBoxY, iconBoxSz) => {
        drawButtonIcon('ad_video', iconBoxX + iconBoxSz / 2, iconBoxY + iconBoxSz / 2, 42);
        const textX = iconBoxX + iconBoxSz + 10;
        drawGlossyText('Free +250 Coins', textX, oy + 32, 16.5, 'left', '#ffffff', '#052e16', 3.2);
        drawGlossyText('Watch a short ad reward', textX, oy + 55, 10.5, 'left', '#dcfce7', '#052e16', 2.0);
        const pbx = ox + (c.priceBtn.x - c.x);
        const pby = oy + (c.priceBtn.y - c.y);
        drawGlossyButton(pbx, pby, c.priceBtn.w, c.priceBtn.h, BUTTON_THEMES.yellow, 'WATCH AD', null, pressed, 16);
      });
      ctx.drawImage(cardSpr.canvas, c.x - cardSpr.pad, c.y - cardSpr.pad, cardSpr.totW, cardSpr.totH);
      drawCardShineSweep(c.x, c.y, c.w, c.h, 18, i * 0.3);

    } else if (c.type === 'item') {
      const owned = inventory[c.item.id] || 0;
      const isBuyPressed = (activePress === 'shop_buy_' + c.item.id);
      const cardSpr = getCachedMiscShopCard(c, String(owned), isBuyPressed, (ox, oy, iconBoxX, iconBoxY, iconBoxSz) => {
        drawButtonIcon(c.item.icon, iconBoxX + iconBoxSz / 2, iconBoxY + iconBoxSz / 2, 38);
        const px = iconBoxX + iconBoxSz - 9;
        const py = iconBoxY + iconBoxSz - 8;
        ctx.fillStyle = c.item.accent;
        roundRect(ctx, px - 13, py - 8, 26, 16, 8);
        ctx.fill();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1.5;
        roundRect(ctx, px - 13, py - 8, 26, 16, 8);
        ctx.stroke();
        drawGlossyText(`x${c.item.packCount}`, px, py + 0.5, 10.5, 'center', '#ffffff', '#0f172a', 2.5);

        const textX = iconBoxX + iconBoxSz + 10;
        drawGlossyText(c.item.name, textX, oy + 26, 17, 'left', '#ffffff', c.item.border, 3.6);
        drawGlossyText(c.item.desc, textX, oy + 46, 9.2, 'left', '#f8fafc', '#0f172a', 1.9);
        drawGlossyText(`Owned: ${owned}`, textX, oy + 66, 10.5, 'left', '#fde047', '#0f172a', 2.2);

        const pbx = ox + (c.priceBtn.x - c.x);
        const pby = oy + (c.priceBtn.y - c.y);
        drawGlossyButton(pbx, pby, c.priceBtn.w, c.priceBtn.h, BUTTON_THEMES.green, null, null, isBuyPressed, 16);
        const pressDy = isBuyPressed ? 3 : 0;
        drawGoldCoinIcon(pbx + 21, pby + c.priceBtn.h / 2 + pressDy, 9.5);
        drawGlossyText(String(c.item.price), pbx + 56, pby + c.priceBtn.h / 2 + pressDy + 1, 15.5, 'center', '#ffffff', BUTTON_THEMES.green.border, 3.4);
      });
      ctx.drawImage(cardSpr.canvas, c.x - cardSpr.pad, c.y - cardSpr.pad, cardSpr.totW, cardSpr.totH);
      drawCardShineSweep(c.x, c.y, c.w, c.h, 18, i * 0.3);

    } else {
      const ready = isDailyRewardReady();
      const dInfo = getCurrentDailyRewardInfo();
      const isDailyPressed = (activePress === 'shop_claim_daily');
      const cardSpr = getCachedMiscShopCard(c, `${dInfo.dayNum}_${ready ? 1 : 0}`, isDailyPressed, (ox, oy, iconBoxX, iconBoxY, iconBoxSz) => {
        drawButtonIcon('daily_gift', iconBoxX + iconBoxSz / 2, iconBoxY + iconBoxSz / 2, 40);
        const textX = iconBoxX + iconBoxSz + 10;
        drawGlossyText(`Daily Day ${dInfo.dayNum}`, textX, oy + 31, 17, 'left', '#ffffff', '#713f12', 3.6);
        const dSub = dInfo.bonusBoost > 0 ? `+${dInfo.coins} coins + 1 Boost` : `+${dInfo.coins} free coins`;
        drawGlossyText(dSub, textX, oy + 54, 10.8, 'left', '#ffffff', '#713f12', 2.2);

        const pbx = ox + (c.priceBtn.x - c.x);
        const pby = oy + (c.priceBtn.y - c.y);
        const dTheme = ready ? BUTTON_THEMES.green : BUTTON_THEMES.gray;
        drawGlossyButton(pbx, pby, c.priceBtn.w, c.priceBtn.h, dTheme, ready ? 'Claim' : 'Claimed', null, isDailyPressed, 16);
      });
      ctx.drawImage(cardSpr.canvas, c.x - cardSpr.pad, c.y - cardSpr.pad, cardSpr.totW, cardSpr.totH);
      drawCardShineSweep(c.x, c.y, c.w, c.h, 18, i * 0.3);
    }

    if (hasAnim) {
      ctx.restore();
    }
  }
  ctx.restore();

  // 3. Cached striped scalloped awning + Top-left Red X button (1 drawImage)
  const awningSpr = getCachedShopAwning(L, activePress === 'close_shop');
  ctx.drawImage(awningSpr.canvas, 0, 0, awningSpr.w, awningSpr.h);

  // Top-right Coin pill
  drawWalletCoinPill(L.coinPill.x, L.coinPill.y, L.coinPill.w, L.coinPill.h, Math.round(shopDisplayedWallet), coinCounterBump, false);

  // 4. "Not enough coins" + "Daily reward" shortcut banner (Boosters mode)
  if (shopMode === 'boosters' && shopNoCoinsTimer > 0) {
    const sb = L.shortcutBanner;
    ctx.save();
    ctx.fillStyle = 'rgba(69, 10, 10, 0.94)';
    roundRect(ctx, sb.x, sb.y, sb.w, sb.h, 16);
    ctx.fill();
    ctx.strokeStyle = '#f87171';
    ctx.lineWidth = 2;
    roundRect(ctx, sb.x, sb.y, sb.w, sb.h, 16);
    ctx.stroke();

    drawGlossyText('Not enough coins!', sb.x + 14, sb.y + sb.h / 2 + 1, 13.5, 'left', '#fecaca', '#450a0a', 2.6);
    const dReady = isDailyRewardReady();
    const dLabel = dReady ? 'Daily reward' : 'Daily (Wait)';
    drawGlossyButton(sb.btn.x, sb.btn.y, sb.btn.w, sb.btn.h, dReady ? BUTTON_THEMES.yellow : BUTTON_THEMES.gray, dLabel, null, activePress === 'shop_shortcut_daily', 12);
    ctx.restore();
  }

  // 5. Confirmation modal for Coin Packs & Bundle Packs
  if (coinPackConfirmItem) {
    const b = L.confirmBox;
    const item = coinPackConfirmItem;
    ctx.save();
    ctx.fillStyle = 'rgba(10, 15, 25, 0.65)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#f8fafc';
    roundRect(ctx, b.x, b.y, b.w, b.h, 22);
    ctx.fill();
    ctx.strokeStyle = '#7c3aed';
    ctx.lineWidth = 4.5;
    roundRect(ctx, b.x, b.y, b.w, b.h, 22);
    ctx.stroke();
    ctx.strokeStyle = '#3b0764';
    ctx.lineWidth = 2;
    roundRect(ctx, b.x, b.y, b.w, b.h, 22);
    ctx.stroke();

    if (item.removesAds && (!item.coins || item.coins === 0)) {
      drawNoAdsCircleEmblem(W / 2 - 66, b.y + 42, 16);
    } else {
      drawGoldCoinIcon(W / 2 - 84, b.y + 42, 15);
    }
    drawGlossyText(item.title, W / 2 + 8, b.y + 42, 20, 'center', '#581c87', '#ffffff', 3.0);
    drawGlossyText(`Amount: ${item.priceText}`, W / 2, b.y + 76, 15.5, 'center', '#16a34a', '#ffffff', 2.4);

    let summaryLine = 'Confirm coin pack';
    if (item.boosters) {
      const bSum = [];
      if (item.boosters.boost) bSum.push(`Boost x${item.boosters.boost}`);
      if (item.boosters.magnet) bSum.push(`Magnet x${item.boosters.magnet}`);
      if (item.boosters.shield) bSum.push(`Shield x${item.boosters.shield}`);
      if (item.boosters.slowmo) bSum.push(`Slow-mo x${item.boosters.slowmo}`);
      summaryLine = (item.coins ? `+${item.coins} Coins & ` : '') + bSum.join(', ');
    } else if (item.removesAds) {
      summaryLine = 'Remove interstitial ads forever';
    }
    drawGlossyText(summaryLine, W / 2, b.y + 104, 10.5, 'center', '#475569', '#ffffff', 1.6);

    drawGlossyButton(b.yesBtn.x, b.yesBtn.y, b.yesBtn.w, b.yesBtn.h, BUTTON_THEMES.green, 'Confirm', null, activePress === 'coin_pack_confirm_yes', 14);
    drawGlossyButton(b.noBtn.x, b.noBtn.y, b.noBtn.w, b.noBtn.h, BUTTON_THEMES.gray, 'Cancel', null, activePress === 'coin_pack_confirm_no', 14);
    ctx.restore();
  }

  // 6. Purchase & Daily Reward Sparkles
  for (let i = 0; i < shopSparkles.length; i++) {
    const spk = shopSparkles[i];
    const alpha = Math.max(0, Math.min(1, spk.life / spk.maxLife));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = spk.color;
    ctx.beginPath();
    ctx.arc(spk.x, spk.y, spk.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

function getSettingsModalLayout(isPauseMode) {
  const safeTop = Math.max(8, (topInset || 0) + 12);
  const safeBot = Math.max(10, (botInset || 0) + 10);
  const confSafeTop = Math.max(24, (topInset || 0) + 28);

  const confW = Math.min(286, W - 28), confH = 180;
  const confX = Math.round(W / 2 - confW / 2);
  const confY = Math.max(confSafeTop, Math.min(H - safeBot - confH, Math.round(H / 2 - confH / 2)));
  const confBtnW = 108, confBtnH = 44, confBtnY = confY + 114;

  const supW = Math.min(296, W - 24), supH = 292;
  const supX = Math.round(W / 2 - supW / 2);
  const supY = Math.max(confSafeTop, Math.min(H - safeBot - supH, Math.round(H / 2 - supH / 2)));

  if (isPauseMode) {
    const pauseSafeTop = safeTop + 42;
    const maxAvailH = Math.max(280, H - pauseSafeTop - safeBot);
    let cw = Math.min(320, W - 20);
    let ch = Math.round(cw * (1327 / 1186));
    if (ch > maxAvailH) {
      ch = maxAvailH;
      cw = Math.round(ch * (1186 / 1327));
    }
    const cx = Math.round(W / 2 - cw / 2);
    const maxCy = Math.max(pauseSafeTop, H - safeBot - ch);
    const cy = Math.max(pauseSafeTop, Math.min(maxCy, Math.round(H / 2 - ch / 2 + 10)));

    // Bottom off-white cream tray inside pause_panel_bg.png (y = 0.731..0.934)
    const creamBox = {
      x: cx + Math.round(cw * 0.055),
      y: cy + Math.round(ch * 0.731),
      w: Math.round(cw * 0.890),
      h: Math.round(ch * 0.203)
    };

    const tileW = Math.min(90, Math.round(creamBox.w * 0.32));
    const tileH = Math.min(58, Math.round(creamBox.h * 0.80));
    const tileGap = Math.round(cw * 0.075);
    const startTileX = Math.round(cx + cw / 2 - (tileW * 2 + tileGap) / 2);
    const tileY = Math.round(creamBox.y + (creamBox.h - tileH - 3) / 2);
    const soundBtn = { x: startTileX, y: tileY, w: tileW, h: tileH };
    const vibrateBtn = { x: startTileX + tileW + tileGap, y: tileY, w: tileW, h: tileH };

    // Upper purple interior spanning cleanly below ribbon arch down to cream bezel
    const purpleTop = cy + Math.round(ch * 0.145);
    const purpleBot = cy + Math.round(ch * 0.692);
    const purpleH = purpleBot - purpleTop;

    const resumeW = Math.round(cw * 0.58);
    const resumeH = Math.round(cw * 0.215);
    const actH = Math.round(cw * 0.155);
    const rowGapV = Math.max(12, Math.round((purpleH - resumeH - actH) * 0.34));
    const stackTop = purpleTop + Math.round((purpleH - resumeH - actH - rowGapV) / 2);

    const resumeBtn = { x: Math.round(cx + (cw - resumeW) / 2), y: stackTop, w: resumeW, h: resumeH };

    const padX = Math.round(cw * 0.068);
    const innerW = cw - padX * 2;
    const innerX = cx + padX;
    const actGap = 10;
    const actW = Math.round((innerW - actGap) / 2);
    const actY = stackTop + resumeH + rowGapV;
    const replayBtn = { x: innerX, y: actY, w: actW, h: actH };
    const homeBtn = { x: innerX + actW + actGap, y: actY, w: actW, h: actH };

    return {
      isPauseMode: true,
      cx, cy, cw, ch,
      closeCenter: { x: cx + cw - 12, y: cy + 8, r: 19 },
      soundBtn,
      vibrateBtn,
      resumeBtn,
      replayBtn,
      homeBtn,
      creamBox,
      confirmBox: {
        x: confX, y: confY, w: confW, h: confH,
        yesBtn: { x: confX + 20, y: confBtnY, w: confBtnW, h: confBtnH },
        noBtn: { x: confX + confW - 20 - confBtnW, y: confBtnY, w: confBtnW, h: confBtnH }
      },
      supportBox: {
        x: supX, y: supY, w: supW, h: supH,
        closeCenter: { x: supX + supW - 14, y: supY + 14, r: 17 },
        resetBtn: { x: supX + 42, y: supY + supH - 108, w: supW - 84, h: 42 },
        closeBtn: { x: supX + 64, y: supY + supH - 58, w: supW - 128, h: 42 }
      }
    };
  }

  // Settings panel rendered strictly using the user's new background (720x867) & custom button sprites
  const cw = Math.min(336, W - 16);
  const ch = Math.round(cw * (867 / 720));
  const cx = Math.round(W / 2 - cw / 2);
  const maxCy = Math.max(safeTop, H - safeBot - ch);
  const cy = Math.max(safeTop, Math.min(maxCy, Math.round(H / 2 - ch / 2)));

  // Top bezel plaque spans y=0..0.113*ch; place Settings banner dead-center in that arch
  const bannerW = Math.round(cw * 0.64);
  const bannerH = Math.round(bannerW * (140 / 599));
  const headerBanner = {
    x: Math.round(W / 2 - bannerW / 2),
    y: cy - Math.round(ch * 0.005),
    w: bannerW,
    h: bannerH
  };

  // Interior area spans cleanly inside the glowing frame border
  const innerX = cx + Math.round(cw * 0.065);
  const innerW = cw - Math.round(cw * 0.13);
  const intTop = cy + Math.round(ch * 0.135);
  const intBot = cy + Math.round(ch * 0.905);
  const intH = intBot - intTop;

  // 4 centered rows from the user's sprite sheet (Row 3 Support centered, Row 4 Terms left & Privacy right)
  const topGap = 10;
  const topW = Math.round((innerW - topGap) / 2);
  const topH = Math.round(topW * (215 / 650));

  const spGap = 6;
  const spW = Math.floor((innerW - spGap * 2) / 3);
  const spWLast = innerW - spW * 2 - spGap * 2;
  const spH = Math.round(spW * (182 / 498));

  const supBtnW = Math.round(innerW * 0.50);
  const supBtnH = Math.round(supBtnW * (212 / 537));

  const tpH = 50;
  const termsW = Math.round(tpH * (435 / 209));
  const privacyW = Math.round(tpH * (522 / 214));
  const tpGap = Math.max(12, Math.min(24, innerW - termsW - privacyW - 16));
  const tpStartX = Math.round(W / 2 - (termsW + tpGap + privacyW) / 2);

  const rowGap = Math.max(10, Math.round((intH - topH - spH - supBtnH - tpH) / 5));
  const totalStackH = topH + spH + supBtnH + tpH + rowGap * 3;
  const startY = intTop + Math.round((intH - totalStackH) / 2);

  const row1Y = startY;
  const row2Y = row1Y + topH + rowGap;
  const row3Y = row2Y + spH + rowGap;
  const row4Y = row3Y + supBtnH + rowGap;

  const soundBtn = { x: innerX, y: row1Y, w: topW, h: topH };
  const vibrateBtn = { x: innerX + topW + topGap, y: row1Y, w: topW, h: topH };

  const speedNormalBtn = { x: innerX, y: row2Y, w: spW, h: spH };
  const speedFastBtn = { x: innerX + spW + spGap, y: row2Y, w: spW, h: spH };
  const speedTurboBtn = { x: innerX + (spW + spGap) * 2, y: row2Y, w: spWLast, h: spH };

  const supportBtn = { x: Math.round(W / 2 - supBtnW / 2), y: row3Y, w: supBtnW, h: supBtnH };
  const termsBtn = { x: tpStartX, y: row4Y, w: termsW, h: tpH };
  const privacyBtn = { x: tpStartX + termsW + tpGap, y: row4Y, w: privacyW, h: tpH };

  const legH = 294;
  const legY = Math.max(confSafeTop, Math.min(H - safeBot - legH, Math.round(H / 2 - legH / 2)));

  return {
    isPauseMode: false,
    cx, cy, cw, ch,
    headerBanner,
    closeCenter: { x: cx + cw - 12, y: cy + 20, r: 17 },
    soundBtn,
    vibrateBtn,
    speedNormalBtn,
    speedFastBtn,
    speedTurboBtn,
    supportBtn,
    termsBtn,
    privacyBtn,
    confirmBox: {
      x: confX, y: confY, w: confW, h: confH,
      yesBtn: { x: confX + 20, y: confBtnY, w: confBtnW, h: confBtnH },
      noBtn: { x: confX + confW - 20 - confBtnW, y: confBtnY, w: confBtnW, h: confBtnH }
    },
    supportBox: {
      x: supX, y: supY, w: supW, h: supH,
      closeCenter: { x: supX + supW - 14, y: supY + 14, r: 17 },
      resetBtn: { x: supX + 42, y: supY + supH - 108, w: supW - 84, h: 42 },
      closeBtn: { x: supX + 64, y: supY + supH - 56, w: supW - 128, h: 42 }
    },
    legalBox: {
      x: supX, y: legY, w: supW, h: legH,
      closeCenter: { x: supX + supW - 14, y: legY + 14, r: 17 },
      closeBtn: { x: supX + 64, y: legY + legH - 56, w: supW - 128, h: 42 }
    }
  };
}

function drawRoyalModalCardShell(x, y, w, h, radius = 26) {
  ctx.fillStyle = 'rgba(4, 18, 60, 0.45)';
  roundRect(ctx, x, y + 6, w, h, radius);
  ctx.fill();

  const cardGrad = ctx.createLinearGradient(0, y, 0, y + h);
  cardGrad.addColorStop(0, '#22a8ff');
  cardGrad.addColorStop(0.45, '#0b7ef5');
  cardGrad.addColorStop(1, '#0457d6');
  ctx.fillStyle = cardGrad;
  roundRect(ctx, x, y, w, h, radius);
  ctx.fill();

  ctx.strokeStyle = 'rgba(186, 230, 253, 0.88)';
  ctx.lineWidth = 2.2;
  roundRect(ctx, x + 2.5, y + 2.5, w - 5, h - 5, Math.max(4, radius - 2));
  ctx.stroke();

  ctx.strokeStyle = '#052873';
  ctx.lineWidth = 3.2;
  roundRect(ctx, x, y, w, h, radius);
  ctx.stroke();
}

function drawSpriteSettingsButton(rect, img, opts = {}) {
  const {
    isPressed = false,
    isHovered = false,
    isSelected = false,
    isOff = false,
    badgeText = null,
    fallbackTheme = BUTTON_THEMES.cyanBlue,
    fallbackLabel = ''
  } = opts;

  const dy = isPressed ? 2.5 : (isHovered ? -1 : 0);
  const dx = rect.x;
  const y = rect.y + dy;
  const w = rect.w;
  const h = rect.h;
  const radius = Math.min(22, Math.round(h * 0.46));

  ctx.save();
  if (isOff) ctx.globalAlpha = 0.68;

  if (isSelected) {
    ctx.shadowColor = 'rgba(254, 240, 138, 0.92)';
    ctx.shadowBlur = 12;
  } else if (isHovered) {
    ctx.shadowColor = 'rgba(186, 230, 253, 0.85)';
    ctx.shadowBlur = 9;
  }

  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, dx, y, w, h);
  } else {
    drawGlossyButton(dx, rect.y, w, h, isOff ? BUTTON_THEMES.disabled : fallbackTheme, fallbackLabel, null, isPressed, radius);
  }
  ctx.shadowBlur = 0;

  if (isPressed || isHovered) {
    ctx.save();
    roundRect(ctx, dx + 2, y + 2, w - 4, h - 4, radius);
    ctx.clip();
    ctx.fillStyle = isPressed ? 'rgba(0, 0, 0, 0.18)' : 'rgba(255, 255, 255, 0.14)';
    ctx.fillRect(dx, y, w, h);
    ctx.restore();
  }

  if (isOff) {
    ctx.globalAlpha = 1.0;
    const iconCenterX = dx + Math.round(h * 0.62);
    const iconCenterY = y + Math.round(h * 0.48);
    const sr = Math.round(h * 0.25);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 5.0;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(iconCenterX - sr, iconCenterY - sr);
    ctx.lineTo(iconCenterX + sr, iconCenterY + sr);
    ctx.stroke();
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 3.0;
    ctx.stroke();

    const pw = 30, ph = 15;
    const px = dx + w - pw - 5;
    const py = y - 4;
    ctx.fillStyle = '#dc2626';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    roundRect(ctx, px, py, pw, ph, 7.5);
    ctx.fill();
    ctx.stroke();
    drawGlossyText('OFF', px + pw / 2, py + ph / 2 + 0.5, 9, 'center', '#ffffff', '#450a0a', 2.2);
  } else if (isSelected) {
    ctx.strokeStyle = '#fef08a';
    ctx.lineWidth = 2.6;
    roundRect(ctx, dx + 0.5, y + 0.5, w - 1, h - 1, radius);
    ctx.stroke();
  }

  if (badgeText) {
    ctx.globalAlpha = 1.0;
    const pw = Math.max(24, badgeText.length * 8 + 10), ph = 15;
    const px = dx + w - pw - 3;
    const py = y - 5;
    ctx.fillStyle = isSelected ? '#16a34a' : '#0f172a';
    ctx.strokeStyle = isSelected ? '#fef08a' : '#93c5fd';
    ctx.lineWidth = 1.6;
    roundRect(ctx, px, py, pw, ph, 7.5);
    ctx.fill();
    ctx.stroke();
    drawGlossyText(badgeText, px + pw / 2, py + ph / 2 + 0.5, 9.2, 'center', '#ffffff', '#052e16', 2.2);
  }
  ctx.restore();
}

function drawAreYouSureSubPopup(layout, titleText, subtitle, yesTag, noTag) {
  const b = layout.confirmBox;
  ctx.fillStyle = 'rgba(6, 12, 28, 0.72)';
  ctx.fillRect(0, 0, W, H);

  drawRoyalModalCardShell(b.x, b.y, b.w, b.h, 24);
  drawRoyalSettingsRibbon(W / 2, b.y - 20, 210, 42, 'Confirm');

  drawGlossyText(titleText || 'Are you sure?', W / 2, b.y + 48, 20.5, 'center', '#fef08a', '#052873', 4.0);
  drawGlossyText(subtitle, W / 2, b.y + 80, 13, 'center', '#ffffff', '#052873', 3.0);

  drawGlossyButton(b.yesBtn.x, b.yesBtn.y, b.yesBtn.w, b.yesBtn.h, BUTTON_THEMES.redRim, 'Yes', null, activePress === yesTag, 16, { hovered: hoverKey === yesTag });
  drawGlossyButton(b.noBtn.x, b.noBtn.y, b.noBtn.w, b.noBtn.h, BUTTON_THEMES.silver, 'No', null, activePress === noTag, 16, { hovered: hoverKey === noTag });
}

const SUPPORT_EMAIL = 'luqmanthair260@gmail.com';
let trInfoModalEl = null;
let trModalRibbonEl = null;
let trModalScrollEl = null;
let trModalFooterEl = null;
let trModalToastEl = null;
let trModalToastTimer = null;
let trActiveModalKind = null;
let trBugFormOpen = false;

function getAppVersionLabel() {
  try {
    if (window.AndroidAppBridge && typeof window.AndroidAppBridge.getAppVersion === 'function') {
      const v = window.AndroidAppBridge.getAppVersion();
      if (v) return String(v);
    }
  } catch (e) {}
  return '1.0';
}

function buildSupportDiagnostics() {
  const stageNum = getStageNumber(curLevel);
  const stageName = getStage(curLevel).name;
  return [
    `Game: Thorn Rush v${getAppVersionLabel()}`,
    `Stage: ${stageNum} (${stageName})`,
    `Current Level: ${curLevel} (Highest: ${highestLevel})`,
    `Best Score: ${best}`,
    `Coins: ${wallet}`,
    `Speed Mode: ${speedMode}`,
    `Control Mode: ${controlMode} (Sensitivity ${controlSensitivity}x)`
  ].join('\n');
}

function showTrModalToast(msg) {
  if (!trModalToastEl || !trInfoModalEl || !trInfoModalEl.classList.contains('open')) return;
  trModalToastEl.textContent = msg;
  trModalToastEl.classList.add('visible');
  if (trModalToastTimer) clearTimeout(trModalToastTimer);
  trModalToastTimer = setTimeout(() => {
    if (trModalToastEl) trModalToastEl.classList.remove('visible');
  }, 1800);
}

function copySupportEmailAction() {
  playClickSound();
  let copied = false;
  try {
    if (window.AndroidAppBridge && typeof window.AndroidAppBridge.copyToClipboard === 'function') {
      window.AndroidAppBridge.copyToClipboard('Thorn Rush Support Email', SUPPORT_EMAIL);
      copied = true;
    }
  } catch (e) {}
  if (!copied && navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
    navigator.clipboard.writeText(SUPPORT_EMAIL).catch(() => {});
    copied = true;
  }
  triggerVibrate(25);
  showToast('Support email copied!');
}

function launchSupportEmailAction(subject, body) {
  triggerVibrate(25);
  playClickSound();
  try {
    if (window.AndroidAppBridge && typeof window.AndroidAppBridge.openSupportEmail === 'function') {
      window.AndroidAppBridge.openSupportEmail(SUPPORT_EMAIL, subject, body);
      showToast('Opening email app...');
      return;
    }
  } catch (e) {}
  const mailtoUrl = `mailto:${encodeURIComponent(SUPPORT_EMAIL)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  try {
    window.location.href = mailtoUrl;
  } catch (e) {}
  showToast('Contact: ' + SUPPORT_EMAIL);
}

function openExternalPolicyUrl(url) {
  triggerVibrate(20);
  playClickSound();
  try {
    if (window.AndroidAppBridge && typeof window.AndroidAppBridge.openExternalUrl === 'function') {
      window.AndroidAppBridge.openExternalUrl(url);
      return;
    }
  } catch (e) {}
  try { window.open(url, '_blank', 'noopener,noreferrer'); } catch (e) {}
}

function initTrInfoModalRefs() {
  if (trInfoModalEl) return;
  trInfoModalEl = document.getElementById('trInfoModal');
  trModalRibbonEl = document.getElementById('trModalRibbon');
  trModalScrollEl = document.getElementById('trModalScroll');
  trModalFooterEl = document.getElementById('trModalFooter');
  trModalToastEl = document.getElementById('trModalToast');
  const closeXBtn = document.getElementById('trModalCloseX');
  if (closeXBtn) {
    closeXBtn.addEventListener('click', () => {
      playClickSound();
      triggerVibrate(20);
      closeTrInfoModal();
    });
  }
  if (trInfoModalEl) {
    trInfoModalEl.addEventListener('click', (e) => {
      if (e.target === trInfoModalEl) {
        playClickSound();
        closeTrInfoModal();
      }
    });
  }
}

function syncTrInfoModalVisibility() {
  initTrInfoModalRefs();
  if (!trInfoModalEl) return;
  const shouldShow = Boolean(
    settingsOpen &&
    !settingsConfirmAction &&
    !controlsSubOpen &&
    (legalSubOpen === 'terms' || legalSubOpen === 'privacy' || supportSubOpen)
  );
  if (!shouldShow) {
    trInfoModalEl.classList.remove('open');
    trActiveModalKind = null;
    return;
  }
  const kind = (legalSubOpen === 'terms' || legalSubOpen === 'privacy') ? legalSubOpen : 'support';
  if (trActiveModalKind !== kind || !trInfoModalEl.classList.contains('open')) {
    trActiveModalKind = kind;
    renderTrInfoModalContent(kind);
    if (trModalScrollEl) trModalScrollEl.scrollTop = 0;
  }
  trInfoModalEl.classList.add('open');
}

function drawArched3DRibbon(cx, cy, w, h, text, variant = 'blue') {
  const sprInfo = getPackRibbonSpriteInfo(text);
  if (sprInfo) {
    ctx.save();
    const imgAspect = sprInfo.img.naturalWidth / sprInfo.img.naturalHeight;
    const drawW = Math.round(w + 10);
    const drawH = Math.round(drawW / imgAspect);
    const rx = Math.round(cx - drawW / 2);
    const ry = Math.round(cy + h * 0.46 - drawH * 0.57);
    ctx.shadowColor = 'rgba(10, 15, 30, 0.42)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 4;
    ctx.drawImage(sprInfo.img, rx, ry, drawW, drawH);
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    if (sprInfo.drawText) {
      const textCy = ry + drawH * 0.565;
      const fontSz = text.length >= 11 ? 20.5 : 22;
      drawArchedRibbonLabelText(cx, textCy, drawW * 0.54, fontSz, sprInfo.drawText, sprInfo.outline);
    }
    ctx.restore();
    return;
  }

  const palettes = {
    blue: {
      tailFill: '#063d9e', tailCrease: '#042569', outline: '#052873',
      top: '#60ccff', mid: '#168dff', bot: '#0856d6', rim: 'rgba(186, 230, 253, 0.85)',
      shadow: 'rgba(4, 24, 72, 0.36)'
    },
    purple: {
      tailFill: '#7e22ce', tailCrease: '#4c1d95', outline: '#581c87',
      top: '#f3e8ff', mid: '#c084fc', bot: '#9333ea', rim: 'rgba(255, 255, 255, 0.85)',
      shadow: 'rgba(59, 7, 100, 0.34)'
    },
    orange: {
      tailFill: '#c2410c', tailCrease: '#7c2d12', outline: '#7c2d12',
      top: '#fef08a', mid: '#facc15', bot: '#ea580c', rim: 'rgba(255, 251, 235, 0.88)',
      shadow: 'rgba(124, 45, 18, 0.36)'
    }
  };
  const P = palettes[variant] || palettes.blue;

  ctx.save();
  const halfW = w / 2;
  const tailW = 24;
  const arch = 8;

  for (const side of [-1, 1]) {
    ctx.fillStyle = P.tailFill;
    ctx.strokeStyle = P.outline;
    ctx.lineWidth = 2.0;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx + side * (halfW - 4), cy + 10);
    ctx.lineTo(cx + side * (halfW + tailW), cy + 14);
    ctx.lineTo(cx + side * (halfW + tailW - 6), cy + h * 0.60);
    ctx.lineTo(cx + side * (halfW + tailW - 2), cy + h + 5);
    ctx.lineTo(cx + side * (halfW - 6), cy + h + 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = P.tailCrease;
    ctx.beginPath();
    ctx.moveTo(cx + side * (halfW - 10), cy + h - 4);
    ctx.lineTo(cx + side * (halfW + 4), cy + h + 3);
    ctx.lineTo(cx + side * (halfW - 14), cy + h + 5);
    ctx.closePath();
    ctx.fill();
  }

  const traceRibbon = (ox, oy) => {
    ctx.beginPath();
    ctx.moveTo(cx - halfW + 6 + ox, cy + 4 + oy);
    ctx.quadraticCurveTo(cx + ox, cy - arch + oy, cx + halfW - 6 + ox, cy + 4 + oy);
    ctx.quadraticCurveTo(cx + halfW + 4 + ox, cy + 6 + oy, cx + halfW + 2 + ox, cy + h - 2 + oy);
    ctx.quadraticCurveTo(cx + ox, cy + h - arch * 0.8 + oy, cx - halfW - 2 + ox, cy + h - 2 + oy);
    ctx.quadraticCurveTo(cx - halfW - 4 + ox, cy + 6 + oy, cx - halfW + 6 + ox, cy + 4 + oy);
    ctx.closePath();
  };

  ctx.fillStyle = P.shadow;
  traceRibbon(0, 4);
  ctx.fill();

  const rGrad = ctx.createLinearGradient(0, cy - arch, 0, cy + h);
  rGrad.addColorStop(0, P.top);
  rGrad.addColorStop(0.45, P.mid);
  rGrad.addColorStop(1, P.bot);
  ctx.fillStyle = rGrad;
  traceRibbon(0, 0);
  ctx.fill();

  ctx.save();
  traceRibbon(0, 0);
  ctx.clip();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.30)';
  ctx.beginPath();
  ctx.moveTo(cx - halfW, cy + 5);
  ctx.quadraticCurveTo(cx, cy - arch, cx + halfW, cy + 5);
  ctx.lineTo(cx + halfW, cy + h * 0.42);
  ctx.quadraticCurveTo(cx, cy + h * 0.25, cx - halfW, cy + h * 0.42);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = P.rim;
  ctx.lineWidth = 1.6;
  traceRibbon(0, 1);
  ctx.stroke();

  ctx.strokeStyle = P.outline;
  ctx.lineWidth = 2.6;
  traceRibbon(0, 0);
  ctx.stroke();

  drawGoldStar(cx - halfW + 23, cy + h / 2 + 1, 10.2);
  drawGoldStar(cx + halfW - 23, cy + h / 2 + 1, 10.2);
  drawSparkleStar(cx - halfW + 44, cy + h - 8, 4.5, 0.9);
  drawSparkleStar(cx + halfW - 42, cy + 7, 5.0, 0.95);

  const fontSz = text.length > 10 ? 20.5 : 23;
  drawGlossyText(text, cx, cy + h / 2, fontSz, 'center', '#ffffff', P.outline, 4.6);
  ctx.restore();
}

function drawRoyalSettingsRibbon(cx, cy, w, h, text) {
