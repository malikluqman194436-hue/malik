// High-visibility spinning tire with stationary alloy rim using cached tire sprite
function drawSpinningWheel(ctx, wx, wy, tireR, rimR, spinAngle, rimSprite) {
  ctx.save();
  ctx.translate(wx, wy);

  if (tireRingSprite) {
    ctx.save();
    ctx.rotate(spinAngle);
    ctx.drawImage(tireRingSprite, -tireR, -tireR, tireR * 2, tireR * 2);
    ctx.restore();
  } else {
    ctx.fillStyle = '#101216';
    ctx.beginPath();
    ctx.arc(0, 0, tireR, 0, Math.PI * 2);
    ctx.fill();
  }

  // 3. ALLOY RIM: STATIONARY (Alloy rim does NOT spin)
  if (rimSprite) {
    const rimD = rimR * 2;
    ctx.drawImage(rimSprite, -rimR, -rimR, rimD, rimD);
  }

  ctx.restore();
}

let carRearGlowSprite = null;
let carFrontGlowSprite = null;
function ensureCarLightSprites() {
  if (!carRearGlowSprite) {
    const rc = document.createElement('canvas');
    rc.width = 48;
    rc.height = 32;
    const rCtx = rc.getContext('2d');
    const rg = rCtx.createRadialGradient(34, 16, 1, 22, 16, 22);
    rg.addColorStop(0, 'rgba(255, 30, 70, 0.90)');
    rg.addColorStop(0.4, 'rgba(239, 68, 68, 0.45)');
    rg.addColorStop(1, 'rgba(220, 38, 38, 0)');
    rCtx.fillStyle = rg;
    rCtx.fillRect(0, 0, 48, 32);
    carRearGlowSprite = rc;
  }
  if (!carFrontGlowSprite) {
    const fc = document.createElement('canvas');
    fc.width = 110;
    fc.height = 64;
    const fCtx = fc.getContext('2d');
    const fg = fCtx.createRadialGradient(10, 32, 1, 54, 32, 85);
    fg.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
    fg.addColorStop(0.32, 'rgba(103, 232, 249, 0.45)');
    fg.addColorStop(1, 'rgba(56, 189, 248, 0)');
    fCtx.fillStyle = fg;
    fCtx.beginPath();
    fCtx.moveTo(10, 30);
    fCtx.lineTo(100, 12);
    fCtx.lineTo(100, 52);
    fCtx.lineTo(10, 34);
    fCtx.closePath();
    fCtx.fill();
    carFrontGlowSprite = fc;
  }
}

// Front Headlights and Back Taillights (pre-rendered light sprites to avoid per-frame gradient allocations)
function drawCarLights(ctx, drawW, drawH, intensity) {
  if (intensity <= 0.01) return;
  ensureCarLightSprites();
  const lightAlpha = Math.min(1.0, intensity);
  const rearLX = -drawW / 2 + 6.0;
  const rearLY = -1.2;
  const frontLX = drawW / 2 - 5.5;
  const frontLY = -2.2;

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = lightAlpha;
  ctx.drawImage(carRearGlowSprite, rearLX - 34, rearLY - 16);
  ctx.drawImage(carFrontGlowSprite, frontLX - 10, frontLY - 32);
  ctx.restore();
}

function car(drawX = CAR_X) {
  const drawW = CAR_DRAW_W;
  const drawH = CAR_DRAW_H;
  // Align bottom of tires to the exact same ground baseline as the original car (cy + 24)
  const groundBaseline = cy + 24;
  const carCenterY = groundBaseline - drawH / 2;

  // Soft dark ground shadow under the car tires
  ctx.save();
  ctx.fillStyle = 'rgba(15, 23, 42, 0.28)';
  ctx.beginPath();
  ctx.ellipse(drawX, groundBaseline - 2, drawW * 0.42, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Soft blue glow ellipse on the road or air below the car (alpha 0.25)
  if (SHOW_FLAMES && flameIntensity > 0.01) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const glowY = carCenterY + drawH / 2 + 18;
    const glowW = drawW * 0.36;
    const glowH = 11;
    ctx.fillStyle = `rgba(56, 189, 248, ${(0.18 * flameIntensity).toFixed(3)})`;
    ctx.beginPath();
    ctx.ellipse(drawX - 2, glowY, glowW, glowH, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Draw car always horizontal (perfectly straight, no rotation or tilt)
  ctx.save();
  ctx.translate(drawX, carCenterY);

  // Jet thruster flames under the car (additive blending)
  if (SHOW_FLAMES && flameIntensity > 0.01) {
    drawJetFlames(ctx, drawW, drawH, gameTime);
  }

  if (trimmedCarCanvas) {
    ctx.drawImage(trimmedCarCanvas, -drawW / 2, -drawH / 2, drawW, drawH);

    // Metal nozzle pods sliding out from under the body
    if (SHOW_FLAMES && podDeploy > 0.01) {
      drawThrusterPods(ctx, drawW, drawH);
    }

    // Dynamic spinning tires & stationary alloy rims (tires spin with visible treads, alloy rim does NOT spin)
    const rearX = -drawW / 2 + drawW * WHEEL_REAR_X;
    const frontX = -drawW / 2 + drawW * WHEEL_FRONT_X;
    const wheelY = -drawH / 2 + drawH * WHEEL_Y;
    const tireR = drawW * WHEEL_RADIUS;
    const rimR = drawW * WHEEL_SPIN_RADIUS;

    if (wheelSpritesReady && rearWheelSprite && frontWheelSprite) {
      try {
        drawSpinningWheel(ctx, rearX, wheelY, tireR, rimR, wheelAngle, rearWheelSprite);
        drawSpinningWheel(ctx, frontX, wheelY, tireR, rimR, wheelAngle, frontWheelSprite);
      } catch (err) {
        console.warn('Failed to render spinning wheels:', err);
      }
    }

    // Front headlights and rear taillights (illuminate when pressing/lifting the car)
    drawCarLights(ctx, drawW, drawH, carLightIntensity);
  } else {
    // Fallback to drawn car if image fails to load
    if (SHOW_FLAMES && podDeploy > 0.01) {
      drawThrusterPods(ctx, drawW, drawH);
    }
    ctx.scale(CAR_SCALE, CAR_SCALE);
    renderCarBody(wheelRot);
  }
  ctx.restore();
}

// Background drawing: clean cinematic background with 3 parallax silhouettes, haze, particles, tunnel dark gradient and vignette
function drawParallaxLayer(layerCanv, rate) {
  if (!layerCanv) return;
  const unitW = layerCanv.width;
  const scrollX = cam * rate;
  const relX = -((scrollX % unitW + unitW) % unitW);
  ctx.drawImage(layerCanv, relX, 0);
  if (relX + unitW < W) {
    ctx.drawImage(layerCanv, relX + unitW, 0);
  }
  if (relX > 0) {
    ctx.drawImage(layerCanv, relX - unitW, 0);
  }
}

function drawPreRenderedStage(bgData) {
  if (bgData.gradient) {
    ctx.drawImage(bgData.gradient, 0, 0);
  }
  drawParallaxLayer(bgData.far, 0.08);
  drawParallaxLayer(bgData.mid, 0.14);
  drawParallaxLayer(bgData.near, 0.22);
}

function drawStageScene(stageNum, alpha = 1) {
  const stageIdx = (stageNum - 1) % STAGES.length;
  const stage = STAGES[stageIdx];

  ctx.save();
  ctx.globalAlpha = alpha;

  const pic = (stage.backgroundPicture && stage.backgroundPicture.length > 0) ? getLevelPicture(curLevel) : null;
  if (pic && pic.seamlessCanvas) {
    const sc = pic.seamlessCanvas;
    const unitW = pic.unitW;
    const cw = sc.width;
    const ch = sc.height;
    const scaleX = cw / unitW;
    const scrollX = cam * 0.15;
    let drawX = -((scrollX % unitW + unitW) % unitW);
    while (drawX > 0) drawX -= unitW;
    while (drawX < W) {
      const visStart = Math.max(0, -drawX);
      const visEnd = Math.min(unitW, W - drawX);
      const visW = visEnd - visStart;
      if (visW > 0.2) {
        const sx = visStart * scaleX;
        const sw = visW * scaleX;
        ctx.drawImage(sc, sx, 0, sw, ch, drawX + visStart, 0, visW, H);
      }
      drawX += unitW;
    }
  } else {
    const bgData = getOrBuildStageBg(stageIdx);
    if (bgData) {
      drawPreRenderedStage(bgData);
    } else {
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, stage.gradientTop);
      grad.addColorStop(1, stage.gradientBottom);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }
  }

  ctx.restore();
}

function drawHomeScenicBackground() {
  const img = homeBgLoadedImg;
  const iw = img.naturalWidth;
  const ih = img.naturalHeight;
  const drawW = W;
  const drawH = W * (ih / iw);

  // Place the horizontal road's lower asphalt lane (normY ~0.858) directly under the car tires
  const targetTireY = CAR_REST_Y + 24;
  const idealDrawY = targetTireY - 0.858 * drawH;
  const drawY = Math.round(Math.max(-26, Math.min(56, idealDrawY)));

  // Seamless top sky extension on tall aspect ratios (drawY > 0)
  if (drawY > 0) {
    ctx.drawImage(img, 0, 0, iw, 8, 0, 0, W, drawY + 2);
  }

  ctx.drawImage(img, 0, drawY, drawW, drawH);

  // Seamless bottom meadow grass extension below the artwork down to H
  const bottomEdge = drawY + drawH;
  if (bottomEdge < H) {
    const stripSrcH = Math.min(130, Math.floor(ih * 0.095));
    const stripDrawH = Math.max(40, Math.round(drawW * (stripSrcH / iw)));
    let curY = bottomEdge - 2;
    let flip = true;
    while (curY < H) {
      ctx.save();
      if (flip) {
        ctx.translate(0, curY + stripDrawH);
        ctx.scale(1, -1);
        ctx.drawImage(img, 0, ih - stripSrcH, iw, stripSrcH, 0, 0, drawW, stripDrawH + 2);
      } else {
        ctx.drawImage(img, 0, ih - stripSrcH, iw, stripSrcH, 0, curY, drawW, stripDrawH + 2);
      }
      ctx.restore();
      curY += stripDrawH;
      flip = !flip;
    }
  }
}

function drawBackground() {
  if (isShowingHomeVisuals() && homeBgLoadedImg && homeBgLoadedImg.naturalWidth > 0) {
    drawHomeScenicBackground();
    return;
  }

  if (bgCrossFadeTimer > 0 && prevBgStage !== currentBgStage) {
    const fade = 1 - Math.max(0, Math.min(1, bgCrossFadeTimer / 0.6));
    drawStageScene(prevBgStage, 1);
    drawStageScene(currentBgStage, fade);
  } else {
    drawStageScene(currentBgStage, 1);
  }

  // Soft vignette + tunnel darkening band baked into vignetteCanvas
  if (vignetteCanvas) {
    ctx.drawImage(vignetteCanvas, 0, 0);
  }
}


// ==========================================
// GAME LOOP (STEP & DRAW)
// ==========================================
function step(dt) {
  syncAndroidBackState();
  const sp = speed();
  if (toastTimer > 0) {
    toastTimer -= dt;
    if (toastTimer <= 0) toastMsg = null;
  }

  if (paused) {
    hold = false;
    wasThrustActive = false;
    puffHoldTimer = 0;
    return;
  }

  if (pauseCountdown > 0) {
    hold = false;
    wasThrustActive = false;
    puffHoldTimer = 0;
    pauseCountdown = Math.max(0, pauseCountdown - dt);
    if (pauseCountdown <= 0) {
      resumeGameAudio();
    }
    return;
  }

  if (st === 'loading') {
    loadingTimer += dt;
    loadingWheelRot += dt * 14;

    const MIN_LOAD_DURATION = 2.7; // Pace loading bar smoothly over ~2.7-3.0 seconds

    // Hard timeout check: after 6 seconds, stop waiting and continue with fallbacks
    if (loadingTimer >= 6.0 && !assetsFinished) {
      console.warn('Hard timeout reached (6s); continuing with fallback visuals');
      assetsFinished = true;
    }

    const timeGatePassed = (loadingTimer >= MIN_LOAD_DURATION);

    if (!assetsFinished || !timeGatePassed) {
      // Smoothly pace displayed progress over MIN_LOAD_DURATION while tracking real asset completion
      const realProgress = totalAssets > 0 ? (finishedAssetsCount / totalAssets) : 1;
      const tNorm = Math.min(1, loadingTimer / MIN_LOAD_DURATION);
      const easedTimeProgress = 1 - Math.pow(1 - tNorm, 1.45);
      const targetProgress = Math.min(realProgress, Math.min(0.98, easedTimeProgress));

      // Animate displayed value smoothly toward target, never jump backwards
      visualLoadProgress = Math.max(visualLoadProgress, Math.min(targetProgress, visualLoadProgress + dt * 0.95));
      progressAtFinish = visualLoadProgress;
    } else {
      // Both assets finished and min 2.7s elapsed: sweep cleanly to 100%
      finishFillTimer += dt;
      const fillT = Math.min(1, finishFillTimer / 0.25);
      visualLoadProgress = Math.max(visualLoadProgress, progressAtFinish + (1 - progressAtFinish) * fillT);

      // Show "100%", hold briefly, then fade out into main menu
      if (visualLoadProgress >= 0.999) {
        visualLoadProgress = 1;
        holdTimer += dt;
        if (holdTimer >= 0.25) {
          loadingFade += dt / 0.4;
          if (loadingFade >= 1) {
            st = 'ready';
            menuFadeTimer = 0;
            menuExiting = false;
            menuExitTimer = 0;
            updateMasterAudioGains();
            syncHomeMusicState();
          }
        }
      }
    }
    return;
  }

  if (bgCrossFadeTimer > 0) {
    bgCrossFadeTimer = Math.max(0, bgCrossFadeTimer - dt);
  }

  // Coin combo reset & counter bump decay
  if (coinComboTimer > 0) {
    coinComboTimer -= dt;
    if (coinComboTimer <= 0) coinCombo = 0;
  }
  if (coinCounterBump > 1.0) {
    coinCounterBump = Math.max(1.0, coinCounterBump - dt * 2.5);
  }

  // Update flying coins
  for (let i = flyingCoins.length - 1; i >= 0; i--) {
    const fc = flyingCoins[i];
    fc.t += dt / fc.dur;
    if (fc.t >= 1.0) {
      flyingCoins.splice(i, 1);
      coinCounterBump = 1.35;
    } else if (fc.t > 0) {
      const t = fc.t;
      const ease = t * t * (3 - 2 * t);
      fc.curX = fc.startX + (fc.endX - fc.startX) * ease;
      fc.curY = fc.startY + (fc.endY - fc.startY) * ease;
    } else {
      fc.curX = fc.startX;
      fc.curY = fc.startY;
    }
  }

  // Update Shop animations & smooth coin countdown early (skip stage background physics behind opaque shop)
  if (shopOpen) {
    gameTime += dt;
    if (Math.abs(shopDisplayedWallet - wallet) > 0.4) {
      const diff = wallet - shopDisplayedWallet;
      const stepAmt = diff * Math.min(1, dt * 11);
      shopDisplayedWallet += (Math.abs(stepAmt) < 0.5) ? Math.sign(diff) * Math.min(Math.abs(diff), 40 * dt) : stepAmt;
      if (Math.abs(wallet - shopDisplayedWallet) < 0.6) shopDisplayedWallet = wallet;
    } else {
      shopDisplayedWallet = wallet;
    }
    if (shopNoCoinsTimer > 0) shopNoCoinsTimer = Math.max(0, shopNoCoinsTimer - dt);
    for (const k in shopCardAnim) {
      if (shopCardAnim[k].pop > 0) shopCardAnim[k].pop = Math.max(0, shopCardAnim[k].pop - dt);
      if (shopCardAnim[k].shake > 0) shopCardAnim[k].shake = Math.max(0, shopCardAnim[k].shake - dt);
    }
    for (let i = shopSparkles.length - 1; i >= 0; i--) {
      const spk = shopSparkles[i];
      spk.x += spk.vx * dt;
      spk.y += spk.vy * dt;
      spk.vy += 190 * dt;
      spk.life -= dt;
      if (spk.life <= 0) shopSparkles.splice(i, 1);
    }
    if (!shopDragActive && Math.abs(shopDragVelocity) > 2) {
      shopScrollY = Math.max(0, Math.min(shopMaxScroll, shopScrollY - shopDragVelocity * dt));
      shopDragVelocity *= Math.exp(-8 * dt);
      if (Math.abs(shopDragVelocity) < 5) shopDragVelocity = 0;
    }
    return;
  }

  if (bgPopupOpen) {
    if (!bgDragActive && Math.abs(bgDragVelocity) > 2) {
      bgScrollY = Math.max(0, Math.min(bgMaxScroll, bgScrollY - bgDragVelocity * dt));
      bgDragVelocity *= Math.exp(-8 * dt);
      if (Math.abs(bgDragVelocity) < 5) bgDragVelocity = 0;
    }
    return;
  }

  const curStageIdx = (currentBgStage - 1) % STAGES.length;
  updateStageParticles(dt, STAGES[curStageIdx]);
  updateWindSound(dt, sp);

  // Update coin sparkles
  for (let i = coinSparkles.length - 1; i >= 0; i--) {
    const spk = coinSparkles[i];
    spk.x += spk.vx * dt;
    spk.y += spk.vy * dt;
    spk.vy += 220 * dt;
    spk.life -= dt;
    if (spk.life <= 0) coinSparkles.splice(i, 1);
  }

  // Update floating +1 / +5 texts
  for (let i = coinFloatTexts.length - 1; i >= 0; i--) {
    const ft = coinFloatTexts[i];
    ft.y -= 38 * dt;
    ft.timer -= dt;
    if (ft.timer <= 0) coinFloatTexts.splice(i, 1);
  }

  // Booster timers & smooth ramp (ramps up in 0.35s, slows back in 0.5s)
  if (magnetTimer > 0) {
    magnetTimer = Math.max(0, magnetTimer - dt);
  }
  if (slowMoTimer > 0) {
    slowMoTimer = Math.max(0, slowMoTimer - dt);
  }
  if (shieldBreakInvulnTimer > 0) {
    shieldBreakInvulnTimer = Math.max(0, shieldBreakInvulnTimer - dt);
  }
  if (boostTimer > 0) {
    boostTimer = Math.max(0, boostTimer - dt);
    boostElapsed += dt;
    const rampUp = Math.min(1.0, boostElapsed / 0.35);
    const rampDown = (boostTimer < 0.5) ? Math.max(0, boostTimer / 0.5) : 1.0;
    boostRampFactor = Math.min(rampUp, rampDown);
    if (boostTimer <= 0) {
      boostRampFactor = 0;
      boostElapsed = 0;
    }
    boostProtectionTimer = 0;
  } else {
    boostRampFactor = 0;
    boostElapsed = 0;
    boostProtectionTimer = 0;
  }

  // Safety: Stop any running boost 2 seconds before the finish road arrives
  const distToFinish = FINISH_ROAD_X - (cam + CAR_X);
  const timeToFinish = distToFinish / Math.max(1, sp);
  if (timeToFinish <= 2.0 && (boostTimer > 0 || boostRampFactor > 0)) {
    boostTimer = 0;
    boostRampFactor = 0;
    boostElapsed = 0;
  }

  // Ghost copies trail
  for (let i = carGhostTrail.length - 1; i >= 0; i--) {
    carGhostTrail[i].alpha -= dt * 2.2;
    if (carGhostTrail[i].alpha <= 0) {
      carGhostTrail.splice(i, 1);
    }
  }
  if (boostRampFactor > 0.05 && st === 'play' && finishRunStage === 'none' && !stopping) {
    ghostSpawnTimer += dt;
    if (ghostSpawnTimer >= 0.035) {
      ghostSpawnTimer = 0;
      if (carGhostTrail.length < 14) {
        carGhostTrail.push({
          x: carDrawX,
          y: cy,
          alpha: 0.55 * boostRampFactor
        });
      }
    }
  }

  // Update booster sparkles and pop timers
  for (let i = 0; i < boosters.length; i++) {
    const b = boosters[i];
    if (b.collected && b.popTimer > 0) {
      b.popTimer = Math.max(0, b.popTimer - dt);
    } else if (!b.collected) {
      if (Math.random() < 0.20) {
        spawnBoosterSparkle(b.x, b.y, false);
      }
    }
  }
  for (let i = 0; i < boosterSparklePool.length; i++) {
    const s = boosterSparklePool[i];
    if (s.active) {
      s.life += dt;
      if (s.life >= s.maxLife) {
        s.active = false;
      } else {
        s.x += s.vx * dt;
        s.y += s.vy * dt;
      }
    }
  }

  // Update collected coins pop animation
  for (let i = 0; i < coins.length; i++) {
    const c = coins[i];
    if (c.collected && c.popTimer > 0) {
      c.popTimer = Math.max(0, c.popTimer - dt);
    }
  }

  // Coin and Booster collision detection during play
  if (st === 'play' && !stopping) {
    const carCX = cam + carDrawX;
    const carCY = cy;

    // Booster pickup (pickup radius 0.95 * carVis, measured from car's center)
    for (let i = 0; i < boosters.length; i++) {
      const b = boosters[i];
      if (b.collected) continue;
      const dx = b.x - carCX;
      if (dx < -BOOSTER_PICKUP_RADIUS || dx > BOOSTER_PICKUP_RADIUS) continue;
      const dy = b.y - carCY;
      if (Math.hypot(dx, dy) <= BOOSTER_PICKUP_RADIUS) {
        b.collected = true;
        b.popTimer = 0.3;
        // Collecting a second booster during a boost adds 2 seconds (at most 6)
        if (boostTimer > 0) {
          boostTimer = Math.min(6.0, boostTimer + 2.0);
          boostMaxDuration = Math.max(boostMaxDuration, boostTimer);
        } else {
          boostTimer = BOOST_DURATION;
          boostMaxDuration = BOOST_DURATION;
          boostElapsed = 0;
        }
        playBoostWhooshSound();
        coinFloatTexts.push({
          text: 'BOOST!',
          x: carDrawX,
          y: cy - 28,
          timer: 0.9,
          color: '#38bdf8'
        });
        for (let k = 0; k < 14; k++) {
          spawnBoosterSparkle(b.x, b.y, true);
        }
      }
    }

    for (let i = 0; i < coins.length; i++) {
      const c = coins[i];
      if (c.collected) continue;

      if (magnetTimer > 0) {
        const mdx = carCX - c.x;
        const mdy = carCY - c.y;
        const mdist = Math.hypot(mdx, mdy);
        if (mdist > 1 && mdist <= MAGNET_RANGE) {
          const pullSpeed = (520 + (MAGNET_RANGE - mdist) * 2.2) * dt;
          const stepPull = Math.min(mdist, pullSpeed);
          c.x += (mdx / mdist) * stepPull;
          c.y += (mdy / mdist) * stepPull;
        }
      }

      const dx = c.x - carCX;
      if (dx < -PICKUP_RADIUS || dx > PICKUP_RADIUS) continue;

      const dy = c.y - carCY;
      if (Math.hypot(dx, dy) <= PICKUP_RADIUS) {
        c.collected = true;
        c.popTimer = 0.22;
        const baseVal = c.val || (c.type === 'gem' ? GEM_VALUE : ((c.type === 'gold') ? GOLD_VALUE : ((c.type === 'silver') ? SILVER_VALUE : BRONZE_VALUE)));
        const coinMultiplier = (boostTimer > 0) ? 2 : 1;
        const val = baseVal * coinMultiplier;
        levelCoinsCollected += val;
        wallet += val;
        walletDirty = true;
        playCoinPickupSound(c.type);

        const screenX = c.x - cam;
        const screenY = c.y;

        // Sparkle color matches coin metal
        const spkColor = (c.type === 'gem') ? '#38bdf8' : ((c.type === 'silver') ? '#e2e8f0' : '#fde047');
        for (let s = 0; s < 6; s++) {
          const spkAng = (s / 6) * Math.PI * 2 + (Math.random() * 0.4);
          const spkSpeed = rnd(40, 110);
          coinSparkles.push({
            x: screenX,
            y: screenY,
            vx: Math.cos(spkAng) * spkSpeed,
            vy: Math.sin(spkAng) * spkSpeed - 30,
            life: 0.32,
            maxLife: 0.32,
            size: rnd(2.0, 3.8),
            color: spkColor
          });
        }

        // Flying coin animation to HUD
        flyingCoins.push({
          startX: screenX,
          startY: screenY,
          curX: screenX,
          curY: screenY,
          endX: W - 55,
          endY: 50 + topInset,
          t: 0,
          dur: 0.35,
          type: c.type
        });

        // Floating real value text (clean numbers: +10, +50, +100, doubled during boost):
        if (c.type === 'coin_10' || c.type === 'bronze' || !c.type || c.type === 'coin') {
          bronzeCoinsPicked++;
          if (bronzeCoinsPicked % 3 === 0) {
            coinFloatTexts.push({
              text: (coinMultiplier === 2) ? '+20' : '+10',
              x: carDrawX,
              y: cy - 24,
              timer: 0.65,
              color: (coinMultiplier === 2) ? '#38bdf8' : '#fde047'
            });
          }
        } else if (c.type === 'coin_50' || c.type === 'gold' || c.type === 'silver') {
          coinFloatTexts.push({
            text: (coinMultiplier === 2) ? '+100' : '+50',
            x: carDrawX,
            y: cy - 24,
            timer: 0.65,
            color: (coinMultiplier === 2) ? '#38bdf8' : '#fde047'
          });
        } else if (c.type === 'coin_100' || c.type === 'gem') {
          coinFloatTexts.push({
            text: (coinMultiplier === 2) ? '+200' : '+100',
            x: carDrawX,
            y: cy - 24,
            timer: 0.65,
            color: '#38bdf8'
          });
        }
      }
    }
  }

  if (st === 'ready') {
    cy = CAR_REST_Y;
    vy = 0;
    thrust = 0;
    cam = 0;
    levelRunTimer = 0;
    displayedSpeedKmH = 0;
    menuFadeTimer += dt;
    gameTime += dt;
    if (menuExiting) {
      menuExitTimer += dt;
      if (menuExitTimer >= MENU_EXIT_DURATION) {
        menuExiting = false;
        menuExitTimer = 0;
        startLevelWithTransition(curLevel, true);
      }
    }
  } else if (st === 'transition') {
    transitionTimer += dt;
    levelRunTimer = 0;

    // Wait until blackout frame is guaranteed painted before initializing the level
    if (transitionTimer >= IRIS_CLOSE_DURATION + 0.015 && !levelTransitionInitialized) {
      startLevel(curLevel);
      levelTransitionInitialized = true;
      syncHomeMusicState();
    }

    if (levelTransitionInitialized) {
      cy = CAR_REST_Y;
      vy = 0;
      thrust = 0;
      cam = 0;
    }

    if (transitionTimer >= TITLE_CARD_DURATION) {
      if (transitionTargetState === 'ready') {
        st = 'ready';
        menuFadeTimer = 0.3;
        hold = false;
        thrust = 0;
        levelRunTimer = 0;
        cam = 0;
        syncAndroidBackState();
        syncHomeMusicState();
      } else {
        st = 'play';
        hold = false;
        thrust = 0;
        levelRunTimer = 0;
        cam = 0;
        syncHomeMusicState();
      }
    }
  } else if (st === 'play') {
    const wx = cam + CAR_X;
    if (birdCrashDelayTimer > 0) {
      birdCrashDelayTimer -= dt;
      hold = false;
      thrust = 0;
      gameTime += dt;
      updateSparks(dt, sp);
      updateHazardParticles(dt);
      updateFloatingTexts(dt);
      updateFallingBirdsOnly(dt);
      updateThrustAudio(dt);
      if (birdCrashDelayTimer <= 0) {
        birdCrashDelayTimer = 0;
        die();
      }
      return;
    }

    levelRunTimer += dt;
    const progress = getLevelProgress();

    // 1. Player-controlled flight & landing (NO autopilot):
    // Substepped vertical integration keeps ascent & descent silky-smooth across frame rate variations.
    if (finishRunStage === 'none') {
      if (tapBoostTimer > 0) tapBoostTimer = Math.max(0, tapBoostTimer - dt);
      const physSteps = dt > 0.022 ? 2 : 1;
      const subDt = dt / physSteps;
      const effectiveAirDrag = (easyHoverEnabled || autoGlideAssist) ? 2.1 : AIR_DRAG;
      const dragFactor = Math.exp(-effectiveAirDrag * subDt);
      const liftInput = (controlMode === 'tap') ? (hold || tapBoostTimer > 0) : hold;
      for (let ps = 0; ps < physSteps; ps++) {
        if (liftInput) {
          thrust = Math.min(1, thrust + subDt / THRUST_RISE_TIME);
        } else {
          thrust = Math.max(0, thrust - subDt / THRUST_FALL_TIME);
        }
        const vertAccel = -LIFT_ACCEL * thrust + GRAVITY * (1 - thrust);
        vy += vertAccel * subDt;
        vy *= dragFactor;
        if (autoGlideAssist && !liftInput && vy > MAX_DOWN_SPEED * 0.65) {
          vy = MAX_DOWN_SPEED * 0.65;
        }
        vy = Math.max(-MAX_UP_SPEED, Math.min(MAX_DOWN_SPEED, vy));
        cy += vy * subDt;
      }
      // Back and Front lights activate when pressing/lifting the car
      const targetCarLight = (hold || thrust > 0.04) ? 1.0 : 0.0;
      carLightIntensity += (targetCarLight - carLightIntensity) * Math.min(1.0, dt * 14.0);

      const onStartPlatform = (wx >= START_ROAD_START && wx <= START_ROAD_END);
      const onFinishPlatform = (wx >= FINISH_ROAD_X && wx <= FINISH_ROAD_END);
      const onRoadPlatform = onStartPlatform || onFinishPlatform;

      if (onRoadPlatform) {
        if (!hold && cy >= CAR_REST_Y) {
          cy = CAR_REST_Y;
          vy = 0;
          thrust = 0;
        } else if (cy > CAR_REST_Y) {
          cy = CAR_REST_Y;
          if (vy > 0) vy = 0;
        }
      }

      // Safety fallback only if needed: if the road has passed under the car's front (near finish line)
      // and the car is still in the air, then, and only then, ease the car down gently to the road in about 0.6 seconds.
      const roadPassedFront = (wx >= finishLineWorldX - 100);
      if (roadPassedFront && cy < CAR_REST_Y) {
        if (safetyLandingTimer === 0) {
          safetyLandingStartY = cy;
        }
        safetyLandingTimer += dt;
        const safeT = Math.min(1.0, safetyLandingTimer / 0.6);
        const easeSafe = safeT * safeT * (3 - 2 * safeT);
        cy = safetyLandingStartY + (CAR_REST_Y - safetyLandingStartY) * easeSafe;
        if (safeT >= 1.0) {
          cy = CAR_REST_Y;
          vy = 0;
        }
      } else if (!roadPassedFront) {
        safetyLandingTimer = 0;
      }

      if (cy < 16) { cy = 16; vy = 0; }
      if (cy > H - 16) { cy = H - 16; vy = 0; }

      // Landing moment: as soon as car lands on finish road (tires touch asphalt), start finish run!
      if (wx >= FINISH_ROAD_X && cy >= CAR_REST_Y - 2) {
        finishRunStage = 'speed_run';
        finishRunTimer = 0;
        landingScrollSpeed = sp;
        cy = CAR_REST_Y;
        vy = 0;
        hold = false;
        thrust = 0;
        playWinSound();
      }
    }

    // 2. FINISH RUN EXECUTION:
    const camStop = FINISH_ROAD_END - ROAD_END_STOP_X;
    const easeDist = FINISH_RUN_SPEED * 0.5 * 0.5; // distance during 0.5s deceleration = 0.30 * W
    const wheelRadiusPx = CAR_DRAW_W * WHEEL_RADIUS;

    if (finishRunStage !== 'none') {
      hold = false;
      thrust = 0;
      cy = CAR_REST_Y;
      vy = 0;

      if (finishRunStage === 'speed_run') {
        finishRunTimer += dt;
        const accelT = Math.min(1.0, finishRunTimer / 0.5);
        const currentScrollSp = lerp(landingScrollSpeed, FINISH_RUN_SPEED, accelT);
        cam += currentScrollSp * dt;
        carDrawX = CAR_X;

        // Wheels spin at fastest speed
        if (wheelRadiusPx > 0) {
          const maxSpin = (FINISH_RUN_SPEED / wheelRadiusPx) * 2.5;
          wheelAngle += maxSpin * dt;
          wheelRot = wheelAngle;
        }

        // Subtle white dust at tires
        if (Math.random() < 0.45) {
          spawnTireDust();
        }

        if (cam >= camStop - easeDist) {
          finishRunStage = 'scroll_stopping';
          scrollStopTimer = 0;
          camEaseStart = cam;
          camEaseDist = camStop - cam;
        }
      } else if (finishRunStage === 'scroll_stopping') {
        scrollStopTimer += dt;
        const t = Math.min(1.0, scrollStopTimer / 0.5);
        const progressEase = 1 - Math.pow(1 - t, 2);
        cam = camEaseStart + camEaseDist * progressEase;
        carDrawX = CAR_X;

        const currentScrollSp = FINISH_RUN_SPEED * (1 - t);
        if (wheelRadiusPx > 0) {
          const spinRate = (currentScrollSp / wheelRadiusPx) * 2.5;
          wheelAngle += spinRate * dt;
          wheelRot = wheelAngle;
        }

        if (Math.random() < 0.35 * (1 - t)) {
          spawnTireDust();
        }

        if (t >= 1.0) {
          cam = camStop;
          finishRunStage = 'car_driving';
          carDriveTimer = 0;
        }
      } else if (finishRunStage === 'car_driving') {
        carDriveTimer += dt;
        const driveDuration = 1.35;
        const t = Math.min(1.0, carDriveTimer / driveDuration);
        const carTargetCenterX = CAR_STOP_FRONT_X - CAR_DRAW_W * 0.42;
        const totalDist = carTargetCenterX - CAR_X;
        const driveEase = 1 - Math.pow(1 - t, 2.8);
        carDrawX = CAR_X + totalDist * driveEase;

        if (wheelRadiusPx > 0 && t < 1.0) {
          const forwardVelocity = (totalDist * 2.8 * Math.pow(1 - t, 1.8)) / driveDuration;
          const spinRate = Math.max(0, forwardVelocity / wheelRadiusPx);
          wheelAngle += spinRate * dt;
          wheelRot = wheelAngle;
        }

        const carFrontScreenX = carDrawX + CAR_DRAW_W * 0.42;
        if (carFrontScreenX >= FINISH_LINE_X && !confettiStarted) {
          confettiStarted = true;
          initConfetti(true);
        }

        if (t >= 1.0) {
          finishRunStage = 'car_stopped';
          thumbsUpTimer = 0;
        }
      } else if (finishRunStage === 'car_stopped') {
        thumbsUpTimer += dt;
        carDrawX = CAR_STOP_FRONT_X - CAR_DRAW_W * 0.42;

        if (thumbsUpTimer >= 1.0 && !levelCompleted) {
          levelCompleted = true;
          levelClearCountSinceAd++;
          st = 'level_complete';
          levelCompleteTimer = 0;
          confettiStarted = true;
          triggerLevelCompleteConfetti();
          levelJustCleared = curLevel;
          const ratio = levelCoinsTotal > 0 ? (levelCoinsCollected / levelCoinsTotal) : 1;
          earnedStars = 1;
          if (ratio >= 0.60) earnedStars = 2;
          if (ratio >= 0.90) earnedStars = 3;
          isPerfect = (levelCoinsTotal > 0 && levelCoinsCollected >= levelCoinsTotal);
          perfectBonusGiven = false;
          starSoundsPlayed = [false, false, false];
          saveStars(curLevel, earnedStars);
          const nextLvl = curLevel + 1;
          const clearScore = 100 * curLevel;
          if (clearScore > best) best = clearScore;
          progressDirty = true;
          flushDirtyStorage();
          saveProgress(curLevel, Math.max(highestLevel, nextLvl), best);
        }
      }
    } else {
      const launchT = Math.min(1.0, levelRunTimer / 2.5);
      const launchScrollFactor = 0.50 + 0.50 * Math.sin(launchT * Math.PI * 0.5);
      const thrustScrollFactor = 1.0 + 0.18 * (thrust || (hold ? 1 : 0));
      const activeSp = sp * launchScrollFactor * thrustScrollFactor;
      cam += activeSp * dt;
      carDrawX = CAR_X;
      if (wheelRadiusPx > 0) {
        currentAngularSpeed = (activeSp / wheelRadiusPx) * (hold ? 1.8 : 1.0);
        wheelAngle += currentAngularSpeed * dt;
        wheelRot = wheelAngle;
      }
    }

    // Dynamic car speed calculation for speedometer meter
    let targetKmH = 0;
    if (st === 'play') {
      if (finishRunStage === 'speed_run') {
        const accelT = Math.min(1.0, finishRunTimer / 0.5);
        targetKmH = lerp(160, 240, accelT);
      } else if (finishRunStage === 'car_driving') {
        const driveDuration = 1.35;
        const t = Math.min(1.0, carDriveTimer / driveDuration);
        targetKmH = Math.max(0, 160 * Math.pow(1 - t, 2.0));
      } else if (finishRunStage === 'car_stopped' || stopping) {
        targetKmH = 0;
      } else {
        // Active gameplay drive: tied directly to Speed Mode (Normal 2.0x / Fast 2.5x / Turbo 3.3x), Slow-mo, Thrust & Boost
        const launchT = Math.min(1.0, levelRunTimer / 2.6);
        const launchProgress = Math.sin(launchT * Math.PI * 0.5);

        const mult = getSpeedMultiplier();
        const speedScale = mult / SPEED_NORMAL; // Normal: 1.00, Fast: 1.25, Turbo: 1.65
        let slowMoScale = 1.0;
        if (typeof slowMoTimer !== 'undefined' && slowMoTimer > 0) {
          const easeBack = (slowMoTimer < 0.6) ? (slowMoTimer / 0.6) : 1.0;
          slowMoScale = 1.0 - 0.45 * easeBack;
        }

        const engineMicro = Math.sin(gameTime * 4.2) * 1.6;
        const cruiseKmH = (140 * speedScale * slowMoScale) + engineMicro;

        const thrustAmount = Math.max(hold ? 0.35 : 0, thrust);
        const thrustBonus = thrustAmount * 52 * speedScale * slowMoScale;

        const boostBonus = (typeof boostRampFactor !== 'undefined') ? (boostRampFactor * 88) : 0;

        targetKmH = Math.min(360, (cruiseKmH * launchProgress) + thrustBonus + boostBonus);
      }
    } else if (st === 'transition') {
      targetKmH = 0;
    } else {
      targetKmH = 0;
    }

    // Smooth speedometer tracking: gradual ramp-up (آہستہ آہستہ) from 0 to cruise
    const smoothRate = (targetKmH > displayedSpeedKmH) ? 3.6 : 4.8;
    displayedSpeedKmH += (targetKmH - displayedSpeedKmH) * Math.min(1.0, dt * smoothRate);
    if (displayedSpeedKmH < 0.5 && targetKmH === 0) displayedSpeedKmH = 0;

    const onStartPlatform = (wx >= START_ROAD_START && wx <= START_ROAD_END);
    const onFinishPlatform = (wx >= FINISH_ROAD_X && wx <= FINISH_ROAD_END);
    const onRoadPlatform = onStartPlatform || onFinishPlatform;
    const isCarOnRoad = onRoadPlatform && (cy >= CAR_REST_Y - 2);
    const isCarInAir = !isCarOnRoad;

    // Jet thrusters and flames (audio is synced in updateThrustAudio)
    const isThrustFlying = ((hold || (boostRampFactor > 0.05)) && isCarInAir && st === 'play' && !autoLanding && !stopping);
    if (isThrustFlying) {
      podDeploy = Math.min(1.0, podDeploy + dt / POD_SLIDE_TIME);
      flameIntensity = Math.min(1.0, flameIntensity + dt / 0.12);
    } else {
      podDeploy = Math.max(0.0, podDeploy - dt / POD_SLIDE_TIME);
      flameIntensity = Math.max(0.0, flameIntensity - dt / FLAME_FADE_OUT_TIME);
    }
    // Hard check: never allow flames or sparks when car is resting or driving on the road
    if (isCarOnRoad) {
      flameIntensity = 0.0;
      podDeploy = Math.max(0.0, podDeploy - dt / POD_SLIDE_TIME);
    }

    if (SHOW_FLAMES && flameIntensity > 0.05 && isCarInAir) {
      sparkSpawnTimer += dt;
      if (sparkSpawnTimer >= 0.04) {
        sparkSpawnTimer -= 0.04;
        const drawW = CAR_DRAW_W;
        const drawH = CAR_DRAW_H;
        const carCenterY = (cy + 24) - drawH / 2;
        const nIdx = Math.floor(Math.random() * NOZZLE_X.length);
        const nx = -drawW / 2 + drawW * NOZZLE_X[nIdx];
        const baseNozzleY = -drawH / 2 + drawH * NOZZLE_Y;
        const podH = drawH * 0.05;
        const nozzleLipY = carCenterY + baseNozzleY + podH * podDeploy;
        const flameLen = NOZZLE_LEN[nIdx] * drawH * (0.35 + 0.65 * flameIntensity);
        spawnSpark(CAR_X + nx, nozzleLipY, flameLen, sp);
      }
    }
    updateSparks(dt, sp);
    updateHazardParticles(dt);
    updateFloatingTexts(dt);
    gameTime += dt;
    for (const s of segs) {
      if (s.moving) {
        const moveY = Math.sin(gameTime * s.moveSpeed + s.movePhase) * s.moveAmp;
        s.curTop = s.top + moveY;
        s.curBot = s.bot + moveY;
      } else {
        s.curTop = s.top;
        s.curBot = s.bot;
      }

      // Update interactive hazard states (falling spikes, boost rings, air currents)
      if (s.obstacles && s.obstacles.length > 0) {
        for (const obs of s.obstacles) {
          if (obs.type === 'falling_spike') {
            if (obs.state === 'idle') {
              const distToSpike = obs.x - wx;
              if (distToSpike > 0 && distToSpike <= sp * 1.5 && (!activeFallingSpike || activeFallingSpike === obs) && boostTimer <= 1.0) {
                activeFallingSpike = obs;
                obs.state = 'warning';
                obs.warnTimer = 0.7;
              }
            } else if (obs.state === 'warning') {
              obs.warnTimer -= dt;
              obs.shake = Math.sin((0.7 - obs.warnTimer) * 45) * 2.2;
              if (obs.warnTimer <= 0) {
                obs.state = 'falling';
                obs.velY = 0;
                obs.shake = 0;
              }
            } else if (obs.state === 'falling') {
              obs.velY += 1200 * dt;
              obs.curY += obs.velY * dt;
              if (obs.curY >= obs.maxDepth) {
                obs.state = 'shattered';
                spawnHazardShards(obs.x, obs.curY, (curConfig && curConfig.accentColor) || '#cbd5e1');
                if (activeFallingSpike === obs) activeFallingSpike = null;
              }
            }
          } else if (obs.type === 'boost_ring' && !obs.collected) {
            if (Math.abs(wx - obs.x) < 26 && Math.abs(cy - obs.y) < obs.radius + 16) {
              obs.collected = true;
              boostTimer = 2.0;
              playBoostSound();
              spawnFloatingText('BOOST!', CAR_X, cy - 28, '#38bdf8');
              spawnHazardShards(obs.x, obs.y, '#38bdf8');
            }
          } else if (obs.type === 'air_current') {
            if (wx >= obs.x && wx <= obs.x + obs.w && cy >= obs.yTop - 20 && cy <= obs.yBot + 20) {
              vy += obs.pushDir * obs.strength * dt;
            }
          }
        }
      }
    }

    for (const s of segs) {
      // Crash cannot happen after the last spike or during finish run
      if (stopping || autoLanding || wx >= TUNNEL_END_X) break;
      // Spatial skip: ignore tunnel segments far ahead or behind car
      if (s.x + s.w < wx - 90) continue;
      if (s.x > wx + 90) break;

      // Obstacles collision check (gates, stalactites, stalagmites, floating blocks, hazards)
      if (s.obstacles && s.obstacles.length > 0) {
        let obsHit = false;
        for (const obs of s.obstacles) {
          const obsW = obs.w || (obs.radius ? obs.radius * 2 : 24);
          if (wx + HITBOX_HALF_W > obs.x - obsW / 2 && wx - HITBOX_HALF_W < obs.x + obsW / 2) {
            if (obs.type === 'gate') {
              if (cy - HITBOX_TOP_OFFSET < obs.gapTop - 4 || cy + HITBOX_BOT_OFFSET > obs.gapBot + 4) {
                obsHit = true; break;
              }
            } else if (obs.type === 'stalactite') {
              if (cy - HITBOX_TOP_OFFSET < obs.tipY - 4) {
                obsHit = true; break;
              }
            } else if (obs.type === 'stalagmite') {
              if (cy + HITBOX_BOT_OFFSET > obs.tipY + 4) {
                obsHit = true; break;
              }
            } else if (obs.type === 'floating_block') {
              if (cy - HITBOX_TOP_OFFSET < obs.y + obs.h - 4 && cy + HITBOX_BOT_OFFSET > obs.y + 4) {
                obsHit = true; break;
              }
            } else if (obs.type === 'saw_blade') {
              const slide = (obs.slideDist || 0) * Math.sin((gameTime + (obs.slidePhase || 0)) * 2 * Math.PI / (obs.slidePeriod || 3.0));
              const curX = obs.x + slide;
              const cxClamped = Math.max(wx - HITBOX_HALF_W, Math.min(curX, wx + HITBOX_HALF_W));
              const cyClamped = Math.max(cy - HITBOX_TOP_OFFSET, Math.min(obs.y, cy + HITBOX_BOT_OFFSET));
              const d2 = (curX - cxClamped) ** 2 + (obs.y - cyClamped) ** 2;
              if (d2 < (obs.radius * 0.9) ** 2) {
                obsHit = true; break;
              }
            } else if (obs.type === 'falling_spike') {
              if (obs.state === 'falling') {
                if (cy + HITBOX_BOT_OFFSET > obs.curY && cy - HITBOX_TOP_OFFSET < obs.curY + (obs.h || 28) - 6) {
                  obsHit = true; break;
                }
              }
            } else if (obs.type === 'laser_gate') {
              const t = (gameTime + obs.phase) % 1.4;
              if (t >= 0.6) {
                if (cy >= obs.topY && cy <= obs.botY) {
                  obsHit = true; break;
                }
              }
            } else if (obs.type === 'pendulum') {
              const theta = obs.maxAngle * Math.sin((gameTime + obs.phase) * 2 * Math.PI / obs.period);
              const bx = obs.anchorX + obs.length * Math.sin(theta);
              const by = obs.anchorY + obs.length * Math.cos(theta);
              const cxClamped = Math.max(wx - HITBOX_HALF_W, Math.min(bx, wx + HITBOX_HALF_W));
              const cyClamped = Math.max(cy - HITBOX_TOP_OFFSET, Math.min(by, cy + HITBOX_BOT_OFFSET));
              const d2 = (bx - cxClamped) ** 2 + (by - cyClamped) ** 2;
              if (d2 < (obs.radius * 0.9) ** 2) {
                obsHit = true; break;
              }
            }
          }
        }
        const isBoostProtected = BOOST_INVINCIBLE && (boostTimer > 0 || boostProtectionTimer > 0);
        if (obsHit) {
          if (isBoostProtected) {
            spawnImpactSparks(CAR_X, cy, 6);
          } else if (shieldActive || shieldBreakInvulnTimer > 0) {
            handleCrashImpact();
            break;
          } else {
            die(); break;
          }
        }
      }

      // Rails and spikes collision check
      const isBoostProtected = BOOST_INVINCIBLE && (boostTimer > 0 || boostProtectionTimer > 0);
      const curTop = (s.curTop !== undefined) ? s.curTop : s.top;
      const curBot = (s.curBot !== undefined) ? s.curBot : s.bot;
      if (wx + HITBOX_HALF_W > s.x && wx - HITBOX_HALF_W < s.x + s.w && !s.isOpen) {
        if (s.isSlanted && s.top2 !== undefined && s.bot2 !== undefined) {
          const fracMid = Math.max(0, Math.min(1, (wx - s.x) / s.w));
          const effTop = curTop + (s.top2 - curTop) * fracMid;
          const effBot = curBot + (s.bot2 - curBot) * fracMid;
          if (cy - HITBOX_TOP_OFFSET < effTop - 18 || cy + HITBOX_BOT_OFFSET > effBot + 18) {
            if (isBoostProtected) {
              spawnImpactSparks(CAR_X, cy, 5);
            } else if (shieldActive || shieldBreakInvulnTimer > 0) {
              handleCrashImpact();
              const safeMinY = effTop - 18 + HITBOX_TOP_OFFSET + 6;
              const safeMaxY = effBot + 18 - HITBOX_BOT_OFFSET - 6;
              if (cy < safeMinY) { cy = safeMinY; vy = Math.max(40, Math.abs(vy) * 0.4); }
              if (cy > safeMaxY) { cy = safeMaxY; vy = -Math.max(40, Math.abs(vy) * 0.4); }
              break;
            } else {
              die(); break;
            }
          }
          let hit = false;
          const count = s.topSpikes ? s.topSpikes.length : 0;
          for (let i = 0; i < count; i++) {
            const spX = s.x + i * 12;
            if (wx + HITBOX_HALF_W > spX && wx - HITBOX_HALF_W < spX + 12) {
              const spFrac = Math.max(0, Math.min(1, (spX + 6 - s.x) / s.w));
              const localTop = curTop + (s.top2 - curTop) * spFrac;
              const localBot = curBot + (s.bot2 - curBot) * spFrac;
              const topTip = (localTop - 18) + s.topSpikes[i].h;
              const botTip = (localBot + 18) - s.botSpikes[i].h;
              if ((cy - HITBOX_TOP_OFFSET) < topTip - 6 || (cy + HITBOX_BOT_OFFSET) > botTip + 6) {
                hit = true; break;
              }
            }
          }
          if (hit) {
            if (isBoostProtected) {
              spawnImpactSparks(CAR_X, cy, 6);
            } else if (shieldActive || shieldBreakInvulnTimer > 0) {
              handleCrashImpact();
              const safeMinY = effTop - 18 + HITBOX_TOP_OFFSET + 10;
              const safeMaxY = effBot + 18 - HITBOX_BOT_OFFSET - 10;
              if (cy < safeMinY) { cy = safeMinY; vy = Math.max(40, Math.abs(vy) * 0.4); }
              if (cy > safeMaxY) { cy = safeMaxY; vy = -Math.max(40, Math.abs(vy) * 0.4); }
              break;
            } else {
              die(); break;
            }
          }
        } else {
          if (cy - HITBOX_TOP_OFFSET < curTop - 18 || cy + HITBOX_BOT_OFFSET > curBot + 18) {
            if (isBoostProtected) {
              spawnImpactSparks(CAR_X, cy, 5);
            } else if (shieldActive || shieldBreakInvulnTimer > 0) {
              handleCrashImpact();
              const safeMinY = curTop - 18 + HITBOX_TOP_OFFSET + 6;
              const safeMaxY = curBot + 18 - HITBOX_BOT_OFFSET - 6;
              if (cy < safeMinY) { cy = safeMinY; vy = Math.max(40, Math.abs(vy) * 0.4); }
              if (cy > safeMaxY) { cy = safeMaxY; vy = -Math.max(40, Math.abs(vy) * 0.4); }
              break;
            } else {
              die(); break;
            }
          }
          let hit = false;
          const count = s.topSpikes ? s.topSpikes.length : 0;
          for (let i = 0; i < count; i++) {
            const spX = s.x + i * 12;
            if (wx + HITBOX_HALF_W > spX && wx - HITBOX_HALF_W < spX + 12) {
              const topTip = (curTop - 18) + s.topSpikes[i].h;
              const botTip = (curBot + 18) - s.botSpikes[i].h;
              if ((cy - HITBOX_TOP_OFFSET) < topTip - 6 || (cy + HITBOX_BOT_OFFSET) > botTip + 6) {
                hit = true;
                break;
              }
            }
          }
          if (hit) {
            if (isBoostProtected) {
              spawnImpactSparks(CAR_X, cy, 6);
            } else if (shieldActive || shieldBreakInvulnTimer > 0) {
              handleCrashImpact();
              const safeMinY = curTop - 18 + HITBOX_TOP_OFFSET + 10;
              const safeMaxY = curBot + 18 - HITBOX_BOT_OFFSET - 10;
              if (cy < safeMinY) { cy = safeMinY; vy = Math.max(40, Math.abs(vy) * 0.4); }
              if (cy > safeMaxY) { cy = safeMaxY; vy = -Math.max(40, Math.abs(vy) * 0.4); }
              break;
            } else {
              die(); break;
            }
          }
        }
      }
    }
    // Flying birds movement, collision, falling & blood splatter
    updateBirdBloodPool(dt);
    if (finishRunStage === 'none' && !stopping && !autoLanding) {
      const birdSlowFactor = (typeof slowMoTimer !== 'undefined' && slowMoTimer > 0) ? 0.6 : 1.0;
      const carLeft = wx - HITBOX_HALF_W;
      const carRight = wx + HITBOX_HALF_W;
      const carTop = cy - HITBOX_TOP_OFFSET;
      const carBot = cy + HITBOX_BOT_OFFSET;
      const isBoostProtected = BOOST_INVINCIBLE && (boostTimer > 0 || boostProtectionTimer > 0);

      for (let i = 0; i < birds.length; i++) {
        const b = birds[i];
        if (b.offscreenDone) continue;
        if (b.hit) {
          b.vy += 940 * dt;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.rot += b.rotVel * dt;
          b.bleedTimer -= dt;
          if (b.bleedTimer <= 0 && b.y < H + 40) {
            b.bleedTimer = 0.028;
            spawnBirdBloodTrailDrop(b.x, b.y);
          }
          if (b.y > H + 90) {
            b.offscreenDone = true;
          }
          continue;
        }

        // Start flying right-to-left once entering from right edge
        if (b.x <= cam + W + 45) {
          b.x += b.vx * birdSlowFactor * dt;
        }
        const waveY = b.baseY + Math.sin(gameTime * b.bobFreq + b.phase) * b.bobAmp;
        const bBounds = getCorridorSafeBounds(b.x, segs);
        const minY = (bBounds && bBounds.top > -100) ? (bBounds.top + 32) : 90;
        const maxY = (bBounds && bBounds.bot < H + 100) ? (bBounds.bot - 32) : (H - 90);
        b.y = Math.max(minY, Math.min(maxY, waveY));

        if (b.x < cam - 100) {
          b.offscreenDone = true;
          continue;
        }

        // Collision check with car body
        const closestX = Math.max(carLeft, Math.min(b.x, carRight));
        const closestY = Math.max(carTop, Math.min(b.y, carBot));
        const dx = (b.x - closestX) / 18;
        const dy = (b.y - closestY) / 14;
        if (dx * dx + dy * dy <= 1.0) {
          b.hit = true;
          b.vx = 48;
          b.vy = -72;
          b.rotVel = -7.5;
          b.bleedTimer = 0;
          spawnBirdBloodBurst(b.x, b.y, 28);
          spawnBirdBloodTrailDrop(b.x, b.y);

          if (isBoostProtected) {
            spawnImpactSparks(CAR_X, cy, 8);
          } else if (shieldActive || shieldBreakInvulnTimer > 0) {
            handleCrashImpact();
          } else {
            playCrashSound();
            triggerVibrate([40, 25, 65]);
            birdCrashDelayTimer = 0.56;
            break;
          }
        }
      }
    }

    if (stopping || confettiStarted) {
      updateConfetti(dt);
    }
  } else if (st === 'level_complete') {
    levelCompleteTimer += dt;
    cy = CAR_REST_Y;
    vy = 0;
    updateConfetti(dt);
  } else if (st === 'dead') {
    deadPreviewTime += dt;
    updateFallingBirdsOnly(dt);
  }

  updateThrustAudio(dt);

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.l += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.l >= p.m) {
      parts.splice(i, 1);
    }
  }
}

function drawLoadingScreen() {
  const bgReady = loadingBgImg && loadingBgImg.complete && loadingBgImg.naturalWidth > 0;

  let carTopScreenY = H * 0.455;
  let carBotScreenY = H * 0.605;

  if (bgReady) {
    const iw = loadingBgImg.naturalWidth;
    const ih = loadingBgImg.naturalHeight;
    const drawW = W;
    const drawH = W * (ih / iw);
    const bgY = drawH >= H
      ? Math.round((H - drawH) * 0.50)
      : Math.round((H - drawH) * 0.48);

    // Seamless sky extension if viewport is taller than artwork aspect
    if (bgY > 0) {
      const topStripSrcH = Math.max(8, Math.floor(ih * 0.04));
      ctx.save();
      ctx.translate(0, bgY + 2);
      ctx.scale(1, -1);
      ctx.drawImage(loadingBgImg, 0, 0, iw, topStripSrcH, 0, 0, drawW, bgY + 4);
      ctx.restore();
    }

    ctx.drawImage(loadingBgImg, 0, bgY, drawW, drawH);

    // Seamless courtyard stone tile extension at bottom if needed
    const bottomEdge = bgY + drawH;
    if (bottomEdge < H) {
      const stripSrcH = Math.min(140, Math.floor(ih * 0.095));
      const stripDrawH = Math.max(40, Math.round(drawW * (stripSrcH / iw)));
      let curY = bottomEdge - 2;
      let flip = true;
      while (curY < H) {
        ctx.save();
        if (flip) {
          ctx.translate(0, curY + stripDrawH);
          ctx.scale(1, -1);
          ctx.drawImage(loadingBgImg, 0, ih - stripSrcH, iw, stripSrcH, 0, 0, drawW, stripDrawH + 2);
        } else {
          ctx.drawImage(loadingBgImg, 0, ih - stripSrcH, iw, stripSrcH, 0, curY, drawW, stripDrawH + 2);
        }
        ctx.restore();
        curY += stripDrawH;
        flip = !flip;
      }
    }

    carTopScreenY = bgY + drawH * 0.455;
    carBotScreenY = bgY + drawH * 0.605;
  } else {
    // Brief sky backdrop fallback during frame 0 decode
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#0284c7');
    bgGrad.addColorStop(0.58, '#bae6fd');
    bgGrad.addColorStop(1, '#cbd5e1');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    drawFluffyClouds(ctx, 180, 140, 1.3, 0.75);

    if (loadingTimer >= 1.2 && trimmedCarCanvas) {
      const loadW = Math.round(Math.min(W * 0.64, 270));
      const loadH = Math.round(loadW * (trimmedCarCanvas.height / trimmedCarCanvas.width));
      ctx.drawImage(trimmedCarCanvas, W / 2 - loadW / 2, H * 0.53 - loadH / 2, loadW, loadH);
    }
  }

  // Animated "THRON RUSH" Crown Logo positioned cleanly ABOVE the parked car
  const logoReady = loadingLogoImg && loadingLogoImg.complete && loadingLogoImg.naturalWidth > 0;
  const logoAspect = logoReady ? (loadingLogoImg.naturalHeight / loadingLogoImg.naturalWidth) : (247 / 339);
  const skyAvailH = Math.max(105, carTopScreenY - 26);
  const logoW = Math.min(Math.min(268, W * 0.68), (skyAvailH * 0.84) / logoAspect);
  const logoH = logoW * logoAspect;
  const logoCenterY = Math.max(logoH * 0.5 + 16, carTopScreenY * 0.50);

  if (logoReady) {
    const logoBobY = Math.sin(loadingTimer * 3.1) * 4.5;
    const logoPulseScale = 1.0 + Math.sin(loadingTimer * 3.6) * 0.032;
    const logoTilt = Math.sin(loadingTimer * 2.2) * 0.025;
    const auraPulse = 0.5 + 0.5 * Math.sin(loadingTimer * 4.4);

    ctx.save();
    ctx.translate(W / 2, logoCenterY + logoBobY);

    // Pulsing electric-blue & cyan energy glow behind the THRON RUSH logo
    const auraR = logoW * (0.58 + auraPulse * 0.07);
    const auraGrad = ctx.createRadialGradient(0, 0, logoW * 0.1, 0, 0, auraR);
    auraGrad.addColorStop(0, `rgba(125, 211, 252, ${(0.36 + auraPulse * 0.18).toFixed(2)})`);
    auraGrad.addColorStop(0.55, `rgba(37, 99, 235, ${(0.20 + auraPulse * 0.14).toFixed(2)})`);
    auraGrad.addColorStop(1, 'rgba(37, 99, 235, 0)');
    ctx.fillStyle = auraGrad;
    ctx.beginPath();
    ctx.arc(0, 0, auraR, 0, Math.PI * 2);
    ctx.fill();

    // Animated sprite body with smooth float, zoom & sway
    ctx.save();
    ctx.rotate(logoTilt);
    ctx.scale(logoPulseScale, logoPulseScale);
    ctx.drawImage(loadingLogoImg, -logoW / 2, -logoH / 2, logoW, logoH);
    ctx.restore();

    // Animated diamond sparkles around crown and electric edges
    const sparkleOffsets = [
      { rx: -0.44, ry: -0.26, phase: 0.0, size: 7, color: '#e0f2fe' },
      { rx: 0.45, ry: -0.22, phase: 1.4, size: 8, color: '#fef08a' },
      { rx: 0.0, ry: -0.49, phase: 2.3, size: 9, color: '#fef9c3' },
      { rx: -0.42, ry: 0.28, phase: 3.1, size: 6.5, color: '#bae6fd' },
      { rx: 0.43, ry: 0.30, phase: 4.2, size: 7.5, color: '#fde047' }
    ];
    sparkleOffsets.forEach((sp) => {
      const wave = Math.sin(loadingTimer * 4.8 + sp.phase);
      if (wave <= -0.15) return;
      const alpha = Math.max(0, Math.min(1, (wave + 0.15) * 0.9));
      const sr = sp.size * (0.45 + alpha * 0.65);
      const sx = sp.rx * logoW;
      const sy = sp.ry * logoH;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(loadingTimer * 2.0 + sp.phase);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = sp.color;
      ctx.beginPath();
      ctx.moveTo(0, -sr);
      ctx.quadraticCurveTo(sr * 0.22, -sr * 0.22, sr, 0);
      ctx.quadraticCurveTo(sr * 0.22, sr * 0.22, 0, sr);
      ctx.quadraticCurveTo(-sr * 0.22, sr * 0.22, -sr, 0);
      ctx.quadraticCurveTo(-sr * 0.22, -sr * 0.22, 0, -sr);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });

    ctx.restore();
  } else {
    drawGlossyText('THRON RUSH', W / 2, logoCenterY, 42, 'center', '#ffffff', '#0f172a', 7);
  }

  // Loading bar and "LOADING..." sprite positioned cleanly BELOW the parked car
  const barW = Math.round(Math.min(W * 0.78, 340));
  const barH = Math.round(barW * (92 / 641));
  const barX = Math.round(W / 2 - barW / 2);
  const idealBelowCarY = carBotScreenY + Math.max(46, (H - carBotScreenY) * 0.42);
  const barY = Math.round(Math.max(carBotScreenY + 42, Math.min(H - barH - 30, idealBelowCarY)));

  const pct = Math.min(100, Math.floor(visualLoadProgress * 100));
  const titleReady = loadingTitleImg && loadingTitleImg.complete && loadingTitleImg.naturalWidth > 0;
  if (titleReady) {
    const titleW = Math.round(Math.min(barW * 0.54, 180));
    const titleH = Math.round(titleW * (loadingTitleImg.naturalHeight / loadingTitleImg.naturalWidth));
    const titleX = Math.round(W / 2 - titleW / 2);
    const titleYPos = Math.round(barY - titleH - 3);
    ctx.drawImage(loadingTitleImg, titleX, titleYPos, titleW, titleH);
  } else {
    drawGlossyText('LOADING...', W / 2, barY - 14, 18, 'center', '#ffffff', '#0b1f3a', 4);
  }

  const trackReady = loadingBarTrackImg && loadingBarTrackImg.complete && loadingBarTrackImg.naturalWidth > 0;
  const fillReady = loadingBarFillImg && loadingBarFillImg.complete && loadingBarFillImg.naturalWidth > 0;

  if (trackReady && fillReady) {
    // 1. Draw outer dark-blue capsule track
    ctx.drawImage(loadingBarTrackImg, barX, barY, barW, barH);

    // 2. Reveal bright-green striped capsule fill smoothly up to visualLoadProgress
    const progressClamped = Math.max(0, Math.min(1, visualLoadProgress));
    if (progressClamped > 0.005) {
      const innerPadX = barW * (15 / 641);
      const innerSpanW = barW * ((626 - 15) / 641);
      const innerTop = barY + barH * (12 / 92);
      const innerH = barH * ((73 - 12) / 92);
      const clipW = Math.max(innerH * 0.65, innerSpanW * progressClamped);

      ctx.save();
      ctx.beginPath();
      roundRect(ctx, barX + innerPadX, innerTop, Math.min(innerSpanW, clipW), innerH, innerH / 2);
      ctx.clip();
      ctx.drawImage(loadingBarFillImg, barX, barY, barW, barH);
      ctx.restore();
    }

    // 3. Center crisp percentage text inside the green capsule area
    const pctFontSize = Math.max(13, Math.round(barH * 0.43));
    const pctCenterY = barY + barH * (43 / 92);
    drawGlossyText(`${pct}%`, W / 2, pctCenterY, pctFontSize, 'center', '#ffffff', '#0b1f3a', Math.max(3.5, Math.round(pctFontSize * 0.24)));
  } else {
    // Graceful procedural fallback for the first few ms before decode completes
    const fallbackH = Math.max(20, Math.round(barH * 0.55));
    const fallbackY = barY + Math.round((barH - fallbackH) / 2);
    ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
    roundRect(ctx, barX, fallbackY, barW, fallbackH, fallbackH / 2);
    ctx.fill();
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2.5;
    roundRect(ctx, barX, fallbackY, barW, fallbackH, fallbackH / 2);
    ctx.stroke();

    const fillW = Math.max(fallbackH, barW * visualLoadProgress);
    const fillGrad = ctx.createLinearGradient(0, fallbackY, 0, fallbackY + fallbackH);
    fillGrad.addColorStop(0, '#bef264');
    fillGrad.addColorStop(0.5, '#65a30d');
    fillGrad.addColorStop(1, '#3f6212');
    ctx.fillStyle = fillGrad;
    roundRect(ctx, barX, fallbackY, fillW, fallbackH, fallbackH / 2);
    ctx.fill();
    drawGlossyText(`${pct}%`, W / 2, fallbackY + fallbackH / 2, 14, 'center', '#ffffff', '#0b1f3a', 3.5);
  }

  // Tiny gray debug error message in corner if any error occurred
  if (loadingErrorMsg) {
    ctx.save();
    ctx.font = '10px monospace';
    ctx.fillStyle = 'rgba(100, 116, 139, 0.7)';
    ctx.textAlign = 'left';
    ctx.fillText(String(loadingErrorMsg).slice(0, 48), 8, H - 8);
    ctx.restore();
  }
}

// REAL CAMERA SPEED MEASUREMENT & DEBUG OVERLAY
// ==========================================
let camSamples = [];
let realSpeedWPerSec = 0;
let realSpeedPxPerSec = 0;

function updateRealSpeedMeasurement(nowSec) {
  camSamples.push({ t: nowSec, cam: cam });
  while (camSamples.length > 2 && camSamples[0].t < nowSec - 1.0) {
    camSamples.shift();
  }
  if (camSamples.length >= 2) {
    const oldest = camSamples[0];
    const newest = camSamples[camSamples.length - 1];
    const dtWindow = newest.t - oldest.t;
    if (dtWindow >= 0.08) {
      const dCam = newest.cam - oldest.cam;
      realSpeedPxPerSec = Math.max(0, dCam / dtWindow);
      realSpeedWPerSec = realSpeedPxPerSec / W;
    }
  }
}

// hudSpriteCache initialized near top to avoid TDZ during resizeCanvas

function getCachedGoldStar8() {
  if (hudSpriteCache.goldStar8) return hudSpriteCache.goldStar8;
  const r = 7.0;
  const pad = 4;
  const sz = (r + pad) * 2;
  const c = document.createElement('canvas');
  c.width = sz * 2;
  c.height = sz * 2;
  const sCtx = c.getContext('2d');
  sCtx.scale(2, 2);
  sCtx.translate(sz / 2, sz / 2);
  sCtx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = (i * Math.PI) / 5 - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.48;
    const x = Math.cos(ang) * rad;
    const y = Math.sin(ang) * rad;
    if (i === 0) sCtx.moveTo(x, y); else sCtx.lineTo(x, y);
  }
  sCtx.closePath();
  const starGrad = sCtx.createLinearGradient(0, -r, 0, r);
  starGrad.addColorStop(0, '#fef08a');
  starGrad.addColorStop(0.4, '#facc15');
  starGrad.addColorStop(1, '#ca8a04');
  sCtx.fillStyle = starGrad;
  sCtx.fill();
  sCtx.strokeStyle = '#713f12';
  sCtx.lineWidth = 1.6;
  sCtx.stroke();
  sCtx.fillStyle = '#ffffff';
  sCtx.beginPath();
  sCtx.arc(-r * 0.2, -r * 0.25, r * 0.2, 0, 6.28);
  sCtx.fill();
  hudSpriteCache.goldStar8 = { canvas: c, half: sz / 2, size: sz };
  return hudSpriteCache.goldStar8;
}

function getCachedLevelBadge(lvl) {
  const isHard = (lvl >= 5 && (lvl % 5 === 0 || lvl === 8));
  const key = `${lvl}_${isHard ? 1 : 0}_${dpr}`;
  if (hudSpriteCache.levelBadge && hudSpriteCache.levelBadgeKey === key) {
    return hudSpriteCache.levelBadge;
  }
  const lvlW = 114, lvlH = 34, pad = 6;
  const totW = lvlW + pad * 2, totH = lvlH + pad * 2;
  const c = document.createElement('canvas');
  c.width = Math.round(totW * dpr);
  c.height = Math.round(totH * dpr);
  const bCtx = c.getContext('2d');
  bCtx.scale(dpr, dpr);
  const bx = pad, by = pad;
  const lGrad = bCtx.createLinearGradient(bx, by, bx, by + lvlH);
  lGrad.addColorStop(0, '#c026d3');
  lGrad.addColorStop(0.45, '#9333ea');
  lGrad.addColorStop(1, '#4c1d95');
  bCtx.fillStyle = lGrad;
  roundRect(bCtx, bx, by, lvlW, lvlH, 10);
  bCtx.fill();

  bCtx.save();
  roundRect(bCtx, bx, by, lvlW, lvlH, 10);
  bCtx.clip();
  bCtx.fillStyle = 'rgba(255, 255, 255, 0.22)';
  bCtx.fillRect(bx + 2, by + 2, lvlW - 4, lvlH * 0.42);
  bCtx.restore();

  bCtx.strokeStyle = '#3b0764';
  bCtx.lineWidth = 2.6;
  roundRect(bCtx, bx, by, lvlW, lvlH, 10);
  bCtx.stroke();

  bCtx.strokeStyle = 'rgba(233, 213, 255, 0.65)';
  bCtx.lineWidth = 1.2;
  roundRect(bCtx, bx + 2, by + 2, lvlW - 4, lvlH - 4, 8);
  bCtx.stroke();

  const drawBText = (text, tx, ty, size, color, strokeCol, sw) => {
    bCtx.font = `800 ${size}px "Lilita One", "Baloo 2", cursive, system-ui, sans-serif`;
    bCtx.textAlign = 'center';
    bCtx.textBaseline = 'middle';
    bCtx.strokeStyle = strokeCol;
    bCtx.lineWidth = sw;
    bCtx.lineJoin = 'round';
    bCtx.miterLimit = 2;
    bCtx.strokeText(text, tx, ty);
    bCtx.fillStyle = color;
    bCtx.fillText(text, tx, ty);
  };
  if (isHard) {
    drawBText('HARD', pad + lvlW / 2, by + 1, 10, '#f0abfc', '#2e1065', 3.2);
  }
  drawBText(`Level ${lvl}`, pad + lvlW / 2, by + lvlH / 2 + 1, 16.5, '#ffffff', '#2e1065', 3.6);

  hudSpriteCache.levelBadgeKey = key;
  hudSpriteCache.levelBadge = { canvas: c, pad, w: totW, h: totH };
  return hudSpriteCache.levelBadge;
}

function getCachedSpeedometerBg(meterW, meterH) {

// HUD during play: Top-left Pause button, Top-center purple Level badge + progress bar, Top-right Coin pill
function drawHUD() {
  const cfg = curConfig;
  const progress = getHudBarProgress();
  const curScore = (stopping || st === 'level_complete' || progress >= 1.0) ? 100 : Math.floor(progress * 100);
  const currentTotal = 100 * (curLevel - 1) + curScore;
  if (currentTotal > best) {
    best = currentTotal;
    progressDirty = true;
  }

    const isPausePressed = (activePress === 'pause_game');

      const scale = isPausePressed ? 0.92 : 1.0;

    } else {
      const pKey = `${pb.size}_${isPausePressed ? 1 : 0}_${dpr}`;

        const pad = 4;
        const tot = pb.size + pad * 2;

        pc.width = Math.ceil(tot * dpr);
        pc.height = Math.ceil(tot * dpr);
        const pCtx = pc.getContext('2d');
        pCtx.scale(dpr, dpr);
        const prevCtx = ctx;
        ctx = pCtx;
        try {
          drawGlossyButton(pad, pad, pb.size, pb.size, BUTTON_THEMES.royalPurple, null, 'pause', isPausePressed, 11);
        } finally {
          ctx = prevCtx;
        }
        hudSpriteCache.pauseBtnKey = pKey;
        hudSpriteCache.pauseBtn = { canvas: pc, pad, size: tot };
      }
      const pSpr = hudSpriteCache.pauseBtn;
      ctx.drawImage(pSpr.canvas, pb.x - pSpr.pad, pb.y - pSpr.pad, pSpr.size, pSpr.size);
    }
  }

  // 2. Top-Right: Orange Wallet Coin Pill + collected "+N" / "x2" + Boost timer bar underneath
  const hasOrangeCoinSprite = !!(hudCoinPillImg && hudCoinPillImg.complete && hudCoinPillImg.naturalWidth > 0);
  const coinPillH = hasOrangeCoinSprite ? 34 : 26;

  let rightSubY = coinPillY + coinPillH + 11;
  if (levelCoinsCollected > 0 || boostTimer > 0) {
    let rightTagX = W - 14;
    if (levelCoinsCollected > 0) {
      drawGlossyText(`+${levelCoinsCollected}`, rightTagX, rightSubY, 12.5, 'right', '#fde047', '#713f12', 2.8);
      rightTagX -= (`+${levelCoinsCollected}`.length * 8 + 8);
    }
    if (boostTimer > 0) {
      drawGlossyText('x2', rightTagX, rightSubY, 12.5, 'right', '#38bdf8', '#0f172a', 3.0);
    }
    rightSubY += 14;
  }

  if (boostTimer > 0) {
    const bHudW = 88;
    const bHudH = 12;
    const bHudX = W - bHudW - 12;
    const bHudY = rightSubY - 4;

    ctx.save();
    ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
    roundRect(ctx, bHudX, bHudY, bHudW, bHudH, bHudH / 2);
    ctx.fill();

    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 1.2;
    roundRect(ctx, bHudX, bHudY, bHudW, bHudH, bHudH / 2);
    ctx.stroke();

    // Glowing bolt icon
    const boltCX = bHudX + 9;
    const boltCY = bHudY + bHudH / 2;
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.moveTo(boltCX + 1, boltCY - 4.2);
    ctx.lineTo(boltCX - 3, boltCY);
    ctx.lineTo(boltCX - 0.5, boltCY);
    ctx.lineTo(boltCX - 2, boltCY + 4.2);
    ctx.lineTo(boltCX + 3, boltCY - 0.5);
    ctx.lineTo(boltCX + 0.5, boltCY - 0.5);
    ctx.closePath();
    ctx.fill();

    // Shrinking progress bar
    const barX = bHudX + 18;
    const barY = bHudY + 2.5;
    const barMaxW = bHudW - 22;
    const barH = bHudH - 5;
    const barRatio = Math.max(0, Math.min(1, boostTimer / boostMaxDuration));
    const barW = Math.max(2, barMaxW * barRatio);

    const bgKey = `${barX}_${barMaxW}_${barY}`;
    if (hudSpriteCache.boostBarGradKey !== bgKey) {
      const barGrad = ctx.createLinearGradient(barX, barY, barX + barMaxW, barY);
      barGrad.addColorStop(0, '#38bdf8');
      barGrad.addColorStop(0.5, '#67e8f9');
      barGrad.addColorStop(1, '#ffffff');
      hudSpriteCache.boostBarGradKey = bgKey;
      hudSpriteCache.boostBarGrad = barGrad;
    }
    ctx.fillStyle = hudSpriteCache.boostBarGrad;
    roundRect(ctx, barX, barY, barW, barH, barH / 2);
    ctx.fill();
    ctx.restore();
  }

  // 3. Top-Center: Cached Glossy purple "Level X" badge + progress bar below
  const lvlW = 114;
  const lvlH = 34;
  const lvlX = Math.round(W / 2 - lvlW / 2);
  const lvlY = 14 + topInset;
  const cachedBadge = getCachedLevelBadge(curLevel);
  ctx.drawImage(cachedBadge.canvas, lvlX - cachedBadge.pad, lvlY - cachedBadge.pad, cachedBadge.w, cachedBadge.h);

  // Sleek level progress bar directly below the Level badge (custom gold-star chevron bar #10)
  const clampedProg = Math.max(0, Math.min(1, progress));
  const hasBarSprites = !!(
    hudProgressBarTrackImg && hudProgressBarTrackImg.complete && hudProgressBarTrackImg.naturalWidth > 0 &&
    hudProgressBarFillImg && hudProgressBarFillImg.complete && hudProgressBarFillImg.naturalWidth > 0 &&
    hudProgressBarStarImg && hudProgressBarStarImg.complete && hudProgressBarStarImg.naturalWidth > 0
  );

  if (hasBarSprites) {
    const barW = 136;
    const barH = Math.round(barW * (hudProgressBarTrackImg.naturalHeight / hudProgressBarTrackImg.naturalWidth));
    const barX = Math.round(W / 2 - barW / 2);
    const barY = lvlY + lvlH + 4;

    const starH = Math.round(barH * 1.10);
    const starW = Math.round(starH * (hudProgressBarStarImg.naturalWidth / hudProgressBarStarImg.naturalHeight));
    const starMinX = barX + starW * 0.44;
    const starMaxX = barX + barW - starW * 0.48;
    const starX = starMinX + (starMaxX - starMinX) * clampedProg;

    ctx.save();
    ctx.shadowColor = 'rgba(2, 12, 42, 0.36)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetY = 2;
    ctx.drawImage(hudProgressBarTrackImg, barX, barY, barW, barH);
    ctx.restore();

    if (clampedProg > 0.005) {
      const clipRight = clampedProg >= 0.99 ? (barX + barW) : Math.min(barX + barW, starX + starW * 0.12);
      const clipW = Math.max(0, clipRight - barX);
      if (clipW > 1) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(barX, barY, clipW, barH);
        ctx.clip();
        ctx.drawImage(hudProgressBarFillImg, barX, barY, barW, barH);
        ctx.restore();
      }
    }

    ctx.save();
    ctx.shadowColor = 'rgba(2, 12, 42, 0.38)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetY = 1.5;
    ctx.drawImage(hudProgressBarStarImg, starX - starW / 2, barY + barH / 2 - starH / 2, starW, starH);
    ctx.restore();
  } else {
    const barW = 122;
    const barX = Math.round(W / 2 - barW / 2);
    const barY = lvlY + lvlH + 5;
    const barH = 15;
    const starInset = barH / 2;
    const starX = barX + starInset + (barW - starInset * 2) * clampedProg;
    const fillW = clampedProg > 0 ? Math.min(barW, barH + (barW - barH) * clampedProg) : 0;

    ctx.save();
    ctx.fillStyle = 'rgba(15, 23, 42, 0.66)';
    roundRect(ctx, barX, barY, barW, barH, barH / 2);
    ctx.fill();

    if (fillW > 0) {
      const innerPad = 1.5;
      const innerH = barH - innerPad * 2;
      const innerW = Math.max(innerH, fillW - innerPad * 2);
      const fgKey = `${cfg.accentColor}_${barY}_${barH}`;
      if (hudSpriteCache.progGradKey !== fgKey) {
        const fGrad = ctx.createLinearGradient(0, barY + innerPad, 0, barY + barH - innerPad);
        fGrad.addColorStop(0, '#fef08a');
        fGrad.addColorStop(0.55, cfg.accentColor);
        fGrad.addColorStop(1, adjustColor(cfg.accentColor, -0.4));
        hudSpriteCache.progGradKey = fgKey;
        hudSpriteCache.progGrad = fGrad;
      }
      ctx.fillStyle = hudSpriteCache.progGrad;
      roundRect(ctx, barX + innerPad, barY + innerPad, innerW, innerH, innerH / 2);
      ctx.fill();
    }

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    roundRect(ctx, barX, barY, barW, barH, barH / 2);
    ctx.stroke();

    const starSpr = getCachedGoldStar8();
    ctx.drawImage(starSpr.canvas, starX - starSpr.half, (barY + barH / 2) - starSpr.half, starSpr.size, starSpr.size);
    ctx.restore();
  }

  // 4. Active Magnet / Slow-mo / Shield indicator pills on top-left under Pause button
  let activePillY = pb.y + pb.size + 8;
  if (magnetTimer > 0) {
    drawActiveBoosterHudPill(12, activePillY, 'MAGNET', magnetTimer / magnetMaxDuration, '#c084fc');
    activePillY += 18;
  }
  if (slowMoTimer > 0) {
    drawActiveBoosterHudPill(12, activePillY, 'SLOW-MO', slowMoTimer / slowMoMaxDuration, '#f472b6');
    activePillY += 18;
  }
  if (shieldActive) {
    drawActiveBoosterHudPill(12, activePillY, 'SHIELD', 1.0, '#4ade80');
  }

  // 5. Bottom round active booster buttons during gameplay (cached sprites -> 1 drawImage per button)
  if (st === 'play' && !stopping && finishRunStage === 'none' && activeLevelBoosters.length > 0) {
    const inLevelBtns = getInLevelBoosterButtons();
    for (let i = 0; i < inLevelBtns.length; i++) {
      const b = inLevelBtns[i];
      const item = getShopItemById(b.id);
      if (!item) continue;
      const count = inventory[b.id] || 0;
      const isRunning = (
        (b.id === 'boost' && boostTimer > 0) ||
        (b.id === 'magnet' && magnetTimer > 0) ||
        (b.id === 'shield' && shieldActive) ||
        (b.id === 'slowmo' && slowMoTimer > 0)
      );
      const isPressed = (activePress === 'use_booster_' + b.id);
      const bKey = `${b.id}_${count}_${isRunning ? 1 : 0}_${isPressed ? 1 : 0}_${dpr}`;
      let bSpr = hudSpriteCache.inLevelBtns.get(bKey);
      if (!bSpr) {
        if (hudSpriteCache.inLevelBtns.size > 32) {
          hudSpriteCache.inLevelBtns.clear();
        }
        const pad = 12;
        const tot = (b.r + pad) * 2;
        const center = b.r + pad;
        const bc = document.createElement('canvas');
        bc.width = Math.ceil(tot * dpr);
        bc.height = Math.ceil(tot * dpr);
        const bCtx = bc.getContext('2d');
        bCtx.scale(dpr, dpr);
        const prevCtx = ctx;
        ctx = bCtx;
        try {
          const theme = (count > 0) ? BUTTON_THEMES[item.themeKey] : BUTTON_THEMES.gray;
          drawRoundGlossyButton(center, center, b.r, theme, item.icon, isPressed);
          if (isRunning) {
            bCtx.strokeStyle = '#fde047';
            bCtx.lineWidth = 2.6;
            bCtx.beginPath();
            bCtx.arc(center, center, b.r + 3.5, 0, Math.PI * 2);
            bCtx.stroke();
          }
          const bx = center + b.r * 0.65;
          const by = center - b.r * 0.65;
          bCtx.fillStyle = count > 0 ? '#0f172a' : '#475569';
          bCtx.beginPath();
          bCtx.arc(bx, by, 9, 0, Math.PI * 2);
          bCtx.fill();
          bCtx.strokeStyle = count > 0 ? '#fde047' : '#94a3b8';
          bCtx.lineWidth = 1.4;
          bCtx.stroke();
          drawGlossyText(String(count), bx, by + 0.5, 10, 'center', count > 0 ? '#ffffff' : '#cbd5e1', '#0f172a', 2.2);
        } finally {
          ctx = prevCtx;
        }
        bSpr = { canvas: bc, center, tot };
        hudSpriteCache.inLevelBtns.set(bKey, bSpr);
      }
      ctx.drawImage(bSpr.canvas, b.cx - bSpr.center, b.cy - bSpr.center, bSpr.tot, bSpr.tot);
    }
  }

  // Bottom-Right Corner Speedometer
  drawSpeedometer();
}
// Speedometer widget rendered in bottom-right corner as requested
function drawSpeedometer(dt = 0.016) {
  const meterW = 104;
  const meterH = 79;
  const meterX = W - meterW - 10;
  const meterY = H - meterH - 12 - (botInset || 0);

  ctx.save();

  // 1. Draw Speedometer card background (cached at device resolution)
  const cachedSpeedBg = getCachedSpeedometerBg(meterW, meterH);
  if (cachedSpeedBg) {
    ctx.drawImage(cachedSpeedBg, meterX, meterY, meterW, meterH);
  } else {
    // Procedural fallback matching the exact card styling
    ctx.save();
    ctx.fillStyle = '#0c0d10';
    roundRect(ctx, meterX, meterY, meterW, meterH, 12);
    ctx.fill();
    ctx.strokeStyle = '#ea580c';
    ctx.lineWidth = 1.8;
    roundRect(ctx, meterX, meterY, meterW, meterH, 12);
    ctx.stroke();

    const fR = meterW * 0.38;
    const fGrad = ctx.createRadialGradient(meterX + meterW * 0.5, meterY + meterH * 0.559, fR * 0.5, meterX + meterW * 0.5, meterY + meterH * 0.559, fR);
    fGrad.addColorStop(0, '#0c0d10');
    fGrad.addColorStop(0.65, '#ea580c');
    fGrad.addColorStop(0.9, '#fef08a');
    fGrad.addColorStop(1, '#0c0d10');
    ctx.fillStyle = fGrad;
    ctx.beginPath();
    ctx.arc(meterX + meterW * 0.5, meterY + meterH * 0.559, fR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Dial Center
  const dialCenterX = meterX + meterW * 0.5;
  const dialCenterY = meterY + meterH * 0.559;

  // 2. Extra boost border highlight around speedometer during boost
  if (boostTimer > 0) {
    const pulse = 0.5 + 0.5 * Math.sin(gameTime * 12);
    ctx.save();
    ctx.strokeStyle = 'rgba(251, 146, 60, ' + (0.65 + 0.35 * pulse) + ')';
    ctx.lineWidth = 2.2;
    roundRect(ctx, meterX + 2, meterY + 2, meterW - 4, meterH - 4, 10);
    ctx.stroke();
    ctx.restore();
  }

  // 3. Dynamic tachometer arc sweep along the fiery ring
  const speedRatio = Math.max(0, Math.min(1.0, displayedSpeedKmH / 360));
  if (speedRatio > 0.02) {
    ctx.save();
    const arcR = meterW * 0.285;
    const startAng = Math.PI * 0.75;
    const totalSweep = Math.PI * 1.5;
    const endAng = startAng + totalSweep * speedRatio;

    ctx.beginPath();
    ctx.arc(dialCenterX, dialCenterY, arcR, startAng, endAng);
    ctx.strokeStyle = (boostTimer > 0) ? '#fef08a' : '#f97316';
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();
  }

  // 4. Render dynamic speed number & km/h
  const speedVal = Math.round(displayedSpeedKmH);
  const speedStr = String(Math.max(0, speedVal));

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const numFontSize = speedStr.length >= 3 ? 20 : 23;
  ctx.font = 'italic 900 ' + numFontSize + 'px "Baloo 2", "Lilita One", sans-serif';

      y: slotY,
      w: slotSz,
      h: slotSz

function drawActiveBoosterHudPill(x, y, label, ratio, accentColor) {
  const w = 82, h = 14;
  ctx.save();
  ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
  roundRect(ctx, x, y, w, h, h / 2);
  ctx.fill();
  ctx.strokeStyle = accentColor;
  ctx.lineWidth = 1.2;
  roundRect(ctx, x, y, w, h, h / 2);
  ctx.stroke();

  const fillW = Math.max(0, Math.min(w - 4, (w - 4) * Math.max(0, Math.min(1, ratio))));
  if (fillW > 2) {
    ctx.fillStyle = accentColor;
    ctx.globalAlpha = 0.38;
    roundRect(ctx, x + 2, y + 2, fillW, h - 4, (h - 4) / 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
  drawGlossyText(label, x + w / 2, y + h / 2 + 0.5, 9, 'center', '#ffffff', '#0f172a', 2.2);
  ctx.restore();
}

function activateInLevelBooster(id) {
  if (st !== 'play' || paused || pauseCountdown > 0 || stopping || finishRunStage !== 'none') return;
  if ((inventory[id] || 0) <= 0) return;

    showToast('Shield already active!');
    return;
  }

  inventory[id] = Math.max(0, (inventory[id] || 0) - 1);
  saveInventory();

  if (id === 'boost') {
    if (boostTimer > 0) {
      boostTimer = Math.min(6.0, boostTimer + BOOST_DURATION);
      boostMaxDuration = Math.max(boostMaxDuration, boostTimer);
    } else {
      boostTimer = BOOST_DURATION;
      boostMaxDuration = BOOST_DURATION;
      boostElapsed = 0;
    }
    playBoostWhooshSound();
    coinFloatTexts.push({ text: 'BOOST!', x: carDrawX, y: cy - 28, timer: 0.9, color: '#38bdf8' });
  } else if (id === 'magnet') {
    magnetTimer = MAGNET_DURATION;
    magnetMaxDuration = MAGNET_DURATION;
    playBoostWhooshSound();
    coinFloatTexts.push({ text: 'MAGNET!', x: carDrawX, y: cy - 28, timer: 0.9, color: '#e879f9' });
  } else if (id === 'shield') {
    shieldActive = true;
    playBoostWhooshSound();
    coinFloatTexts.push({ text: 'SHIELD!', x: carDrawX, y: cy - 28, timer: 0.9, color: '#4ade80' });

    slowMoTimer = SLOWMO_DURATION;
    slowMoMaxDuration = SLOWMO_DURATION;
    playBoostWhooshSound();
    coinFloatTexts.push({ text: 'SLOW-MO!', x: carDrawX, y: cy - 28, timer: 0.9, color: '#fde047' });

function reviveAfterCrash() {

  playPerfectBonusSound();
