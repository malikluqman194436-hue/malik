function renderStageSilhouettes(idx, stage, farCtx, midCtx, nearCtx, unitW, H) {
  switch (idx) {
    case 0:
      drawMesasAndArches(farCtx, unitW, H, 'far', stage);
      drawMesasAndArches(midCtx, unitW, H, 'mid', stage);
      drawMesasAndArches(nearCtx, unitW, H, 'near', stage);
      break;
    case 1:
      drawSkyscrapersWithNeon(farCtx, unitW, H, 'far', stage);
      drawSkyscrapersWithNeon(midCtx, unitW, H, 'mid', stage);
      drawSkyscrapersWithNeon(nearCtx, unitW, H, 'near', stage);
      break;
    case 2:
      drawMountainRidges(farCtx, unitW, H, 'far', stage);
      drawMountainRidges(midCtx, unitW, H, 'mid', stage);
      drawMountainRidges(nearCtx, unitW, H, 'near', stage);
      break;
    case 3:
      drawVolcanoCliffs(farCtx, unitW, H, 'far', stage);
      drawVolcanoCliffs(midCtx, unitW, H, 'mid', stage);
      drawVolcanoCliffs(nearCtx, unitW, H, 'near', stage);
      break;
    case 4:
      drawCyberFactory(farCtx, unitW, H, 'far', stage);
      drawCyberFactory(midCtx, unitW, H, 'mid', stage);
      drawCyberFactory(nearCtx, unitW, H, 'near', stage);
      break;
    case 5:
      drawAlienJungle(farCtx, unitW, H, 'far', stage);
      drawAlienJungle(midCtx, unitW, H, 'mid', stage);
      drawAlienJungle(nearCtx, unitW, H, 'near', stage);
      break;
    case 6:
      drawOceanRuins(farCtx, unitW, H, 'far', stage);
      drawOceanRuins(midCtx, unitW, H, 'mid', stage);
      drawOceanRuins(nearCtx, unitW, H, 'near', stage);
      break;
    case 7:
    default:
      drawSpaceStation(farCtx, unitW, H, 'far', stage);
      drawSpaceStation(midCtx, unitW, H, 'mid', stage);
      drawSpaceStation(nearCtx, unitW, H, 'near', stage);
      break;
  }
}

function prerenderStageBackgrounds() {
  stageBgCanvases.length = 0;
}

function getOrBuildStageBg(stageIdx) {
  if (stageBgCanvases[stageIdx]) return stageBgCanvases[stageIdx];
  const stage = STAGES[stageIdx];
  if (!stage) return null;
  const unitW = 720;

  // Keep at most 2 fallback stage backgrounds cached in memory
  let cachedCount = 0;
  for (let k = 0; k < stageBgCanvases.length; k++) {
    if (stageBgCanvases[k]) cachedCount++;
  }
  if (cachedCount >= 2) {
    for (let k = 0; k < stageBgCanvases.length; k++) {
      if (k !== stageIdx && k !== ((prevBgStage - 1) % STAGES.length)) {
        stageBgCanvases[k] = null;
      }
    }
  }

  const gradCanv = document.createElement('canvas');
  gradCanv.width = W;
  gradCanv.height = H;
  const gCtx = gradCanv.getContext('2d');
  const bgGrad = gCtx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, stage.gradientTop);
  bgGrad.addColorStop(1, stage.gradientBottom);
  gCtx.fillStyle = bgGrad;
  gCtx.fillRect(0, 0, W, H);

  const haze = gCtx.createLinearGradient(0, H * 0.40, 0, H * 0.62);
  haze.addColorStop(0, 'rgba(255, 255, 255, 0)');
  haze.addColorStop(0.5, 'rgba(255, 255, 255, 0.12)');
  haze.addColorStop(1, 'rgba(255, 255, 255, 0)');
  gCtx.fillStyle = haze;
  gCtx.fillRect(0, H * 0.40, W, H * 0.22);

  const farCanv = document.createElement('canvas');
  farCanv.width = unitW;
  farCanv.height = H;
  const farCtx = farCanv.getContext('2d');

  const midCanv = document.createElement('canvas');
  midCanv.width = unitW;
  midCanv.height = H;
  const midCtx = midCanv.getContext('2d');

  const nearCanv = document.createElement('canvas');
  nearCanv.width = unitW;
  nearCanv.height = H;
  const nearCtx = nearCanv.getContext('2d');

  renderStageSilhouettes(stageIdx, stage, farCtx, midCtx, nearCtx, unitW, H);

  stageBgCanvases[stageIdx] = {
    gradient: gradCanv,
    far: farCanv,
    mid: midCanv,
    near: nearCanv
  };
  return stageBgCanvases[stageIdx];
}

// Stage Particles (slow particles in 2 sizes)
const stageParticles = [];
function initStageParticles() {
  stageParticles.length = 0;
}

function drawStageParticles(stage, alpha = 1) {
  return;
  const pType = stage.particleType || 'dust';
  const color = stage.accent || '#ffffff';

  ctx.save();
  ctx.globalAlpha = alpha;

  if (pType === 'rain') {
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 1.0;
    ctx.beginPath();
    for (let i = 0; i < stageParticles.length; i++) {
      const p = stageParticles[i];
      if (p.sizeClass === 0) {
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - 3, p.y + 8);
      }
    }
    ctx.stroke();
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let i = 0; i < stageParticles.length; i++) {
      const p = stageParticles[i];
      if (p.sizeClass !== 0) {
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - 3, p.y + 14);
      }
    }
    ctx.stroke();
  } else if (pType === 'bubbles') {
    ctx.strokeStyle = 'rgba(52, 224, 200, 0.7)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i < stageParticles.length; i++) {
      const p = stageParticles[i];
      const r = (p.sizeClass === 0) ? 1.8 : 3.6;
      ctx.moveTo(p.x + r, p.y);
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    }
    ctx.stroke();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.beginPath();
    for (let i = 0; i < stageParticles.length; i++) {
      const p = stageParticles[i];
      const r = (p.sizeClass === 0) ? 1.8 : 3.6;
      const hx = p.x - r * 0.3, hy = p.y - r * 0.3, hr = r * 0.35;
      ctx.moveTo(hx + hr, hy);
      ctx.arc(hx, hy, hr, 0, Math.PI * 2);
    }
    ctx.fill();
  } else if (pType === 'sparks') {
    ctx.fillStyle = '#ffd21a';
    for (let i = 0; i < stageParticles.length; i++) {
      const p = stageParticles[i];
      const r = (p.sizeClass === 0) ? 1.8 : 3.6;
      ctx.fillRect(p.x - r * 0.5, p.y - r * 0.5, r, r);
    }
  } else {
    if (pType === 'embers') ctx.fillStyle = '#ff6a1a';
    else if (pType === 'glowing spores') ctx.fillStyle = color;
    else if (pType === 'snow') ctx.fillStyle = '#ffffff';
    else ctx.fillStyle = (pType === 'dust') ? '#f59e0b' : 'rgba(200, 180, 255, 0.7)';

    ctx.beginPath();
    for (let i = 0; i < stageParticles.length; i++) {
      const p = stageParticles[i];
      const r = (p.sizeClass === 0) ? 1.8 : 3.6;
      ctx.moveTo(p.x + r, p.y);
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    }
    ctx.fill();
  }
  ctx.restore();
}

function updateStageParticles(dt, stage) {
  const pType = stage.particleType || 'dust';

  for (let i = 0; i < stageParticles.length; i++) {
    const p = stageParticles[i];
    if (pType === 'rain') {
      p.x -= 30 * dt;
      p.y += (350 + p.speed * 4) * dt;
    } else if (pType === 'bubbles') {
      p.y -= (45 + p.speed * 0.8) * dt;
      p.x += Math.sin(p.phase + gameTime * 2) * 12 * dt;
    } else if (pType === 'embers') {
      p.y -= (40 + p.speed * 0.7) * dt;
      p.x += Math.sin(p.phase + gameTime * 2.5) * 10 * dt;
    } else if (pType === 'sparks') {
      p.y += (65 + p.speed) * dt;
      p.x += Math.sin(p.phase + gameTime * 3) * 16 * dt;
    } else if (pType === 'glowing spores') {
      p.x -= (22 + p.speed * 0.4) * dt;
      p.y += Math.sin(p.phase + gameTime * 1.5) * 8 * dt;
    } else if (pType === 'snow') {
      p.y += (32 + p.speed * 0.5) * dt;
      p.x += Math.sin(p.phase + gameTime * 1.8) * 14 * dt;
    } else {
      // dust / floating dust
      p.x -= (18 + p.speed * 0.4) * dt;
      p.y += Math.sin(p.phase + gameTime) * 6 * dt;
    }

    if (p.x < -10) p.x += W + 20;
    if (p.x > W + 10) p.x -= W + 20;
    if (p.y < -10) p.y += H + 20;
    if (p.y > H + 10) p.y -= H + 20;
  }
}

function renderCustomCoinFrame(fCtx, cx, cy, radius, wScale, valueLabel, theme, frameIdx) {
  fCtx.save();
  fCtx.translate(cx, cy);

  // 1. Soft radiant golden aura
  const glow = fCtx.createRadialGradient(0, 0, radius * 0.25, 0, 0, radius + 7);
  glow.addColorStop(0, theme.glowInner);
  glow.addColorStop(0.62, theme.glowOuter);
  glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  fCtx.fillStyle = glow;
  fCtx.beginPath();
  fCtx.arc(0, 0, radius + 7, 0, Math.PI * 2);
  fCtx.fill();

  // 2. Subtle drop shadow underneath
  const depth = Math.max(2.3, radius * 0.13 + (1 - wScale) * 4.2);
  fCtx.fillStyle = 'rgba(15, 23, 42, 0.24)';
  fCtx.beginPath();
  fCtx.ellipse(-depth * 0.45, 2.2, radius * wScale + 1.0, radius + 1.0, 0, 0, Math.PI * 2);
  fCtx.fill();

  // 3. 3D Extruded metallic rim edge (matches outer/HUD glossy star coin)
  const edgeGrad = fCtx.createLinearGradient(-depth, -radius, -depth, radius);
  edgeGrad.addColorStop(0, theme.edgeStops[0]);
  edgeGrad.addColorStop(0.28, theme.edgeStops[1]);
  edgeGrad.addColorStop(0.75, theme.edgeStops[2]);
  edgeGrad.addColorStop(1, theme.edgeStops[3]);
  fCtx.fillStyle = edgeGrad;
  fCtx.beginPath();
  fCtx.ellipse(-depth, 0, radius * wScale, radius, 0, 0, Math.PI * 2);
  fCtx.fill();
  fCtx.strokeStyle = theme.rimStroke;
  fCtx.lineWidth = Math.max(1.1, radius * 0.065);
  fCtx.stroke();

  // 4. Front glossy golden coin face
  fCtx.scale(wScale, 1.0);

  const faceGrad = fCtx.createRadialGradient(-radius * 0.25, -radius * 0.30, radius * 0.08, 0, 0, radius);
  faceGrad.addColorStop(0, theme.faceStops[0]);
  faceGrad.addColorStop(0.35, theme.faceStops[1]);
  faceGrad.addColorStop(0.82, theme.faceStops[2]);
  faceGrad.addColorStop(1, theme.faceStops[3]);
  fCtx.fillStyle = faceGrad;
  fCtx.beginPath();
  fCtx.arc(0, 0, radius, 0, Math.PI * 2);
  fCtx.fill();
  fCtx.strokeStyle = theme.faceStroke;
  fCtx.lineWidth = Math.max(1.1, radius * 0.068);
  fCtx.stroke();

  // Top-left rim highlight arc
  fCtx.strokeStyle = 'rgba(255, 255, 255, 0.72)';
  fCtx.lineWidth = Math.max(1.1, radius * 0.075);
  fCtx.lineCap = 'round';
  fCtx.beginPath();
  fCtx.arc(0, 0, radius * 0.89, -Math.PI * 0.85, -Math.PI * 0.16);
  fCtx.stroke();

  // 5. Inner recessed circular groove (identical to HUD Star Coin)
  const innerR = radius * 0.75;
  const innerGrad = fCtx.createLinearGradient(0, -innerR, 0, innerR);
  innerGrad.addColorStop(0, theme.innerStops[0]);
  innerGrad.addColorStop(0.5, theme.innerStops[1]);
  innerGrad.addColorStop(1, theme.innerStops[2]);
  fCtx.fillStyle = innerGrad;
  fCtx.beginPath();
  fCtx.arc(0, 0, innerR, 0, Math.PI * 2);
  fCtx.fill();

  fCtx.strokeStyle = theme.innerStroke;
  fCtx.lineWidth = Math.max(1.0, radius * 0.072);
  fCtx.beginPath();
  fCtx.arc(0, 0, innerR, 0, Math.PI * 2);
  fCtx.stroke();

  // Subtle bright lip inside bottom of recessed circle
  fCtx.strokeStyle = 'rgba(254, 249, 195, 0.65)';
  fCtx.lineWidth = Math.max(0.85, radius * 0.055);
  fCtx.beginPath();
  fCtx.arc(0, 0, innerR * 0.93, Math.PI * 0.14, Math.PI * 0.86);
  fCtx.stroke();

  // Decorative crown stars top & bottom on 50 & 100 coins
  if (valueLabel === '50' || valueLabel === '100') {
    fCtx.fillStyle = '#fef9c3';
    fCtx.beginPath();
    fCtx.arc(0, -innerR * 0.68, 1.5, 0, Math.PI * 2);
    fCtx.arc(0, innerR * 0.68, 1.5, 0, Math.PI * 2);
    fCtx.fill();
  }

  // 6. Embossed 3D coin value numeral ("10", "50", "100")
  const fontSize = valueLabel.length >= 3 ? Math.round(radius * 0.60) : Math.round(radius * 0.78);
  fCtx.font = `900 ${fontSize}px "Lilita One", "Baloo 2", system-ui, "Segoe UI", sans-serif`;
  fCtx.textAlign = 'center';
  fCtx.textBaseline = 'middle';
  fCtx.lineJoin = 'round';
  fCtx.miterLimit = 2;

  // Soft recessed drop shadow
  fCtx.fillStyle = 'rgba(120, 53, 15, 0.45)';
  fCtx.fillText(valueLabel, 0, 2.0);

  // Dark amber-brown embossed outline
  fCtx.strokeStyle = theme.textStroke;
  fCtx.lineWidth = Math.max(2.6, radius * 0.16);
  fCtx.strokeText(valueLabel, 0, 0.7);

  // Glossy gold-cream fill matching the embossed star emblem
  const txtGrad = fCtx.createLinearGradient(0, -fontSize * 0.45, 0, fontSize * 0.45);
  txtGrad.addColorStop(0, '#ffffff');
  txtGrad.addColorStop(0.55, '#fef9c3');
  txtGrad.addColorStop(1, '#fde047');
  fCtx.fillStyle = txtGrad;
  fCtx.fillText(valueLabel, 0, 0.7);

  // 7. Animated sweeping diagonal shine highlight across coin face
  const shineX = ((frameIdx / 7) * 2 - 1) * radius * 0.95;
  fCtx.save();
  fCtx.beginPath();
  fCtx.arc(0, 0, radius - 0.5, 0, Math.PI * 2);
  fCtx.clip();
  const shineGrad = fCtx.createLinearGradient(shineX - 4.5, -radius, shineX + 4.5, radius);
  shineGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
  shineGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.52)');
  shineGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
  fCtx.fillStyle = shineGrad;
  fCtx.fillRect(-radius, -radius, radius * 2, radius * 2);
  fCtx.restore();

  // 8. Crisp 4-point star sparkle glint on rim
  if (frameIdx % 3 === 0) {
    const gx = -radius * 0.56;
    const gy = -radius * 0.56;
    fCtx.fillStyle = '#ffffff';
    fCtx.beginPath();
    fCtx.moveTo(gx, gy - 3.6);
    fCtx.lineTo(gx + 1.0, gy - 1.0);
    fCtx.lineTo(gx + 3.6, gy);
    fCtx.lineTo(gx + 1.0, gy + 1.0);
    fCtx.lineTo(gx, gy + 3.6);
    fCtx.lineTo(gx - 1.0, gy + 1.0);
    fCtx.lineTo(gx - 3.6, gy);
    fCtx.lineTo(gx - 1.0, gy - 1.0);
    fCtx.closePath();
    fCtx.fill();
  }

  fCtx.restore();
}

let lastCoinPrerenderSig = '';
function prerenderCoinFrames(img10, img50, img100) {
  if (img10) coin10LoadedImg = img10;
  if (img50) coin50LoadedImg = img50;
  if (img100) coin100LoadedImg = img100;

  bronzeFrames.length = 0;
  silverFrames.length = 0;
  goldFrames.length = 0;
  gemFrames.length = 0;

  const logicalSz = COIN_SPRITE_LOGICAL_SIZE;
  const pixelSz = logicalSz * COIN_SPRITE_SCALE;

    const ang = (i / 8) * Math.PI;
    // Gentle 3D tilt-turn so the embossed coin price stays readable on every frame
    const wScale = 0.66 + 0.34 * Math.abs(Math.cos(ang));

    // 1. 3D GLOSSY GOLD COIN (10)
    const canv10 = document.createElement('canvas');
    canv10.width = pixelSz; canv10.height = pixelSz;
    const ctx10 = canv10.getContext('2d');

    bronzeFrames.push(canv10);

    // 2. 3D GLOSSY GOLD COIN (50)

    renderCustomCoinFrame(ctx100, cx, cy, 22.5, wScale, '100', COIN_STAGE_THEMES[100], i);
    gemFrames.push(canv100);
  }
}

function playCoinPickupSound(coinType = 'bronze') {
  if (!soundEnabled) return;
  ensureAudioContext();
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    coinCombo = Math.min(8, coinCombo + 1);
    coinComboTimer = 0.8;

    const pitchFactor = Math.pow(2, coinCombo / 14);
    const outNode = masterGain || audioCtx.destination;

    if (coinType === 'gem' || coinType === 'coin_100') {
      // Shimmering triple chime for rare 100 laurel coin
      const freqs = [
        [1046.5 * pitchFactor, 1318.5 * pitchFactor],
        [1567.98 * pitchFactor, 2093.0 * pitchFactor],
        [2637.0 * pitchFactor, 3135.96 * pitchFactor]
      ];
      freqs.forEach((pair, idx) => {
        const t = now + idx * 0.055;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0, now);
        g.gain.setValueAtTime(0.24, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
        g.connect(outNode);
        pair.forEach(f => {
          const osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t);
          osc.connect(g);
          trackScheduledAudioNode(osc, g);
          osc.start(t);
          osc.stop(t + 0.26);
        });
      });
      return;
    }

    if (coinType === 'gold' || coinType === 'coin_50') {
      // Fuller double chime for gold coin
      const freqs = [
        [1046.5 * pitchFactor, 1318.5 * pitchFactor],
        [1567.98 * pitchFactor, 2093.0 * pitchFactor]
      ];
      freqs.forEach((pair, idx) => {
        const t = now + idx * 0.06;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0, now);
        g.gain.setValueAtTime(0.26, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        g.connect(outNode);
        pair.forEach(f => {
          const osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t);
          osc.connect(g);
          trackScheduledAudioNode(osc, g);
          osc.start(t);
          osc.stop(t + 0.22);
        });
      });
      return;
    }

    if (coinType === 'silver') {
      // Higher ting for silver coin
      const f1 = 1760 * pitchFactor;
      const f2 = 2637 * pitchFactor;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.25, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      g.connect(outNode);
      [f1, f2].forEach(f => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now);
        osc.connect(g);
        trackScheduledAudioNode(osc, g);
        osc.start(now);
        osc.stop(now + 0.16);
      });
      return;
    }

    // Normal ting for bronze coin
    const f1 = 1318 * pitchFactor;
    const f2 = 1976 * pitchFactor;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.25, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    g.connect(outNode);
    [f1, f2].forEach(f => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now);
      osc.connect(g);
      trackScheduledAudioNode(osc, g);
      osc.start(now);
      osc.stop(now + 0.14);
    });
  } catch (e) {}
}

function prerenderBoosterSprite() {
  const sz = 80;
  const canvas = document.createElement('canvas');
  canvas.width = sz;
  canvas.height = sz;
  const bCtx = canvas.getContext('2d');
  const cx = sz / 2, cy = sz / 2;
  const r = BOOSTER_RADIUS;

  // 1. Soft glowing outer radial gradient
  const glow = bCtx.createRadialGradient(cx, cy, r * 0.25, cx, cy, sz / 2);
  glow.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
  glow.addColorStop(0.35, 'rgba(56, 189, 248, 0.85)');
  glow.addColorStop(0.70, 'rgba(14, 165, 233, 0.35)');
  glow.addColorStop(1, 'rgba(2, 132, 199, 0)');
  bCtx.fillStyle = glow;
  bCtx.beginPath();
  bCtx.arc(cx, cy, sz / 2, 0, Math.PI * 2);
  bCtx.fill();

  // 2. Translucent ring backing
  bCtx.fillStyle = 'rgba(15, 23, 42, 0.88)';
  bCtx.beginPath();
  bCtx.arc(cx, cy, r, 0, Math.PI * 2);
  bCtx.fill();

  // 3. Bright cyan/white ring border
  bCtx.strokeStyle = '#38bdf8';
  bCtx.lineWidth = 2.6;
  bCtx.beginPath();
  bCtx.arc(cx, cy, r, 0, Math.PI * 2);
  bCtx.stroke();

  // Inner white accent ring
  bCtx.strokeStyle = '#ffffff';
  bCtx.lineWidth = 1.2;
  bCtx.beginPath();
  bCtx.arc(cx, cy, r - 3, 0, Math.PI * 2);
  bCtx.stroke();

  // 4. Glowing Lightning Bolt Icon in center
  bCtx.save();
  bCtx.shadowColor = '#38bdf8';
  bCtx.shadowBlur = 8;
  bCtx.beginPath();
  bCtx.moveTo(cx + 2, cy - r * 0.62);
  bCtx.lineTo(cx - r * 0.45, cy + 1);
  bCtx.lineTo(cx - 1, cy + 1);
  bCtx.lineTo(cx - 3, cy + r * 0.66);
  bCtx.lineTo(cx + r * 0.45, cy - 1);
  bCtx.lineTo(cx + 1, cy - 1);
  bCtx.closePath();

  const boltGrad = bCtx.createLinearGradient(cx - r * 0.4, cy - r * 0.6, cx + r * 0.4, cy + r * 0.6);
  boltGrad.addColorStop(0, '#ffffff');
  boltGrad.addColorStop(0.5, '#fef08a');
  boltGrad.addColorStop(1, '#f59e0b');
  bCtx.fillStyle = boltGrad;
  bCtx.fill();

  bCtx.strokeStyle = '#ffffff';
  bCtx.lineWidth = 1.0;
  bCtx.stroke();
  bCtx.restore();

  // 5. Orbiting diamond sparkle stars
  const starPoints = [
    [cx - r * 0.9, cy - r * 0.65, 5],
    [cx + r * 0.95, cy, 6],
    [cx + r * 0.72, cy + r * 0.75, 5]
  ];
  for (const [sx, sy, ss] of starPoints) {
    bCtx.fillStyle = '#bae6fd';
    bCtx.beginPath();
    bCtx.moveTo(sx, sy - ss);
    bCtx.lineTo(sx + ss * 0.38, sy);
    bCtx.lineTo(sx, sy + ss);
    bCtx.lineTo(sx - ss * 0.38, sy);
    bCtx.closePath();
    bCtx.fill();
  }

  boosterCanvas = canvas;
}

function drawBoosters() {
  if (!boosterCanvas) prerenderBoosterSprite();

  for (let i = 0; i < boosters.length; i++) {
    const b = boosters[i];
    if (b.collected && b.popTimer <= 0) continue;
    const screenX = b.x - cam;
    if (screenX < -60 || screenX > W + 60) continue;

    const bobY = Math.sin(gameTime * 4.2 + b.phase) * 3.5;
    const pulse = 1.0 + 0.08 * Math.sin(gameTime * 6 + b.phase);
    const drawY = b.y + bobY;

    if (b.collected && b.popTimer > 0) {
      const popT = 1 - (b.popTimer / 0.3);
      const scale = (1 + popT * 0.6) * pulse;
      const alpha = Math.max(0, 1 - popT);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(screenX, drawY);
      ctx.scale(scale, scale);
      if (boosterCanvas) {
        ctx.drawImage(boosterCanvas, -boosterCanvas.width / 2, -boosterCanvas.height / 2);
      }
      ctx.restore();
    } else {
      ctx.save();
      ctx.translate(screenX, drawY);
      ctx.scale(pulse, pulse);

      // Pulsing blue-white outer ring wave
      const wavePhase = (gameTime * 2.8 + b.phase) % 1.0;
      ctx.strokeStyle = 'rgba(56, 189, 248, ' + (0.75 * (1 - wavePhase)) + ')';
      ctx.lineWidth = 2.0;
      ctx.beginPath();
      ctx.arc(0, 0, BOOSTER_RADIUS + wavePhase * 10, 0, Math.PI * 2);
      ctx.stroke();

      if (boosterCanvas) {
        ctx.drawImage(boosterCanvas, -boosterCanvas.width / 2, -boosterCanvas.height / 2);
      }

      ctx.restore();
    }
  }

  // Draw booster sparkles
  for (let i = 0; i < boosterSparklePool.length; i++) {
    const s = boosterSparklePool[i];
    if (!s.active) continue;
    const scrX = s.x - cam;
    if (scrX < -20 || scrX > W + 20) continue;
    const lifeRatio = 1 - (s.life / s.maxLife);
    ctx.save();
    ctx.globalAlpha = Math.max(0, lifeRatio);
    ctx.fillStyle = s.color || '#38bdf8';
    ctx.beginPath();
    ctx.arc(scrX, s.y, s.size * (0.6 + 0.4 * lifeRatio), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function getCorridorSafeBounds(x, segsList) {
  for (let i = 0; i < segsList.length; i++) {
    const s = segsList[i];
    if (x >= s.x && x <= s.x + s.w) {
      if (s.isOpen) {
        if (s.obstacles && s.obstacles.length > 0) {
          for (const obs of s.obstacles) {
            if (Math.abs(x - (obs.x + obs.w / 2)) < obs.w + 30) {
              if (obs.type === 'gate') {
                const sTop = obs.gapTop + 16;
                const sBot = obs.gapBot - 16;
                return { top: obs.gapTop, bot: obs.gapBot, safeTop: sTop, safeBot: sBot, safeCenter: obs.gateCenter, halfH: Math.max(12, (sBot - sTop) / 2) };
              } else if (obs.type === 'stalactite') {
                const sTop = obs.tipY + 18;
                const sBot = H - 90;
                return { top: obs.tipY, bot: H - 70, safeTop: sTop, safeBot: sBot, safeCenter: (sTop + sBot) / 2, halfH: Math.max(12, (sBot - sTop) / 2) };
              } else if (obs.type === 'stalagmite') {
                const sTop = 90;
                const sBot = obs.tipY - 18;
                return { top: 70, bot: obs.tipY, safeTop: sTop, safeBot: sBot, safeCenter: (sTop + sBot) / 2, halfH: Math.max(12, (sBot - sTop) / 2) };
              } else if (obs.type === 'floating_block') {
                const sTop = 80;
                const sBot = obs.y - 18;
                return { top: 60, bot: obs.y, safeTop: sTop, safeBot: sBot, safeCenter: (sTop + sBot) / 2, halfH: Math.max(12, (sBot - sTop) / 2) };
              }
            }
          }
        }
        const sCenter = s.safeCenter || (CAR_REST_Y - 40);
        return {
          top: -300,
          bot: H + 300,
          safeTop: sCenter - 80,
          safeBot: sCenter + 80,
          safeCenter: sCenter,
          halfH: 80
        };
      }
      let curTop = (s.curTop !== undefined) ? s.curTop : s.top;
      let curBot = (s.curBot !== undefined) ? s.curBot : s.bot;

      if (s.isSlanted && s.top2 !== undefined) {
        const t = Math.max(0, Math.min(1, (x - s.x) / s.w));
        curTop = curTop + (s.top2 - curTop) * t;
        curBot = curBot + (s.bot2 - curBot) * t;
      } else if (i < segsList.length - 1) {
        // Smooth step interpolation near segment boundary
        const sNext = segsList[i + 1];
        if (!sNext.isOpen) {
          const seamX = s.x + s.w;
          const blendDist = 48 * 1.2;
          if (x > seamX - blendDist) {
            const t = (x - (seamX - blendDist)) / blendDist;
            const ease = t * t * (3 - 2 * t);
            const nextTop = (sNext.curTop !== undefined) ? sNext.curTop : sNext.top;
            const nextBot = (sNext.curBot !== undefined) ? sNext.curBot : sNext.bot;
            curTop = curTop + (nextTop - curTop) * ease;
            curBot = curBot + (nextBot - curBot) * ease;
          }
        }
      }

      const safeTop = curTop + 1.2 * 48;
      const safeBot = curBot - 1.2 * 48;
      const safeCenter = (safeTop + safeBot) / 2;
      const halfH = Math.max(12, (safeBot - safeTop) / 2 - COIN_RADIUS);
      return { top: curTop, bot: curBot, safeTop, safeBot, safeCenter, halfH };
    }
  }
  return {
    top: -300,
    bot: H + 300,
    safeTop: 120,
    safeBot: H - 120,
    safeCenter: CAR_REST_Y,
    halfH: 100
  };
}

function generateLevelCoins(lvl, segsList) {
  coins.length = 0;
  coinSparkles.length = 0;
  flyingCoins.length = 0;
  coinFloatTexts.length = 0;
  levelCoinsCollected = 0;
  earnedStars = 1;
  isPerfect = false;
  perfectBonusGiven = false;
  starSoundsPlayed = [false, false, false];
  bronzeCoinsPicked = 0;

  const prng = mulberry32(hashInt(lvl * 77777 + 98765));
  const coinSpacing = 1.1 * 48; // ~52.8 px
  const sp = scrollSpeed();

  function pushCoin(cx, cy, type, phase) {
    const isHigher = (type !== 'bronze');
    const b = getCorridorSafeBounds(cx, segsList);
    let finalY = cy;
    if (isHigher) {
      // 1.4 * carH distance from spike tips for higher value coins
      const minSafeY = b.top + 1.4 * 48;
      const maxSafeY = b.bot - 1.4 * 48;
      if (minSafeY < maxSafeY) {
        finalY = Math.max(minSafeY, Math.min(maxSafeY, cy));
      } else {
        finalY = b.safeCenter;
      }
    } else {
      finalY = Math.max(b.safeTop + BRONZE_RADIUS, Math.min(b.safeBot - BRONZE_RADIUS, cy));
    }
    const val = (type === 'gem') ? GEM_VALUE : ((type === 'gold') ? GOLD_VALUE : ((type === 'silver') ? SILVER_VALUE : BRONZE_VALUE));
    const r = (type === 'gem') ? GEM_RADIUS : ((type === 'gold') ? GOLD_RADIUS : ((type === 'silver') ? SILVER_RADIUS : BRONZE_RADIUS));
    coins.push({
      x: cx,
      y: finalY,
      type,
      val,
      radius: r,
      collected: false,
      phase,
      popTimer: 0
    });
  }

  // 1. START GUIDE: bronze coins in gentle arc leading off start road through open gap into tunnel
  const startX = START_ROAD_END - 40;
  const firstSegBounds = getCorridorSafeBounds(TUNNEL_START_X + 60, segsList);
  const targetEntryY = firstSegBounds.safeCenter;
  const numGuideCoins = 7;
  const guideEnd = TUNNEL_START_X + 40;
  const guideStep = (guideEnd - startX) / (numGuideCoins - 1);
  for (let k = 0; k < numGuideCoins; k++) {
    const t = k / (numGuideCoins - 1);
    const x = startX + k * guideStep;
    const y = CAR_REST_Y - (CAR_REST_Y - targetEntryY) * Math.sin(t * Math.PI * 0.5);
    pushCoin(x, y, 'bronze', prng() * 6.28);
  }

  // 2. TUNNEL COIN PATTERNS (Subway Surfers style: straight, wave, arc, staircase, double row, risk line)
  let curX = TUNNEL_START_X + 180;
  const tunnelMaxX = TUNNEL_END_X - 180;
  const patternTypes = ['straight', 'wave', 'arc_up', 'arc_down', 'staircase', 'double_row', 'risk_high', 'risk_low'];
  const totalApproxPatterns = Math.max(1, Math.floor((tunnelMaxX - curX) / (sp * 1.35)));

  // Rare blue gem appears at most once per level (value 25)
  const hasGem = (prng() < 0.50);
  const gemPatternIndex = hasGem ? Math.floor(totalApproxPatterns * (0.35 + prng() * 0.35)) : -1;

  // Gold coins: at most 3 per level (value 10)
  const maxGold = hasGem ? 1 : Math.min(3, Math.floor(prng() * 2 + 1));
  const maxSilver = hasGem ? Math.min(4, Math.floor(prng() * 2 + 2)) : Math.min(6, Math.floor(prng() * 2 + 4));
  let goldPlaced = 0;
  let silverPlaced = 0;
  let gemPlaced = false;
  let patternCount = 0;

  while (curX < tunnelMaxX) {
    const pType = patternTypes[Math.floor(prng() * patternTypes.length)];
    const count = (pType === 'double_row') ? Math.floor(prng() * 3 + 4) : Math.floor(prng() * 4 + 5);
    const isGemPattern = (patternCount === gemPatternIndex && !gemPlaced);

    // Higher-value coin placement: end of pattern or top of arc
    let rewardIdx = -1;
    let rewardType = 'bronze';

    if (isGemPattern) {
      rewardType = 'gem';
      gemPlaced = true;
      rewardIdx = (pType === 'arc_up' || pType === 'arc_down') ? Math.floor(count / 2) : (count - 1);
    } else if (goldPlaced < maxGold && (patternCount % 4 === 1 || pType === 'risk_high' || pType === 'risk_low') && prng() < 0.50) {
      rewardType = 'gold';
      goldPlaced++;
      rewardIdx = (pType === 'arc_up' || pType === 'arc_down') ? Math.floor(count / 2) : (count - 1);
    } else if (silverPlaced < maxSilver && (patternCount % 2 === 0 || prng() < 0.40)) {
      rewardType = 'silver';
      silverPlaced++;
      rewardIdx = (pType === 'arc_up' || pType === 'arc_down') ? Math.floor(count / 2) : (count - 1);
    }

    if (pType === 'straight') {
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, b.safeCenter, type, prng() * 6.28);
      }
    } else if (pType === 'wave') {
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const amp = Math.min(b.halfH * 0.65, 36);
        const y = b.safeCenter + Math.sin((k / count) * Math.PI * 2) * amp;
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, y, type, prng() * 6.28);
      }
    } else if (pType === 'arc_up' || pType === 'arc_down') {
      const sign = (pType === 'arc_up') ? -1 : 1;
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const t = k / (count - 1);
        const arc = 4 * t * (1 - t);
        const amp = Math.min(b.halfH * 0.70, 38);
        const y = b.safeCenter + sign * arc * amp;
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, y, type, prng() * 6.28);
      }
    } else if (pType === 'staircase') {
      const bStart = getCorridorSafeBounds(curX, segsList);
      const bEnd = getCorridorSafeBounds(curX + count * coinSpacing, segsList);
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const t = k / (count - 1);
        const ease = t * t * (3 - 2 * t);
        const y = bStart.safeCenter + (bEnd.safeCenter - bStart.safeCenter) * ease;
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, y, type, prng() * 6.28);
      }
    } else if (pType === 'double_row') {
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const offset = Math.min(18, b.halfH * 0.45);
        const type = (k === count - 1 && rewardType === 'silver') ? 'silver' : 'bronze';
        pushCoin(cx, b.safeCenter - offset, type, prng() * 6.28);
        pushCoin(cx, b.safeCenter + offset, 'bronze', (prng() * 6.28) + 1.5);
      }
    } else {
      // risk line slightly toward one edge of safe band (still safe)
      const isHigh = (pType === 'risk_high');
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const offset = Math.min(30, b.halfH * 0.65);
        const y = isHigh ? (b.safeCenter - offset) : (b.safeCenter + offset);
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, y, type, prng() * 6.28);
      }
    }

    patternCount++;
    const patternLen = count * coinSpacing;
    const gapSec = 0.8 + prng() * 0.8;
    curX += patternLen + (gapSec * sp);
  }

  // 3. FINISH ROAD: Reduced number of coins as requested (reduced to 3 coins)
  const finishCoinY = CAR_REST_Y - BRONZE_RADIUS - 2;
  const finishCoinsStart = FINISH_ROAD_X + 140;
  const finishCoinsEnd = finishLineWorldX - 80;
  const finishCoinCount = 3;
  const finishCoinStep = (finishCoinsEnd - finishCoinsStart) / (finishCoinCount - 1);
  for (let k = 0; k < finishCoinCount; k++) {
    const isLast = (k === finishCoinCount - 1);
    pushCoin(finishCoinsStart + k * finishCoinStep, finishCoinY, isLast ? 'silver' : 'bronze', prng() * 6.28);
  }

  levelCoinsTotal = coins.reduce((acc, c) => acc + c.val, 0);
}

function generateLevelBoosters(lvl, segsList, coinsList) {
  boosters.length = 0;
  for (let i = 0; i < boosterSparklePool.length; i++) boosterSparklePool[i].active = false;
  boosterSparkles.length = 0;
  carGhostTrail.length = 0;
  boostTimer = 0;
  boostProtectionTimer = 0;
  boostRampFactor = 0;
  boostElapsed = 0;

  if (!segsList || segsList.length === 0) return;

  // PRNG seeded for consistent and repeatable booster placement per level
  const boostRng = mulberry32(hashInt(lvl * 99933 + 77719));

  // Requirement: Every level must have at least 3 to 4 boosters
  // Randomly generate 3 or 4 boosters (biased towards 4 on longer stages)
  const targetCount = (boostRng() < 0.35) ? 3 : 4;

  const minX = TUNNEL_START_X + TUNNEL_LENGTH * 0.10;
  const maxX = TUNNEL_START_X + TUNNEL_LENGTH * 0.88;
  const minSpikeDist = 1.35 * carVis; // 56.7px safe clearance from spikes

  // Helper: check if (cx, cy) is closer than minSpikeDist to any spike tip
  function isTooCloseToSpikes(cx, cy) {
    for (let sIdx = 0; sIdx < segsList.length; sIdx++) {
      const s = segsList[sIdx];
      if (cx + minSpikeDist < s.x || cx - minSpikeDist > s.x + s.w) continue;
      const count = s.topSpikes ? s.topSpikes.length : 0;
      for (let i = 0; i < count; i++) {
        const spX = s.x + i * 12 + 6;
        if (Math.abs(cx - spX) > minSpikeDist) continue;
        const spFrac = Math.max(0, Math.min(1, (spX - s.x) / s.w));
        const curTop = s.isSlanted ? (s.top + (s.top2 - s.top) * spFrac) : (s.curTop != null ? s.curTop : s.top);
        const curBot = s.isSlanted ? (s.bot + (s.bot2 - s.bot) * spFrac) : (s.curBot != null ? s.curBot : s.bot);
        const topTip = (curTop - 18) + (s.topSpikes[i] ? s.topSpikes[i].h : 0);
        const botTip = (curBot + 18) - (s.botSpikes[i] ? s.botSpikes[i].h : 0);
        if (Math.hypot(cx - spX, cy - topTip) < minSpikeDist) return true;
        if (Math.hypot(cx - spX, cy - botTip) < minSpikeDist) return true;
      }
    }
    return false;
  }

  function isSpacedFromExisting(cx, minGap = 500) {
    for (let eb of boosters) {
      if (Math.abs(eb.x - cx) < minGap) return false;
    }
    return true;
  }

  const coinsToRemove = [];
  const span = maxX - minX;

  // Pass 1: Zone-based placement to evenly distribute boosters across the level (3 to 4 zones)
  for (let z = 0; z < targetCount; z++) {
    const zMin = minX + span * (z / targetCount);
    const zMax = minX + span * ((z + 1) / targetCount);

    // Look for eligible coins in this zone first (prefer replacing a coin so flow is natural)
    let zoneCandidates = [];
    if (coinsList && coinsList.length > 0) {
      for (let i = 0; i < coinsList.length; i++) {
        const coin = coinsList[i];
        if (!coin || coin.x < zMin || coin.x > zMax) continue;
        if (!isSpacedFromExisting(coin.x, 480)) continue;
        const b = getCorridorSafeBounds(coin.x, segsList);
        if (b.isSqueeze || b.halfH < 8) continue;
        const candY = Math.max(b.safeTop + 8, Math.min(b.safeBot - 8, coin.y));
        if (isTooCloseToSpikes(coin.x, candY)) continue;
        zoneCandidates.push({ coinIndex: i, x: coin.x, y: candY });
      }
    }

    if (zoneCandidates.length > 0) {
      // Pick a candidate coin in this zone
      const pick = zoneCandidates[Math.floor(boostRng() * zoneCandidates.length)];
      boosters.push({
        x: pick.x,
        y: pick.y,
        radius: BOOSTER_RADIUS,
        collected: false,
        phase: boostRng() * 6.28,
        popTimer: 0
      });
      coinsToRemove.push(pick.coinIndex);
    } else {
      // Fallback: scan for a safe point in the corridor in this zone
      let safePoint = null;
      const step = 40;
      const startX = zMin + 40;
      const endX = zMax - 40;
      const count = Math.max(1, Math.floor((endX - startX) / step));
      const offset = Math.floor(boostRng() * count);
      for (let s = 0; s < count; s++) {
        const testX = startX + ((s + offset) % count) * step;
        if (!isSpacedFromExisting(testX, 480)) continue;
        const b = getCorridorSafeBounds(testX, segsList);
        if (b.isSqueeze || b.halfH < 12) continue;
        const candY = b.safeCenter || (b.safeTop + b.safeBot) / 2;
        if (!isTooCloseToSpikes(testX, candY)) {
          safePoint = { x: testX, y: candY };
          break;
        }
      }
      if (safePoint) {
        boosters.push({
          x: safePoint.x,
          y: safePoint.y,
          radius: BOOSTER_RADIUS,
          collected: false,
          phase: boostRng() * 6.28,
          popTimer: 0
        });
      }
    }
  }

  // Pass 2: Safety guarantee - ensure at least 3 boosters exist in every level
  if (boosters.length < 3) {
    const step = 45;
    for (let testX = minX; testX <= maxX && boosters.length < 3; testX += step) {
      if (!isSpacedFromExisting(testX, 400)) continue;
      const b = getCorridorSafeBounds(testX, segsList);
      if (b.isSqueeze || b.halfH < 10) continue;
      const candY = b.safeCenter || (b.safeTop + b.safeBot) / 2;
      if (!isTooCloseToSpikes(testX, candY)) {
        boosters.push({
          x: testX,
          y: candY,
          radius: BOOSTER_RADIUS,
          collected: false,
          phase: boostRng() * 6.28,
          popTimer: 0
        });
      }
    }
  }

  // Remove substituted coins in reverse index order
  coinsToRemove.sort((a, b) => b - a);
  for (const cIdx of coinsToRemove) {
    if (cIdx >= 0 && coinsList && cIdx < coinsList.length) {
      coinsList.splice(cIdx, 1);
    }
  }
}

  creamTile: { top: '#ffffff', mid: '#fffbf0', bot: '#f3e7d3', lip: '#c8af90', border: '#8c6d46', innerRim: '#ffffff', innerRimW: 2.2 },
  disabled: { top: '#cbd5e1', mid: '#94a3b8', bot: '#64748b', lip: '#475569', border: '#334155', innerRim: 'rgba(255, 255, 255, 0.35)', innerRimW: 1.4 }
};

function drawGlossyText(text, x, y, size, align = 'center', color = '#ffffff', strokeColor = '#0f172a', strokeWidth) {
  ctx.save();
  ctx.font = `800 ${size}px "Lilita One", "Baloo 2", cursive, system-ui, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';

  const sw = strokeWidth !== undefined ? strokeWidth : Math.max(3.5, Math.round(size * 0.18));
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = sw;
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;
  ctx.strokeText(text, x, y);

  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawGlossyButton(x, y, w, h, theme, label, iconType, isPressed, radius = 18, opts = null) {
  const isDisabled = Boolean(opts && opts.disabled);
  const isHovered = Boolean(opts && opts.hovered && !isDisabled);
  const isSelected = Boolean(opts && opts.selected && !isDisabled);
  const effectiveTheme = isDisabled ? BUTTON_THEMES.disabled : theme;
  const effectivePressed = Boolean(isPressed && !isDisabled);
  const py = effectivePressed ? y + 3 : y;
  const lipH = effectivePressed ? 2 : (isDisabled ? 3 : 5);

  ctx.save();
  if (isDisabled) ctx.globalAlpha = 0.72;
  if (isHovered) {
    ctx.shadowColor = 'rgba(186, 230, 253, 0.85)';
    ctx.shadowBlur = 10;
  }

  ctx.fillStyle = effectiveTheme.lip;
  roundRect(ctx, x, py + lipH, w, h, radius);
  ctx.fill();
  ctx.shadowBlur = 0;

  const grad = ctx.createLinearGradient(0, py, 0, py + h);
  grad.addColorStop(0, effectiveTheme.top);
  grad.addColorStop(0.48, effectiveTheme.mid);
  grad.addColorStop(1, effectiveTheme.bot);
  ctx.fillStyle = grad;
  roundRect(ctx, x, py, w, h, radius);
  ctx.fill();

  // White gloss band on top half
  ctx.save();
  roundRect(ctx, x, py, w, h, radius);
  ctx.clip();
  const glossGrad = ctx.createLinearGradient(0, py, 0, py + h * 0.54);
  glossGrad.addColorStop(0, isDisabled ? 'rgba(255, 255, 255, 0.25)' : (isHovered ? 'rgba(255, 255, 255, 0.80)' : 'rgba(255, 255, 255, 0.65)'));
  glossGrad.addColorStop(1, 'rgba(255, 255, 255, 0.05)');
  ctx.fillStyle = glossGrad;
  ctx.beginPath();
  ctx.ellipse(x + w / 2, py + 2, w * 0.6, h * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();
  if (effectivePressed) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.14)';
    ctx.fillRect(x, py, w, h);
  }
  ctx.restore();

  // Inner highlight outline
  ctx.save();
  roundRect(ctx, x + 1.5, py + 1.5, w - 3, h - 3, Math.max(2, radius - 1));
  ctx.strokeStyle = isSelected ? '#fef08a' : (effectiveTheme.goldRim || effectiveTheme.innerRim || 'rgba(255, 255, 255, 0.5)');
  ctx.lineWidth = isSelected ? 2.6 : (effectiveTheme.goldRim ? 3.2 : (effectiveTheme.innerRimW || 1.3));
  ctx.stroke();
  if (effectiveTheme.goldHi) {
    roundRect(ctx, x + 3.2, py + 3.2, w - 6.4, h - 6.4, Math.max(2, radius - 2.5));
    ctx.strokeStyle = effectiveTheme.goldHi;
    ctx.lineWidth = 1.0;
    ctx.stroke();
  }
  ctx.restore();

  // Dark/gold outer outline
  ctx.strokeStyle = isSelected ? '#fef08a' : effectiveTheme.border;
  ctx.lineWidth = isSelected ? 2.8 : 2.4;
  roundRect(ctx, x, py, w, h + (effectivePressed ? 1 : 2), radius);
  ctx.stroke();

  const textCol = isDisabled ? '#e2e8f0' : '#ffffff';
  const strokeCol = effectiveTheme.border;
  const fontSz = Math.min(20, Math.max(12, Math.round(h * 0.42)));

  if (iconType && label) {
    const iconSz = Math.min(w, h) * 0.52;
    ctx.save();
    ctx.font = `800 ${fontSz}px "Lilita One", "Baloo 2", cursive, system-ui, sans-serif`;
    const labelW = ctx.measureText(label).width;
    ctx.restore();
    const totalW = iconSz + 7 + labelW;
    const startX = x + (w - totalW) / 2;
    drawButtonIcon(iconType, startX + iconSz * 0.5, py + h / 2, iconSz);
    drawGlossyText(label, startX + iconSz + 7, py + h / 2 + 1, fontSz, 'left', textCol, strokeCol, 3.8);
  } else if (iconType) {
    drawButtonIcon(iconType, x + w / 2, py + h / 2, Math.min(w, h) * 0.48);
  } else if (label) {
    const textY = py + h / 2 + 1;
    drawGlossyText(label, x + w / 2, textY, fontSz, 'center', textCol, strokeCol, 4.0);
  }
  ctx.restore();
}

function drawRoundGlossyButton(cx, cy, r, theme, iconType, isPressed) {
  drawGlossyButton(cx - r, cy - r, r * 2, r * 2, theme, null, iconType, isPressed, r);
}

function drawButtonIcon(type, cx, cy, sz) {
  ctx.save();
  ctx.translate(cx, cy);

  if (type === 'gear') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2;
    for (let a = 0; a < 6; a++) {
      ctx.rotate(Math.PI / 3);
      ctx.fillRect(-sz * 0.16, -sz * 0.52, sz * 0.32, sz * 0.22);
      ctx.strokeRect(-sz * 0.16, -sz * 0.52, sz * 0.32, sz * 0.22);
    }
    ctx.beginPath(); ctx.arc(0, 0, sz * 0.38, 0, 6.28); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2563eb';
    ctx.beginPath(); ctx.arc(0, 0, sz * 0.18, 0, 6.28); ctx.fill(); ctx.stroke();

  } else if (type === 'car') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#3b0764';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.45, sz * 0.15);
    ctx.lineTo(-sz * 0.35, -sz * 0.1);
    ctx.lineTo(-sz * 0.1, -sz * 0.28);
    ctx.lineTo(sz * 0.2, -sz * 0.28);
    ctx.lineTo(sz * 0.4, -sz * 0.05);
    ctx.lineTo(sz * 0.45, sz * 0.15);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(-sz * 0.25, sz * 0.18, sz * 0.14, 0, 6.28); ctx.fill();
  } else if (type === 'wheel') {
    ctx.fillStyle = '#f8fafc';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.44, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // Inner dark rotor
    ctx.fillStyle = '#334155';
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.36, 0, Math.PI * 2);
    ctx.fill();
    // 5 Spokes
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 2.2;
    for (let a = 0; a < 5; a++) {
      const ang = a * (Math.PI * 2 / 5);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(ang) * sz * 0.36, Math.sin(ang) * sz * 0.36);
      ctx.stroke();
    }
    // Red sport center cap
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.12, 0, Math.PI * 2);
    ctx.fill();

  } else if (type === 'close') {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = sz * 0.22;
    ctx.lineCap = 'round';
    const s = sz * 0.32;
    ctx.beginPath();
    ctx.moveTo(-s, -s); ctx.lineTo(s, s);
    ctx.moveTo(s, -s); ctx.lineTo(-s, s);
    ctx.stroke();

  } else if (type === 'sound_on' || type === 'sound_on_white') {
    const isWhite = (type === 'sound_on_white');
    const fillCol = isWhite ? '#ffffff' : '#fbbf24';
    const strokeCol = isWhite ? '#78350f' : '#92400e';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.fillStyle = fillCol;
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.40, -sz * 0.16);
    ctx.lineTo(-sz * 0.16, -sz * 0.16);
    ctx.lineTo(sz * 0.10, -sz * 0.38);
    ctx.lineTo(sz * 0.10, sz * 0.38);
    ctx.lineTo(-sz * 0.16, sz * 0.16);
    ctx.lineTo(-sz * 0.40, sz * 0.16);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    const drawWaves = () => {
      ctx.beginPath();
      ctx.arc(sz * 0.06, 0, sz * 0.25, -0.62, 0.62);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(sz * 0.06, 0, sz * 0.42, -0.72, 0.72);
      ctx.stroke();
    };
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = 5.0;
    drawWaves();
    ctx.strokeStyle = fillCol;
    ctx.lineWidth = 2.6;
    drawWaves();

  } else if (type === 'sound_off') {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.38, -sz * 0.16);
    ctx.lineTo(-sz * 0.15, -sz * 0.16);
    ctx.lineTo(sz * 0.10, -sz * 0.36);
    ctx.lineTo(sz * 0.10, sz * 0.36);
    ctx.lineTo(-sz * 0.15, sz * 0.16);
    ctx.lineTo(-sz * 0.38, sz * 0.16);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 3.6;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.35, -sz * 0.35);
    ctx.lineTo(sz * 0.35, sz * 0.35);
    ctx.stroke();

  } else if (type === 'vibrate_on' || type === 'vibrate_on_white') {
    const isWhite = (type === 'vibrate_on_white');
    const waveCol = isWhite ? '#ffffff' : '#f59e0b';
    const bodyCol = isWhite ? '#ffffff' : '#fb923c';
    const screenCol = isWhite ? '#f59e0b' : '#fef3c7';
    const strokeCol = isWhite ? '#78350f' : '#92400e';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // Zig-zag vibration waves flanking smartphone (matches reference graphic)
    const drawZigZags = () => {
      for (const side of [-1, 1]) {
        const bx = side * sz * 0.33;
        ctx.beginPath();
        ctx.moveTo(bx, -sz * 0.34);
        ctx.lineTo(bx + side * sz * 0.10, -sz * 0.18);
        ctx.lineTo(bx, -sz * 0.02);
        ctx.lineTo(bx + side * sz * 0.10, sz * 0.14);
        ctx.lineTo(bx, sz * 0.32);
        ctx.stroke();
      }
    };
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = 4.6;
    drawZigZags();
    ctx.strokeStyle = waveCol;
    ctx.lineWidth = 2.4;
    drawZigZags();

    // Sleek vertical smartphone body
    ctx.fillStyle = bodyCol;
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = 2.2;
    roundRect(ctx, -sz * 0.21, -sz * 0.36, sz * 0.42, sz * 0.72, 5);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = screenCol;
    roundRect(ctx, -sz * 0.13, -sz * 0.25, sz * 0.26, sz * 0.46, 2.5);
    ctx.fill();
    ctx.fillStyle = strokeCol;
    ctx.beginPath();
    ctx.arc(0, sz * 0.28, sz * 0.035, 0, Math.PI * 2);
    ctx.fill();

  } else if (type === 'vibrate_off') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 2.2;
    roundRect(ctx, -sz * 0.21, -sz * 0.36, sz * 0.42, sz * 0.72, 5);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#cbd5e1';
    roundRect(ctx, -sz * 0.13, -sz * 0.25, sz * 0.26, sz * 0.46, 2.5);
    ctx.fill();
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 3.6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-sz * 0.35, -sz * 0.35);
    ctx.lineTo(sz * 0.35, sz * 0.35);
    ctx.stroke();

  } else if (type === 'pause') {
    const barW = sz * 0.25;
    const barH = sz * 0.68;
    const gap = sz * 0.15;
    const r = Math.max(2, barW * 0.35);
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.8;
    roundRect(ctx, -gap / 2 - barW, -barH / 2, barW, barH, r);
    ctx.fill(); ctx.stroke();
    roundRect(ctx, gap / 2, -barH / 2, barW, barH, r);
    ctx.fill(); ctx.stroke();

  } else if (type === 'ambient_on' || type === 'ambient_off') {
    const isOff = (type === 'ambient_off');
    const outlineCol = isOff ? '#334155' : '#78350f';
    const fillCol = isOff ? '#f8fafc' : '#ffffff';

    // Fluffy cloud above wind curls
    ctx.beginPath();
    ctx.moveTo(-sz * 0.28, -sz * 0.04);
    ctx.bezierCurveTo(-sz * 0.36, -sz * 0.16, -sz * 0.22, -sz * 0.32, -sz * 0.08, -sz * 0.26);
    ctx.bezierCurveTo(-sz * 0.02, -sz * 0.44, sz * 0.26, -sz * 0.42, sz * 0.30, -sz * 0.22);
    ctx.bezierCurveTo(sz * 0.44, -sz * 0.20, sz * 0.45, -sz * 0.04, sz * 0.28, -sz * 0.04);
    ctx.closePath();
    ctx.fillStyle = fillCol;
    ctx.fill();
    ctx.strokeStyle = outlineCol;
    ctx.lineWidth = 2.1;
    ctx.stroke();

    // Stylized horizontal wind curls beneath the cloud
    ctx.lineCap = 'round';
    const drawWindLines = () => {
      ctx.beginPath();
      ctx.moveTo(-sz * 0.42, sz * 0.06);
      ctx.lineTo(sz * 0.26, sz * 0.06);
      ctx.arc(sz * 0.26, sz * 0.15, sz * 0.09, -Math.PI * 0.5, Math.PI * 0.85, false);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-sz * 0.34, sz * 0.20);
      ctx.lineTo(-sz * 0.02, sz * 0.20);
      ctx.arc(-sz * 0.02, sz * 0.28, sz * 0.08, -Math.PI * 0.5, Math.PI * 0.85, false);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(sz * 0.04, sz * 0.22);
      ctx.lineTo(sz * 0.34, sz * 0.22);
      ctx.arc(sz * 0.34, sz * 0.30, sz * 0.08, -Math.PI * 0.5, Math.PI * 0.85, false);
      ctx.stroke();
    };
    ctx.strokeStyle = outlineCol;
    ctx.lineWidth = 4.4;
    drawWindLines();
    ctx.strokeStyle = fillCol;
    ctx.lineWidth = 2.2;
    drawWindLines();

    if (isOff) {
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 3.6;
      ctx.beginPath(); ctx.moveTo(-sz * 0.36, -sz * 0.36); ctx.lineTo(sz * 0.36, sz * 0.36); ctx.stroke();
    }

  } else if (type === 'shop') {
    // Shopping bag icon
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#3b0764';
    ctx.lineWidth = 2.0;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-sz * 0.34, -sz * 0.16);
    ctx.lineTo(sz * 0.34, -sz * 0.16);
    ctx.lineTo(sz * 0.40, sz * 0.38);
    ctx.lineTo(-sz * 0.40, sz * 0.38);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Bag handle
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.arc(0, -sz * 0.16, sz * 0.20, Math.PI, 0, false);
    ctx.stroke();
    // Gold coin emblem on bag
    ctx.fillStyle = '#facc15';
    ctx.strokeStyle = '#713f12';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(0, sz * 0.12, sz * 0.13, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

  } else if (type === 'booster_boost') {
    // Glowing lightning bolt
    ctx.fillStyle = '#fef08a';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2.0;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(sz * 0.10, -sz * 0.44);
    ctx.lineTo(-sz * 0.26, sz * 0.04);
    ctx.lineTo(-sz * 0.02, sz * 0.04);
    ctx.lineTo(-sz * 0.12, sz * 0.44);
    ctx.lineTo(sz * 0.28, -sz * 0.05);
    ctx.lineTo(sz * 0.04, -sz * 0.05);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

  } else if (type === 'booster_magnet') {
    // Horseshoe magnet
    ctx.lineCap = 'butt';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = sz * 0.26;
    ctx.beginPath();
    ctx.arc(0, sz * 0.06, sz * 0.28, 0, Math.PI, false);
    ctx.stroke();
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = sz * 0.18;
    ctx.beginPath();
    ctx.arc(0, sz * 0.06, sz * 0.28, 0, Math.PI, false);
    ctx.stroke();
    // Upper arms
    ctx.fillStyle = '#ef4444';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.6;
    ctx.fillRect(-sz * 0.37, -sz * 0.28, sz * 0.18, sz * 0.35);
    ctx.strokeRect(-sz * 0.37, -sz * 0.28, sz * 0.18, sz * 0.35);
    ctx.fillRect(sz * 0.19, -sz * 0.28, sz * 0.18, sz * 0.35);
    ctx.strokeRect(sz * 0.19, -sz * 0.28, sz * 0.18, sz * 0.35);
    // Silver magnet tips
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(-sz * 0.37, -sz * 0.34, sz * 0.18, sz * 0.14);
    ctx.strokeRect(-sz * 0.37, -sz * 0.34, sz * 0.18, sz * 0.14);
    ctx.fillRect(sz * 0.19, -sz * 0.34, sz * 0.18, sz * 0.14);
    ctx.strokeRect(sz * 0.19, -sz * 0.34, sz * 0.18, sz * 0.14);

  } else if (type === 'booster_shield') {
    // Energy shield
    ctx.fillStyle = '#86efac';
    ctx.strokeStyle = '#052e16';
    ctx.lineWidth = 2.0;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -sz * 0.42);
    ctx.lineTo(sz * 0.35, -sz * 0.26);
    ctx.quadraticCurveTo(sz * 0.36, sz * 0.16, 0, sz * 0.44);
    ctx.quadraticCurveTo(-sz * 0.36, sz * 0.16, -sz * 0.35, -sz * 0.26);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(0, -sz * 0.26);
    ctx.lineTo(sz * 0.18, -sz * 0.16);
    ctx.quadraticCurveTo(sz * 0.18, sz * 0.08, 0, sz * 0.24);
    ctx.quadraticCurveTo(-sz * 0.18, sz * 0.08, -sz * 0.18, -sz * 0.16);
    ctx.closePath();
    ctx.fill();

  } else if (type === 'booster_slowmo') {
    // Stopwatch clock
    ctx.fillStyle = '#facc15';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.8;
    roundRect(ctx, -sz * 0.11, -sz * 0.45, sz * 0.22, sz * 0.11, 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.lineWidth = 2.0;
    ctx.beginPath();
    ctx.arc(0, sz * 0.04, sz * 0.35, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, sz * 0.04); ctx.lineTo(0, -sz * 0.16);
    ctx.moveTo(0, sz * 0.04); ctx.lineTo(sz * 0.18, sz * 0.12);
    ctx.stroke();

  } else if (type === 'daily_gift') {
    // Gift box
    ctx.fillStyle = '#fef08a';
    ctx.strokeStyle = '#713f12';
    ctx.lineWidth = 1.8;
    roundRect(ctx, -sz * 0.34, -sz * 0.12, sz * 0.68, sz * 0.48, 5);
    ctx.fill(); ctx.stroke();
    roundRect(ctx, -sz * 0.38, -sz * 0.28, sz * 0.76, sz * 0.18, 4);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(-sz * 0.07, -sz * 0.28, sz * 0.14, sz * 0.64);
    ctx.strokeRect(-sz * 0.07, -sz * 0.28, sz * 0.14, sz * 0.64);

  } else if (type === 'daily_calendar') {
    // Glossy 7-day calendar with gold coin/star
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.8;
    roundRect(ctx, -sz * 0.38, -sz * 0.32, sz * 0.76, sz * 0.68, 6);
    ctx.fill(); ctx.stroke();
    // Red header band
    ctx.fillStyle = '#ef4444';
    roundRect(ctx, -sz * 0.38, -sz * 0.32, sz * 0.76, sz * 0.24, 6);
    ctx.fill();
    ctx.fillRect(-sz * 0.38, -sz * 0.18, sz * 0.76, sz * 0.10);
    ctx.strokeRect(-sz * 0.38, -sz * 0.32, sz * 0.76, sz * 0.24);
    // Calendar rings
    ctx.fillStyle = '#e2e8f0';
    roundRect(ctx, -sz * 0.24, -sz * 0.42, sz * 0.12, sz * 0.18, 2);
    ctx.fill(); ctx.stroke();
    roundRect(ctx, sz * 0.12, -sz * 0.42, sz * 0.12, sz * 0.18, 2);
    ctx.fill(); ctx.stroke();
    // Gold coin emblem in center
    ctx.fillStyle = '#facc15';
    ctx.strokeStyle = '#713f12';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, sz * 0.13, sz * 0.18, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

  } else if (type === 'starter_bundle') {
    // Festive starter gift bundle with ribbon bow
    ctx.fillStyle = '#38bdf8';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.8;
    roundRect(ctx, -sz * 0.34, -sz * 0.10, sz * 0.68, sz * 0.46, 6);
    ctx.fill(); ctx.stroke();
    // Lid
    ctx.fillStyle = '#7dd3fc';
    roundRect(ctx, -sz * 0.39, -sz * 0.24, sz * 0.78, sz * 0.17, 5);
    ctx.fill(); ctx.stroke();
    // Gold ribbon
    ctx.fillStyle = '#facc15';
    ctx.strokeStyle = '#713f12';
    ctx.lineWidth = 1.4;
    ctx.fillRect(-sz * 0.08, -sz * 0.24, sz * 0.16, sz * 0.60);
    ctx.strokeRect(-sz * 0.08, -sz * 0.24, sz * 0.16, sz * 0.60);
    // Bow loops
    ctx.beginPath();
    ctx.ellipse(-sz * 0.14, -sz * 0.33, sz * 0.14, sz * 0.09, -0.35, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(sz * 0.14, -sz * 0.33, sz * 0.14, sz * 0.09, 0.35, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

  } else if (type === 'ad_video') {
    const r = sz * 0.48;
    const playGrad = ctx.createRadialGradient(-r * 0.25, -r * 0.25, r * 0.1, 0, 0, r);
    playGrad.addColorStop(0, '#bbf7d0');
    playGrad.addColorStop(0.55, '#22c55e');
    playGrad.addColorStop(1, '#14532d');
    ctx.fillStyle = playGrad;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.0;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#052e16';
    ctx.lineWidth = 1.6;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-r * 0.26, -r * 0.36);
    ctx.lineTo(r * 0.42, 0);
    ctx.lineTo(-r * 0.26, r * 0.36);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

  } else if (type === 'no_ads_icon') {
    drawNoAdsCircleEmblem(0, 0, sz * 0.50);

  } else if (type === 'ad_clapper') {
    // Sleek dark-slate movie clapperboard with crisp white stripes & white play triangle
    const w = sz * 0.80;
    const h = sz * 0.66;
    ctx.fillStyle = '#1e293b';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.6;
    roundRect(ctx, -w / 2, -h * 0.30, w, h * 0.82, 4);
    ctx.fill();
    ctx.stroke();

    // Tilted white-striped top clapper bar
    ctx.save();
    ctx.translate(-w / 2, -h * 0.30);
    ctx.rotate(-0.16);
    ctx.fillStyle = '#1e293b';
    roundRect(ctx, 0, -h * 0.30, w, h * 0.28, 2.5);
    ctx.fill();
    ctx.save();
    roundRect(ctx, 0, -h * 0.30, w, h * 0.28, 2.5);
    ctx.clip();
    ctx.fillStyle = '#ffffff';
    for (let sx = 3; sx < w; sx += 7) {
      ctx.beginPath();
      ctx.moveTo(sx, -h * 0.30);
      ctx.lineTo(sx + 3.4, -h * 0.30);
      ctx.lineTo(sx + 0.8, 0);
      ctx.lineTo(sx - 2.6, 0);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.2;
    roundRect(ctx, 0, -h * 0.30, w, h * 0.28, 2.5);
    ctx.stroke();
    ctx.restore();

    // Crisp white play triangle centered inside slate body
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(-sz * 0.09, -sz * 0.07);
    ctx.lineTo(sz * 0.16, sz * 0.09);
    ctx.lineTo(-sz * 0.09, sz * 0.25);
    ctx.closePath();
    ctx.fill();

  } else if (type === 'stage_thumb_on' || type === 'stage_thumb_off') {
    const isOff = (type === 'stage_thumb_off');
    const bw = sz * 1.18;
    const bh = sz * 1.18;
    ctx.save();
    roundRect(ctx, -bw / 2, -bh / 2, bw, bh, 8);
    ctx.clip();

    // Game-relevant Thorn Rush corridor backdrop (no sun)
    const skyG = ctx.createLinearGradient(0, -bh / 2, 0, bh / 2);
    if (isOff) {
      skyG.addColorStop(0, '#334155');
      skyG.addColorStop(1, '#1e293b');
    } else {
      skyG.addColorStop(0, '#0f172a');
      skyG.addColorStop(0.55, '#1e3a8a');
      skyG.addColorStop(1, '#0c4a6e');
    }
    ctx.fillStyle = skyG;
    ctx.fillRect(-bw / 2, -bh / 2, bw, bh);

    // Subtle orange Thorn Rush spikes along top & bottom edge
    ctx.fillStyle = isOff ? '#64748b' : '#f97316';
    const spCount = 5;
    const spW = bw / spCount;
    for (let s = 0; s < spCount; s++) {
      const sx = -bw / 2 + s * spW;
      ctx.beginPath();
      ctx.moveTo(sx, -bh / 2);
      ctx.lineTo(sx + spW * 0.5, -bh / 2 + bh * 0.16);
      ctx.lineTo(sx + spW, -bh / 2);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(sx, bh / 2);
      ctx.lineTo(sx + spW * 0.5, bh / 2 - bh * 0.16);
      ctx.lineTo(sx + spW, bh / 2);
      ctx.closePath();
      ctx.fill();
    }

    // Actual game car sprite centered (or sharp futuristic car silhouette fallback)
    if (typeof trimmedCarCanvas !== 'undefined' && trimmedCarCanvas && trimmedCarCanvas.width > 0) {
      const cwImg = bw * 0.86;
      const chImg = cwImg * (trimmedCarCanvas.height / trimmedCarCanvas.width);
      ctx.save();
      if (isOff) ctx.globalAlpha = 0.55;
      ctx.drawImage(trimmedCarCanvas, -cwImg / 2, -chImg / 2 + bh * 0.04, cwImg, chImg);
      ctx.restore();
    } else {
      ctx.fillStyle = isOff ? '#cbd5e1' : '#ffffff';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(-bw * 0.34, bh * 0.10);
      ctx.lineTo(-bw * 0.20, -bh * 0.08);
      ctx.lineTo(bw * 0.12, -bh * 0.12);
      ctx.lineTo(bw * 0.36, bh * 0.04);
      ctx.lineTo(bw * 0.34, bh * 0.14);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    // Ambient sound waves at top when ON, clean muted slash when OFF
    if (!isOff) {
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(bw * 0.02, -bh * 0.10, bw * 0.18, -Math.PI * 0.78, -Math.PI * 0.22);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(bw * 0.02, -bh * 0.10, bw * 0.28, -Math.PI * 0.76, -Math.PI * 0.24);
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 3.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-bw * 0.36, -bh * 0.36);
      ctx.lineTo(bw * 0.36, bh * 0.36);
      ctx.stroke();
    }
    ctx.restore();

    ctx.strokeStyle = isOff ? '#475569' : '#0284c7';
    ctx.lineWidth = 1.8;
    roundRect(ctx, -bw / 2, -bh / 2, bw, bh, 8);
    ctx.stroke();

  } else if (type === 'gamepad') {
    // Glossy arcade controller icon
    ctx.fillStyle = '#0f172a';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.8;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-sz * 0.34, -sz * 0.18);
    ctx.lineTo(sz * 0.34, -sz * 0.18);
    ctx.quadraticCurveTo(sz * 0.48, -sz * 0.16, sz * 0.46, sz * 0.16);
    ctx.quadraticCurveTo(sz * 0.40, sz * 0.32, sz * 0.24, sz * 0.22);
    ctx.lineTo(sz * 0.14, sz * 0.10);
    ctx.lineTo(-sz * 0.14, sz * 0.10);
    ctx.lineTo(-sz * 0.24, sz * 0.22);
    ctx.quadraticCurveTo(-sz * 0.40, sz * 0.32, -sz * 0.46, sz * 0.16);
    ctx.quadraticCurveTo(-sz * 0.48, -sz * 0.16, -sz * 0.34, -sz * 0.18);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // D-pad
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(-sz * 0.28, -sz * 0.06, sz * 0.16, sz * 0.05);
    ctx.fillRect(-sz * 0.225, -sz * 0.115, sz * 0.05, sz * 0.16);
    // Colored buttons
    const dots = [
      [sz * 0.22, -sz * 0.09, '#facc15'],
      [sz * 0.29, -sz * 0.02, '#ef4444'],
      [sz * 0.22, sz * 0.05, '#22c55e'],
      [sz * 0.15, -sz * 0.02, '#38bdf8']
    ];
    for (const [dx, dy, col] of dots) {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(dx, dy, sz * 0.045, 0, Math.PI * 2);
      ctx.fill();
    }

  } else if (type === 'music_note' || type === 'music_off') {
    const isOff = (type === 'music_off');
    ctx.fillStyle = isOff ? '#cbd5e1' : '#ffffff';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.8;
    ctx.lineJoin = 'round';
    // Beamed eighth note
    ctx.beginPath();
    ctx.moveTo(-sz * 0.14, sz * 0.20);
    ctx.lineTo(-sz * 0.14, -sz * 0.26);
    ctx.lineTo(sz * 0.28, -sz * 0.34);
    ctx.lineTo(sz * 0.28, sz * 0.14);
    ctx.lineTo(sz * 0.20, sz * 0.14);
    ctx.lineTo(sz * 0.20, -sz * 0.18);
    ctx.lineTo(-sz * 0.06, -sz * 0.12);
    ctx.lineTo(-sz * 0.06, sz * 0.20);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(-sz * 0.16, sz * 0.24, sz * 0.13, sz * 0.095, -0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(sz * 0.20, sz * 0.17, sz * 0.13, sz * 0.095, -0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    if (isOff) {
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 3.0;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-sz * 0.34, -sz * 0.34);
      ctx.lineTo(sz * 0.34, sz * 0.34);
      ctx.stroke();
    }

  } else if (type === 'play_tri') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#14532d';
    ctx.lineWidth = 2.0;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-sz * 0.24, -sz * 0.34);
    ctx.lineTo(sz * 0.36, 0);
    ctx.lineTo(-sz * 0.24, sz * 0.34);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

  } else if (type === 'restart_cw') {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = Math.max(2.6, sz * 0.17);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.30, -Math.PI * 0.2, Math.PI * 1.45);
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(sz * 0.34, -sz * 0.36);
    ctx.lineTo(sz * 0.40, -sz * 0.04);
    ctx.lineTo(sz * 0.08, -sz * 0.10);
    ctx.closePath();
    ctx.fill();

  } else if (type === 'home_house') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#3b0764';
    ctx.lineWidth = 1.8;
    ctx.lineJoin = 'round';
    // Roof
    ctx.beginPath();
    ctx.moveTo(0, -sz * 0.38);
    ctx.lineTo(sz * 0.38, -sz * 0.04);
    ctx.lineTo(sz * 0.25, -sz * 0.04);
    ctx.lineTo(sz * 0.25, sz * 0.34);
    ctx.lineTo(-sz * 0.25, sz * 0.34);
    ctx.lineTo(-sz * 0.25, -sz * 0.04);
    ctx.lineTo(-sz * 0.38, -sz * 0.04);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#9333ea';
    roundRect(ctx, -sz * 0.08, sz * 0.09, sz * 0.16, sz * 0.25, 2);
    ctx.fill();

  } else if (type === 'quit_door') {
    ctx.strokeStyle = '#ffffff';
    ctx.fillStyle = '#ffffff';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // Door frame
    ctx.beginPath();
    ctx.moveTo(sz * 0.06, -sz * 0.34);
    ctx.lineTo(-sz * 0.28, -sz * 0.34);
    ctx.lineTo(-sz * 0.28, sz * 0.34);
    ctx.lineTo(sz * 0.06, sz * 0.34);
    ctx.stroke();
    // Exit arrow
    ctx.beginPath();
    ctx.moveTo(-sz * 0.06, 0);
    ctx.lineTo(sz * 0.34, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(sz * 0.20, -sz * 0.16);
    ctx.lineTo(sz * 0.38, 0);
    ctx.lineTo(sz * 0.20, sz * 0.16);
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
}

function drawGoldStar(cx, cy, r, scale = 1.0) {
  if (scale <= 0.01) return;
  ctx.save();
  ctx.translate(cx, cy);
  if (scale !== 1.0) {
    ctx.scale(scale, scale);
  }

  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = (i * Math.PI) / 5 - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.48;
    const x = Math.cos(ang) * rad;
    const y = Math.sin(ang) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();

  const starGrad = ctx.createLinearGradient(0, -r, 0, r);
  starGrad.addColorStop(0, '#fef08a');
  starGrad.addColorStop(0.4, '#facc15');
  starGrad.addColorStop(1, '#ca8a04');
  ctx.fillStyle = starGrad;
  ctx.fill();

  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#713f12';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-r * 0.2, -r * 0.25, r * 0.2, 0, 6.28);
  ctx.fill();

  ctx.restore();
}

function drawEmptyStar(cx, cy, r) {
  ctx.save();
  ctx.translate(cx, cy);

  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = (i * Math.PI) / 5 - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.48;
    const x = Math.cos(ang) * rad;
    const y = Math.sin(ang) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();

  ctx.fillStyle = '#cbd5e1';
  ctx.fill();

  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  ctx.restore();
}

function drawGoldenPerfectRibbon(cx, cy, w, h) {
  ctx.save();
  const halfW = w / 2;
  const tailW = 20;

  // Tail ribbons
  ctx.fillStyle = '#b45309';
  ctx.beginPath();
  ctx.moveTo(cx - halfW, cy);
  ctx.lineTo(cx - halfW - tailW, cy + 8);
  ctx.lineTo(cx - halfW - tailW + 6, cy + h + 4);
  ctx.lineTo(cx - halfW, cy + h);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx + halfW, cy);
  ctx.lineTo(cx + halfW + tailW, cy + 8);
  ctx.lineTo(cx + halfW + tailW - 6, cy + h + 4);
  ctx.lineTo(cx + halfW, cy + h);
  ctx.closePath();
  ctx.fill();

  // Main ribbon body
  const ribGrad = ctx.createLinearGradient(0, cy, 0, cy + h);
  ribGrad.addColorStop(0, '#fef08a');
  ribGrad.addColorStop(0.35, '#facc15');
  ribGrad.addColorStop(0.7, '#eab308');
  ribGrad.addColorStop(1, '#ca8a04');

  ctx.fillStyle = 'rgba(15, 7, 36, 0.28)';
  roundRect(ctx, cx - halfW, cy + 3, w, h, 8);
  ctx.fill();

  ctx.fillStyle = ribGrad;
  roundRect(ctx, cx - halfW, cy, w, h, 8);
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2.0;
  roundRect(ctx, cx - halfW, cy, w, h, 8);
  ctx.stroke();

  ctx.strokeStyle = '#713f12';
  ctx.lineWidth = 1.2;
  roundRect(ctx, cx - halfW + 1.5, cy + 1.5, w - 3, h - 3, 6);
  ctx.stroke();

  // Gleam shine animation across ribbon
  const shineT = (levelCompleteTimer * 1.5) % 2.5;
  if (shineT < 1.0) {
    const shineX = (cx - halfW) + shineT * (w + 40) - 20;
    ctx.save();
    roundRect(ctx, cx - halfW, cy, w, h, 8);
    ctx.clip();
    const sGrad = ctx.createLinearGradient(shineX - 20, cy, shineX + 20, cy + h);
    sGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
    sGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.55)');
    sGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = sGrad;
    ctx.fillRect(cx - halfW, cy, w, h);
    ctx.restore();
  }

  // Text inside ribbon
  drawGlossyText('★ PERFECT! +25 BONUS ★', cx, cy + h / 2 + 1, 13.5, 'center', '#ffffff', '#713f12', 3.6);

  ctx.restore();
}

function drawRibbonHeader(cx, cy, w, h, text, themeColor, starCount = 2) {
  ctx.save();
  const halfW = w / 2;
  const tailW = 24;

  ctx.fillStyle = themeColor.lip;
  ctx.beginPath();
  ctx.moveTo(cx - halfW, cy);
  ctx.lineTo(cx - halfW - tailW, cy + 10);
  ctx.lineTo(cx - halfW - tailW + 8, cy + h + 4);
  ctx.lineTo(cx - halfW, cy + h);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx + halfW, cy);
  ctx.lineTo(cx + halfW + tailW, cy + 10);
  ctx.lineTo(cx + halfW + tailW - 8, cy + h + 4);
  ctx.lineTo(cx + halfW, cy + h);
  ctx.closePath();
  ctx.fill();

  const rGrad = ctx.createLinearGradient(0, cy, 0, cy + h);
  rGrad.addColorStop(0, themeColor.top);
  rGrad.addColorStop(0.5, themeColor.mid);
  rGrad.addColorStop(1, themeColor.bot);
  ctx.fillStyle = rGrad;
  roundRect(ctx, cx - halfW, cy, w, h, 8);
  ctx.fill();

  ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
  ctx.fillRect(cx - halfW + 4, cy + 2, w - 8, h * 0.35);

  ctx.strokeStyle = themeColor.border;
  ctx.lineWidth = 2.4;
  roundRect(ctx, cx - halfW, cy, w, h, 8);
  ctx.stroke();

  drawGlossyText(text, cx, cy + h / 2 + 1, 22, 'center', '#ffffff', themeColor.border, 4.5);

  if (starCount >= 2) {
    drawGoldStar(cx - halfW + 18, cy + h / 2, 11);
    drawGoldStar(cx + halfW - 18, cy + h / 2, 11);
  }

  ctx.restore();
}

// Score Pill with gold star badge (not confused with coins)
function drawScorePill(x, y, w, h, val, isBest = false) {
  ctx.save();
  ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
  roundRect(ctx, x, y, w, h, h / 2);
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.6;
  roundRect(ctx, x, y, w, h, h / 2);
  ctx.stroke();

  // Small gold star badge on left
  const starCX = x + h * 0.52;
  const starCY = y + h * 0.5;
  drawGoldStar(starCX, starCY, h * 0.38);

  const label = isBest ? `BEST ${val}` : `${val}`;
  drawGlossyText(label, x + (w + h * 0.35) / 2 + 1, y + h / 2 + 1, Math.min(14, h * 0.58), 'center', '#ffffff', '#0f172a', 3.2);

  ctx.restore();
}

// Global Offscreen Sprite Caches (initialized near top to avoid TDZ during resizeCanvas)

function getCachedStarCoinSprite(r) {
  const key = `${r.toFixed(1)}_${dpr}`;
  const hit = uiRenderCache.starCoins.get(key);
  if (hit) return hit;

  const depth = Math.max(2.4, r * 0.22);
  const pad = Math.ceil(depth + 6);
  const half = Math.ceil(r + pad);
  const sz = half * 2;
  const c = document.createElement('canvas');
  c.width = Math.ceil(sz * dpr);
  c.height = Math.ceil(sz * dpr);
  const cCtx = c.getContext('2d');
  cCtx.scale(dpr, dpr);
  cCtx.translate(half, half);

  // Subtle soft drop shadow (replaces slow shadowBlur)
  cCtx.fillStyle = 'rgba(15, 23, 42, 0.22)';
  cCtx.beginPath();
  cCtx.arc(-depth * 0.45, 2.2, r + 1.2, 0, Math.PI * 2);
  cCtx.fill();

  // 3D Extruded left metallic rim edge
  const edgeGrad = cCtx.createLinearGradient(-depth, -r, -depth, r);
  edgeGrad.addColorStop(0, '#fef08a');
  edgeGrad.addColorStop(0.28, '#f59e0b');
  edgeGrad.addColorStop(0.75, '#d97706');
  edgeGrad.addColorStop(1, '#92400e');
  cCtx.fillStyle = edgeGrad;
  cCtx.beginPath();
  cCtx.arc(-depth, 0, r, 0, Math.PI * 2);
  cCtx.fill();
  cCtx.strokeStyle = '#92400e';
  cCtx.lineWidth = Math.max(0.9, r * 0.065);
  cCtx.stroke();

  // Front golden coin face
  const faceGrad = cCtx.createRadialGradient(-r * 0.25, -r * 0.30, r * 0.1, 0, 0, r);
  faceGrad.addColorStop(0, '#fef9c3');
  faceGrad.addColorStop(0.35, '#fde047');
  faceGrad.addColorStop(0.82, '#facc15');
  faceGrad.addColorStop(1, '#eab308');
  cCtx.fillStyle = faceGrad;
  cCtx.beginPath();
  cCtx.arc(0, 0, r, 0, Math.PI * 2);
  cCtx.fill();
  cCtx.strokeStyle = '#b45309';
  cCtx.lineWidth = Math.max(0.9, r * 0.065);
  cCtx.stroke();

  // Top-left rim highlight arc
  cCtx.strokeStyle = 'rgba(255, 255, 255, 0.62)';
  cCtx.lineWidth = Math.max(1.0, r * 0.075);
  cCtx.beginPath();
  cCtx.arc(0, 0, r * 0.89, -Math.PI * 0.85, -Math.PI * 0.18);
  cCtx.stroke();

  // Inner recessed circular groove
  const innerR = r * 0.75;
  const innerGrad = cCtx.createLinearGradient(0, -innerR, 0, innerR);
  innerGrad.addColorStop(0, '#f59e0b');
  innerGrad.addColorStop(0.5, '#facc15');
  innerGrad.addColorStop(1, '#fde047');
  cCtx.fillStyle = innerGrad;
  cCtx.beginPath();
  cCtx.arc(0, 0, innerR, 0, Math.PI * 2);
  cCtx.fill();

  cCtx.strokeStyle = '#b45309';
  cCtx.lineWidth = Math.max(1.0, r * 0.075);
  cCtx.beginPath();
  cCtx.arc(0, 0, innerR, 0, Math.PI * 2);
  cCtx.stroke();

  // Subtle bright lip inside bottom of recessed circle
  cCtx.strokeStyle = 'rgba(254, 249, 195, 0.55)';
  cCtx.lineWidth = Math.max(0.8, r * 0.055);
  cCtx.beginPath();
  cCtx.arc(0, 0, innerR * 0.94, Math.PI * 0.15, Math.PI * 0.85);
  cCtx.stroke();

  // Embossed 5-point golden star in center
  const starOuter = r * 0.49;
  const starInner = r * 0.25;
  cCtx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = (i * Math.PI) / 5 - Math.PI / 2;
    const rad = (i % 2 === 0) ? starOuter : starInner;
    const px = Math.cos(ang) * rad;
    const py = Math.sin(ang) * rad + r * 0.02;
    if (i === 0) cCtx.moveTo(px, py); else cCtx.lineTo(px, py);
  }
  cCtx.closePath();

  cCtx.lineJoin = 'round';
  cCtx.miterLimit = 2;
  cCtx.strokeStyle = '#b45309';
  cCtx.lineWidth = Math.max(1.8, r * 0.14);
  cCtx.stroke();

  const starGrad = cCtx.createLinearGradient(0, -starOuter, 0, starOuter);
  starGrad.addColorStop(0, '#fef9c3');
  starGrad.addColorStop(0.5, '#fde047');
  starGrad.addColorStop(1, '#f59e0b');
  cCtx.fillStyle = starGrad;
  cCtx.fill();

  const entry = { canvas: c, half, size: sz };
  uiRenderCache.starCoins.set(key, entry);
  return entry;
}

function getIrisRadiusAt(t) {
  const cx = W / 2;
  const cy = H / 2;
  const maxR = Math.hypot(cx, cy) + 8;
  if (t < IRIS_CLOSE_DURATION) {
    const p = Math.max(0, Math.min(1, t / IRIS_CLOSE_DURATION));
    const closeEase = 1 - Math.pow(1 - p, 1.75);
    return maxR * (1 - closeEase);
  } else if (t < IRIS_CLOSE_DURATION + IRIS_HOLD_DURATION) {
    return 0;
  } else {
    const openT = t - (IRIS_CLOSE_DURATION + IRIS_HOLD_DURATION);
    const q = Math.max(0, Math.min(1, openT / IRIS_OPEN_DURATION));
    const openEase = Math.pow(q, 1.55);
    return maxR * openEase;
  }
}

let cachedIrisMaskCanvas = null;
const IRIS_MASK_SIZE = 384;
const IRIS_MASK_HOLE_R = 160;
function getCachedIrisMask() {
  if (cachedIrisMaskCanvas) return cachedIrisMaskCanvas;
  const c = document.createElement('canvas');
  c.width = IRIS_MASK_SIZE;
  c.height = IRIS_MASK_SIZE;
  const mCtx = c.getContext('2d');
  mCtx.fillStyle = '#000000';
  mCtx.fillRect(0, 0, IRIS_MASK_SIZE, IRIS_MASK_SIZE);
  mCtx.globalCompositeOperation = 'destination-out';
  mCtx.beginPath();
  mCtx.arc(IRIS_MASK_SIZE / 2, IRIS_MASK_SIZE / 2, IRIS_MASK_HOLE_R, 0, Math.PI * 2);
  mCtx.fill();
  cachedIrisMaskCanvas = c;
  return c;
}

function drawStylishLevelTransition(t) {
  const cx = W / 2;
  const cy = H / 2;
  const maxR = Math.hypot(cx, cy) + 8;
  const radius = getIrisRadiusAt(t);

  if (radius >= maxR) return;

  if (radius <= 0.5) {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);
    return;
  }

  const mask = getCachedIrisMask();
  const halfBox = radius * ((IRIS_MASK_SIZE / 2) / IRIS_MASK_HOLE_R);
  const boxX = cx - halfBox;
  const boxY = cy - halfBox;
  const boxSize = halfBox * 2;

  ctx.fillStyle = '#000000';
  const topH = Math.ceil(boxY) + 2;
  const botY = Math.floor(boxY + boxSize) - 2;
  const leftW = Math.ceil(boxX) + 2;
  const rightX = Math.floor(boxX + boxSize) - 2;

  if (topH > 0) ctx.fillRect(0, 0, W, Math.min(H, topH));
  if (botY < H) ctx.fillRect(0, Math.max(0, botY), W, H - Math.max(0, botY));
  const midTop = Math.max(0, topH - 2);
  const midBot = Math.min(H, botY + 2);
  const midH = Math.max(0, midBot - midTop);
  if (midH > 0) {
    if (leftW > 0) ctx.fillRect(0, midTop, Math.min(W, leftW), midH);
    if (rightX < W) ctx.fillRect(Math.max(0, rightX), midTop, W - Math.max(0, rightX), midH);
  }
  ctx.drawImage(mask, boxX, boxY, boxSize, boxSize);
}

function getHudBarProgress() {
  if (levelCompleted || st === 'level_complete') return 1.0;
  const camStop = Math.max(1, FINISH_ROAD_END - ROAD_END_STOP_X);
  const carTargetCenterX = CAR_STOP_FRONT_X - CAR_DRAW_W * 0.42;

function getDifficultyDistance() {
