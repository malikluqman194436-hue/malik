function playCoinPickupSound(coinType = 'bronze') {
  if (!soundEnabled) return;
  ensureAudioContext();
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    coinCombo = Math.min(8, coinCombo + 1);
    coinComboTimer = 0.8;

    const pitchFactor = Math.pow(2, coinCombo / 14);
    const outNode = masterGain || audioCtx.destination;

    if (coinType === 'gem' || coinType === 'coin_100') {
      // Shimmering triple chime for rare 100 laurel coin
      const freqs = [
        [1046.5 * pitchFactor, 1318.5 * pitchFactor],
        [1567.98 * pitchFactor, 2093.0 * pitchFactor],
        [2637.0 * pitchFactor, 3135.96 * pitchFactor]
      ];
      freqs.forEach((pair, idx) => {
        const t = now + idx * 0.055;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0, now);
        g.gain.setValueAtTime(0.24, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
        g.connect(outNode);
        pair.forEach(f => {
          const osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t);
          osc.connect(g);
          trackScheduledAudioNode(osc, g);
          osc.start(t);
          osc.stop(t + 0.26);
        });
      });
      return;
    }

    if (coinType === 'gold' || coinType === 'coin_50') {
      // Fuller double chime for gold coin
      const freqs = [
        [1046.5 * pitchFactor, 1318.5 * pitchFactor],
        [1567.98 * pitchFactor, 2093.0 * pitchFactor]
      ];
      freqs.forEach((pair, idx) => {
        const t = now + idx * 0.06;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0, now);
        g.gain.setValueAtTime(0.26, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        g.connect(outNode);
        pair.forEach(f => {
          const osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t);
          osc.connect(g);
          trackScheduledAudioNode(osc, g);
          osc.start(t);
          osc.stop(t + 0.22);
        });
      });
      return;
    }

    if (coinType === 'silver') {
      // Higher ting for silver coin
      const f1 = 1760 * pitchFactor;
      const f2 = 2637 * pitchFactor;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.25, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      g.connect(outNode);
      [f1, f2].forEach(f => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now);
        osc.connect(g);
        trackScheduledAudioNode(osc, g);
        osc.start(now);
        osc.stop(now + 0.16);
      });
      return;
    }

    // Normal ting for bronze coin
    const f1 = 1318 * pitchFactor;
    const f2 = 1976 * pitchFactor;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.25, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    g.connect(outNode);
    [f1, f2].forEach(f => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now);
      osc.connect(g);
      trackScheduledAudioNode(osc, g);
      osc.start(now);
      osc.stop(now + 0.14);
    });
  } catch (e) {}
}

function prerenderBoosterSprite() {
  const sz = 80;
  const canvas = document.createElement('canvas');
  canvas.width = sz;
  canvas.height = sz;
  const bCtx = canvas.getContext('2d');
  const cx = sz / 2, cy = sz / 2;
  const r = BOOSTER_RADIUS;

  // 1. Soft glowing outer radial gradient
  const glow = bCtx.createRadialGradient(cx, cy, r * 0.25, cx, cy, sz / 2);
  glow.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
  glow.addColorStop(0.35, 'rgba(56, 189, 248, 0.85)');
  glow.addColorStop(0.70, 'rgba(14, 165, 233, 0.35)');
  glow.addColorStop(1, 'rgba(2, 132, 199, 0)');
  bCtx.fillStyle = glow;
  bCtx.beginPath();
  bCtx.arc(cx, cy, sz / 2, 0, Math.PI * 2);
  bCtx.fill();

  // 2. Translucent ring backing
  bCtx.fillStyle = 'rgba(15, 23, 42, 0.88)';
  bCtx.beginPath();
  bCtx.arc(cx, cy, r, 0, Math.PI * 2);
  bCtx.fill();

  // 3. Bright cyan/white ring border
  bCtx.strokeStyle = '#38bdf8';
  bCtx.lineWidth = 2.6;
  bCtx.beginPath();
  bCtx.arc(cx, cy, r, 0, Math.PI * 2);
  bCtx.stroke();

  // Inner white accent ring
  bCtx.strokeStyle = '#ffffff';
  bCtx.lineWidth = 1.2;
  bCtx.beginPath();
  bCtx.arc(cx, cy, r - 3, 0, Math.PI * 2);
  bCtx.stroke();

  // 4. Glowing Lightning Bolt Icon in center
  bCtx.save();
  bCtx.shadowColor = '#38bdf8';
  bCtx.shadowBlur = 8;
  bCtx.beginPath();
  bCtx.moveTo(cx + 2, cy - r * 0.62);
  bCtx.lineTo(cx - r * 0.45, cy + 1);
  bCtx.lineTo(cx - 1, cy + 1);
  bCtx.lineTo(cx - 3, cy + r * 0.66);
  bCtx.lineTo(cx + r * 0.45, cy - 1);
  bCtx.lineTo(cx + 1, cy - 1);
  bCtx.closePath();

  const boltGrad = bCtx.createLinearGradient(cx - r * 0.4, cy - r * 0.6, cx + r * 0.4, cy + r * 0.6);
  boltGrad.addColorStop(0, '#ffffff');
  boltGrad.addColorStop(0.5, '#fef08a');
  boltGrad.addColorStop(1, '#f59e0b');
  bCtx.fillStyle = boltGrad;
  bCtx.fill();

  bCtx.strokeStyle = '#ffffff';
  bCtx.lineWidth = 1.0;
  bCtx.stroke();
  bCtx.restore();

  // 5. Orbiting diamond sparkle stars
  const starPoints = [
    [cx - r * 0.9, cy - r * 0.65, 5],
    [cx + r * 0.95, cy, 6],
    [cx + r * 0.72, cy + r * 0.75, 5]
  ];
  for (const [sx, sy, ss] of starPoints) {
    bCtx.fillStyle = '#bae6fd';
    bCtx.beginPath();
    bCtx.moveTo(sx, sy - ss);
    bCtx.lineTo(sx + ss * 0.38, sy);
    bCtx.lineTo(sx, sy + ss);
    bCtx.lineTo(sx - ss * 0.38, sy);
    bCtx.closePath();
    bCtx.fill();
  }

  boosterCanvas = canvas;
}

function drawBoosters() {
  if (!boosterCanvas) prerenderBoosterSprite();

  for (let i = 0; i < boosters.length; i++) {
    const b = boosters[i];
    if (b.collected && b.popTimer <= 0) continue;
    const screenX = b.x - cam;
    if (screenX < -60 || screenX > W + 60) continue;

    const bobY = Math.sin(gameTime * 4.2 + b.phase) * 3.5;
    const pulse = 1.0 + 0.08 * Math.sin(gameTime * 6 + b.phase);
    const drawY = b.y + bobY;

    if (b.collected && b.popTimer > 0) {
      const popT = 1 - (b.popTimer / 0.3);
      const scale = (1 + popT * 0.6) * pulse;
      const alpha = Math.max(0, 1 - popT);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(screenX, drawY);
      ctx.scale(scale, scale);
      if (boosterCanvas) {
        ctx.drawImage(boosterCanvas, -boosterCanvas.width / 2, -boosterCanvas.height / 2);
      }
      ctx.restore();
    } else {
      ctx.save();
      ctx.translate(screenX, drawY);
      ctx.scale(pulse, pulse);

      // Pulsing blue-white outer ring wave
      const wavePhase = (gameTime * 2.8 + b.phase) % 1.0;
      ctx.strokeStyle = 'rgba(56, 189, 248, ' + (0.75 * (1 - wavePhase)) + ')';
      ctx.lineWidth = 2.0;
      ctx.beginPath();
      ctx.arc(0, 0, BOOSTER_RADIUS + wavePhase * 10, 0, Math.PI * 2);
      ctx.stroke();

      if (boosterCanvas) {
        ctx.drawImage(boosterCanvas, -boosterCanvas.width / 2, -boosterCanvas.height / 2);
      }

      ctx.restore();
    }
  }

  // Draw booster sparkles
  for (let i = 0; i < boosterSparklePool.length; i++) {
    const s = boosterSparklePool[i];
    if (!s.active) continue;
    const scrX = s.x - cam;
    if (scrX < -20 || scrX > W + 20) continue;
    const lifeRatio = 1 - (s.life / s.maxLife);
    ctx.save();
    ctx.globalAlpha = Math.max(0, lifeRatio);
    ctx.fillStyle = s.color || '#38bdf8';
    ctx.beginPath();
    ctx.arc(scrX, s.y, s.size * (0.6 + 0.4 * lifeRatio), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function getCorridorSafeBounds(x, segsList) {
  for (let i = 0; i < segsList.length; i++) {
    const s = segsList[i];
    if (x >= s.x && x <= s.x + s.w) {
      if (s.isOpen) {
        if (s.obstacles && s.obstacles.length > 0) {
          for (const obs of s.obstacles) {
            if (Math.abs(x - (obs.x + obs.w / 2)) < obs.w + 30) {
              if (obs.type === 'gate') {
                const sTop = obs.gapTop + 16;
                const sBot = obs.gapBot - 16;
                return { top: obs.gapTop, bot: obs.gapBot, safeTop: sTop, safeBot: sBot, safeCenter: obs.gateCenter, halfH: Math.max(12, (sBot - sTop) / 2) };
              } else if (obs.type === 'stalactite') {
                const sTop = obs.tipY + 18;
                const sBot = H - 90;
                return { top: obs.tipY, bot: H - 70, safeTop: sTop, safeBot: sBot, safeCenter: (sTop + sBot) / 2, halfH: Math.max(12, (sBot - sTop) / 2) };
              } else if (obs.type === 'stalagmite') {
                const sTop = 90;
                const sBot = obs.tipY - 18;
                return { top: 70, bot: obs.tipY, safeTop: sTop, safeBot: sBot, safeCenter: (sTop + sBot) / 2, halfH: Math.max(12, (sBot - sTop) / 2) };
              } else if (obs.type === 'floating_block') {
                const sTop = 80;
                const sBot = obs.y - 18;
                return { top: 60, bot: obs.y, safeTop: sTop, safeBot: sBot, safeCenter: (sTop + sBot) / 2, halfH: Math.max(12, (sBot - sTop) / 2) };
              }
            }
          }
        }
        const sCenter = s.safeCenter || (CAR_REST_Y - 40);
        return {
          top: -300,
          bot: H + 300,
          safeTop: sCenter - 80,
          safeBot: sCenter + 80,
          safeCenter: sCenter,
          halfH: 80
        };
      }
      let curTop = (s.curTop !== undefined) ? s.curTop : s.top;
      let curBot = (s.curBot !== undefined) ? s.curBot : s.bot;

      if (s.isSlanted && s.top2 !== undefined) {
        const t = Math.max(0, Math.min(1, (x - s.x) / s.w));
        curTop = curTop + (s.top2 - curTop) * t;
        curBot = curBot + (s.bot2 - curBot) * t;
      } else if (i < segsList.length - 1) {
        // Smooth step interpolation near segment boundary
        const sNext = segsList[i + 1];
        if (!sNext.isOpen) {
          const seamX = s.x + s.w;
          const blendDist = 48 * 1.2;
          if (x > seamX - blendDist) {
            const t = (x - (seamX - blendDist)) / blendDist;
            const ease = t * t * (3 - 2 * t);
            const nextTop = (sNext.curTop !== undefined) ? sNext.curTop : sNext.top;
            const nextBot = (sNext.curBot !== undefined) ? sNext.curBot : sNext.bot;
            curTop = curTop + (nextTop - curTop) * ease;
            curBot = curBot + (nextBot - curBot) * ease;
          }
        }
      }

      const safeTop = curTop + 1.2 * 48;
      const safeBot = curBot - 1.2 * 48;
      const safeCenter = (safeTop + safeBot) / 2;
      const halfH = Math.max(12, (safeBot - safeTop) / 2 - COIN_RADIUS);
      return { top: curTop, bot: curBot, safeTop, safeBot, safeCenter, halfH };
    }
  }
  return {
    top: -300,
    bot: H + 300,
    safeTop: 120,
    safeBot: H - 120,
    safeCenter: CAR_REST_Y,
    halfH: 100
  };
}

function generateLevelCoins(lvl, segsList) {
  coins.length = 0;
  coinSparkles.length = 0;
  flyingCoins.length = 0;
  coinFloatTexts.length = 0;
  levelCoinsCollected = 0;
  earnedStars = 1;
  isPerfect = false;
  perfectBonusGiven = false;
  starSoundsPlayed = [false, false, false];
  bronzeCoinsPicked = 0;

  const prng = mulberry32(hashInt(lvl * 77777 + 98765));
  const coinSpacing = 1.1 * 48; // ~52.8 px
  const sp = scrollSpeed();

  function pushCoin(cx, cy, type, phase) {
    const isHigher = (type !== 'bronze');
    const b = getCorridorSafeBounds(cx, segsList);
    let finalY = cy;
    if (isHigher) {
      // 1.4 * carH distance from spike tips for higher value coins
      const minSafeY = b.top + 1.4 * 48;
      const maxSafeY = b.bot - 1.4 * 48;
      if (minSafeY < maxSafeY) {
        finalY = Math.max(minSafeY, Math.min(maxSafeY, cy));
      } else {
        finalY = b.safeCenter;
      }
    } else {
      finalY = Math.max(b.safeTop + BRONZE_RADIUS, Math.min(b.safeBot - BRONZE_RADIUS, cy));
    }
    const val = (type === 'gem') ? GEM_VALUE : ((type === 'gold') ? GOLD_VALUE : ((type === 'silver') ? SILVER_VALUE : BRONZE_VALUE));
    const r = (type === 'gem') ? GEM_RADIUS : ((type === 'gold') ? GOLD_RADIUS : ((type === 'silver') ? SILVER_RADIUS : BRONZE_RADIUS));
    coins.push({
      x: cx,
      y: finalY,
      type,
      val,
      radius: r,
      collected: false,
      phase,
      popTimer: 0
    });
  }

  // 1. START GUIDE: bronze coins in gentle arc leading off start road through open gap into tunnel
  const startX = START_ROAD_END - 40;
  const firstSegBounds = getCorridorSafeBounds(TUNNEL_START_X + 60, segsList);
  const targetEntryY = firstSegBounds.safeCenter;
  const numGuideCoins = 7;
  const guideEnd = TUNNEL_START_X + 40;
  const guideStep = (guideEnd - startX) / (numGuideCoins - 1);
  for (let k = 0; k < numGuideCoins; k++) {
    const t = k / (numGuideCoins - 1);
    const x = startX + k * guideStep;
    const y = CAR_REST_Y - (CAR_REST_Y - targetEntryY) * Math.sin(t * Math.PI * 0.5);
    pushCoin(x, y, 'bronze', prng() * 6.28);
  }

  // 2. TUNNEL COIN PATTERNS (Subway Surfers style: straight, wave, arc, staircase, double row, risk line)
  let curX = TUNNEL_START_X + 180;
  const tunnelMaxX = TUNNEL_END_X - 180;
  const patternTypes = ['straight', 'wave', 'arc_up', 'arc_down', 'staircase', 'double_row', 'risk_high', 'risk_low'];
  const totalApproxPatterns = Math.max(1, Math.floor((tunnelMaxX - curX) / (sp * 1.35)));

  // Rare blue gem appears at most once per level (value 25)
  const hasGem = (prng() < 0.50);
  const gemPatternIndex = hasGem ? Math.floor(totalApproxPatterns * (0.35 + prng() * 0.35)) : -1;

  // Gold coins: at most 3 per level (value 10)
  const maxGold = hasGem ? 1 : Math.min(3, Math.floor(prng() * 2 + 1));
  const maxSilver = hasGem ? Math.min(4, Math.floor(prng() * 2 + 2)) : Math.min(6, Math.floor(prng() * 2 + 4));
  let goldPlaced = 0;
  let silverPlaced = 0;
  let gemPlaced = false;
  let patternCount = 0;

  while (curX < tunnelMaxX) {
    const pType = patternTypes[Math.floor(prng() * patternTypes.length)];
    const count = (pType === 'double_row') ? Math.floor(prng() * 3 + 4) : Math.floor(prng() * 4 + 5);
    const isGemPattern = (patternCount === gemPatternIndex && !gemPlaced);

    // Higher-value coin placement: end of pattern or top of arc
    let rewardIdx = -1;
    let rewardType = 'bronze';

    if (isGemPattern) {
      rewardType = 'gem';
      gemPlaced = true;
      rewardIdx = (pType === 'arc_up' || pType === 'arc_down') ? Math.floor(count / 2) : (count - 1);
    } else if (goldPlaced < maxGold && (patternCount % 4 === 1 || pType === 'risk_high' || pType === 'risk_low') && prng() < 0.50) {
      rewardType = 'gold';
      goldPlaced++;
      rewardIdx = (pType === 'arc_up' || pType === 'arc_down') ? Math.floor(count / 2) : (count - 1);
    } else if (silverPlaced < maxSilver && (patternCount % 2 === 0 || prng() < 0.40)) {
      rewardType = 'silver';
      silverPlaced++;
      rewardIdx = (pType === 'arc_up' || pType === 'arc_down') ? Math.floor(count / 2) : (count - 1);
    }

    if (pType === 'straight') {
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, b.safeCenter, type, prng() * 6.28);
      }
    } else if (pType === 'wave') {
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const amp = Math.min(b.halfH * 0.65, 36);
        const y = b.safeCenter + Math.sin((k / count) * Math.PI * 2) * amp;
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, y, type, prng() * 6.28);
      }
    } else if (pType === 'arc_up' || pType === 'arc_down') {
      const sign = (pType === 'arc_up') ? -1 : 1;
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const t = k / (count - 1);
        const arc = 4 * t * (1 - t);
        const amp = Math.min(b.halfH * 0.70, 38);
        const y = b.safeCenter + sign * arc * amp;
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, y, type, prng() * 6.28);
      }
    } else if (pType === 'staircase') {
      const bStart = getCorridorSafeBounds(curX, segsList);
      const bEnd = getCorridorSafeBounds(curX + count * coinSpacing, segsList);
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const t = k / (count - 1);
        const ease = t * t * (3 - 2 * t);
        const y = bStart.safeCenter + (bEnd.safeCenter - bStart.safeCenter) * ease;
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, y, type, prng() * 6.28);
      }
    } else if (pType === 'double_row') {
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const offset = Math.min(18, b.halfH * 0.45);
        const type = (k === count - 1 && rewardType === 'silver') ? 'silver' : 'bronze';
        pushCoin(cx, b.safeCenter - offset, type, prng() * 6.28);
        pushCoin(cx, b.safeCenter + offset, 'bronze', (prng() * 6.28) + 1.5);
      }
    } else {
      // risk line slightly toward one edge of safe band (still safe)
      const isHigh = (pType === 'risk_high');
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const offset = Math.min(30, b.halfH * 0.65);
        const y = isHigh ? (b.safeCenter - offset) : (b.safeCenter + offset);
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, y, type, prng() * 6.28);
      }
    }

    patternCount++;
    const patternLen = count * coinSpacing;
    const gapSec = 0.8 + prng() * 0.8;
    curX += patternLen + (gapSec * sp);
  }

  // 3. FINISH ROAD: Reduced number of coins as requested (reduced to 3 coins)
  const finishCoinY = CAR_REST_Y - BRONZE_RADIUS - 2;
  const finishCoinsStart = FINISH_ROAD_X + 140;
  const finishCoinsEnd = finishLineWorldX - 80;
  const finishCoinCount = 3;
  const finishCoinStep = (finishCoinsEnd - finishCoinsStart) / (finishCoinCount - 1);
  for (let k = 0; k < finishCoinCount; k++) {
    const isLast = (k === finishCoinCount - 1);
    pushCoin(finishCoinsStart + k * finishCoinStep, finishCoinY, isLast ? 'silver' : 'bronze', prng() * 6.28);
  }

  levelCoinsTotal = coins.reduce((acc, c) => acc + c.val, 0);
}

function generateLevelBoosters(lvl, segsList, coinsList) {
  boosters.length = 0;
  for (let i = 0; i < boosterSparklePool.length; i++) boosterSparklePool[i].active = false;
  boosterSparkles.length = 0;
  carGhostTrail.length = 0;
  boostTimer = 0;
  boostProtectionTimer = 0;
  boostRampFactor = 0;
  boostElapsed = 0;

  if (!segsList || segsList.length === 0) return;

  // PRNG seeded for consistent and repeatable booster placement per level
  const boostRng = mulberry32(hashInt(lvl * 99933 + 77719));

  // Requirement: Every level must have at least 3 to 4 boosters
  // Randomly generate 3 or 4 boosters (biased towards 4 on longer stages)
  const targetCount = (boostRng() < 0.35) ? 3 : 4;

  const minX = TUNNEL_START_X + TUNNEL_LENGTH * 0.10;
  const maxX = TUNNEL_START_X + TUNNEL_LENGTH * 0.88;
  const minSpikeDist = 1.35 * carVis; // 56.7px safe clearance from spikes

  // Helper: check if (cx, cy) is closer than minSpikeDist to any spike tip
  function isTooCloseToSpikes(cx, cy) {
    for (let sIdx = 0; sIdx < segsList.length; sIdx++) {
      const s = segsList[sIdx];
      if (cx + minSpikeDist < s.x || cx - minSpikeDist > s.x + s.w) continue;
      const count = s.topSpikes ? s.topSpikes.length : 0;
      for (let i = 0; i < count; i++) {
        const spX = s.x + i * 12 + 6;
        if (Math.abs(cx - spX) > minSpikeDist) continue;
        const spFrac = Math.max(0, Math.min(1, (spX - s.x) / s.w));
        const curTop = s.isSlanted ? (s.top + (s.top2 - s.top) * spFrac) : (s.curTop != null ? s.curTop : s.top);
        const curBot = s.isSlanted ? (s.bot + (s.bot2 - s.bot) * spFrac) : (s.curBot != null ? s.curBot : s.bot);
        const topTip = (curTop - 18) + (s.topSpikes[i] ? s.topSpikes[i].h : 0);
        const botTip = (curBot + 18) - (s.botSpikes[i] ? s.botSpikes[i].h : 0);
        if (Math.hypot(cx - spX, cy - topTip) < minSpikeDist) return true;
        if (Math.hypot(cx - spX, cy - botTip) < minSpikeDist) return true;
      }
    }
    return false;
  }

  function isSpacedFromExisting(cx, minGap = 500) {
    for (let eb of boosters) {
      if (Math.abs(eb.x - cx) < minGap) return false;
    }
    return true;
  }

  const coinsToRemove = [];
  const span = maxX - minX;

  // Pass 1: Zone-based placement to evenly distribute boosters across the level (3 to 4 zones)
  for (let z = 0; z < targetCount; z++) {
    const zMin = minX + span * (z / targetCount);
    const zMax = minX + span * ((z + 1) / targetCount);

    // Look for eligible coins in this zone first (prefer replacing a coin so flow is natural)
    let zoneCandidates = [];
    if (coinsList && coinsList.length > 0) {
      for (let i = 0; i < coinsList.length; i++) {
        const coin = coinsList[i];
        if (!coin || coin.x < zMin || coin.x > zMax) continue;
        if (!isSpacedFromExisting(coin.x, 480)) continue;
        const b = getCorridorSafeBounds(coin.x, segsList);
        if (b.isSqueeze || b.halfH < 8) continue;
        const candY = Math.max(b.safeTop + 8, Math.min(b.safeBot - 8, coin.y));
        if (isTooCloseToSpikes(coin.x, candY)) continue;
        zoneCandidates.push({ coinIndex: i, x: coin.x, y: candY });
      }
    }

    if (zoneCandidates.length > 0) {
      // Pick a candidate coin in this zone
      const pick = zoneCandidates[Math.floor(boostRng() * zoneCandidates.length)];
      boosters.push({
        x: pick.x,
        y: pick.y,
        radius: BOOSTER_RADIUS,
        collected: false,
        phase: boostRng() * 6.28,
        popTimer: 0
      });
      coinsToRemove.push(pick.coinIndex);
    } else {
      // Fallback: scan for a safe point in the corridor in this zone
      let safePoint = null;
      const step = 40;
      const startX = zMin + 40;
      const endX = zMax - 40;
      const count = Math.max(1, Math.floor((endX - startX) / step));
      const offset = Math.floor(boostRng() * count);
      for (let s = 0; s < count; s++) {
        const testX = startX + ((s + offset) % count) * step;
        if (!isSpacedFromExisting(testX, 480)) continue;
        const b = getCorridorSafeBounds(testX, segsList);
        if (b.isSqueeze || b.halfH < 12) continue;
        const candY = b.safeCenter || (b.safeTop + b.safeBot) / 2;
        if (!isTooCloseToSpikes(testX, candY)) {
          safePoint = { x: testX, y: candY };
          break;
        }
      }
      if (safePoint) {
        boosters.push({
          x: safePoint.x,
          y: safePoint.y,
          radius: BOOSTER_RADIUS,
          collected: false,
          phase: boostRng() * 6.28,
          popTimer: 0
        });
      }
    }
  }

  // Pass 2: Safety guarantee - ensure at least 3 boosters exist in every level
  if (boosters.length < 3) {
    const step = 45;
    for (let testX = minX; testX <= maxX && boosters.length < 3; testX += step) {
      if (!isSpacedFromExisting(testX, 400)) continue;
      const b = getCorridorSafeBounds(testX, segsList);
      if (b.isSqueeze || b.halfH < 10) continue;
      const candY = b.safeCenter || (b.safeTop + b.safeBot) / 2;
      if (!isTooCloseToSpikes(testX, candY)) {
        boosters.push({
          x: testX,
          y: candY,
          radius: BOOSTER_RADIUS,
          collected: false,
          phase: boostRng() * 6.28,
          popTimer: 0
        });
      }
    }
  }

  // Remove substituted coins in reverse index order
  coinsToRemove.sort((a, b) => b - a);
  for (const cIdx of coinsToRemove) {
    if (cIdx >= 0 && coinsList && cIdx < coinsList.length) {
      coinsList.splice(cIdx, 1);
    }
  }
}

// ==========================================
// GLOSSY UI COMPONENTS (White text with dark outline)
// ==========================================
const BUTTON_THEMES = {
  green: { top: '#6ee7b7', mid: '#22c55e', bot: '#16a34a', lip: '#14532d', border: '#052e16' },
  blue: { top: '#93c5fd', mid: '#3b82f6', bot: '#2563eb', lip: '#1e3a8a', border: '#0f172a' },
  purple: { top: '#d8b4fe', mid: '#a855f7', bot: '#9333ea', lip: '#581c87', border: '#3b0764' },
  orange: { top: '#fed7aa', mid: '#f97316', bot: '#ea580c', lip: '#7c2d12', border: '#431407' },
  yellow: { top: '#fef08a', mid: '#facc15', bot: '#eab308', lip: '#a16207', border: '#713f12' },
  red: { top: '#fca5a5', mid: '#ef4444', bot: '#dc2626', lip: '#7f1d1d', border: '#450a0a' },
  gray: { top: '#e2e8f0', mid: '#94a3b8', bot: '#64748b', lip: '#334155', border: '#1e293b' }
};

function drawGlossyText(text, x, y, size, align = 'center', color = '#ffffff', strokeColor = '#0f172a', strokeWidth) {
  ctx.save();
  ctx.font = `800 ${size}px "Lilita One", "Baloo 2", cursive, system-ui, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';

  const sw = strokeWidth !== undefined ? strokeWidth : Math.max(3.5, Math.round(size * 0.18));
  ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetY = 2;

  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = sw;
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;
  ctx.strokeText(text, x, y);

  ctx.shadowColor = 'transparent';
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawGlossyButton(x, y, w, h, theme, label, iconType, isPressed, radius = 18) {
  const py = isPressed ? y + 3 : y;
  const lipH = isPressed ? 2 : 5;

  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
  ctx.shadowBlur = isPressed ? 4 : 8;
  ctx.shadowOffsetY = isPressed ? 2 : 5;

  ctx.fillStyle = theme.lip;
  roundRect(ctx, x, py + lipH, w, h, radius);
  ctx.fill();

  ctx.shadowColor = 'transparent';

  const grad = ctx.createLinearGradient(0, py, 0, py + h);
  grad.addColorStop(0, theme.top);
  grad.addColorStop(0.48, theme.mid);
  grad.addColorStop(1, theme.bot);
  ctx.fillStyle = grad;
  roundRect(ctx, x, py, w, h, radius);
  ctx.fill();

  // White gloss band on top half
  ctx.save();
  roundRect(ctx, x, py, w, h, radius);
  ctx.clip();
  const glossGrad = ctx.createLinearGradient(0, py, 0, py + h * 0.54);
  glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
  glossGrad.addColorStop(1, 'rgba(255, 255, 255, 0.05)');
  ctx.fillStyle = glossGrad;
  ctx.beginPath();
  ctx.ellipse(x + w / 2, py + 2, w * 0.6, h * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Inner highlight outline
  ctx.save();
  roundRect(ctx, x + 1.5, py + 1.5, w - 3, h - 3, Math.max(2, radius - 1));
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.lineWidth = 1.3;
  ctx.stroke();
  ctx.restore();

  // Dark outer outline
  ctx.strokeStyle = theme.border;
  ctx.lineWidth = 2.4;
  roundRect(ctx, x, py, w, h + (isPressed ? 1 : 2), radius);
  ctx.stroke();

  if (iconType) {
    drawButtonIcon(iconType, x + w / 2, py + h / 2, Math.min(w, h) * 0.48);
  }
  if (label) {
    const textY = py + h / 2 + 1;
    drawGlossyText(label, x + w / 2, textY, Math.min(22, Math.round(h * 0.42)), 'center', '#ffffff', theme.border, 4.2);
  }
  ctx.restore();
}

function drawRoundGlossyButton(cx, cy, r, theme, iconType, isPressed) {
  drawGlossyButton(cx - r, cy - r, r * 2, r * 2, theme, null, iconType, isPressed, r);
}

function drawButtonIcon(type, cx, cy, sz) {
  ctx.save();
  ctx.translate(cx, cy);

  if (type === 'gear') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2;
    for (let a = 0; a < 6; a++) {
      ctx.rotate(Math.PI / 3);
      ctx.fillRect(-sz * 0.16, -sz * 0.52, sz * 0.32, sz * 0.22);
      ctx.strokeRect(-sz * 0.16, -sz * 0.52, sz * 0.32, sz * 0.22);
    }
    ctx.beginPath(); ctx.arc(0, 0, sz * 0.38, 0, 6.28); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2563eb';
    ctx.beginPath(); ctx.arc(0, 0, sz * 0.18, 0, 6.28); ctx.fill(); ctx.stroke();

  } else if (type === 'car') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#3b0764';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.45, sz * 0.15);
    ctx.lineTo(-sz * 0.35, -sz * 0.1);
    ctx.lineTo(-sz * 0.1, -sz * 0.28);
    ctx.lineTo(sz * 0.2, -sz * 0.28);
    ctx.lineTo(sz * 0.4, -sz * 0.05);
    ctx.lineTo(sz * 0.45, sz * 0.15);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(-sz * 0.25, sz * 0.18, sz * 0.14, 0, 6.28); ctx.fill();
  } else if (type === 'wheel') {
    ctx.fillStyle = '#f8fafc';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.44, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // Inner dark rotor
    ctx.fillStyle = '#334155';
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.36, 0, Math.PI * 2);
    ctx.fill();
    // 5 Spokes
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 2.2;
    for (let a = 0; a < 5; a++) {
      const ang = a * (Math.PI * 2 / 5);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(ang) * sz * 0.36, Math.sin(ang) * sz * 0.36);
      ctx.stroke();
    }
    // Red sport center cap
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.12, 0, Math.PI * 2);
    ctx.fill();

  } else if (type === 'close') {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = sz * 0.22;
    ctx.lineCap = 'round';
    const s = sz * 0.32;
    ctx.beginPath();
    ctx.moveTo(-s, -s); ctx.lineTo(s, s);
    ctx.moveTo(s, -s); ctx.lineTo(-s, s);
    ctx.stroke();

  } else if (type === 'sound_on') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#052e16';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.35, -sz * 0.15); ctx.lineTo(-sz * 0.15, -sz * 0.15); ctx.lineTo(sz * 0.1, -sz * 0.35);
    ctx.lineTo(sz * 0.1, sz * 0.35); ctx.lineTo(-sz * 0.15, sz * 0.15); ctx.lineTo(-sz * 0.35, sz * 0.15);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(sz * 0.05, 0, sz * 0.24, -0.6, 0.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(sz * 0.05, 0, sz * 0.4, -0.7, 0.7); ctx.stroke();

  } else if (type === 'sound_off') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.35, -sz * 0.15); ctx.lineTo(-sz * 0.15, -sz * 0.15); ctx.lineTo(sz * 0.1, -sz * 0.35);
    ctx.lineTo(sz * 0.1, sz * 0.35); ctx.lineTo(-sz * 0.15, sz * 0.15); ctx.lineTo(-sz * 0.35, sz * 0.15);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-sz * 0.35, -sz * 0.35); ctx.lineTo(sz * 0.35, sz * 0.35); ctx.stroke();

  } else if (type === 'vibrate_on') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#052e16';
    ctx.lineWidth = 2;
    roundRect(ctx, -sz * 0.2, -sz * 0.35, sz * 0.4, sz * 0.7, 4);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(-sz * 0.25, 0, sz * 0.25, Math.PI * 0.75, Math.PI * 1.25); ctx.stroke();
    ctx.beginPath(); ctx.arc(sz * 0.25, 0, sz * 0.25, -Math.PI * 0.25, Math.PI * 0.25); ctx.stroke();

  } else if (type === 'vibrate_off') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2;
    roundRect(ctx, -sz * 0.2, -sz * 0.35, sz * 0.4, sz * 0.7, 4);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-sz * 0.35, -sz * 0.35); ctx.lineTo(sz * 0.35, sz * 0.35); ctx.stroke();

  } else if (type === 'pause') {
    const barW = sz * 0.25;
    const barH = sz * 0.68;
    const gap = sz * 0.15;
    const r = Math.max(2, barW * 0.35);
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.8;
    roundRect(ctx, -gap / 2 - barW, -barH / 2, barW, barH, r);
    ctx.fill(); ctx.stroke();
    roundRect(ctx, gap / 2, -barH / 2, barW, barH, r);
    ctx.fill(); ctx.stroke();

  } else if (type === 'ambient_on' || type === 'ambient_off') {
    const isOff = (type === 'ambient_off');
    ctx.strokeStyle = isOff ? '#1e293b' : '#052e16';
    ctx.lineWidth = 4.2;
    ctx.lineCap = 'round';
    const drawWindLines = () => {
      ctx.beginPath();
      ctx.moveTo(-sz * 0.36, -sz * 0.16);
      ctx.lineTo(sz * 0.16, -sz * 0.16);
      ctx.arc(sz * 0.16, -sz * 0.26, sz * 0.10, Math.PI * 0.5, -Math.PI * 0.85, true);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-sz * 0.42, 0);
      ctx.lineTo(sz * 0.30, 0);
      ctx.arc(sz * 0.30, sz * 0.10, sz * 0.10, -Math.PI * 0.5, Math.PI * 0.85, false);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-sz * 0.30, sz * 0.18);
      ctx.lineTo(sz * 0.06, sz * 0.18);
      ctx.arc(sz * 0.06, sz * 0.27, sz * 0.09, -Math.PI * 0.5, Math.PI * 0.8, false);
      ctx.stroke();
    };
    drawWindLines();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.4;
    drawWindLines();
    if (isOff) {
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(-sz * 0.36, -sz * 0.36); ctx.lineTo(sz * 0.36, sz * 0.36); ctx.stroke();
    }

  } else if (type === 'shop') {
    // Shopping bag icon
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#3b0764';
    ctx.lineWidth = 2.0;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-sz * 0.34, -sz * 0.16);
    ctx.lineTo(sz * 0.34, -sz * 0.16);
    ctx.lineTo(sz * 0.40, sz * 0.38);
    ctx.lineTo(-sz * 0.40, sz * 0.38);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Bag handle
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.arc(0, -sz * 0.16, sz * 0.20, Math.PI, 0, false);
    ctx.stroke();
    // Gold coin emblem on bag
    ctx.fillStyle = '#facc15';
    ctx.strokeStyle = '#713f12';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(0, sz * 0.12, sz * 0.13, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

  } else if (type === 'booster_boost') {
    // Glowing lightning bolt
    ctx.fillStyle = '#fef08a';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2.0;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(sz * 0.10, -sz * 0.44);
    ctx.lineTo(-sz * 0.26, sz * 0.04);
    ctx.lineTo(-sz * 0.02, sz * 0.04);
    ctx.lineTo(-sz * 0.12, sz * 0.44);
    ctx.lineTo(sz * 0.28, -sz * 0.05);
    ctx.lineTo(sz * 0.04, -sz * 0.05);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

  } else if (type === 'booster_magnet') {
    // Horseshoe magnet
    ctx.lineCap = 'butt';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = sz * 0.26;
    ctx.beginPath();
    ctx.arc(0, sz * 0.06, sz * 0.28, 0, Math.PI, false);
    ctx.stroke();
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = sz * 0.18;
    ctx.beginPath();
    ctx.arc(0, sz * 0.06, sz * 0.28, 0, Math.PI, false);
    ctx.stroke();
    // Upper arms
    ctx.fillStyle = '#ef4444';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.6;
    ctx.fillRect(-sz * 0.37, -sz * 0.28, sz * 0.18, sz * 0.35);
    ctx.strokeRect(-sz * 0.37, -sz * 0.28, sz * 0.18, sz * 0.35);
    ctx.fillRect(sz * 0.19, -sz * 0.28, sz * 0.18, sz * 0.35);
    ctx.strokeRect(sz * 0.19, -sz * 0.28, sz * 0.18, sz * 0.35);
    // Silver magnet tips
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(-sz * 0.37, -sz * 0.34, sz * 0.18, sz * 0.14);
    ctx.strokeRect(-sz * 0.37, -sz * 0.34, sz * 0.18, sz * 0.14);
    ctx.fillRect(sz * 0.19, -sz * 0.34, sz * 0.18, sz * 0.14);
    ctx.strokeRect(sz * 0.19, -sz * 0.34, sz * 0.18, sz * 0.14);

  } else if (type === 'booster_shield') {
    // Energy shield
    ctx.fillStyle = '#86efac';
    ctx.strokeStyle = '#052e16';
    ctx.lineWidth = 2.0;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -sz * 0.42);
    ctx.lineTo(sz * 0.35, -sz * 0.26);
    ctx.quadraticCurveTo(sz * 0.36, sz * 0.16, 0, sz * 0.44);
    ctx.quadraticCurveTo(-sz * 0.36, sz * 0.16, -sz * 0.35, -sz * 0.26);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(0, -sz * 0.26);
    ctx.lineTo(sz * 0.18, -sz * 0.16);
    ctx.quadraticCurveTo(sz * 0.18, sz * 0.08, 0, sz * 0.24);
    ctx.quadraticCurveTo(-sz * 0.18, sz * 0.08, -sz * 0.18, -sz * 0.16);
    ctx.closePath();
    ctx.fill();

  } else if (type === 'booster_slowmo') {
    // Stopwatch clock
    ctx.fillStyle = '#fde047';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.8;
    ctx.fillRect(-sz * 0.09, -sz * 0.44, sz * 0.18, sz * 0.10);
    ctx.strokeRect(-sz * 0.09, -sz * 0.44, sz * 0.18, sz * 0.10);
    ctx.fillStyle = '#e0f2fe';
    ctx.beginPath();
    ctx.arc(0, sz * 0.04, sz * 0.35, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, sz * 0.04); ctx.lineTo(0, -sz * 0.16);
    ctx.moveTo(0, sz * 0.04); ctx.lineTo(sz * 0.18, sz * 0.12);
    ctx.stroke();

  } else if (type === 'daily_gift') {
    // Gift box
    ctx.fillStyle = '#fef08a';
    ctx.strokeStyle = '#713f12';
    ctx.lineWidth = 1.8;
    roundRect(ctx, -sz * 0.34, -sz * 0.12, sz * 0.68, sz * 0.48, 5);
    ctx.fill(); ctx.stroke();
    roundRect(ctx, -sz * 0.38, -sz * 0.28, sz * 0.76, sz * 0.18, 4);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(-sz * 0.07, -sz * 0.28, sz * 0.14, sz * 0.64);
    ctx.strokeRect(-sz * 0.07, -sz * 0.28, sz * 0.14, sz * 0.64);

  } else if (type === 'daily_calendar') {
    // Glossy 7-day calendar with gold coin/star
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.8;
    roundRect(ctx, -sz * 0.38, -sz * 0.32, sz * 0.76, sz * 0.68, 6);
    ctx.fill(); ctx.stroke();
    // Red header band
    ctx.fillStyle = '#ef4444';
    roundRect(ctx, -sz * 0.38, -sz * 0.32, sz * 0.76, sz * 0.24, 6);
    ctx.fill();
    ctx.fillRect(-sz * 0.38, -sz * 0.18, sz * 0.76, sz * 0.10);
    ctx.strokeRect(-sz * 0.38, -sz * 0.32, sz * 0.76, sz * 0.24);
    // Calendar rings
    ctx.fillStyle = '#e2e8f0';
    roundRect(ctx, -sz * 0.24, -sz * 0.42, sz * 0.12, sz * 0.18, 2);
    ctx.fill(); ctx.stroke();
    roundRect(ctx, sz * 0.12, -sz * 0.42, sz * 0.12, sz * 0.18, 2);
    ctx.fill(); ctx.stroke();
    // Gold coin emblem in center
    ctx.fillStyle = '#facc15';
    ctx.strokeStyle = '#713f12';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, sz * 0.13, sz * 0.18, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

  } else if (type === 'starter_bundle') {
    // Festive starter gift bundle with ribbon bow
    ctx.fillStyle = '#38bdf8';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.8;
    roundRect(ctx, -sz * 0.34, -sz * 0.10, sz * 0.68, sz * 0.46, 6);
    ctx.fill(); ctx.stroke();
    // Lid
    ctx.fillStyle = '#7dd3fc';
    roundRect(ctx, -sz * 0.39, -sz * 0.24, sz * 0.78, sz * 0.17, 5);
    ctx.fill(); ctx.stroke();
    // Gold ribbon
    ctx.fillStyle = '#facc15';
    ctx.strokeStyle = '#713f12';
    ctx.lineWidth = 1.4;
    ctx.fillRect(-sz * 0.08, -sz * 0.24, sz * 0.16, sz * 0.60);
    ctx.strokeRect(-sz * 0.08, -sz * 0.24, sz * 0.16, sz * 0.60);
    // Bow loops
    ctx.beginPath();
    ctx.ellipse(-sz * 0.14, -sz * 0.33, sz * 0.14, sz * 0.09, -0.35, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(sz * 0.14, -sz * 0.33, sz * 0.14, sz * 0.09, 0.35, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }

  ctx.restore();
}

function drawGoldStar(cx, cy, r, scale = 1.0) {
  if (scale <= 0.01) return;
  ctx.save();
  ctx.translate(cx, cy);
  if (scale !== 1.0) {
    ctx.scale(scale, scale);
  }

  ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetY = 2;

  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = (i * Math.PI) / 5 - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.48;
    const x = Math.cos(ang) * rad;
    const y = Math.sin(ang) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();

  const starGrad = ctx.createLinearGradient(0, -r, 0, r);
  starGrad.addColorStop(0, '#fef08a');
  starGrad.addColorStop(0.4, '#facc15');
  starGrad.addColorStop(1, '#ca8a04');
  ctx.fillStyle = starGrad;
  ctx.fill();

  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#713f12';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-r * 0.2, -r * 0.25, r * 0.2, 0, 6.28);
  ctx.fill();

  ctx.restore();
}

function drawEmptyStar(cx, cy, r) {
  ctx.save();
  ctx.translate(cx, cy);

  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = (i * Math.PI) / 5 - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.48;
    const x = Math.cos(ang) * rad;
    const y = Math.sin(ang) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();

  ctx.fillStyle = '#cbd5e1';
  ctx.fill();

  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  ctx.restore();
}

function drawGoldenPerfectRibbon(cx, cy, w, h) {
  ctx.save();
  const halfW = w / 2;
  const tailW = 20;

  // Tail ribbons
  ctx.fillStyle = '#b45309';
  ctx.beginPath();
  ctx.moveTo(cx - halfW, cy);
  ctx.lineTo(cx - halfW - tailW, cy + 8);
  ctx.lineTo(cx - halfW - tailW + 6, cy + h + 4);
  ctx.lineTo(cx - halfW, cy + h);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx + halfW, cy);
  ctx.lineTo(cx + halfW + tailW, cy + 8);
  ctx.lineTo(cx + halfW + tailW - 6, cy + h + 4);
  ctx.lineTo(cx + halfW, cy + h);
  ctx.closePath();
  ctx.fill();

  // Main ribbon body
  const ribGrad = ctx.createLinearGradient(0, cy, 0, cy + h);
  ribGrad.addColorStop(0, '#fef08a');
  ribGrad.addColorStop(0.35, '#facc15');
  ribGrad.addColorStop(0.7, '#eab308');
  ribGrad.addColorStop(1, '#ca8a04');

  ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
  ctx.shadowBlur = 8;

function drawStylishLevelTransition(t) {
  const cx = W / 2;

  if (t < IRIS_CLOSE_DURATION) {
    const p = Math.max(0, Math.min(1, t / IRIS_CLOSE_DURATION));
    const closeEase = 1 - Math.pow(1 - p, 1.75);
    radius = maxR * (1 - closeEase);
  } else if (t < IRIS_CLOSE_DURATION + IRIS_HOLD_DURATION) {
    radius = 0;

    const q = Math.max(0, Math.min(1, openT / IRIS_OPEN_DURATION));
    const openEase = Math.pow(q, 1.55);
    radius = maxR * openEase;
  }

  ctx.save();
  ctx.fillStyle = '#000000';
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  if (radius > 0.5) {

}

// Synchronized progress calculation: exactly 100% when finish road reaches car
function getLevelProgress() {
  const dist = Math.max(0, cam);
  return Math.max(0, Math.min(1, dist / LEVEL_LENGTH));
}

function getDifficultyDistance() {
  const distInLevel = Math.max(0, Math.min(LEVEL_LENGTH, cam));
  return (curLevel - 1) * LEVEL_LENGTH + distInLevel;
}

// 1. Difficulty Growth:
// 1. Difficulty Growth & Stage Steps (Requirement 2):
// - Balanced progressive curve: fBase grows across levels and never resets.
// - At the start of a new stage it steps back by about 10% so the player can get used to the new look, then grows again.
function getLevelDifficulty(lvl, p = 0) {
  const L = lvl || curLevel;
  const stage = getStageNumber(L);
  const levelInStage = getLevelInStage(L);

  const rawF = 1 - Math.exp(-(L - 1) / LEVEL_GROWTH_TAU);

  // 10% step-back at the start of a new stage (stage > 1), easing back across the stage
  let stageDiscount = 0;
  if (stage > 1) {
    stageDiscount = 0.10 * (5 - levelInStage) / 4;
  }
  const fBase = rawF * (1 - stageDiscount);

  let intra = 1.0;
  if (p < INTRA_LEVEL_EASY_FRACTION) {
    const ramp = p / INTRA_LEVEL_EASY_FRACTION;
    intra = (1.0 - INTRA_LEVEL_GROWTH) + (INTRA_LEVEL_GROWTH * ramp);
  } else {
    const normP = (p - INTRA_LEVEL_EASY_FRACTION) / (1.0 - INTRA_LEVEL_EASY_FRACTION);
    intra = 1.0 + INTRA_LEVEL_GROWTH * normP;
  }

  const f = Math.max(0, Math.min(1.0, fBase * intra));
  return { f, fBase, intra };
}

// Scroll speed: canvasWidth * 0.31 * multiplier at level 1, growing with difficulty up to 1.4 * starting speed
function scrollSpeed(difficultyDistance = getDifficultyDistance(), ignoreBoost = false) {
  const p = getLevelProgress();
  const { f } = getLevelDifficulty(curLevel, p);
  const mult = getSpeedMultiplier();
  const startingSpeed = W * BASE_SCROLL_SPEED_RATIO * mult;
  const diffMultiplier = Math.min(1.4, 1 + SCROLL_SPEED_GROWTH * f);
  const boostMult = (!ignoreBoost && typeof boostRampFactor !== 'undefined' && boostRampFactor > 0)
    ? (1.0 + (BOOST_SPEED - 1.0) * boostRampFactor)
    : 1.0;
  let slowMoMult = 1.0;
  if (!ignoreBoost && typeof slowMoTimer !== 'undefined' && slowMoTimer > 0) {
    const easeBack = (slowMoTimer < 0.6) ? (slowMoTimer / 0.6) : 1.0;
    slowMoMult = 1.0 - 0.45 * easeBack;
  }
  return startingSpeed * diffMultiplier * SPEED_MULTIPLIER * boostMult * slowMoMult;
}
const speed = scrollSpeed;

// Gap height = lerp(GAP_LEVEL_1_RATIO, GAP_MAX_DIFFICULTY_RATIO, f) * carVis
function getGapHeight(lvl, p = 0) {
  const { f } = getLevelDifficulty(lvl, p);
  const gapRatio = lerp(GAP_LEVEL_1_RATIO, GAP_MAX_DIFFICULTY_RATIO, f);
  return Math.max(GAP_MAX_DIFFICULTY_RATIO * carVis, gapRatio * carVis);
}
